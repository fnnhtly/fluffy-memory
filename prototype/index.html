          drawPartShape(pid, rowsX + 27, ry + rowH / 2 + 2, iconS, 0);
          drawStackBadge(rowsX + 36, ry + 4, 3);
        } else {
          drawPartShape(pid, rowsX + 20, ry + rowH / 2, iconS, 0,
            pid === 'wood_frame' ? 3 : undefined);
        }
        // 名称 + 类别
        const ty = ry + rowH / 2 + 4;
        text(RAP.PARTS[pid].label, rowsX + 48, ty, 13, '#ffe9b0', 'left', true);
        text(cat, rowsX + 134, ty, 10.5, 'rgba(176,208,230,.92)', 'left');
        // 职责：长说明会被卡右边挤出去，先量再缩
        let ds = 12;
        const maxW = X + W - 30 - (rowsX + 186);
        ctx.font = `${ds}px "Microsoft YaHei", sans-serif`;
        while (ds > 8.5 && ctx.measureText(desc).width > maxW) {
          ds -= 0.5;
          ctx.font = `${ds}px "Microsoft YaHei", sans-serif`;
        }
        text(desc, rowsX + 186, ty, ds, '#c9dae8', 'left');
      });
    } else {
      // 三个按钮图标竖排，互不重叠
      const icx = X + 130;
      // 暂停（红）
      ctx.fillStyle = '#e0513c';
      ctx.beginPath(); ctx.arc(icx, Y + 168, 22, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.fillRect(icx - 7, Y + 158, 5, 20); ctx.fillRect(icx + 2, Y + 158, 5, 20);
      // 重来（绿）
      ctx.fillStyle = '#63bf3f';
      ctx.beginPath(); ctx.arc(icx, Y + 232, 22, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(icx, Y + 232, 10, -0.6, 3.6); ctx.stroke();
      // 刹车图标已删（按钮不存在了，说明页里也不能再画它）
    }

    // 右侧文字（零件一览页自己横向排好了，不再走这一支）
    if (Array.isArray(page.lines)) {
      page.lines.forEach((ln, i) => {
        text(ln, X + 250, Y + 108 + i * 30, 15, ln ? '#d8e8f4' : '#000', 'left');
      });
    }

    // 页码点（贴在卡片底边内侧）
    for (let i = 0; i < WELCOME_PAGES.length; i++) {
      const dx2 = X + W / 2 - 24 + i * 24, dy2 = Y + H - 22;
      if (i === state.welcome - 1) {
        ctx.fillStyle = '#ffe9b0';
        ctx.beginPath(); ctx.arc(dx2, dy2, 6, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.fillStyle = 'rgba(255,255,255,.18)';
        ctx.beginPath(); ctx.arc(dx2, dy2, 4.5, 0, Math.PI * 2); ctx.fill();
      }
    }

    // 按钮：跳过（次）+ 下一步/开始（主）
    const bk = welcomeSkipRect(), bn = welcomeBtnRect();
    const wbtn = (r, label, primary) => {
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 6;
      ctx.fillStyle = primary ? 'rgba(232,200,122,.96)' : 'rgba(20,34,44,.96)';
      roundRect(r.x, r.y, r.w, r.h, 12); ctx.fill();
      ctx.restore();
      ctx.strokeStyle = primary ? '#fff1c4' : 'rgba(200,218,232,.42)';
      ctx.lineWidth = 1.8; roundRect(r.x, r.y, r.w, r.h, 12); ctx.stroke();
      text(label, r.x + r.w / 2, r.y + 35, 17, primary ? '#20180a' : '#c3d4e2', 'center', true);
    };
    wbtn(bk, '跳过', false);
    const last = state.welcome >= WELCOME_PAGES.length;
    wbtn(bn, last ? '开始搭车！' : '下一步 →', true);
    // 小提示：键盘也可以翻页
    text('Enter 继续　·　Esc 跳过', DW / 2, bn.y + bn.h + 26, 12, 'rgba(196,216,232,.82)', 'center');
  }

  // 关卡地形缩略图：把 mapRows 压成一条剖面。
  // 早期版本只有 44px 高、单色填充，看不出"这关有冰面 / 有坑 / 箱子在哪"。
  // 现在：草皮层 + 岩体两层、冰面单独配色、木箱与起终点都标出来。
  function drawLevelThumb(lv, x, y, w, h) {
    const rows = lv.mapRows || [];
    const cols = (lv.grid && lv.grid.cols) || (rows[0] || '').length;
    if (!cols || !rows.length) return;
    const SOLID = c => c === '#' || c === '=' || c === 'v' || c === 'n' || c === '/';
    const top = [];
    const isIce = [];
    for (let c = 0; c < cols; c++) {
      let rr = rows.length, ice = false;
      for (let r = 0; r < rows.length; r++) {
        const ch = rows[r][c];
        if (SOLID(ch)) { rr = r; ice = (ch === '='); break; }
      }
      top.push(rr); isIce.push(ice);
    }
    const maxRow = rows.length;
    const bh = BIOMES[lv.biome] || BIOMES.field;
    const sy = i => y + h - ((maxRow - top[i]) / maxRow) * h;   // 第 i 列地表 y
    const sx = i => x + (i / Math.max(1, cols - 1)) * w;

    // 底：一条淡的"天"，让洞穴/黄昏关的色差先说话
    const hex2rgb = hx => {
      const s2 = String(hx || '#000000').replace('#', '');
      return [parseInt(s2.substr(0, 2), 16) || 0, parseInt(s2.substr(2, 2), 16) || 0,
              parseInt(s2.substr(4, 2), 16) || 0];
    };
    const sky = ctx.createLinearGradient(0, y, 0, y + h);
    sky.addColorStop(0, 'rgba(' + hex2rgb(bh.skyTop).join(',') + ',.5)');
    /* 底部那层暗色只压到 0.35（原来是 0.55）。
     *
     * 缩略图的"可辨识度"就靠这一步：0.55 的暗色把所有 biome 一起拉暗，
     * 于是 1-1（草地）、1-3（洞穴）、1-5（黄昏）的平均色挤到只差 8~16，
     * 而 tools/test_level_thumbs 的阈值是 18 —— 选关页上根本分不出哪张是哪关
     * （实测 1-1 rgb(49,65,65) vs 1-5 rgb(55,60,73)）。
     *
     * 压到 0.35 之后，`skyTop` 那个"每关不同"的颜色才真的透得出来。
     * 代价是缩略图整体亮一点 —— 但它本来就该像关卡，而不是像夜视画面。 */
    sky.addColorStop(1, 'rgba(8,14,20,.35)');
    ctx.fillStyle = sky;
    roundRect(x, y, w, h, 6); ctx.fill();

    // 岩体：比草皮暗一档，形成"土层厚度"的感觉
    ctx.beginPath();
    ctx.moveTo(x, y + h);
    for (let c = 0; c < cols; c++) ctx.lineTo(sx(c), sy(c));
    ctx.lineTo(x + w, y + h);
    ctx.closePath();
    ctx.fillStyle = 'rgb(' + bh.rock.join(',') + ')';
    ctx.fill();

    // 草皮：沿地表线两侧各画一条，冰面段单独配色
    for (let c = 0; c + 1 < cols; c++) {
      ctx.beginPath();
      ctx.moveTo(sx(c), sy(c)); ctx.lineTo(sx(c + 1), sy(c + 1));
      ctx.strokeStyle = isIce[c] ? '#bfe9ff' : bh.grass;
      ctx.lineWidth = isIce[c] ? 3.2 : 2.2;
      ctx.lineCap = 'round';
      ctx.stroke();
    }
    // 冰面：加几道短斜线，和草皮区分开（不靠颜色也能认）
    for (let c = 0; c + 1 < cols; c++) {
      if (!isIce[c]) continue;
      ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 1;
      const mx = (sx(c) + sx(c + 1)) / 2, my = (sy(c) + sy(c + 1)) / 2;
      ctx.beginPath();
      ctx.moveTo(mx - 2, my + 3); ctx.lineTo(mx + 2, my - 1); ctx.stroke();
    }

    // 木箱
    (lv.boxes || []).forEach(b => {
      const c = Math.max(0, Math.min(cols - 1, b.col));
      const bx2 = sx(c), by2 = sy(c) - 4;
      ctx.fillStyle = '#d9a441';
      roundRect(bx2 - 3, by2 - 5, 6, 6, 1.5); ctx.fill();
      ctx.strokeStyle = 'rgba(120,80,20,.9)'; ctx.lineWidth = 1;
      roundRect(bx2 - 3, by2 - 5, 6, 6, 1.5); ctx.stroke();
    });

    // 起点 / 终点：起终点用小圆点 + 旗，跟场上一致
    const sc = Math.max(0, Math.min(cols - 1, (lv.start && lv.start.col) || 0));
    const gc = Math.max(0, Math.min(cols - 1, (lv.goal && lv.goal.col) || cols - 1));
    ctx.fillStyle = '#63d97e';
    ctx.beginPath(); ctx.arc(sx(sc), Math.max(y + 4, sy(sc) - 4), 3.2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#e8f0e0'; ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(sx(gc), Math.max(y + 4, sy(gc) - 2));
    ctx.lineTo(sx(gc), Math.max(y + 4, sy(gc) - 15)); ctx.stroke();
    ctx.fillStyle = COL.flag;
    ctx.beginPath();
    ctx.moveTo(sx(gc), Math.max(y + 4, sy(gc) - 15));
    ctx.lineTo(sx(gc) + 8, Math.max(y + 4, sy(gc) - 12));
    ctx.lineTo(sx(gc), Math.max(y + 4, sy(gc) - 9));
    ctx.closePath(); ctx.fill();

    ctx.strokeStyle = 'rgba(232,200,122,.25)'; ctx.lineWidth = 1;
    roundRect(x, y, w, h, 6); ctx.stroke();
  }

  function drawLevelSelect() {
    if (!state.levelSelect) return;
    // 选关是"独立一屏"：用不透明底，底下的建造 UI 一点都别透出来
    fillScreen('#08111a');
    // 顶部一层极淡的暖光，避免整屏死黑
    const svg = ctx.createRadialGradient(DW * 0.5, -60, 40, DW * 0.5, -60, DH * 0.95);
    svg.addColorStop(0, 'rgba(232,200,122,.10)');
    svg.addColorStop(1, 'rgba(232,200,122,0)');
    fillScreen(svg);
    text('选择关卡', DW / 2, 92, 30, '#ffe9b0', 'center', true);
    text('★★ 拿木箱　★★★ 每关的特殊条件', DW / 2, 124, 13, '#9fb2c2', 'center');
    // 标题下的金色细线，和结算卡同一套语言
    const lg = ctx.createLinearGradient(0, 0, DW, 0);
    lg.addColorStop(0, 'rgba(232,200,122,0)');
    lg.addColorStop(0.5, 'rgba(232,200,122,.55)');
    lg.addColorStop(1, 'rgba(232,200,122,0)');
    ctx.fillStyle = lg; ctx.fillRect(0, 138, DW, 1.5);

    const L = levelCardsLayout();
    const CW = L.CW, CH = L.CH;
    levels.forEach((lv, i) => {
      const x = L.x0 + i * (CW + L.GAP);
      const y = L.y;
      // 每次都从 localStorage 重新读，避免只在启动时读一次
      const pr = readRecord(lv.levelId) ||
        { goals: { arrive: false, boxes: false, challenge: false }, best: null, boxes: 0 };
      const prStars = starsOf(pr.goals);
      const isCur = i === state.levelIndex;
      // 卡面
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 7;
      ctx.fillStyle = isCur ? 'rgba(20,44,38,.98)' : 'rgba(14,28,34,.96)';
      roundRect(x, y, CW, CH, 14); ctx.fill();
      ctx.restore();
      // 描边必须自己开一条路径：之前只设了 strokeStyle 就 stroke()，
      // 描的是上一个残留路径，所以卡片根本没有边框。
      ctx.strokeStyle = isCur ? 'rgba(232,200,122,.85)' : 'rgba(232,200,122,.26)';
      ctx.lineWidth = isCur ? 2.5 : 1.5;
      roundRect(x, y, CW, CH, 14); ctx.stroke();
      // 当前关卡：左侧金条（比整卡变绿更克制）
      if (isCur) {
        ctx.save();
        ctx.beginPath(); roundRect(x, y, CW, CH, 14); ctx.clip();
        ctx.fillStyle = 'rgba(232,200,122,.9)';
        ctx.fillRect(x, y + 10, 3.5, CH - 20);
        ctx.restore();
      }
      // 关卡号
      text(lv.levelId, x + CW / 2, y + 42, 26, isCur ? '#ffe9b0' : '#e8f2fa', 'center', true);
      text(lv.name, x + CW / 2, y + 70, 15, '#cfe0ee', 'center');
      // 星级：三颗星各自代表一个永久标记（到达 / 全木箱 / 特殊条件）。
      // 参考里这三颗是"分别达成也算"，所以这里必须按标记点亮，而不是按星星数量涂满。
      GOALS.forEach((gk, k) => {
        const cx2 = x + CW / 2 - 44 + k * 44, cy2 = y + 104;
        const on = !!pr.goals[gk];
        ctx.fillStyle = on ? '#ffd93d' : 'rgba(255,255,255,.14)';
        ctx.beginPath();
        for (let q = 0; q < 10; q++) {
          const ang = -Math.PI / 2 + q * Math.PI / 5;
          const rad = (q % 2 === 0) ? 15 : 6.5;
          const px2 = cx2 + Math.cos(ang) * rad, py2 = cy2 + Math.sin(ang) * rad;
          q === 0 ? ctx.moveTo(px2, py2) : ctx.lineTo(px2, py2);
        }
        ctx.closePath(); ctx.fill();
        if (on) {
          ctx.strokeStyle = 'rgba(120,86,10,.65)'; ctx.lineWidth = 1.2; ctx.stroke();
        }
      });
      // 最佳时间
      text(pr.best ? '最佳 ' + pr.best.toFixed(2) + ' s' : '未通关',
        x + CW / 2, y + 140, 12, pr.best ? '#9fe0a8' : '#7f97a6', 'center');
      // 第三颗星的条件（说清"这颗星要做什么"）
      const gn = challengeNameOf(lv);
      text('★★★：' + gn, x + CW / 2, y + 166, 11,
        pr.goals.challenge ? '#b6ff9e' : '#8fb6c9', 'center');
      // 零件箱
      // 地形缩略图：从 44px 加高到 56px，能看出坡度和坑的深浅
      drawLevelThumb(lv, x + 12, y + 172, CW - 24, 56);
      /* 零件箱清单：卡片宽度现在是自适应的（6 关时只有 187），
       * 9 个零件的清单在 10px 下就可能超出卡面。所以先量再定字号，
       * 宁可小一号也不出卡 —— 出卡的文字在选关页看起来像是渲染坏了。 */
      const boxTxt = Object.keys(lv.partsBox || {})
        .map(k => (RAP.PARTS[k] ? RAP.PARTS[k].label : k) + lv.partsBox[k]).join(' ');
      let bxSize = 10;
      ctx.font = `700 ${bxSize}px "Microsoft YaHei", sans-serif`;
      while (bxSize > 7 && ctx.measureText(boxTxt).width > CW - 16) {
        bxSize -= 0.5;
        ctx.font = `700 ${bxSize}px "Microsoft YaHei", sans-serif`;
      }
      text(boxTxt, x + CW / 2, y + 240, bxSize, 'rgba(212,228,240,.82)', 'center');
    });
    // 底部进度条带：填掉卡片下方的大片空白，同时给一个"总进度"的目标感
    {
      let tot = 0, got = 0, cleared = 0;
      levels.forEach(lv => {
        const pr = readRecord(lv.levelId);
        tot += 3;
        got += pr ? starsOf(pr.goals) : 0;
        if (pr && pr.best) cleared++;
      });
      const BW = 520, BX = DW / 2 - BW / 2, BY = 478;
      ctx.fillStyle = 'rgba(14,28,34,.9)';
      roundRect(BX - 22, BY - 26, BW + 44, 92, 14); ctx.fill();
      ctx.strokeStyle = 'rgba(232,200,122,.22)'; ctx.lineWidth = 1.5;
      roundRect(BX - 22, BY - 26, BW + 44, 92, 14); ctx.stroke();
      text('总进度', BX, BY, 12, 'rgba(200,220,236,.9)', 'left', true);
      text('通关 ' + cleared + ' / ' + levels.length + ' 关', BX + BW, BY, 12, '#9fb2c2', 'right');
      ctx.fillStyle = 'rgba(255,255,255,.10)';
      roundRect(BX, BY + 12, BW, 12, 6); ctx.fill();
      if (got > 0) {
        const gw = Math.max(12, BW * got / tot);
        const gb = ctx.createLinearGradient(BX, 0, BX + gw, 0);
        gb.addColorStop(0, '#e8c87a'); gb.addColorStop(1, '#ffe9b0');
        ctx.fillStyle = gb; roundRect(BX, BY + 12, gw, 12, 6); ctx.fill();
      }
      // 星标
      for (let k = 0; k < tot; k++) {
        const sx3 = BX + (BW / tot) * (k + 0.5);
        if (k < got) {
          ctx.fillStyle = '#2a1e08';
          ctx.beginPath();
          for (let q = 0; q < 10; q++) {
            const a3 = -Math.PI / 2 + q * Math.PI / 5, r3 = (q % 2 === 0) ? 4.6 : 1.9;
            const px3 = sx3 + Math.cos(a3) * r3, py3 = BY + 18 + Math.sin(a3) * r3;
            q === 0 ? ctx.moveTo(px3, py3) : ctx.lineTo(px3, py3);
          }
          ctx.closePath(); ctx.fill();
        }
      }
      text(got + ' / ' + tot + ' 星', BX + BW / 2, BY + 52, 13, got === tot ? '#ffe9b0' : 'rgba(190,214,232,.6)', 'center', true);
      /* 这里原来是一个金币图标 + 「×180」。金币删掉之后（第 61 轮），
       * 那个位置空出来一块 —— 现在放"满星过关几关"：仍然只由星推导，
       * 不发明第二种货币。满星 6 关时它变成金色，算这个切片唯一的
       * "全清"指标（以后成就系统可以直接挂在这条线上）。 */
      let perfect = 0;
      levels.forEach(lv => { const pr = readRecord(lv.levelId); if (pr && starsOf(pr.goals) === 3) perfect++; });
      /* 0 满星时那句「还没有满星的关」必须仍然读得清：它是**唯一**在告诉玩家
       * "还有满星这回事"的一句话，读不清就等于没说过。
       * 第一版用 rgba(150,170,186,.7)，叠在卡片底色 rgb(14,26,33) 上是
       * rgb(109,127,140) = 对比度 4.22 —— 被 tools/test_text_contrast.js 判低
       * （阈值 4.5）。改成 .85 之后是 5.65，和其他"次要文字"一档。 */
      text(perfect > 0 ? '满星 ' + perfect + ' / ' + levels.length + ' 关' : '还没有满星的关',
        BX + BW - 26, BY + 52, 12,
        perfect === levels.length ? '#ffd93d' : (perfect > 0 ? 'rgba(214,232,244,.86)' : 'rgba(150,170,186,.85)'),
        'right', perfect > 0);
    }

    // 「玩法说明」按钮：重新打开欢迎引导
    const hb2 = { x: DW / 2 - 80, y: DH - 84, w: 160, h: 38 };
    ctx.fillStyle = 'rgba(16,30,40,.95)';
    roundRect(hb2.x, hb2.y, hb2.w, hb2.h, 10); ctx.fill();
    ctx.strokeStyle = 'rgba(232,200,122,.55)'; ctx.lineWidth = 1.5;
    roundRect(hb2.x, hb2.y, hb2.w, hb2.h, 10); ctx.stroke();
    text('? 玩法说明', hb2.x + hb2.w / 2, hb2.y + 25, 14, '#ffe9b0', 'center', true);
    text('点卡片进入关卡　·　按 ESC 或点空白关闭', DW / 2, DH - 18, 12, '#7f97a6', 'center');
  }

  /* 选关卡片的排版只允许有一份。
   * 原来是 drawLevelSelect 和 levelCardRect 各写一遍 `216/250/18`，
   * 加到第 6 关时 6×216 + 5×18 = 1386 > 1280，卡片整体溢出屏幕 —— 而点击热区
   * 用的是另一份拷贝，于是"看得见"和"点得着"会分家。
   * 现在按卡片数自适应宽度：能放下 216 就用 216，放不下就等分。 */
  function levelCardsLayout() {
    const n = levels.length, GAP = 14, SIDE = 44;
    const CW = Math.min(216, Math.floor((DW - SIDE * 2 - (n - 1) * GAP) / n));
    const CH = 250;
    const totalW = n * CW + (n - 1) * GAP;
    return { CW, CH, GAP, x0: (DW - totalW) / 2, y: 168 };
  }

  function levelCardRect(i) {
    const L = levelCardsLayout();
    return { x: L.x0 + i * (L.CW + L.GAP), y: L.y, w: L.CW, h: L.CH };
  }

  function drawHelp() {
    if (!state.helpOpen) return;
    /* 零件说明面板 —— 第 63 轮改成**两栏**。
     *
     * 旧版是一栏、每件一行、行高 58。零件从 9 件涨到 13 件之后：
     *   84 + 13×58 + 46 = 884 高，而屏幕只有 720 —— 最后三件
     *   （霄灯 / 仙术机关 / 小猪）连同"点任意处关闭"一起画到了屏幕外。
     *   tools/test_layout_audit 报 10 条「越界」，其中 9 条在这一页。
     *
     * 两栏的代价是每行更窄，所以说明文字要更短 —— 这也是为什么
     * PARTS 里的 desc 统一压到 ~40 字（见 game.js 那段注释）。
     * 详细原理在 docs/parts-redesign.md，面板只负责"一眼看懂它干什么"。 */
    const W = 1060, ROWH = 46;
    const perCol = Math.ceil(RAP.TRAY_ORDER.length / 2);
    const H = 76 + perCol * ROWH + 44;
    const X = (DW - W) / 2;
    const Y = Math.max(40, (DH - H) / 2 - 6);
    fillScreen('rgba(6,12,14,.78)');
    ctx.fillStyle = '#132430'; roundRect(X, Y, W, H, 16); ctx.fill();
    ctx.strokeStyle = 'rgba(232,200,122,.55)'; ctx.lineWidth = 2; ctx.stroke();
    text('零件说明 —— 搭之前先知道每个东西干什么', X + 26, Y + 36, 19, '#ffe9b0', 'left', true);

    const order = RAP.TRAY_ORDER;
    const colW = (W - 52) / 2;
    order.forEach((part, i) => {
      const def = RAP.PARTS[part];
      const col = i < perCol ? 0 : 1;
      const row = i < perCol ? i : i - perCol;
      const cx0 = X + 26 + col * colW;
      const yy = Y + 76 + row * ROWH;
      drawPartShape(part, cx0 + 22, yy + 6, 30, 0);
      text(def.label, cx0 + 48, yy, 13.5, '#e6f0f8', 'left', true);
      /* 标签按**新零件表的标志位**拼（第 63 轮）。
       * 旧版读 def.motor / def.energy —— 那两个字段已经不存在，
       * 于是动力源和驱动件的标签是空的，玩家看不出它们是什么。 */
      const tags = [def.mass + ' kg'];
      if (def.structure) tags.push('结构');
      if (def.wheel) tags.push('轮子');
      if (def.seedKind) tags.push('一次性·' +
        (def.seedKind === 'anemo' ? '风场' : def.seedKind === 'geo' ? '岩柱' : '冲刺'));
      if (def.catchesWind) tags.push('吃风 ×' + def.catchesWind);
      if (def.tool) tags.push('驱动 ' + def.thrust);
      if (def.liftMass) tags.push('浮力 +' + def.liftMass + ' kg');
      if (def.dropOne) tags.push('压舱');
      if (def.oneShot) tags.push('一次性');
      if (def.interactive && !def.tapOnBody && !def.oneShot) tags.push('交互件');
      if (def.inner) tags.push('只能放框里');
      if (def.dir) tags.push('有方向');
      if (def.maxStack > 1) tags.push('同格可叠 ' + def.maxStack);
      text(tags.join(' · '), cx0 + 48, yy + 15, 10.5, '#8fb6c9', 'left');
      // 说明文字自动换行（栏内宽度）
      const maxW = colW - 60;
      const chars = (def.desc || '').split('');
      let line = '', ly = yy + 2, lx = cx0 + 196;
      for (let k = 0; k < chars.length; k++) {
        const test = line + chars[k];
        if (ctx.measureText(test).width > maxW && line) {
          text(line, lx, ly, 11.5, '#cfe0ee', 'left');
          line = chars[k]; ly += 16;
        } else line = test;
      }
      if (line) text(line, lx, ly, 11.5, '#cfe0ee', 'left');
    });
    // 右上角关闭按钮
    const cb = { x: X + W - 56, y: Y + 16, w: 34, h: 34 };
    ctx.fillStyle = 'rgba(224,81,60,.9)';
    ctx.beginPath(); ctx.arc(cb.x + cb.w / 2, cb.y + cb.h / 2, 17, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    const ccx = cb.x + cb.w / 2, ccy = cb.y + cb.h / 2;
    ctx.beginPath();
    ctx.moveTo(ccx - 7, ccy - 7); ctx.lineTo(ccx + 7, ccy + 7);
    ctx.moveTo(ccx + 7, ccy - 7); ctx.lineTo(ccx - 7, ccy + 7);
    ctx.stroke();
    text('点任意处关闭 / 按 H', X + W - 26, Y + H - 18, 12, '#7f97a6', 'right');
  }

  /* 气球炸开：一圈粉色橡皮屑 + 一团雾。
   * 和 spawnDebris（木质碎片）分开，因为气球炸开该是"轻、飘、粉色"，
   * 用木头碎片会看起来像"车散架了"，语义完全不对。 */
  function spawnBurstFx(wx, wy) {
    state.bursts = state.bursts || [];
    for (let i = 0; i < 9; i++) {
      const ang = (i / 9) * Math.PI * 2 + Math.random() * 0.5;
      const sp = 2.2 + Math.random() * 3.4;
      state.bursts.push({
        x: wx, y: wy,
        vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp * 0.8 + 1.2,
        r: 2.5 + Math.random() * 3,
        life: 0.42 + Math.random() * 0.28, maxLife: 0.7,
        color: ['#e0708f', '#f6b6c8', '#a8455f'][i % 3]
      });
    }
    // 中心一团白雾，让"炸开"有一瞬间的体积
    for (let i = 0; i < 4; i++) {
      state.bursts.push({
        x: wx + (Math.random() - 0.5) * 0.2, y: wy + (Math.random() - 0.5) * 0.2,
        vx: (Math.random() - 0.5) * 1.2, vy: (Math.random() - 0.5) * 1.2,
        r: 7 + Math.random() * 5,
        life: 0.28 + Math.random() * 0.16, maxLife: 0.44,
        color: 'rgba(255,236,244,.9)'
      });
    }
  }

  function drawBursts(cam) {
    if (!state.bursts || !state.bursts.length) return;
    state.bursts.forEach(b => {
      const p = worldToScreen(b.x, b.y, cam);
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, b.life / b.maxLife));
      ctx.fillStyle = b.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, b.r * PPM * cam.zoom / 32, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
  }

  function spawnDebris(wx, wy) {
    for (let i = 0; i < 10; i++) {
      state.debris.push({
        x: wx, y: wy,
        vx: (Math.random() - 0.5) * 6,
        vy: 1 + Math.random() * 4,
        a: Math.random() * 6.28,
        w: (Math.random() - 0.5) * 14,
        size: 3 + Math.random() * 5,
        life: 0.5 + Math.random() * 0.4,
        maxLife: 0.9,
        color: Math.random() > 0.5 ? '#c08a4a' : '#8a5f30'
      });
    }
  }

  function drawConfetti(cam) {
    if (!state.confetti.length) return;
    state.confetti.forEach(c2 => {
      const p = worldToScreen(c2.x, c2.y, cam);
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, c2.life / 0.8));
      ctx.translate(p.x, p.y); ctx.rotate(c2.a);
      ctx.fillStyle = c2.color;
      ctx.fillRect(-c2.size / 2, -c2.size / 2, c2.size, c2.size * 0.6);
      ctx.restore();
    });
  }

  function spawnDust(wx, wy, n) {
    for (let i = 0; i < n; i++) {
      state.dust = state.dust || [];
      state.dust.push({
        x: wx + (Math.random() - 0.5) * 0.5,
        y: wy + Math.random() * 0.15,
        vx: (Math.random() - 0.5) * 2.2,
        vy: 0.6 + Math.random() * 1.4,
        r: 2 + Math.random() * 3.5,
        life: 0.35 + Math.random() * 0.3,
        maxLife: 0.65
      });
    }
  }

  function drawDust(cam) {
    if (!state.dust || !state.dust.length) return;
    state.dust.forEach(d => {
      const p = worldToScreen(d.x, d.y, cam);
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(0.5, d.life / d.maxLife * 0.5));
      ctx.fillStyle = '#d8cfb0';
      ctx.beginPath();
      ctx.arc(p.x, p.y, d.r * (1.6 - d.life / d.maxLife), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
  }

  /* ══════════ 风 / 喷流的特效（第 68 轮，用户要求）══════════
   *
   * 用户原话：「为什么不给风相关的零件使用的时候给风的特效」。
   *
   * 之前风车桨和喷气口在行驶期**完全没有视觉输出**：车自己往前跑，
   * 而桨是静止的一个图标。玩家看不出"力是从哪来的"，
   * 也看不出"我现在还有没有推力"。
   *
   * 做法：
   *   · 每个正在出力的 blowAir 零件，沿 `blowVec`（风的方向，见 game.js）
   *     吐出一串流线；
   *   · 流线是**粒子**而不是贴图，因为它们必须随车体旋转 —— 车翻过来时
   *     风也要跟着翻；
   *   · 生成点在零件车体局部坐标处（和车一起动），速度 = 风方向 × 风速 + 少量抖动；
   *   · 生命周期很短（0.35 秒），所以"停推"之后半秒内画面就干净了。
   *
   * 为什么在渲染层生成而不是引擎：这是纯视觉，不该进物理、
   * 也不该让 headless 的断言依赖它。引擎已经通过"零件还在不在车上"
   * 说清了"有没有在出力"，这里只是把它画出来。
   *
   * ⚠ 第 71 轮：`p.powered` 随动力容量系统一起删了。驱动件现在**装了就一直出力**，
   * 所以"停推"在玩法里唯一的形状是**零件不在车上**（框碎了、被消耗掉）。
   * 原来这里写 `p.powered && d.tool`，删掉 powered 之后恒为假 ——
   * 所有风特效都不生成了，而画法本身没坏。
   *
   * ⚠ 生成速率必须按 dt 累积，不能"每帧生成 n 个" ——
   * 那样 30fps 和 60fps 的粒子数量差一倍，看起来像两辆不同的车。
   */
  function spawnWindFx(car, dt) {
    state.windFx = state.windFx || [];
    state.windAcc = state.windAcc || 0;
    /* 每秒吐多少条：一个零件 34 条/秒。三层并联时画面才有"风"的密度。 */
    const RATE = 34;
    const ca = Math.cos(car.a), sa = Math.sin(car.a);
    let emitting = 0;
    (car.parts || []).forEach(p => {
      const d = RAP.PARTS[p.part];
      if (!d || !d.blowsAir) return;
      /* ⚠ `p.powered` 已经不存在了（第 71 轮：动力容量系统删掉，驱动件
       * 装了就一直出力）。这里原来写的是 `p.powered && d.tool` ——
       * 于是**所有驱动件的风特效都不生成了**（`undefined` 恒假）。
       * 表现是 test_wind_fx 的 A1/A2/A3 三条全红，而画法本身没坏。
       * 现在条件只有两个：它是驱动件，或者它正在烧（霄灯）。 */
      const on = !!d.tool || (p.burn > 0);
      if (!on) return;
      emitting++;
      const bv = RAP.blowVec(p.part, p.dir || 0);
      // 风在世界里 = 车体局部方向随车旋转
      const wx = bv[0] * ca - bv[1] * sa;
      const wy = bv[0] * sa + bv[1] * ca;
      const ox = car.x + p.lx * ca - p.ly * sa;
      const oy = car.y + p.lx * sa + p.ly * ca;
      // 按 dt 累积（见上面那段注释）
      state.windAcc += dt * RATE;
      while (state.windAcc >= 1) {
        state.windAcc -= 1;
        const sp = 5.2 + Math.random() * 1.8;
        state.windFx.push({
          x: ox + wx * 0.35, y: oy + wy * 0.35,
          vx: wx * sp + (Math.random() - 0.5) * 0.9,
          vy: wy * sp + (Math.random() - 0.5) * 0.9,
          life: 0.34, maxLife: 0.34,
          w: 2.0 + Math.random() * 2.2,
          hue: d.blowsAir ? (p.part === 'jet' ? 1 : 0) : 0    // 0 = 风（青白），1 = 蒸汽（暖）
        });
      }
    });
    state.windEmitting = emitting;
    /* 推进 + 回收。放到渲染层推进是安全的：它只影响自己。 */
    const keep = [];
    for (const f of state.windFx) {
      f.life -= dt;
      if (f.life <= 0) continue;
      f.x += f.vx * dt; f.y += f.vy * dt;
      f.vx *= (1 - 2.2 * dt); f.vy *= (1 - 2.2 * dt);
      keep.push(f);
    }
    state.windFx = keep;
    // 上限：万一一帧卡了很久（切回来时 dt 被夹到 0.05），别让数组爆掉
    if (state.windFx.length > 260) state.windFx.splice(0, state.windFx.length - 260);
  }

  /* ══════════ 种子的三种视觉（第 71 轮）══════════
   *
   * 三个种子都是**看不见的物理**：风场是力、岩柱改的是 groundY、
   * 雷屏障挡的是一条判定线。如果只在引擎里生效，玩家看到的是
   * "我按了 F，车莫名其妙飞起来了" —— 那不是机制，那是 bug 的观感。
   * 所以每一个都必须有明确、能持续读的视觉。
   *
   * 共同的约定：
   *   · 全部按**世界坐标**画（worldToScreen），车一动它们留在地上；
   *   · 全部用**半透明**，因为它们不是实体零件 —— 玩家要能看见车在它们里面；
   *   · 剩余时间必须**看得出来**（风场在缩小、岩柱在升起、屏障在闪）。
   */

  /* 风场：一个半透明的圆 + 一圈向上的流线 + 中心的涡旋。
   * 半径直接读 `wf.r`（引擎同一个数），不是另写一个 ——
   * 画得比作用范围大或小都是在骗玩家。 */
  function drawWindField(cam) {
    const wf = state.run && state.run.windField;
    state.windFieldDrawN = wf ? 1 : 0;
    if (!wf) return;
    const s = PPM * cam.zoom;
    const c = worldToScreen(wf.x, wf.y, cam);
    const rr = wf.r * s;
    const k = Math.max(0, Math.min(1, wf.ttl / (wf.maxTtl || 1)));   // 1 → 0
    ctx.save();
    /* 地面上的圈：用椭圆表示"这是一个俯视的范围"（等距视角）。
     * 只画下半 1/3 高度，让它是**躺在地上**的圈而不是空中的一个球。 */
    const gy = worldToScreen(wf.x, wf.y, cam);
    const eg = ctx.createRadialGradient(c.x, gy.y + rr * 0.25, rr * 0.10,
      c.x, gy.y + rr * 0.25, rr * 0.95);
    eg.addColorStop(0, 'rgba(180,255,238,' + (0.26 * k).toFixed(3) + ')');
    eg.addColorStop(0.62, 'rgba(120,230,210,' + (0.13 * k).toFixed(3) + ')');
    eg.addColorStop(1, 'rgba(120,230,210,0)');
    ctx.fillStyle = eg;
    ctx.beginPath();
    ctx.ellipse(c.x, gy.y + rr * 0.25, rr * 0.98, rr * 0.42, 0, 0, Math.PI * 2);
    ctx.fill();
    // 上涌的流线：位置由时间决定（`state.clock`），不随机 —— 随机会抖
    const T = state.clock || 0;
    ctx.lineCap = 'round';
    for (let i = 0; i < 14; i++) {
      const ph = (i / 14) * Math.PI * 2 + T * 1.6;
      const rad = (0.20 + 0.72 * ((i * 37) % 100) / 100) * rr;
      const bx = c.x + Math.cos(ph) * rad;
      const by = gy.y + rr * 0.25 + Math.sin(ph) * rad * 0.42;
      // 每条流线从地面往上冲，越往上越淡
      const rise = (T * 1.9 + i * 0.37) % 1;          // 0 → 1 循环
      const len = (0.55 + 0.9 * rise) * s;
      ctx.globalAlpha = (0.10 + 0.42 * k) * (1 - rise) * (1 - rise);
      ctx.strokeStyle = 'rgba(206,255,244,.95)';
      ctx.lineWidth = Math.max(1, 2.2 * cam.zoom * (1 - rise * 0.5));
      ctx.beginPath();
      ctx.moveTo(bx, by);
      ctx.lineTo(bx + Math.sin(ph) * 4, by - len);
      ctx.stroke();
    }
    ctx.restore();
  }

  /* 岩柱：从地面升起的一根方柱。
   *
   * `born` 到此刻的时间差决定它"升到几成高" —— 这正是玩家看到的
   * "地长出来了"。**升起的动画不能影响物理**：物理里 `pillar.top` 立刻
   * 就是最终高度（`triggerSeed` 那一刻写死），否则车会被一根
   * 还在上升的柱子挤穿。所以这里只是**视觉补间**，物理早就是最终值。
   * 反过来（让物理也跟着长）会让 0.2 秒内车被推上去 3 米 —— 那是弹射。 */
  function drawPillars(cam) {
    const ps = (state.run && state.run.pillars) || [];
    /* 计数给测试读：`test_seed_fx` 靠它区分"没画"和"画了但颜色不对"
     * （这两种情况的修法完全不同）。 */
    state.pillarDrawN = ps.length;
    if (!ps.length) return;
    const s = PPM * cam.zoom;
    const now = (state.run && state.run.time) || 0;
    ps.forEach(p => {
      const age = Math.max(0, now - (p.born || 0));
      const grow = Math.min(1, age / 0.28);                 // 0.28 秒长到全高
      const ease = 1 - Math.pow(1 - grow, 3);               // 缓出：先快后慢
      const baseY = state.run.terrain.surfaceY(p.x);
      const topY = baseY + (p.top - baseY) * ease;
      const a = worldToScreen(p.x - p.w / 2, baseY, cam);
      const b = worldToScreen(p.x + p.w / 2, topY, cam);
      const wpx = b.x - a.x, hpx = a.y - b.y;
      if (wpx <= 0 || hpx <= 0) return;
      ctx.save();
      // 柱身：上浅下深（和地形同色系，但更暖 —— 它是"新长出来的石头"）
      const pg = ctx.createLinearGradient(a.x, b.y, a.x, a.y);
      pg.addColorStop(0, '#c8b47a');
      pg.addColorStop(0.30, '#a89468');
      pg.addColorStop(1, '#7a6c4e');
      ctx.fillStyle = pg;
      roundRect(a.x, b.y, wpx, hpx, Math.max(2, wpx * 0.06));
      ctx.fill();
      // 顶面：一条亮带，让"这是可以站人的平台"读得出来
      ctx.fillStyle = 'rgba(240,228,180,.85)';
      ctx.fillRect(a.x + wpx * 0.02, b.y, wpx * 0.96, Math.max(2, hpx * 0.10));
      // 两侧的竖向裂纹
      ctx.strokeStyle = 'rgba(70,58,34,.45)';
      ctx.lineWidth = Math.max(1, 1.6 * cam.zoom);
      for (let i = 1; i <= 2; i++) {
        const fx = a.x + wpx * (i / 3);
        ctx.beginPath();
        ctx.moveTo(fx, b.y + hpx * 0.14);
        ctx.lineTo(fx + wpx * 0.03, a.y - hpx * 0.06);
        ctx.stroke();
      }
      // 外描边
      ctx.strokeStyle = 'rgba(58,46,26,.75)';
      ctx.lineWidth = Math.max(1.5, 2.2 * cam.zoom);
      roundRect(a.x, b.y, wpx, hpx, Math.max(2, wpx * 0.06));
      ctx.stroke();
      // 升起时的尘
      if (grow < 1) {
        ctx.globalAlpha = (1 - grow) * 0.55;
        ctx.fillStyle = 'rgba(214,198,154,.9)';
        for (let i = 0; i < 6; i++) {
          const fx = a.x + wpx * (0.12 + 0.16 * i);
          const fr = (3 + i * 1.7) * cam.zoom * (1 + grow);
          ctx.beginPath();
          ctx.arc(fx, a.y - (1 - grow) * 8 * cam.zoom, fr, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();
    });
  }

  /* 雷屏障：一道竖直的紫色能量墙 + 闪电纹。
   * 冲刺时把它画成"正在被穿过"（透明度下降 + 边缘发白），
   * 这样玩家能看出"是冲刺让我穿过去的"，而不是"这堵墙有时候不管用"。 */
  function drawBarriers(cam) {
    const bs = (state.run && state.run.barriers) || [];
    state.barrierDrawN = bs.length;
    if (!bs.length) return;
    const car = state.run.car;
    const dashing = car && car.dashT > 0;
    const T = state.clock || 0;
    bs.forEach(br => {
      const baseY = RAP.groundY(state.run, br.col + 0.5);
      const a = worldToScreen(br.col, baseY, cam);
      const b = worldToScreen(br.col + 1, baseY + br.h, cam);
      const wpx = b.x - a.x, hpx = a.y - b.y;
      if (wpx <= 0 || hpx <= 0) return;
      ctx.save();
      /* 冲刺时几乎穿透（0.22 而不是 0.34）。
       * 0.34 时像素差异只有 4.5%~10.5% —— 在洞穴的深青背景上，
       * 那点变化玩家读不出来，测试也在阈值的边缘抖。
       * 这不是"为了让测试过"而调：玩家需要在**冲刺的那 4 秒里**
       * 就看出"这堵墙现在挡不住我"，否则他会先撞一次才明白。 */
      if (dashing) ctx.globalAlpha = 0.22;
      // 墙体：紫色渐变 + 顶部更亮
      const bg = ctx.createLinearGradient(a.x, b.y, a.x, a.y);
      bg.addColorStop(0, 'rgba(214,178,255,.42)');
      bg.addColorStop(0.45, 'rgba(150,104,220,.34)');
      bg.addColorStop(1, 'rgba(84,48,140,.42)');
      ctx.fillStyle = bg;
      ctx.fillRect(a.x, b.y, wpx, hpx);
      // 闪电纹：三条折线，随时间上下跑
      ctx.strokeStyle = 'rgba(244,232,255,.85)';
      ctx.lineWidth = Math.max(1.2, 2.0 * cam.zoom);
      for (let i = 0; i < 3; i++) {
        const fx = a.x + wpx * (0.22 + i * 0.28);
        ctx.beginPath();
        ctx.moveTo(fx, a.y);
        const seg = 4;
        for (let k2 = 1; k2 <= seg; k2++) {
          const yy = a.y - hpx * (k2 / seg);
          const jitter = Math.sin(T * 6 + i * 2.1 + k2 * 1.7) * wpx * 0.20;
          ctx.lineTo(fx + jitter, yy);
        }
        ctx.stroke();
      }
      // 上下边缘
      ctx.strokeStyle = 'rgba(232,212,255,.9)';
      ctx.lineWidth = Math.max(1.6, 2.4 * cam.zoom);
      ctx.beginPath();
      ctx.moveTo(a.x, b.y); ctx.lineTo(a.x + wpx, b.y);
      ctx.moveTo(a.x, a.y); ctx.lineTo(a.x + wpx, a.y);
      ctx.stroke();
      ctx.restore();
    });
  }

  function drawWindFx(cam) {
    if (!state.windFx || !state.windFx.length) return;
    const s = PPM * cam.zoom;
    state.windFx.forEach(f => {
      const p = worldToScreen(f.x, f.y, cam);
      const k = f.life / f.maxLife;                 // 1 → 0
      ctx.save();
      /* 风是"青白色流线"：越老越透明、越细。用线段而不是圆点，
       * 因为流线才有方向感 —— 圆点看起来像灰尘。 */
      const len = (0.30 + 0.55 * (1 - k)) * s;
      const nrm = Math.hypot(f.vx, f.vy) || 1;
      const dx = f.vx / nrm * len, dy = -f.vy / nrm * len;
      ctx.globalAlpha = 0.10 + 0.42 * k;
      ctx.strokeStyle = f.hue ? 'rgba(255,214,170,.95)' : 'rgba(206,244,255,.95)';
      ctx.lineWidth = Math.max(1, f.w * (0.45 + 0.55 * k) * (cam.zoom / 1.6));
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + dx, p.y + dy);
      ctx.stroke();
      ctx.restore();
    });
    state.windFxDrawN = state.windFx.length;   // 供测试读"这一帧画了几条"
  }

  function drawDebris(cam) {
    if (!state.debris.length) return;
    state.debris.forEach(d => {
      const p = worldToScreen(d.x, d.y, cam);
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, d.life / 0.5));
      ctx.translate(p.x, p.y); ctx.rotate(d.a);
      ctx.fillStyle = d.color;
      ctx.fillRect(-d.size / 2, -d.size / 2, d.size, d.size);
      ctx.restore();
    });
  }

  function drawToast() {
    if (state.toastT <= 0) return;
    ctx.fillStyle = 'rgba(16,22,28,.85)';
    const w = Math.max(220, state.toast.length * 16 + 40);
    roundRect(DW / 2 - w / 2, DH - 190, w, 44, 10); ctx.fill();
    text(state.toast, DW / 2, DH - 160, 17, '#ffe08a', 'center');
  }

  // ---------- 主循环 ----------
  let last = performance.now();
  let frameErr = null;
  function frame(now) {
    try { frameBody(now); } catch (e) {
      frameErr = (e && e.message) || String(e);
      console.error('frame error:', e);
      try {
        ctx.fillStyle = 'rgba(200,60,40,.9)';
        ctx.fillRect(8, 8, 560, 26);
        text('渲染异常（游戏继续）：' + frameErr, 16, 26, 13, '#fff');
      } catch (e2) {}
    }
    requestAnimationFrame(frame);
  }
  function frameBody(now) {
    applyCanvasSize();
    state.frameCount = (state.frameCount || 0) + 1;   // 只用于"rAF 还活着吗"这类测试
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    /* 全局动画时钟（第 71 轮）。风场的流线、雷屏障的闪电都按它走。
     * ⚠ 用它而**不用** `performance.now()` —— 后者在无头浏览器里
     * 会跟着 rAF 一起被节流，测试里"画了几帧"和"过了几秒"就对不上。 */
    state.clock = (state.clock || 0) + dt;
    if (state.toastT > 0) state.toastT -= dt;
    if (state.runBanner > 0) state.runBanner = Math.max(0, state.runBanner - dt);
    state.arrowDrawN = 0;      // 每帧重置：方向箭头只在建造期画，测试靠它确认
    /* 地形预览条同理：每帧重置后由 drawBuildPreview 重新填。
     * 行驶期这两项必须保持 0/null —— 那时玩家已经在跑真地形了，
     * 再挂一条缩略图是噪音（test_build_preview.js 会验这一条）。 */
    state.previewDrawN = 0;
    state.previewProfile = null;

    ctx.clearRect(-VIEW_OFF_X - 2, -VIEW_OFF_Y - 2, VIEW_W + 4, VIEW_H + 4);
    if (state.phase === 'build') {
      // 地形缓存：同一关不重复重建（每帧重建要跑 3 遍高斯平滑，很贵）
      if (terrainCacheId !== level().levelId || !terrainCache) {
        terrainCache = RAP.makeTerrain(level());
        terrainCacheId = level().levelId;
      }
      const ter = terrainCache;
      /* 建造相用**玩家自己的**镜头（可平移/缩放），不是 buildCam()。
       *
       * buildCam() 是"贴着起点的一个特写"，现在只作为初始值：
       * 进场先把整关收进画面（buildViewDefault），玩家想细看再滚轮推近。
       * 入场推镜保留，但它推去的目标从"特写"改成"玩家当前的 buildView" ——
       * 否则玩家一进关就被强行拉回起点，刚看的全貌白看了。 */
      if (!state.buildView) state.buildView = buildViewDefault(level());
      const bv = clampBuildView(state.buildView, level());
      state.buildView = bv;
      /* ---------- 观察模式：WASD / 摇杆推镜头（第 64 轮） ----------
       *
       * 位移按 dt 推进（不是按事件），所以"按住"就是持续平移，
       * 而按下/松手的频率不会影响速度。
       *
       * 速度用 worldPxPerSec / (PPM*zoom)：屏幕上一秒滑多少像素是**恒定的**，
       * 放大时世界位移自动变小 —— 这才是"拖画面"的手感。
       * 如果按世界速度算，放大之后会飞得看不见。
       */
      {
        const panScreen = 420;                  // 屏幕像素/秒（满杆）
        const s2 = PPM * bv.zoom;
        let mx = 0, my = 0;
        const ok = state.observeKeys || {};
        if (state.observe) {
          if (ok['a']) mx -= 1;
          if (ok['d']) mx += 1;
          if (ok['w']) my += 1;                 // W = 往上看 = 世界 y 增大
          if (ok['s']) my -= 1;
        }
        if (state.joystick) {
          mx += state.joystick.dx || 0;
          my -= state.joystick.dy || 0;         // 摇杆向下（dy>0）= 视角往下
        }
        if (mx || my) {
          const k2 = (panScreen / s2) * dt;
          bv.x += mx * k2;
          bv.y += my * k2;
          clampBuildView(bv, level());
        }
      }
      /* 「回拼装区」的缓动（第 66 轮）。
       *
       * 0.35 秒 ease-out。瞬移会让人丢掉"我被带到哪了"的空间感 ——
       * 视角一跳，玩家得在画面里重新找自己的车；缓动让他**看着**自己回去。
       * 缓动期间玩家一按 WASD/摇杆就立刻放弃，否则会出现"我在拖、镜头却被按钮
       * 往回拽"的对拉。 */
      if (state.recentre) {
        const rc = state.recentre;
        const keep = state.observeKeys || {};
        const userMoving = state.observe &&
          (keep['w'] || keep['a'] || keep['s'] || keep['d'] || state.joystick);
        if (userMoving) {
          state.recentre = null;
        } else {
          rc.t += dt;
          const k = Math.min(1, rc.t / 0.35);
          const e = 1 - Math.pow(1 - k, 3);
          const home = buildViewDefault(level());
          bv.x = rc.from.x + (home.x - rc.from.x) * e;
          bv.y = rc.from.y + (home.y - rc.from.y) * e;
          bv.zoom = rc.from.zoom + (home.zoom - rc.from.zoom) * e;
          clampBuildView(bv, level());
          if (k >= 1) state.recentre = null;
        }
      }
      const cam = { x: bv.x, y: bv.y, zoom: bv.zoom };
      if (state.introT < 1) {
        state.introT = Math.min(1, state.introT + dt / 1.2);
        const k = 1 - Math.pow(1 - state.introT, 3);      // ease-out cubic
        const wide = { x: cam.x, y: cam.y, zoom: Math.max(BUILD_ZOOM_MIN, cam.zoom * 0.55) };
        cam.y = wide.y + (cam.y - wide.y) * k;
        cam.zoom = wide.zoom + (cam.zoom - wide.zoom) * k;
      }
      // 记录"这一帧真正用的镜头"，供测试核对推镜幅度（buildCam() 每帧新建对象，
      // 光看 state.cam 永远是终值，测不出推镜有没有跑）
      state.camLive = { x: cam.x, y: cam.y, zoom: cam.zoom };
      drawWorld(ter, cam);
      // 建造阶段的场景压暗：让拼装区成为视觉主体（原样太亮，网格糊在风景里）
      if (state.introT > 0.2) {
        // 压暗强度按地貌给：洞穴本身就黑，再压就看不见了
        const bm = BIOMES[(level() && level().biome) || 'field'] || BIOMES.field;
        ctx.globalAlpha = Math.min(1, (state.introT - 0.2) / 0.5);
        fillScreen('rgba(6,14,20,' + (bm.dim || 0.26).toFixed(2) + ')');
        ctx.globalAlpha = 1;
      }
      ctx.save();
      ctx.translate(0, VIEW_OFF_Y);      // UI 在设计区居中（4:3 时上下有扩展）
      // 入场时 UI 淡入（前 40% 不显示）
      ctx.globalAlpha = 1;   // 强制复位（缓存切换可能残留 alpha）
      const uiAlpha = state.introT < 0.35 ? 0 : Math.min(1, (state.introT - 0.35) / 0.35);
      if (uiAlpha < 1) ctx.globalAlpha = uiAlpha;
      drawGrid();
      drawBuildCar();
      if (state.bounce) {
        state.bounce.t += dt;
        const k = Math.min(1, state.bounce.t / 0.25);
        if (k >= 1) { state.bounce = null; }
        else {
          const idx = TRAY.indexOf(state.bounce.part);
          const target = idx >= 0 ? trayRect(idx) : { x: DW / 2, y: DH - 60, w: 0, h: 0 };
          const tx = target.x + target.w / 2, ty = target.y + target.h / 2;
          const bx = state.bounce.x + (tx - state.bounce.x) * k;
          const by = state.bounce.y + (ty - state.bounce.y) * k;
          ctx.save();
          ctx.globalAlpha = 1 - k * 0.7;
          drawPartShape(state.bounce.part, bx, by,
            (buildOrigin().px) * 0.84 * (1 - k * 0.3), 0);
          ctx.restore();
        }
      }
      drawTray();
      drawObserveBtn();
      drawRecentreBtn();
      drawButtons();
      drawTabs();
      /* 地形预览条必须用这一帧的 ter（可能刚重建过），并且只画在建造期：
       * 行驶期玩家已经在跑那段地形了，再挂一条缩略图只是噪音。 */
      drawBuildPreview(ter);
      drawHud();
      /* 摇杆画在**所有 UI 之上**：它出现在玩家按下的地方，
       * 那可能正好压在托盘或网格上，被盖住就看不见自己推了多远。 */
      drawJoystick();
      if (uiAlpha < 1) ctx.globalAlpha = 1;
      ctx.restore();
    } else if (state.phase === 'run' || state.phase === 'resolved') {
      // 慢动作衰减（撞击后 0.25 倍，0.35 秒内恢复）
      if (state.slowmo > 0) state.slowmo = Math.max(0, state.slowmo - dt);
      // 气球炸开的橡皮屑：轻、飘、带上升（气球是"往上炸"的）
      if (state.bursts && state.bursts.length) {
        state.bursts.forEach(b => {
          b.x += b.vx * dt; b.y += b.vy * dt;
          b.vx *= (1 - 2.6 * dt);
          b.vy -= 1.2 * dt;          // 继续往上飘，不是往下掉
          b.life -= dt;
        });
        state.bursts = state.bursts.filter(b => b.life > 0);
      }
      // 尘土：上浮 + 扩散 + 淡出
      if (state.dust && state.dust.length) {
        state.dust.forEach(d => {
          d.vy -= 2.2 * dt;
          d.x += d.vx * dt;
          d.y += d.vy * dt;
          d.vx *= (1 - 2.2 * dt);
          d.life -= dt;
        });
        state.dust = state.dust.filter(d => d.life > 0);
      }
      // 纸花：抛物线 + 摇曳 + 淡出
      if (state.confetti.length) {
        state.confetti.forEach(c2 => {
          c2.vy -= 9 * dt;
          c2.x += c2.vx * dt + Math.sin(performance.now() / 260 + c2.a) * 0.02;
          c2.y += c2.vy * dt;
          c2.a += c2.w * dt;
          c2.life -= dt;
        });
        state.confetti = state.confetti.filter(c2 => c2.life > 0);
      }
      // 碎片：抛物线 + 旋转 + 淡出
      if (state.debris.length) {
        state.debris.forEach(d => {
          d.vy -= 16 * dt;
          d.x += d.vx * dt; d.y += d.vy * dt;
          d.a += d.w * dt; d.life -= dt;
        });
        state.debris = state.debris.filter(d => d.life > 0);
      }
      /* 只有**整场都在跑**时才推进物理。
       *
       * 光判 run.phase 不够：state.phase 才是这一层认的那一个（相机、结算卡、
       * 暂停都看它）。两边一旦不同步 —— 测试会直接把 state.phase 改成
       * 'resolved' 去截结算页 —— 底下的这局还会继续走物理，而看门狗
       * 拿着一个被外部改过的 time 一算 noGainFor 就立刻判负，
       * 把刚设好的 win 覆盖成 fail，结算卡永远出不来。
       * （第 39 轮加看门狗之后，排版审计和对比度审计就是这样同时挂的。） */
      if (state.run && state.phase === 'run' && state.run.phase === 'run' && !state.paused) {
        // 固定 60Hz 累加
        const timeScale = state.slowmo > 0 ? 0.3 : 1;
        state.run.acc = (state.run.acc || 0) + dt * timeScale;
        let guard = 0;
        while (state.run.acc >= 1 / 60 && guard++ < 5) {
          state.run.acc -= 1 / 60;
          // 标准解里的"按下/松开/扔/扎"时刻（只由 launchSpec 注入）：
          // 走的是玩家按键 / 点车身的同一批函数，不是伪造状态。
          // 三类动作用同一条时间轴，和 game.js 的 simulate 同构 ——
          // 否则 1-6 只会在 Node 里通关，浏览器里一次都跑不到（第 40 轮修）。
          if (state.run.actScript && state.run.actScript.length) {
            const ps = state.run.actScript;
            while (ps.length && ps[0].t <= state.run.time) {
              const a = ps.shift();
              if (a.k === 'release') RAP.releaseInteract(state.run, a.n || 1);
              else if (a.k === 'drop') RAP.dropSandbag(state.run, a.n || 1);
              else if (a.k === 'pop') RAP.popBalloon(state.run, a.n || 1);
              else if (a.k === 'seed') RAP.triggerSeed(state.run, a.kind);
              else RAP.pressInteract(state.run, a.n || 1);
            }
          }
          RAP.step(state.run, 1 / 60);
          // 撞击检测（用事件流，避免改物理）
          const evs = state.run.events || [];
          if (evs.length !== (state.lastEventLen || 0)) {
            for (let i = state.lastEventLen || 0; i < evs.length; i++) {
              if (evs[i].indexOf('impact') === 0) {
                state.slowmo = 0.35;
                state.shake = Math.min(1.4, state.shake + 0.85);
                state.flash = 1;
                state.vignette = 1;
                spawnDebris(state.run.car.x, state.run.car.y + 0.4);
              } else if (evs[i].indexOf('burst') === 0) {
                /* 气球炸了：在炸点撒一圈橡皮屑 + 一小团粉色雾。
                 * 没有这个，点气球只有"数字变了"、画面上什么都不发生 ——
                 * 玩家会以为没点中。坐标由物理层写进事件串，渲染层只负责画。 */
                const mb = evs[i].match(/x=(-?[\d.]+) y=(-?[\d.]+)/);
                const bx = mb ? parseFloat(mb[1]) : state.run.car.x;
                const by = mb ? parseFloat(mb[2]) : state.run.car.y;
                spawnBurstFx(bx, by);
                SFX.pop();
              } else if (evs[i].indexOf('sandbag_drop') === 0) {
                SFX.bagDrop();
              } else if (evs[i].indexOf('firework_light') === 0) {
                /* 霄灯被点亮（第 63 轮新增零件）。玩家点它一下 → 开始烧 1.2 秒。
                 * 没有这条的话，点一下之后画面上除了灯身闪一下什么都不发生，
                 * 而"它到底点着了没有"是这一关最关键的判断。 */
                SFX.place(0.5);
                state.fireworkFlash = 1;
              } else if (evs[i].indexOf('firework_out') === 0) {
                /* 霄灯烧完。这一刻玩家必须知道 —— 推力没了，
                 * 从此这盏灯只是配重。用轻的一声 + 一点烟。 */
                SFX.bagDrop();
              } else if (evs[i].indexOf('wind_field') === 0) {
                /* 风场生成 / 结束（第 71 轮）。
                 * 风场是**看不见的力**，所以它在画面上必须有明确的开始和结束 ——
                 * 玩家按了 2 号键，如果只有一股粒子，他不会知道自己买了 3 秒。 */
                if (evs[i].indexOf('wind_field_end') === 0) {
                  SFX.bagDrop();
                } else {
                  SFX.pop();
                }
              } else if (evs[i].indexOf('pillar') === 0) {
                /* 岩柱升起。低沉的"轰"和轻的"噗"都表达不了"地长出来了"，
                 * 用触地音 + 一次轻震屏最接近。
                 * ⚠ SFX 里没有 `impact` 这个名字（那是**事件**名，不是音效名）。
                 * 音效只有 thud / hurt / crack / structBreak 几个；
                 * 写成 SFX.impact() 会每帧抛 TypeError，被 frame() 吞掉之后
                 * 整个渲染循环停在上一帧 —— 表现是"画什么都没反应"。 */
                SFX.thud(2);
                state.shake = Math.max(state.shake || 0, 0.5);
              } else if (evs[i].indexOf('dash_start') === 0) {
                /* 冲刺开始：这一下的音量必须比普通动作大，
                 * 因为接下来 4 秒玩家是"失控"的（速度快、方向固定）。 */
                SFX.pop();
                state.flash = Math.max(state.flash || 0, 0.35);
              } else if (evs[i].indexOf('dash_end') === 0) {
                SFX.bagDrop();
              } else if (evs[i].indexOf('barrier_block') === 0) {
                /* 撞上雷屏障。和"撞墙"必须能听出区别 ——
                 * 屏障是"再试一次就好"，不是"这把废了"。 */
                SFX.thud(1);
                toast('雷屏障挡路：用雷种冲刺才穿得过');
              } else if (evs[i].indexOf('part_broken') === 0) {
                /* 木框碎了：这局的「不散架」已经没了，必须有一声和"裂缝"完全不同的音。
                 * 原来这里什么都不做 —— 碎框唯一的表现是通用撞击音 + 木框耐久条消失，
                 * 玩家听到的和"撞了一下"一模一样，但代价差一颗星。
                 *
                 * 一次撞击会同时碎掉**每一块**结构件（2~3 格），也就是连发 2~3 条
                 * part_broken 事件。三条音效在同一毫秒叠起来不是"更响"，
                 * 而是一团糊掉的噪声（实测 8 米落体响了 3 声）。
                 * 所以这里按 0.25 秒去重：一次撞击 = 一声断裂。 */
                if (!state.lastBreakSfx || state.run.time - state.lastBreakSfx > 0.25) {
                  state.lastBreakSfx = state.run.time;
                  SFX.structBreak();
                  state.shake = Math.min(1.3, state.shake + 0.55);
                  state.flash = Math.max(state.flash, 0.45);
                }
              } else if (evs[i].indexOf('struct_hurt') === 0) {
                /* 木框掉耐久（还没碎）。在它之前，这件事在画面上是**完全静默**的：
                 * 只有木头上多一道相对淡的缝，没有音、没有抖、没有闪。
                 * 于是「不散架」这颗星是靠"你回头自己发现"来惩罚玩家的。
                 * 这里给它一声木头裂的音 + 一点点抖，量级比 touch lvl=4 小一半：
                 * 掉耐久不是灾难片，是提醒。 */
                SFX.crack();
                state.shake = Math.min(1.1, state.shake + 0.30);
              } else if (evs[i].indexOf('motor_out') === 0) {
                /* 马达断电。引擎一直在写这条事件（game.js），渲染层原来是**零消费者**：
                 * 车不再被推动，玩家只看到它慢慢停住，然后 8 秒没进展判负，
                 * 失败卡写"一直在原地打转：8 秒没能更靠近终点"。
                 * 真实原因是电池用光。1-3 的整关设计就是围着电量转的，
                 * 归零却没有任何提示，等于把最关键的一次状态变化藏起来。
                 * 这里给一次明确提示 + 一次闷响（不是撞击级别，是"东西停了"）。 */
                toast('电池用光了 —— 马达停了');
                SFX.motorOut();
              } else if (evs[i].indexOf('touch lvl=') === 0) {
                // 分级接触反馈
                const lv = parseInt(evs[i].split('lvl=')[1], 10) || 1;
                const mx = evs[i].match(/x=([\d.]+)/);
                const px = mx ? parseFloat(mx[1]) : state.run.car.x;
                const strengths = [0, 0.10, 0.22, 0.42, 0.85];
                state.shake = Math.min(1.2, state.shake + strengths[lv]);
                /* 记下"这一局震到过的最大值"（第 63 轮加）。
                 *
                 * 为什么需要：`state.shake` 每帧按 elapsed*3.2 衰减，
                 * Lv2 的 0.22 只要 70 ms 就掉到 0.05 以下。任何
                 * **按固定间隔轮询**的测试（100 ms 一次）几乎必然错过峰值 ——
                 * tools/test_touch_fx 就是这么误报的："Lv≥2 出现 1 次，
                 * 震屏峰值 0.05"，而实际上它确实震过。
                 *
                 * 记一个峰值字段，测试读它，就不用和帧率赛跑。
                 * 这个字段是**纯观测值**，不参与任何物理/玩法判定。 */
                state.shakePeak = Math.max(state.shakePeak || 0, state.shake);
                if (lv >= 3) { state.flash = Math.max(state.flash, 0.35); }
                if (lv >= 2) { state.vignette = Math.max(state.vignette, lv >= 3 ? 0.7 : 0.25); }
                // 尘土：级别 1~2 个小，3~4 用碎片
                const n = [0, 3, 5, 8, 10][lv] || 3;
                if (lv >= 3) spawnDebris(px, state.run.car.y + 0.2);
                spawnDust(px, state.run.car.y - 0.3, n);
                SFX.thud(lv);
              }
            }
            state.lastEventLen = evs.length;
          }
        }
      }
      if (state.run && state.run.phase === 'resolved' && state.phase === 'run') {
        state.phase = 'resolved';
        state.resultT = 0;
        state.outroT = 0;                              // 推镜过渡计时
        state.slowmo = Math.max(state.slowmo, 0.75);   // 过关瞬间放慢（比撞击更久）
        if (state.run.result === 'win') {
          // 纸花：从车上方上抛
          for (let k = 0; k < 26; k++) {
            state.confetti.push({
              x: state.run.car.x + (Math.random() - 0.5) * 3,
              y: state.run.car.y + 2.2 + Math.random() * 1.2,
              vx: (Math.random() - 0.5) * 5,
              vy: 3 + Math.random() * 4.5,
              a: Math.random() * 6.28,
              w: (Math.random() - 0.5) * 12,
              size: 3 + Math.random() * 4,
              life: 1.6 + Math.random() * 0.8,
              color: ['#ffd93d', '#63d97e', '#4a9be0', '#e8816a', '#ffffff'][k % 5]
            });
          }
          SFX.cheer();
        }
        if (state.run.result === 'win') {
          // 先读旧记录，判断破没破纪录、点亮了几颗新星，再写
          const rec = readRecord(level().levelId);
          const oldBest = rec ? rec.best : null;
          state.newBest = (oldBest === null || state.run.time < oldBest);
          state.oldBest = oldBest;
          /* 这一局点亮了哪几颗**新**星 —— 结算卡上那格只画这个数。
           * 原来这里还算了一次 coinsBefore/coinsAfter（金币的差），
           * 第 61 轮金币整个删掉之后，唯一还会增长的只有星，
           * 而星的差就是 newGoals.length —— 不需要第二套记账。
           *
           * 同时删掉了 `state.newStarRecord`：它记的是"本关累计星数有没有涨"，
           * 而 mergeGoals 是**取并集**，所以「星数涨了」和「newGoals 非空」是
           * 同一件事的两种写法。原来它喂那枚「星级提升！」胶囊，
           * 胶囊合并进星星位之后它就没有读者了 —— 一个写了没人读的字段
           * 正是 tools/audit_state_fields.js 专门在抓的形状，不能留着。 */
          const goals = state.run.starGoals ||
            { arrive: state.run.stars >= 1, boxes: state.run.stars >= 2, challenge: state.run.stars >= 3 };
          const res = saveProgress(level().levelId, goals, state.run.time, state.run.boxesGot);
          state.newGoals = GOALS.filter(k => goals[k] && !res.before[k]);
          state.totalGoals = mergeGoals(res.after);
          state.didSave = true;
        } else {
          state.newBest = false;
          state.didSave = false;
          state.newGoals = [];
          // 失败也要让玩家看到"这一关已经亮了几颗" —— 否则累计制读不出来
          const rec2 = readRecord(level().levelId);
          state.totalGoals = rec2 ? mergeGoals(rec2.goals) : mergeGoals(null);
        }
        if (state.run.result === 'win') SFX.win(); else SFX.fail();
      }
      // 轮子滚动环境音（按速度调制）
      if (state.run && state.run.phase === 'run' && !state.paused) {
        const sp3 = Math.hypot(state.run.car.vx, state.run.car.vy);
        SFX.rollStart();
        SFX.rollSet(sp3);
      } else {
        SFX.rollStop();
      }
      const prevBox = state.run ? state.run.boxesGot : 0;
      const prevHp = state.run ? state.run.pigHP : 3;
      drawRun(dt);
      if (state.run) {
        if (state.run.boxesGot > prevBox) SFX.box();
        if (state.run.pigHP < prevHp) SFX.hurt();
      }
      drawTabs();
      drawHud();
      // 结算推镜：0.2 秒内把镜头推近 12%（再盖卡片，避免硬切）
      if (state.phase === 'resolved' && state.outroT < 1) {
        state.outroT = Math.min(1, state.outroT + dt / 0.2);
        const kz = 1 + 0.12 * (1 - Math.pow(1 - state.outroT, 2));
        state.camState.zoom *= 1 + (kz - 1) * 0.35;
      }
      if (state.slowmo > 0 && state.phase === 'run') {
        fillScreen('rgba(232,200,122,.08)');
      }
      if (state.phase === 'resolved') drawResult(dt);
      drawButtons();
    }
    drawWelcome();
    drawLevelSelect();
    drawHelp();
    /* 静音钮画在**所有面板之后**：欢迎页、选关页、零件说明、暂停卡都会盖住
     * 大半个屏幕，而那几页正好是玩家最想静音的地方（尤其是被自动暂停的时候）。
     * 画在最底层就等于"看起来在那儿、其实点不着"—— 本项目已经踩过一次
     * （右上角的钮被引导层吞掉，见 test_mute.js 的 B4/B5）。 */
    drawMuteBtn();
    /* 提示钮和静音钮同一层（也画在所有面板之后）：卡关的玩家正在看着
     * 零件说明页/暂停卡，而"我要提示"恰恰是那一刻的念头。
     * 画在底层就等于"那个页面里没有提示"。
     * 但欢迎页例外 —— 新玩家还没看过规则，提示卡由点击处理挡住不显示。 */
    drawHintBtn();
    drawHintCard();
    drawToast();
  }
  // 首次进入自动显示欢迎引导
  try {
    if (!localStorage.getItem('rap-welcomed-v1')) state.welcome = 1;
  } catch (e) { state.welcome = 1; }

  /* `BUILD_PX` 不再是常量 —— 一格 = PPM × zoom（见 buildOrigin）。
   * 导出 buildCellPx() 给测试用；老的 BUILD_PX 保留成一个 getter 形态的函数，
   * 免得还在读它的探针直接崩（读到的值是**当前**格边长）。 */
  window.__rap = { state, RAP, levels, startLevel, launch, launchSpec, buildOrigin,
                   /* 风特效生成器：签名与内部一致（car, dt）。
                    * 测试要能直接按固定步长驱动它，才证明得出"帧率无关"。 */
                   spawnWindFx: (car, dt) => spawnWindFx(car, dt),
                   /* 第 66 轮：视角两颗钮的几何（绘制与判定同一份）+ 缓动状态 */
                   observeBtnRect, recentreRect, buildViewAwayFromHome,
                   buildCellPx, get BUILD_PX() { return buildCellPx(); },
                   cellAt, canvasPos,
                   /* ⚠ `TRAY` 必须导出成 **getter**，不能按值导出。
                    * refreshTray() 是重新赋值（TRAY = [...]），按值导出会让
                    * `__rap.TRAY` 永远停在初始化那一刻的那个数组 ——
                    * 第 67 轮就是这么踩的：测试读到空数组，浏览器里托盘却正常。
                    * 按值导出读的是一个**快照**，那是最难发现的一类假绿。 */
                   trayRect, btnRect, get TRAY() { return TRAY; },
                   refreshTray, pauseRowRects, level, welcomeCard, welcomeBtnRect,
                   welcomeSkipRect, levelCardRect, runTimeRects, runProgressRect,
                   runChallengeRect, challengeStatus, SAVE_KEY,
                   readRecord, saveProgress, starsOf, mergeGoals, goalNames,
                   totalStars, GOALS, RAP, tapAt: (wx, wy) => RAP.tapAt(state.run, wx, wy),
                   /* 种子触发（第 71 轮）。测试要能走和玩家按 F 键**同一条路径**，
                    * 而不是自己写 state 字段 —— 后者会让测试绿而实机红
                    * （一次性/范围性这些规则都在 triggerSeed 里）。 */
                   triggerSeed: (which) => RAP.triggerSeed(state.run, which),
                   drawStackBadge, liftLineOf: () => liftLineCache,
                   challengeNameOf, goalNames, challengeStatus, overGoalNotice,
                   progressWarning, failText, failCulprit, chapterDone, resultNextBtn, frameHpOf, frameSegRects,
                   pumpChargeOf, muteRect, toggleMute,
                   /* 提示（第 62 轮）：测试要读的必须是渲染读的那一份 ——
                    * hintFor 就是 drawHintCard 用的那个函数，不是另抄的文案表。 */
                   hintRect, hintFor, HINTS, DEFAULT_HINTS,
                   /* 刹车没了按钮，但引擎函数还在 —— 测试要能直接调它
                    * 证明「删按钮 ≠ 删物理」（见 tools/test_brake_removed.js）。 */
                   setBrake: (st, on) => RAP.setBrake(st, on),
                   /* 建造相「看全图」的几何：测试要读的必须是渲染用的那一份。 */
                   buildViewDefault, clampBuildView, BUILD_ZOOM_MIN, BUILD_ZOOM_MAX,
                   buildPreviewRect, buildPreviewGeom, previewWin, PREVIEW_SPAN_M,
                   sfxStats: () => SFX.stats(), sfxResetStats: () => SFX._resetStats(),
                   /* 音效分支记录（只存名字，不给逻辑用）：测试读不到 WebAudio，
                    * 靠它才能断言"碎框走的是 structBreak 这一支"而不是靠人耳。 */
                   fxLog: () => fxLog.slice(), clearFxLog: () => { fxLog.length = 0; } };
  startLevel(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
