      text(boxTxt, x + CW / 2, y + 236, 10, 'rgba(212,228,240,.82)', 'center');
    });
    // 底部进度条带：填掉卡片下方的大片空白，同时给一个"总进度"的目标感
    {
      let tot = 0, got = 0, cleared = 0;
      levels.forEach(lv => {
        let pr = progress[lv.levelId];
        try { const raw = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}') || {};
              if (raw[lv.levelId]) pr = raw[lv.levelId]; } catch (e) {}
        pr = pr || { stars: 0, best: null };
        tot += 3; got += (pr.stars || 0); if (pr.best) cleared++;
      });
      const BW = 520, BX = DW / 2 - BW / 2, BY = 478;
      ctx.fillStyle = 'rgba(14,28,34,.9)';
      roundRect(BX - 22, BY - 26, BW + 44, 92, 14); ctx.fill();
      ctx.strokeStyle = 'rgba(232,200,122,.22)'; ctx.lineWidth = 1.5;
      roundRect(BX - 22, BY - 26, BW + 44, 92, 14); ctx.stroke();
      text('总进度', BX, BY, 12, 'rgba(200,220,236,.9)', 'left', true);
      text('通关 ' + cleared + ' / ' + levels.length + ' 关', BX + BW, BY, 12, '#9fb2c2', 'right');
      ctx.fillStyle = 'rgba(255,255,255,.10)';

  function spawnDebris(wx, wy) {
    for (let i = 0; i < 10; i++) {
      state.debris.push({
        x: wx, y: wy,
        vx: (Math.random() - 0.5) * 6,
        vy: 1 + Math.random() * 4,
        a: Math.random() * 6.28,
        w: (Math.random() - 0.5) * 14,
        size: 3 + Math.random() * 5,
        life: 0.5 + Math.random() * 0.4,
        maxLife: 0.9,
        color: Math.random() > 0.5 ? '#c08a4a' : '#8a5f30'
      });
    }
  }

  function drawConfetti(cam) {
    if (!state.confetti.length) return;
    state.confetti.forEach(c2 => {
      const p = worldToScreen(c2.x, c2.y, cam);
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, c2.life / 0.8));
      ctx.translate(p.x, p.y); ctx.rotate(c2.a);
      ctx.fillStyle = c2.color;
      ctx.fillRect(-c2.size / 2, -c2.size / 2, c2.size, c2.size * 0.6);
      ctx.restore();
    });
  }

  function spawnDust(wx, wy, n) {
    for (let i = 0; i < n; i++) {
      state.dust = state.dust || [];
      state.dust.push({
        x: wx + (Math.random() - 0.5) * 0.5,
        y: wy + Math.random() * 0.15,
        vx: (Math.random() - 0.5) * 2.2,
        vy: 0.6 + Math.random() * 1.4,
        r: 2 + Math.random() * 3.5,
        life: 0.35 + Math.random() * 0.3,
        maxLife: 0.65
      });
    }
  }

  function drawDust(cam) {
    if (!state.dust || !state.dust.length) return;
    state.dust.forEach(d => {
      const p = worldToScreen(d.x, d.y, cam);
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(0.5, d.life / d.maxLife * 0.5));
      ctx.fillStyle = '#d8cfb0';
      ctx.beginPath();
      ctx.arc(p.x, p.y, d.r * (1.6 - d.life / d.maxLife), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
  }

  function drawDebris(cam) {
    if (!state.debris.length) return;
    state.debris.forEach(d => {
      const p = worldToScreen(d.x, d.y, cam);
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, d.life / 0.5));
      ctx.translate(p.x, p.y); ctx.rotate(d.a);
      ctx.fillStyle = d.color;
      ctx.fillRect(-d.size / 2, -d.size / 2, d.size, d.size);
      ctx.restore();
    });
  }

  function drawToast() {
    if (state.toastT <= 0) return;
    ctx.fillStyle = 'rgba(16,22,28,.85)';
    const w = Math.max(220, state.toast.length * 16 + 40);
    roundRect(DW / 2 - w / 2, DH - 190, w, 44, 10); ctx.fill();
    text(state.toast, DW / 2, DH - 160, 17, '#ffe08a', 'center');
  }

  // ---------- 主循环 ----------
  let last = performance.now();
  let frameErr = null;
  function frame(now) {
    try { frameBody(now); } catch (e) {
      frameErr = (e && e.message) || String(e);
      console.error('frame error:', e);
      try {
        ctx.fillStyle = 'rgba(200,60,40,.9)';
        ctx.fillRect(8, 8, 560, 26);
        text('渲染异常（游戏继续）：' + frameErr, 16, 26, 13, '#fff');
      } catch (e2) {}
    }
    requestAnimationFrame(frame);
  }
  function frameBody(now) {
    applyCanvasSize();
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (state.toastT > 0) state.toastT -= dt;
    if (state.runBanner > 0) state.runBanner = Math.max(0, state.runBanner - dt);

    ctx.clearRect(-VIEW_OFF_X - 2, -VIEW_OFF_Y - 2, VIEW_W + 4, VIEW_H + 4);
    if (state.phase === 'build') {
      // 地形缓存：同一关不重复重建（每帧重建要跑 3 遍高斯平滑，很贵）
      if (terrainCacheId !== level().levelId || !terrainCache) {
        terrainCache = RAP.makeTerrain(level());
        terrainCacheId = level().levelId;
      }
      const ter = terrainCache;
      const cam = buildCam();
      // 入场镜头：从关卡全景推到建造区
      if (state.introT < 1) {
        state.introT = Math.min(1, state.introT + dt / 1.2);
        const k = 1 - Math.pow(1 - state.introT, 3);      // ease-out cubic
        const wide = { x: cam.x + 9, y: cam.y + 3.2, zoom: 0.72 };
        cam.x = wide.x + (cam.x - wide.x) * k;
        cam.y = wide.y + (cam.y - wide.y) * k;
        cam.zoom = wide.zoom + (cam.zoom - wide.zoom) * k;
      }
      drawWorld(ter, cam);
      // 建造阶段的场景压暗：让拼装区成为视觉主体（原样太亮，网格糊在风景里）
      if (state.introT > 0.2) {
        // 压暗强度按地貌给：洞穴本身就黑，再压就看不见了
        const bm = BIOMES[(level() && level().biome) || 'field'] || BIOMES.field;
        ctx.globalAlpha = Math.min(1, (state.introT - 0.2) / 0.5);
        fillScreen('rgba(6,14,20,' + (bm.dim || 0.26).toFixed(2) + ')');
        ctx.globalAlpha = 1;
      }
      ctx.save();
      ctx.translate(0, VIEW_OFF_Y);      // UI 在设计区居中（4:3 时上下有扩展）
      // 入场时 UI 淡入（前 40% 不显示）
      ctx.globalAlpha = 1;   // 强制复位（缓存切换可能残留 alpha）
      const uiAlpha = state.introT < 0.35 ? 0 : Math.min(1, (state.introT - 0.35) / 0.35);
      if (uiAlpha < 1) ctx.globalAlpha = uiAlpha;
      drawGrid();
      drawBuildCar();
      if (state.bounce) {
        state.bounce.t += dt;
        const k = Math.min(1, state.bounce.t / 0.25);
        if (k >= 1) { state.bounce = null; }
        else {
          const idx = TRAY.indexOf(state.bounce.part);
          const target = idx >= 0 ? trayRect(idx) : { x: DW / 2, y: DH - 60, w: 0, h: 0 };
          const tx = target.x + target.w / 2, ty = target.y + target.h / 2;
          const bx = state.bounce.x + (tx - state.bounce.x) * k;
          const by = state.bounce.y + (ty - state.bounce.y) * k;
          ctx.save();
          ctx.globalAlpha = 1 - k * 0.7;
          drawPartShape(state.bounce.part, bx, by, BUILD_PX * 0.84 * (1 - k * 0.3), 0);
          ctx.restore();
        }
      }
      drawTray();
      drawButtons();
      drawTabs();
      drawHud();
      if (uiAlpha < 1) ctx.globalAlpha = 1;
      ctx.restore();
    } else if (state.phase === 'run' || state.phase === 'resolved') {
      // 慢动作衰减（撞击后 0.25 倍，0.35 秒内恢复）
      if (state.slowmo > 0) state.slowmo = Math.max(0, state.slowmo - dt);
      // 尘土：上浮 + 扩散 + 淡出
      if (state.dust && state.dust.length) {
        state.dust.forEach(d => {
          d.vy -= 2.2 * dt;
          d.x += d.vx * dt;
          d.y += d.vy * dt;
          d.vx *= (1 - 2.2 * dt);
          d.life -= dt;
        });
        state.dust = state.dust.filter(d => d.life > 0);
      }
      // 纸花：抛物线 + 摇曳 + 淡出
      if (state.confetti.length) {
        state.confetti.forEach(c2 => {
          c2.vy -= 9 * dt;
          c2.x += c2.vx * dt + Math.sin(performance.now() / 260 + c2.a) * 0.02;
          c2.y += c2.vy * dt;
          c2.a += c2.w * dt;
          c2.life -= dt;
        });
        state.confetti = state.confetti.filter(c2 => c2.life > 0);
      }
      // 碎片：抛物线 + 旋转 + 淡出
      if (state.debris.length) {
        state.debris.forEach(d => {
          d.vy -= 16 * dt;
          d.x += d.vx * dt; d.y += d.vy * dt;
          d.a += d.w * dt; d.life -= dt;
        });
        state.debris = state.debris.filter(d => d.life > 0);
      }
      if (state.run && state.run.phase === 'run' && !state.paused) {
        // 固定 60Hz 累加
        const timeScale = state.slowmo > 0 ? 0.3 : 1;
        state.run.acc = (state.run.acc || 0) + dt * timeScale;
        let guard = 0;
        while (state.run.acc >= 1 / 60 && guard++ < 5) {
          state.run.acc -= 1 / 60;
          RAP.step(state.run, 1 / 60);
          // 撞击检测（用事件流，避免改物理）
          const evs = state.run.events || [];
          if (evs.length !== (state.lastEventLen || 0)) {
            for (let i = state.lastEventLen || 0; i < evs.length; i++) {
              if (evs[i].indexOf('impact') === 0) {
                state.slowmo = 0.35;
                state.shake = Math.min(1.4, state.shake + 0.85);
                state.flash = 1;
                state.vignette = 1;
                spawnDebris(state.run.car.x, state.run.car.y + 0.4);
              } else if (evs[i].indexOf('touch lvl=') === 0) {
                // 分级接触反馈
                const lv = parseInt(evs[i].split('lvl=')[1], 10) || 1;
                const mx = evs[i].match(/x=([\d.]+)/);
                const px = mx ? parseFloat(mx[1]) : state.run.car.x;
                const strengths = [0, 0.10, 0.22, 0.42, 0.85];
                state.shake = Math.min(1.2, state.shake + strengths[lv]);
                if (lv >= 3) { state.flash = Math.max(state.flash, 0.35); }
                if (lv >= 2) { state.vignette = Math.max(state.vignette, lv >= 3 ? 0.7 : 0.25); }
                // 尘土：级别 1~2 个小，3~4 用碎片
                const n = [0, 3, 5, 8, 10][lv] || 3;
                if (lv >= 3) spawnDebris(px, state.run.car.y + 0.2);
                spawnDust(px, state.run.car.y - 0.3, n);
                SFX.thud(lv);
              }
            }
            state.lastEventLen = evs.length;
          }
        }
      }
      if (state.run && state.run.phase === 'resolved' && state.phase === 'run') {
        state.phase = 'resolved';
        state.resultT = 0;
        state.outroT = 0;                              // 推镜过渡计时
        state.slowmo = Math.max(state.slowmo, 0.75);   // 过关瞬间放慢（比撞击更久）
        if (state.run.result === 'win') {
          // 纸花：从车上方上抛
          for (let k = 0; k < 26; k++) {
            state.confetti.push({
              x: state.run.car.x + (Math.random() - 0.5) * 3,
              y: state.run.car.y + 2.2 + Math.random() * 1.2,
              vx: (Math.random() - 0.5) * 5,
              vy: 3 + Math.random() * 4.5,
              a: Math.random() * 6.28,
              w: (Math.random() - 0.5) * 12,
              size: 3 + Math.random() * 4,
              life: 1.6 + Math.random() * 0.8,
              color: ['#ffd93d', '#63d97e', '#4a9be0', '#e8816a', '#ffffff'][k % 5]
            });
          }
          SFX.cheer();
        }
        if (state.run.result === 'win') {
          // 先读旧记录，判断是否破纪录，再写
          let oldBest = null, oldStars = 0;
          try {
            const all = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}') || {};
            const rec = all[level().levelId];
            if (rec) { oldBest = rec.best; oldStars = rec.stars; }
          } catch (e) {}
          state.newBest = (oldBest === null || state.run.time < oldBest);
          state.oldBest = oldBest;
          state.newStarRecord = state.run.stars > oldStars;
          saveProgress(level().levelId, state.run.stars, state.run.time);
        } else {
          state.newBest = false;
          state.newStarRecord = false;
        }
        if (state.run.result === 'win') SFX.win(); else SFX.fail();
      }
      // 轮子滚动环境音（按速度调制）
      if (state.run && state.run.phase === 'run' && !state.paused) {
        const sp3 = Math.hypot(state.run.car.vx, state.run.car.vy);
        SFX.rollStart();
        SFX.rollSet(sp3);
      } else {
        SFX.rollStop();
      }
      const prevBox = state.run ? state.run.boxesGot : 0;
      const prevHp = state.run ? state.run.pigHP : 3;
      drawRun(dt);
      if (state.run) {
        if (state.run.boxesGot > prevBox) SFX.box();
        if (state.run.pigHP < prevHp) SFX.hurt();
      }
      drawTabs();
      drawHud();
      // 结算推镜：0.2 秒内把镜头推近 12%（再盖卡片，避免硬切）
      if (state.phase === 'resolved' && state.outroT < 1) {
        state.outroT = Math.min(1, state.outroT + dt / 0.2);
        const kz = 1 + 0.12 * (1 - Math.pow(1 - state.outroT, 2));
        state.camState.zoom *= 1 + (kz - 1) * 0.35;
      }
      if (state.slowmo > 0 && state.phase === 'run') {
        fillScreen('rgba(232,200,122,.08)');
      }
      if (state.phase === 'resolved') drawResult(dt);
      drawButtons();
    }
    drawWelcome();
    drawLevelSelect();
    drawHelp();
    drawToast();
  }
  // 首次进入自动显示欢迎引导
  try {
    if (!localStorage.getItem('rap-welcomed-v1')) state.welcome = 1;
  } catch (e) { state.welcome = 1; }

  window.__rap = { state, RAP, levels, startLevel, launch, buildOrigin, BUILD_PX, cellAt, canvasPos,
                   trayRect, btnRect, TRAY, pauseRowRects, level, welcomeCard, welcomeBtnRect };
  startLevel(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
