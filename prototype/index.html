<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>滚蛋吧！猪 · 垂直切片演示（1-1 ~ 1-6）</title>
<style>
  html, body { margin: 0; padding: 0; background: #10161c; overflow: hidden;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
  #wrap { position: fixed; inset: 0; display: block; }
  canvas { display: block; box-shadow: 0 10px 40px rgba(0,0,0,.6); cursor: pointer;
    width: 100vw; height: 100vh; }
  #panel { position: fixed; right: 16px; top: 16px; width: 264px; padding: 12px 14px;
    background: rgba(12,20,26,.94); border: 1px solid #2b3a45; border-radius: 10px; color: #cfe0ef;
    font-size: 12px; display: none; z-index: 10; }
  #panel h3 { margin: 0 0 8px; font-size: 13px; color: #9fd66a; font-weight: 600; }
  #panel label { display: flex; justify-content: space-between; margin: 7px 0 2px; }
  #panel input[type=range] { width: 100%; }
  #panel .val { color: #ffd93d; }
  #panel .note { color: #7f8c99; line-height: 1.5; margin-top: 10px; }
  #panel button { margin-top: 10px; width: 100%; padding: 6px; background: #2f6b33; color: #dfffe0;
    border: 1px solid #4f9a52; border-radius: 6px; cursor: pointer; }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="1280" height="720"></canvas></div>

<div id="panel">
  <h3>数值调参（真机基线就用这套值）</h3>
  <div id="sliders"></div>
  <button id="reset">恢复默认</button>
  <div class="note">地面摩擦调到 2~3 会明显变粘，但靠惯性滑的关卡（1-1/1-2/1-5）会走不远 —— 想两者都要就调 1.0 左右。改完直接发射试。</div>
</div>
<script src="levels.js"></script>
<script src="game.js"></script>
<script>
(function () {
  'use strict';
  const cv = document.getElementById('cv');
  let ctx = cv.getContext('2d');   // let：离屏缓存时会临时切换（见 paintOffscreen）
  // 设计分辨率（所有坐标都基于它）；实际画布按窗口等比缩放
  const DW = 1280, DH = 720, PPM = 32;
  /* 闭包里需要一个"当前 HUD 净重行"的读取点（供测试断言玩家实际看到的文字）。
   * 必须声明在 window.__rap 之前 —— 那里用箭头函数引用它，运行时才取值。 */
  let liftLineCache = '';

  // 千星的画布预设（用于自测各尺寸下的排版）
  const CANVAS_PRESETS = [
    { id: 'pc-16-9', label: 'PC 1600×900', w: 1600, h: 900 },
    { id: 'pc-21-9', label: 'PC 2100×900', w: 2100, h: 900 },
    { id: 'mobile-16-9', label: '手机 1280×720', w: 1280, h: 720 },
    { id: 'mobile-19.5-9', label: '手机 1560×720', w: 1560, h: 720 },
    { id: 'mobile-4-3', label: '手机 1280×960', w: 1280, h: 960 }
  ];
  let curPreset = 0;      // 当前模拟的画布尺寸（只影响自测与显示）

  // 把画布像素对齐到"设计分辨率 × 缩放"，避免非整数缩放导致的模糊
  // 当前可视尺寸（设计坐标）。默认 = 设计分辨率；宽/高比例变化时扩展对应方向
  // ---------- 离屏缓存画布（性能：静态层不每帧重画）----------
  let terrainCache = null, terrainCacheId = '';
  const stoneLayer = document.createElement('canvas');
  const stoneCtx = stoneLayer.getContext('2d');
  let stoneCacheKey = '';
  const skyLayer = document.createElement('canvas');
  const skyCtx = skyLayer.getContext('2d');
  let skyCacheKey = '';

  // 确定性伪随机（石头/碎石纹理用）
  function texHash(a, b) {
    let h = (a * 374761393 + b * 668265263) & 0x7fffffff;
    h = (h ^ (h >> 13)) * 1274126177 & 0x7fffffff;
    return ((h ^ (h >> 16)) & 0xffff) / 0xffff;
  }

  let VIEW_W = DW, VIEW_H = DH;
  let VIEW_OFF_X = 0, VIEW_OFF_Y = 0;   // 扩展后设计坐标的偏移（HUD 居中用）

  function applyCanvasSize() {
    const r = cv.getBoundingClientRect();
    const dpr = Math.min(1.5, window.devicePixelRatio || 1);   // 性能：4K 屏别画 2 倍
    const cssW = Math.max(320, r.width || DW);
    const cssH = Math.max(180, r.height || DH);
    const w = Math.round(cssW * dpr);
    const h = Math.round(cssH * dpr);
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }

    // 以 1280×720 为基准等比铺满（cover），超出的方向扩展可视范围
    const scale = Math.max(DW / cssW, DH / cssH);
    VIEW_W = Math.round(cssW * scale);
    VIEW_H = Math.round(cssH * scale);
    VIEW_OFF_X = (VIEW_W - DW) / 2;
    VIEW_OFF_Y = (VIEW_H - DH) / 2;

    // 缩放：1 设计像素 = w/VIEW_W 实际像素
    const sx = w / VIEW_W, sy = h / VIEW_H;
    ctx.setTransform(sx, 0, 0, sy, VIEW_OFF_X * sx, VIEW_OFF_Y * sy);
    // 供测试核对"设计区是否完整可见"（宽高比变化时靠扩展可视范围来 cover）
    window.__view = { W: VIEW_W, H: VIEW_H, offX: VIEW_OFF_X, offY: VIEW_OFF_Y,
                      cssW: cssW, cssH: cssH, pxW: w, pxH: h, dpr: dpr, scale: scale };
  }

  // ---------- 视觉参数 ----------
  const COL = {
    // 原神黄昏调：天空由上到下 深青 → 青 → 暖金地平线
    skyTop: '#8FC4E0', skyMid: '#CFE6D8', skyLow: '#F2F0C0',
    hillFar: '#7FA8B8', jungle: '#2F6B5A', jungle2: '#27584A',
    stone: '#7C8694', stone2: '#6E7E8C', stoneHi: '#94A3AE', stoneLo: '#4A5866',
    grass: '#7FBF5A', grassRim: '#C9E37A', shadow: '#2C5A38',
    mud: '#8A7A5A', ice: '#9FE3F2', iceEdge: '#D9F6FF',
    grid: 'rgba(120,170,130,.45)', gridSel: 'rgba(232,200,122,.85)',
    wood: '#C08A4A', woodDark: '#8A5F30', wheel: '#3A4048', iron: '#5A6672', ironRim: '#C8D2DC',
    pig: '#6FC25A', motor: '#E06A4A', battery: '#8FD66A', pump: '#4F8FB0',
    box: '#D9A94A', flag: '#E2574C', ink: '#16211A',
    gold: '#E8C87A', goldDim: '#8A7448', panel: 'rgba(18,30,40,.92)'
  };


  const TRAY = RAP.TRAY_ORDER.concat(['eraser']);
  const state = {
    levelIndex: 0, phase: 'build', build: RAP.newBuild(),
    selected: 'wood_frame', run: null, paramsOpen: false,
    dragPart: null, dragFromTray: false, mouse: { x: 0, y: 0, down: false },
    helpOpen: false, paused: false, bounce: null, debris: [], bursts: [], slowmo: 0, lastImpact: null,
    camState: { x: 0, y: 0, zoom: 1.7 }, shake: 0, flash: 0, vignette: 0, levelSelect: false,
    introT: 0,        // 入场镜头进度 0→1
    outroT: 0,        // 结算过渡进度 0→1
    runBanner: 0,     // 出发横幅剩余时间（秒）
    confetti: [], dust: [], starSfxIdx: -1,
    popped: {},        // 刚落下的格子 → 播放弹性
    welcome: 0,        // 0=关闭，1..3=第几页
    cam: { x: 0, y: 0, zoom: 2.1 }, toast: '', toastT: 0, resultT: 0,
    replayT: 0, replayIdx: 0
  };

  const levels = window.RAP_LEVELS;

  // ---------- 关卡进度（localStorage，关掉页面也在） ----------
  const SAVE_KEY = 'rap-progress-v1';
  let progress = {};
  try {
    progress = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}') || {};
  } catch (e) { progress = {}; }

  /* 三星是**累计**的，不是一局定生死。
   *
   * 这是照《捣蛋猪》改的（见 docs/reference-badpiggies.md §3）：
   * 参考里一篇百科原话是「每一关的三星是采用累计的方式获得……分别三次获取也算作三星通关」。
   * 我们原来的做法是"这一局同时满足几个条件就算几星"，后果是玩家一旦没在一局里
   * 全做到，就必须整关重来——第三颗星从目标变成了惩罚。
   *
   * 现在每一颗星是一个**永久标记**（到达 / 全木箱 / 挑战条件），
   * 满足一次就永久点亮，此后任何一局失败都不会熄灭它。
   */
  const GOALS = ['arrive', 'boxes', 'challenge'];
  function mergeGoals(oldGoals, newGoals) {
    const g = Object.assign({ arrive: false, boxes: false, challenge: false }, oldGoals || {});
    GOALS.forEach(k => { if (newGoals && newGoals[k]) g[k] = true; });
    return g;
  }
  function starsOf(goals) {
    return GOALS.reduce((n, k) => n + (goals && goals[k] ? 1 : 0), 0);
  }
  // 存档里可能还是旧格式（只有 stars 数字，没有 goals）。不迁移的话，
  // 老存档的星会显示成 0 颗——看起来像"进度丢了"，实际是格式变了。
  function migrateRecord(rec) {
    if (!rec) return null;
    if (rec.goals) return rec;
    const g = { arrive: (rec.stars || 0) >= 1, boxes: (rec.stars || 0) >= 2,
                challenge: (rec.stars || 0) >= 3 };
    return Object.assign({}, rec, { goals: g });
  }
  function readRecord(levelId) {
    let rec = progress[levelId];
    try {
      const raw = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}') || {};
      if (raw[levelId]) rec = raw[levelId];
    } catch (e) {}
    return migrateRecord(rec);
  }

  // 金币跟着星走：一关的金币 = 该关**已点亮**的星数 ×50 + 木箱 ×30。
  // 这样重刷不会无限刷金币（金币永远由永久标记推导），也不需要单独存一个会漂移的数字。
  function coinsOf(stars, boxesGot) {
    return (stars || 0) * 50 + (boxesGot || 0) * 30;
  }
  function totalCoins() {
    let sum = 0;
    levels.forEach(lv => {
      const pr = readRecord(lv.levelId);
      if (pr) sum += coinsOf(starsOf(pr.goals), pr.boxes || 0);
    });
    return sum;
  }
  function totalStars() {
    return levels.reduce((n, lv) => {
      const pr = readRecord(lv.levelId);
      return n + (pr ? starsOf(pr.goals) : 0);
    }, 0);
  }
  /* 整个切片打通了吗？
   *
   * 为什么要专门问这一句：第 40 轮把六关都真跑了一遍（probe_chapter_end.js），
   * 打完 1-6 的三星之后，屏幕上唯一的"终局"表达是一颗**灰掉的**
   * 「已是最后一关」按钮 —— 玩家把垂直切片通关了，游戏一个字都没说。
   * 这和"第三颗星是惩罚"是同一类错误：内容做完了，却没有收束。
   *
   * 判据只看 arrive（是否到过终点），不看星数 —— 全三星是"完美"，
   * 但**打通**不等于全三星，两件事不能混成一个门槛。 */
  function chapterDone() {
    return levels.every(lv => {
      const pr = readRecord(lv.levelId);
      return !!(pr && pr.goals && pr.goals.arrive);
    });
  }
  /* 结算页右下那个按钮到底是什么，只有一份定义。
   *
   * 三种情况：
   *   1) 还有下一关        → 「下一关」N
   *   2) 最后一关但没打通  → 「已是最后一关」灰掉（这才是它该有的样子）
   *   3) 最后一关且已打通  → 「章节总览」L，点开选关看整张地图
   *
   * 第 3 种是把一颗死按钮换成真动作：玩家走到终点时最想看的东西，
   * 就是"我一共点亮了多少"。它同时也给了卡面一个天然的收尾。 */
  function resultNextBtn() {
    const hasNext = state.levelIndex < levels.length - 1;
    if (hasNext) return { label: '下一关', disabled: false, keycap: 'N', action: 'next' };
    if (chapterDone()) return { label: '章节总览', disabled: false, keycap: 'L', action: 'overview' };
    return { label: '已是最后一关', disabled: true, keycap: null, action: 'none' };
  }
  /* 写存档：goals 取并集（只增不减），木箱取最好，时间取最短。
   * 返回 { before, after }，让调用方知道"这一次到底点亮了哪颗新星"。 */
  function saveProgress(levelId, goals, time, boxesGot) {
    const cur = migrateRecord(progress[levelId]) ||
      { goals: { arrive: false, boxes: false, challenge: false }, best: null, boxes: 0 };
    const before = Object.assign({}, cur.goals);
    cur.goals = mergeGoals(cur.goals, goals);
    if (!cur.best || time < cur.best) cur.best = time;
    if (typeof boxesGot === 'number' && boxesGot > (cur.boxes || 0)) cur.boxes = boxesGot;
    cur.stars = starsOf(cur.goals);        // 冗余字段：给旧代码/旧存档读
    progress[levelId] = cur;
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(progress)); } catch (e) {}
    return { before, after: Object.assign({}, cur.goals) };
  }
  const level = () => levels[state.levelIndex];

  // ---------- 音效：WebAudio 现场合成，不依赖任何素材 ----------
  const SFX = (() => {
    let ac = null;
    let ROLL = null;
    const ensure = () => {
      try {
        if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
        if (ac.state === 'suspended') ac.resume();
      } catch (e) { ac = null; }
      return ac;
    };
    function tone(freq, dur, type, gain, slideTo) {
      const a = ensure(); if (!a) return;
      const o = a.createOscillator(), g = a.createGain();
      o.type = type || 'triangle';
      o.frequency.setValueAtTime(freq, a.currentTime);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime + dur);
      g.gain.setValueAtTime(0.0001, a.currentTime);
      g.gain.exponentialRampToValueAtTime(gain || 0.12, a.currentTime + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
      o.connect(g); g.connect(a.destination);
      o.start(); o.stop(a.currentTime + dur + 0.02);
    }
    function noise(dur, gain) {
      const a = ensure(); if (!a) return;
      const n = Math.floor(a.sampleRate * dur);
      const buf = a.createBuffer(1, n, a.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const src = a.createBufferSource(); src.buffer = buf;
      const g = a.createGain(); g.gain.value = gain || 0.08;
      src.connect(g); g.connect(a.destination); src.start();
    }
    return {
      place(h) {
        // 越往上音越高（h 建议传 0..1）
        const f = 440 + (h || 0) * 260;
        tone(f, 0.07, 'square', 0.07);
      },
      /* 卸下（拖出网格松手）：和"放下"反着来 —— 音高往下走、更轻。
       * 玩家要能听出"这次不是放，是拿走"。 */
      remove() { tone(380, 0.08, 'triangle', 0.07, 210); },
      deny() { tone(180, 0.12, 'sawtooth', 0.07, 120); },
      launch() { noise(0.25, 0.09); tone(220, 0.25, 'sine', 0.09, 520); },
      box() { tone(880, 0.09, 'sine', 0.1); tone(1320, 0.09, 'sine', 0.06); },
      win() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.18, 'triangle', 0.1), i * 110)); },
      fail() { tone(300, 0.22, 'sawtooth', 0.09, 140); setTimeout(() => tone(220, 0.28, 'sawtooth', 0.08, 110), 140); },
      pump() { tone(300, 0.1, 'square', 0.06, 700); },
      /* 扎气球：短促的"啪"（噪声爆 + 一个高频滑落）。
       * 沙袋：低沉的"咚"。名字不能叫 thud —— 下面已经有一个分级触地音叫 thud(lvl)，
       * 对象字面量里同名键后者覆盖前者，于是 `SFX.thud()` 会走进触地音那条分支、
       * 拿到 lvl=undefined → NaN 时长 → AudioParam 抛异常（真跑红过一次）。 */
      pop() { noise(0.08, 0.16); tone(900, 0.09, 'square', 0.08, 320); },
      bagDrop() { tone(120, 0.14, 'sine', 0.11, 62); noise(0.05, 0.06); },
      hurt() { tone(160, 0.16, 'square', 0.08, 90); },
      /* 木框掉耐久（还没碎）：木头裂开的"咔"。
       * 和 SFX.hurt 分开 —— hurt 是猪被撞疼（红），crack 是结构受损（棕）。
       * 两者在同一个时间点可能都发生，用同一个音就分不清"谁受伤了"。 */
      crack() { noise(0.07, 0.10); tone(240, 0.13, 'square', 0.07, 110); },
      star(n) { tone(660 + (n || 0) * 220, 0.12, 'triangle', 0.1); },   // 星星逐颗弹出
      cheer() { [784, 988, 1175].forEach((f, i) => setTimeout(() => tone(f, 0.22, 'sine', 0.09), i * 90)); },
      // 轮子滚动环境音：用持续振荡器，速度调制频率与音量
      rollStart() {
        const a = ensure(); if (!a || ROLL) return;
        try {
          const o = a.createOscillator(), g = a.createGain();
          o.type = 'sawtooth';
          o.frequency.value = 60;
          g.gain.value = 0.0001;
          o.connect(g); g.connect(a.destination);
          o.start();
          ROLL = { o, g };
        } catch (e) {}
      },
      rollSet(speed) {
        if (!ROLL) return;
        const a = ensure(); if (!a) return;
        const v = Math.max(0, Math.min(1, (speed - 1.5) / 10));
        ROLL.o.frequency.setTargetAtTime(50 + v * 130, a.currentTime, 0.08);
        ROLL.g.gain.setTargetAtTime(v * 0.022, a.currentTime, 0.08);
      },
      thud(lvl) {
        // 分级触地音：级别越高越低越沉
        const base = [0, 420, 320, 220, 150][Math.min(4, lvl)] || 300;
        tone(base, 0.05 + lvl * 0.02, 'sine', 0.03 + lvl * 0.02, base * 0.6);
        if (lvl >= 3) noise(0.10 + lvl * 0.03, 0.03 + lvl * 0.015);
      },
      rollStop() {
        if (!ROLL) return;
        const a = ensure(); if (!a) { ROLL = null; return; }
        ROLL.g.gain.setTargetAtTime(0.0001, a.currentTime, 0.1);
        const r = ROLL; ROLL = null;
        setTimeout(() => { try { r.o.stop(); } catch (e) {} }, 400);
      }
    };
  })();

  // 铺满整个可视区（宽屏时覆盖扩展部分，避免黑边）
  function fillScreen(style) {
    ctx.fillStyle = style;
    ctx.fillRect(-VIEW_OFF_X - 4, -VIEW_OFF_Y - 4, VIEW_W + 8, VIEW_H + 8);
  }

  // ---------- 坐标 ----------
  const BUILD_PX = 44;   // 建造格显示尺寸
  // 面板整体避开顶部信息条（y<190）：格子顶边 188 > 说明底衬底边 186，刚好不压
  const buildOrigin = () => ({ x: DW / 2 - RAP.BUILD_COLS * BUILD_PX / 2 - 40, y: 222 });
  function worldToScreen(wx, wy, cam) {
    const s = PPM * cam.zoom;                 // zoom 是"倍率"，实际每米像素 = PPM * zoom
    return { x: DW / 2 + (wx - cam.x) * s, y: DH / 2 - (wy - cam.y) * s };
  }
  function buildCam() {
    const ter = RAP.makeTerrain(level());
    const sy = ter.surfaceY(level().start.col + 0.5);
    return { x: level().start.col + 3.2, y: sy + 1.55, zoom: 2.1 };
  }

  // ---------- 交互 ----------
  function canvasPos(ev) {
    const r = cv.getBoundingClientRect();
    // 事件坐标 → 可视设计坐标（考虑宽屏扩展）
    return {
      x: (ev.clientX - r.left) * VIEW_W / r.width - VIEW_OFF_X,
      y: (ev.clientY - r.top) * VIEW_H / r.height - VIEW_OFF_Y
    };
  }
  function trayRect(i) {
    const n = TRAY.length, w = 46, gap = 7;
    const total = n * w + (n - 1) * gap;
    const x0 = (DW - total) / 2;
    return { x: x0 + i * (w + gap), y: DH - 76, w, h: w };
  }
  function cellAt(mx, my) {
    const o = buildOrigin();
    const c = Math.floor((mx - o.x) / BUILD_PX), r = Math.floor((my - o.y) / BUILD_PX);
    if (c < 0 || c >= RAP.BUILD_COLS || r < 0 || r >= RAP.BUILD_ROWS) return null;
    return { r, c };
  }
  function tabRect(i) { return { x: 24 + i * 86, y: 18, w: 80, h: 30 }; }
  // 暂停面板的几何：绘制与点击共用一份，避免"看得见点不着"
  function pausePanel() {
    const PW = 420, PH = 236;
    return { x: DW / 2 - PW / 2, y: DH / 2 - PH / 2 - 10, w: PW, h: PH };
  }
  function pauseRowRects() {
    const P = pausePanel(), rx = P.x + 32, rw = P.w - 64;
    return {
      resume: { x: rx, y: P.y + 100, w: rw, h: 44 },
      back: { x: rx, y: P.y + 156, w: rw, h: 44 }
    };
  }
  function btnRect(name) {
    if (state.phase === 'build') {
      if (name === 'launch') return { x: DW / 2 + 150, y: 258, w: 76, h: 76 };
      if (name === 'clear') return { x: 84, y: 324, w: 56, h: 56 };
      if (name === 'undo') return { x: 84, y: 392, w: 56, h: 56 };
      if (name === 'rotate') return { x: 84, y: 460, w: 56, h: 56 };
      if (name === 'help') return { x: DW / 2 + 144, y: 366, w: 88, h: 38 };
    }
    if (state.phase === 'resolved') {
      const y = state.resultBtnY || 556;
      if (name === 'retry') return { x: DW / 2 - 300, y, w: 260, h: 72 };
      if (name === 'next') return { x: DW / 2 + 40, y, w: 260, h: 72 };
    }
    if (state.phase === 'run') {
      if (name === 'pause') return { x: 24, y: 84, w: 46, h: 46 };
      if (name === 'restartRun') return { x: 24, y: 138, w: 46, h: 46 };
      if (name === 'help') return { x: DW - 70, y: 84, w: 46, h: 46 };
      if (name === 'interact') return { x: 0, y: DH - 150, w: 92, h: 92 };
      if (name === 'brake') return { x: DW - 128, y: DH - 150, w: 92, h: 92 };
      // 注意：行驶期"重开"只在左上角（绿圆钮 restartRun）。
      // 这里曾经还有一个 retryRun = {x:DW-300, y:DH-220, 84×84}，
      // 但按钮早就不画了、判定还留着 —— 玩家在右下那片空白上随手一点
      // 就会被踢回建造页。ghost 热区由 test_ghost_buttons.js 把守。

    }
    return null;
  }
  // 行驶期的右上计时/木箱面板：位置必须让开「?」按钮（原来压在按钮下沿，
  // 把金圈盖掉了 39/72，玩家看到的按钮是缺一块的）。绘制与检查共用这一份。
  // 行驶期的"还剩多远"进度轨：起点 → 终点，小猪在哪一段必须一眼看到。
  // 位置紧贴顶部信息条下方；绘制与重叠检查共用这一份几何。
  function runProgressRect() {
    return {
      panel: { x: 84, y: 126, w: 700, h: 30 },
      track: { x: 108, y: 139, w: 592, h: 8 }
    };
  }
  function runTimeRects() {
    return {
      timer: { x: DW - 224, y: 138, w: 192, h: 30 },
      box: { x: DW - 224, y: 174, w: 192, h: 26 },
      /* 木框耐久条（第 45 轮）。放在木箱下面自成一块：木框耐久和木箱是
       * 两件完全不同的事（一个是"还剩几个箱子能捡"，一个是"车还结不结实"），
       * 挤在一行里玩家会读混。y 上留 6 px 间距，和上方木箱面板是同一竖列。 */
      frame: { x: DW - 224, y: 206, w: 192, h: 26 }
    };
  }
  // 行驶期的「★★★ 条件」状态条：把奖励条件做成实时读数，
  // 否则玩家整趟都在猜"我这算不算没按打气筒"。纯函数，供绘制与测试共用。
  function runChallengeRect() {
    return { x: 84, y: 162, w: 552, h: 28 };
  }
  /* 木框耐久读数（绘制与判定共用一份）。
   * 返回 { min, max, n }：最低耐久、单格满耐久、还活着的木框格数。
   * 没有木框时 min = max = 0 —— 调用方必须自己处理这个"空车"的情况，
   * 否则「不散架」会在空车上判成"已碎"。 */
  /* 木框耐久条的三段格子几何。
   * 绘制和像素测试必须读同一份 —— 测试自己再算一遍坐标的话，
   * 改了面板位置就会出现"测试找到的是空气、仍然全绿"。
   * 三段固定 3 格：PARTS.wood_frame 的 maxHp 是 3，耐久条讲的就是这三点。 */
  function frameSegRects() {
    const F = runTimeRects().frame;
    const segW = 20, segH = 12, gap = 4, segX = F.x + 52, segY = F.y + 7;
    const out = [];
    for (let i = 0; i < 3; i++) out.push({ x: segX + i * (segW + gap), y: segY, w: segW, h: segH });
    return out;
  }
  function frameHpOf(run) {
    const car = (run || {}).car || {};
    const frames = (car.parts || []).filter(p => p.def && p.def.structure);
    if (!frames.length) return { min: 0, max: 0, n: 0 };
    return {
      min: Math.min.apply(null, frames.map(p => p.hp)),
      max: Math.max.apply(null, frames.map(p => (p.def.maxHp || 3))),
      n: frames.length
    };
  }
  function challengeStatus(run) {
    const lv = level();
    const ch = (lv && lv.challenge) || { type: 'none' };
    const st = run || {};
    const car = st.car || {};
    switch (ch.type) {
      case 'pumpPress':
        return { type: ch.type, label: '不按打气筒', value: '已按 ' + (st.pumpPress || 0) + ' 次',
                 pass: (st.pumpPress || 0) <= (ch.max || 0) };
      case 'energyLeft':
        return { type: ch.type, label: '能量剩 ≥' + (ch.min || 0),
                 value: '现在 ' + Math.round(car.energy || 0),
                 pass: (car.energy || 0) >= (ch.min || 0) };
      case 'noFlip':
        return { type: ch.type, label: '全程不翻车',
                 value: '最大倾角 ' + Math.round((st.maxAngle || 0) * 180 / Math.PI) + '°',
                 pass: (st.maxAngle || 0) <= (ch.maxAngle || 0.785) };
      case 'motorUse':
        return { type: ch.type, label: '不用马达',
                 value: '已用 ' + (st.motorUse || 0).toFixed(1) + ' s',
                 pass: (st.motorUse || 0) <= (ch.max || 0) };
      /* 「限时／速通」——参考里最常见的第三颗星（秒表图标）。
       * 它奖励的是"把车造轻、路线走直"，和「不散架」正好是两种相反的造车取向：
       * 前者要快而脆，后者要结实而慢。这也是参考让人愿意重打同一关的原因。 */
      case 'time':
        return { type: ch.type, label: '限时 ≤ ' + (ch.max || 0).toFixed(1) + ' s',
                 value: '现在 ' + (st.time || 0).toFixed(1) + ' s',
                 pass: (st.time || 0) <= (ch.max || 0) };
      /* 不散架（KRAK SNAP）：参考里最经典的那颗星 —— 载具没散架、猪也没掉出来。
       *
       * 第 45 轮把它从"碎/没碎"两态改成**带耐久读数**的三态：
       * 以前这一行只有「结构完好」和「木框已碎」，而引擎里木框有三点耐久，
       * 中间那两次掉血在画面上完全静默 —— 玩家只会在结算页突然发现星没了。
       * 把最低耐久和裂纹段位直接印在这一行里（"木框 2/3 裂了"），
       * 掉一颗血的那一刻就能看见数字变了，不必等结算。 */
      case 'noBreak': {
        const fh = frameHpOf(st);
        if (st.hullBroken) {
          return { type: ch.type, label: '不散架', value: '木框已碎', pass: false };
        }
        if (st.pigEjected) {
          return { type: ch.type, label: '不散架', value: '猪掉出来了', pass: false };
        }
        /* 只有真的读到木框时才报耐久读数。
         * 构造出来的 state（测试、以及结算页之外的临时对象）可能没有 car.parts，
         * 那时 frameHpOf 会返回 n=0 —— 绝不能再把"读不到"解释成"已碎"，
         * 否则任何没带零件的模拟状态都会被判成散架（test_challenge_bar 就是这么红的）。 */
        if (fh.n > 0) {
          if (fh.min <= 0) return { type: ch.type, label: '不散架', value: '木框已碎', pass: false };
          if (fh.min <= 1) {
            return { type: ch.type, label: '不散架', value: '木框 ' + fh.min + '/' + fh.max + ' 快散了', pass: true };
          }
          if (fh.min <= 2) {
            return { type: ch.type, label: '不散架', value: '木框 ' + fh.min + '/' + fh.max + ' 裂了', pass: true };
          }
        }
        return { type: ch.type, label: '不散架', value: '结构完好', pass: true };
      }
      /* 气球/沙袋那两颗星（第 37 轮）。
       * 这两个条件都是"用掉消耗品"，和「不散架」的思路正好相反：
       * 前者奖励"敢花"，后者奖励"别碰"。放在同一套条里才看得出这种反差。 */
      case 'noPop':
        return { type: ch.type, label: '一个气球都不扎',
                 value: '已扎 ' + (st.balloonPopsBurst || 0) + ' 个',
                 pass: (st.balloonPopsBurst || 0) === 0 };
      case 'allSandbags':
        return { type: ch.type, label: '沙袋全扔',
                 value: '已扔 ' + (st.sandbagsDropped || 0) + ' / ' + (st.sandbagTotal || 0),
                 pass: (st.sandbagsDropped || 0) >= (st.sandbagTotal || 0) && (st.sandbagTotal || 0) > 0 };
      default:
        return { type: 'none', label: '本关没有 ★★★', value: '', pass: false };
    }
  }
  /* 三颗星的名字（结算页与实时状态条共用一份，避免两处文案漂移）。
   * 照参考的顺序：① 到终点 ② 全木箱 ③ 关卡特殊条件。 */
  function goalNames() {
    return {
      arrive: '小猪抵达终点',
      boxes: '收齐所有木箱',
      challenge: challengeNameOf(level())
    };
  }
  /* 第三颗星的名字：结算页、行驶期状态条、选关卡面三处都要显示它。
   * 原来是三份互不相同的手抄表（选关那处写「不散架（KSP）」、结算写「KRAK SNAP」、
   * 状态条写「不散架」），加气球/沙袋那两颗新星时只改了其中两处 ——
   * 选关卡面就会显示 "★★★：—"。现在只有一个来源。 */
  function challengeNameOf(lvx) {
    const ch = (lvx || {}).challenge || { type: 'none' };
    const m = {
      none: '无特殊条件',
      pumpPress: '不按打气筒',
      energyLeft: '能量剩 ≥ ' + (ch.min || 30),
      noFlip: '不翻车',
      motorUse: '不用马达',
      noBreak: '不散架（KRAK SNAP）',
      time: '限时 ≤ ' + (ch.max || 0).toFixed(1) + ' s',
      noPop: '一个气球都不扎',
      allSandbags: '沙袋全扔'
    };
    return m[ch.type] || '—';
  }

  function hit(rect, mx, my) { return rect && mx >= rect.x && mx <= rect.x + rect.w && my >= rect.y && my <= rect.y + rect.h; }

  function closeWelcome() {
    state.welcome = 0;
    try { localStorage.setItem('rap-welcomed-v1', '1'); } catch (e) {}
  }

  function toast(msg) { state.toast = msg; state.toastT = 2.2; }

  function startLevel(i) {
    state.levelIndex = i;
    state.build = RAP.newBuild();
    state.phase = 'build';
    state.run = null;
    state.selected = 'wood_frame';
    state.cam = buildCam();
    state.introT = 0;          // 触发入场镜头
    state.outroT = 0;
  }

  function selectPart(part) {
    // 零件箱里没有的零件不给选
    const left = RAP.budgetLeft(level(), part, state.build);
    if (part !== 'eraser' && left <= 0) { toast('这个零件已经用完了'); return; }
    state.selected = part;
  }

  /* 撤销：整个回到上一步图纸（见 game.js 里 undo 的注释 —— 原来的
   * `order.pop()` 版本在"擦掉 / 卸下之后按 Z"会删掉车上另一件东西）。
   * 空历史必须出声：按了没反应和按了乱删，玩家都以为是 bug。 */
  function undoStep() {
    if (!RAP.undo(state.build)) { toast('没有可撤销的步骤'); SFX.deny(); return; }
    SFX.remove();
    toast('已撤销上一步');
  }

  function tryPlaceAt(r, c) {
    const part = state.selected;
    if (part === 'eraser') {
      if (RAP.removeAt(state.build, r, c)) toast('拆下零件');
      return;
    }
    const res = RAP.tryPlace(level(), state.build, part, r, c);
    if (res.ok) {
      SFX.place(1 - r / RAP.BUILD_ROWS);
      state.popped[r + ',' + c] = performance.now();   // 弹性动画起点
    } else SFX.deny();
    if (!res.ok) {
      const map = { budget: '零件箱空了', connect: '必须贴着木框放', occupied: '这一格已经有零件了',
                    interact_limit: '交互键最多 3 个（交互件即键位）', outside: '超出建造区' };
      toast(map[res.reason] || res.reason);
    }
  }

  function launch() {
    const chk = RAP.canLaunch(state.build);
    if (!chk.ok) {
      const msg = { empty: '先放零件再发射', frame: '至少要有一块木框', wheel: '至少要有一个轮子',
                    pig: '车是空的：把小猪拖进木框里' }[chk.reason] || chk.reason;
      toast(msg);
      SFX.deny();
      return;
    }
    const car = RAP.buildVehicle(level(), state.build);
    state.run = RAP.createRun(level(), state.build);
    state.phase = 'run';
    state.resultT = 0;
    state.runBanner = 2.0;      // 出发横幅：关卡名 + 本关目标
    SFX.launch();
    state.replayT = 0; state.replayIdx = 0;
  }

  /* 标准解发射：给测试用的一步到位入口。
   *
   * `_presses` / `_drops` / `_pops` 里的时刻会在跑的过程中按时送到
   * `RAP.pressInteract` / `RAP.dropSandbag` / `RAP.popBalloon` ——
   * 和玩家按 1/2/3 键、点车身走的是**同一条代码路径**，不是伪造状态。
   *
   * 为什么需要它：1-2 改成"必须按一下打气筒"之后，光是把零件摆好并不能通关；
   * 1-6 更极端，"什么时候扔沙袋、什么时候扎气球"就是这一关的全部玩法。
   * 如果 launchSpec 只认 _presses，那 1-6 在浏览器里就**根本没法自动跑到通关**
   * —— 它只能在 Node 的 simulate 里过，而真浏览器里一次都没验过。
   * 第 40 轮补上：三类动作统一成一条时间轴（`actScript`），
   * 和 game.js 的 simulate 完全同构。 */
  function launchSpec(levelIndex, specKey) {
    if (typeof levelIndex === 'number') startLevel(levelIndex);
    const lv = level();
    const spec = RAP.SPECS[specKey];
    if (!spec) { toast('没有这个标准解：' + specKey); return false; }
    state.build = RAP.newBuild();
    RAP.applySpec(lv, state.build, spec);
    const chk = RAP.canLaunch(state.build);
    if (!chk.ok) { toast('标准解装不上：' + chk.reason); return false; }
    launch();
    RAP.applySpecRuntime(state.run, spec);
    const acts = [];
    (spec._presses || []).forEach(a => acts.push({ t: a.t, k: a.k || 'press', n: a.n || 1 }));
    (spec._drops || []).forEach(a => {
      for (let i = 0; i < (a.n || 1); i++) acts.push({ t: a.t + i * 0.016, k: 'drop', n: 1 });
    });
    (spec._pops || []).forEach(a => {
      for (let i = 0; i < (a.n || 1); i++) acts.push({ t: a.t + i * 0.016, k: 'pop', n: 1 });
    });
    acts.sort((a, b) => a.t - b.t);
    state.run.actScript = acts;
    state.welcome = 0; state.introT = 1;
    return true;
  }

  // ---------- 输入 ----------
  cv.addEventListener('contextmenu', e => e.preventDefault());
  cv.addEventListener('mousedown', ev => {
    const p = canvasPos(ev);
    state.mouse.x = p.x; state.mouse.y = p.y; state.mouse.down = true;

    // 欢迎引导：必须用按钮翻页（避免误触关闭）
    if (state.welcome) {
      const bk = welcomeSkipRect(), bn = welcomeBtnRect();
      if (hit(bk, p.x, p.y)) { closeWelcome(); return; }
      if (hit(bn, p.x, p.y)) {
        if (state.welcome >= WELCOME_PAGES.length) closeWelcome();
        else state.welcome++;
        return;
      }
      return;   // 其他点击吞掉
    }

    // 零件说明面板开着时：点任何地方都先关掉它（不会误触到下面的按钮）
    if (state.helpOpen) { state.helpOpen = false; return; }

    // 暂停面板：两张"行"必须先判，否则点继续会落到下面的 HUD 按钮上
    if (state.paused && state.phase === 'run') {
      const PY2 = pauseRowRects();
      if (hit(PY2.resume, p.x, p.y)) { state.paused = false; return; }
      if (hit(PY2.back, p.x, p.y)) {
        state.phase = 'build'; state.run = null; state.paused = false; return;
      }
      return;   // 暂停时其余点击一律吞掉，避免误触刹车/交互
    }

    // 选关页：点卡片进入，点空白关闭
    if (state.levelSelect) {
      for (let i = 0; i < levels.length; i++) {
        const r0 = levelCardRect(i);
        if (hit(r0, p.x, p.y)) { state.levelSelect = false; startLevel(i); return; }
      }
      const hbr = { x: DW / 2 - 80, y: DH - 84, w: 160, h: 38 };
      if (hit(hbr, p.x, p.y)) { state.levelSelect = false; state.welcome = 1; return; }
      state.levelSelect = false;
      return;
    }

    // 顶栏：第一个是「关卡」入口，其余仍是快速切换
    if (hit(tabRect(0), p.x, p.y)) { state.levelSelect = true; return; }
    for (let i = 1; i < levels.length; i++) {
      if (hit(tabRect(i), p.x, p.y)) { startLevel(i); return; }
    }

    // 全局按钮：帮助 / 暂停 / 重来（先判这三个，避免被别的分支吃掉）
    {
      const hb = btnRect('help');
      if (hb && hit(hb, p.x, p.y)) { state.helpOpen = !state.helpOpen; return; }
      const pb = btnRect('pause');
      if (pb && hit(pb, p.x, p.y)) { state.paused = !state.paused; return; }
      const rb = btnRect('restartRun');
      if (rb && hit(rb, p.x, p.y)) {
        state.phase = 'build'; state.run = null; state.paused = false;
        return;
      }
      const bk = btnRect('brake');
      if (bk && hit(bk, p.x, p.y) && state.run) { RAP.setBrake(state.run, true); return; }
    }

    if (state.phase === 'build') {
      const bLaunch = btnRect('launch'), bClear = btnRect('clear'), bUndo = btnRect('undo');
      if (hit(bLaunch, p.x, p.y)) { launch(); return; }
      if (hit(bClear, p.x, p.y)) { RAP.clearBuild(state.build); toast('已清空'); return; }
      if (hit(bUndo, p.x, p.y)) { undoStep(); return; }
      const bRot = btnRect('rotate');
      if (hit(bRot, p.x, p.y)) {
        const hc2 = cellAt(p.x, p.y) || cellAt(state.mouse.x, state.mouse.y);
        if (hc2 && state.build.cells[hc2.r + ',' + hc2.c] &&
            RAP.isDirectional(state.build.cells[hc2.r + ',' + hc2.c].part)) {
          RAP.rotateAt(state.build, hc2.r, hc2.c);
          SFX.place();
        } else {
          // 没有悬停格子：转最后放下的方向件
          const keys = state.build.order.slice().reverse();
          for (const k of keys) {
            if (k.indexOf('inner:') === 0) continue;
            const cell = state.build.cells[k];
            if (cell && RAP.isDirectional(cell.part)) {
              RAP.rotateAt(state.build, +k.split(',')[0], +k.split(',')[1]);
              SFX.place();
              break;
            }
          }
        }
        return;
      }
      for (let i = 0; i < TRAY.length; i++) {
        if (hit(trayRect(i), p.x, p.y)) {
          if (ev.button === 2) return;
          selectPart(TRAY[i]);
          state.dragPart = TRAY[i];       // 拿起零件，等松手才落子
          state.dragFromTray = true;
          return;
        }
      }
      const cell = cellAt(p.x, p.y);
      if (cell) {
        if (ev.button === 2) { RAP.rotateAt(state.build, cell.r, cell.c); return; }
        // 橡皮：按下即擦，按住拖动可以连续擦
        if (state.selected === 'eraser') {
          state.erasePaint = true;
          if (RAP.removeAt(state.build, cell.r, cell.c)) SFX.place();
          return;
        }
        const key = cell.r + ',' + cell.c;
        const there = state.build.cells[key];
        if (there) {
          // 先只记录：拖动才移动，单击则按选中零件去放置/旋转

      }
    } else {
      // 洞窟：顶部钟乳石 + 强暗角
      ctx.fillStyle = '#0a141a';
      const dripN = Math.max(14, Math.ceil((VIEW_W + VIEW_OFF_X * 2) / 78));
      for (let ci = 0; ci < dripN; ci++) {
        const bx = (ci / (dripN - 1)) * (VIEW_W + VIEW_OFF_X * 2) + ((ci * 37) % 40) - 20 - VIEW_OFF_X;
        const w2 = 26 + ((ci * 53) % 30);
        const h2 = 60 + ((ci * 71) % 90);
        ctx.beginPath();
        ctx.moveTo(bx - w2 / 2, 0); ctx.lineTo(bx + w2 / 2, 0);
        ctx.lineTo(bx + ((ci % 3) - 1) * 8, h2);
        ctx.closePath(); ctx.fill();
      }
      // 顶部垂藤
      ctx.strokeStyle = 'rgba(28,52,40,.75)';
      for (let vi = 0; vi < 18; vi++) {
        const hx = (vi / 17) * (VIEW_W + VIEW_OFF_X * 2) - VIEW_OFF_X + ((vi * 53) % 30);
        const vlen = 40 + ((vi * 71) % 110);
        const bend = ((vi % 3) - 1) * 12;
        ctx.lineWidth = 1.5 + ((vi * 37) % 3) * 0.8;
        ctx.beginPath();
        ctx.moveTo(hx, 0);
        ctx.quadraticCurveTo(hx + bend, vlen * 0.6, hx + bend * 1.6, vlen);
        ctx.stroke();
      }

      const caveV = ctx.createRadialGradient(DW / 2, DH * 0.62, DH * 0.2, DW / 2, DH * 0.62, DW * 0.7);
      caveV.addColorStop(0, 'rgba(0,0,0,0)');
      caveV.addColorStop(1, 'rgba(0,0,0,.55)');
      fillScreen(caveV);
    }

    // 地平线光晕（暖；洞穴里换成冷光，暖光会让洞窟"漏日光"）
    const glow = ctx.createRadialGradient(DW * 0.5, DH * 0.5, 80, DW * 0.5, DH * 0.5, DW * 0.62);
    glow.addColorStop(0, CAVE ? 'rgba(150,200,220,.13)' : 'rgba(255,248,196,.32)');
    glow.addColorStop(1, 'rgba(255,248,196,0)');
    fillScreen(glow);
    // 远山剪影（原神感的层峦）
    // 底边要伸到远景地面之下，否则一圈三角形会在屏幕固定高度上"切"出一条直线
    ctx.fillStyle = PAL.hill;
    for (let i = 0; i < 5; i++) {
      const bx = i * 300 - 80, h = 90 - (i % 3) * 18;
      ctx.beginPath();
      ctx.moveTo(bx, DH * 0.62);
      ctx.lineTo(bx + 150, DH * 0.42 - h);
      ctx.lineTo(bx + 300, DH * 0.62);
      ctx.closePath(); ctx.fill();
    }

    // ---------- 丛林：三层剪影 ----------
    function canopy(baseY2, r0, dy, color, alpha, leafy) {
      ctx.save();
      ctx.globalAlpha = alpha;
      const n = Math.ceil((VIEW_W + VIEW_OFF_X * 2) / (r0 * 1.5)) + 4;
      for (let i = 0; i < n; i++) {
        const bx = (i - 1) * r0 * 1.5 + (i % 2) * r0 * 0.4 - VIEW_OFF_X;
        const rr = r0 * (0.75 + ((i * 37) % 11) / 22);
        const by = baseY2 + dy - ((i * 53) % 9) * 1.6;
        ctx.fillStyle = color;
        ctx.beginPath(); ctx.arc(bx, by, rr, Math.PI, 0); ctx.fill();
        // 叶尖（近景层才画）
        if (leafy) {
          for (let k = 0; k < 7; k++) {
            const a2 = -Math.PI + (k / 6) * Math.PI;
            const x1 = bx + Math.cos(a2) * rr * 0.96;
            const y1 = by + Math.sin(a2) * rr * 0.96;
            ctx.beginPath();
            ctx.moveTo(x1 - 3 * cam.zoom, y1);
            ctx.quadraticCurveTo(x1, y1 - 8 * cam.zoom, x1 + 3 * cam.zoom, y1);
            ctx.closePath(); ctx.fill();
          }
        }
      }
      ctx.restore();
    }

    const horizonY = toY(ter.surfaceY(cam.x) + 2.6);
    // 远景地面：先铺满，避免远山与丛林之间漏出天空
    // 从远山顶点之上就开始铺（否则三角形之间会漏出天空）
    // 淡入带要够长，否则远景地面顶端会在屏幕固定高度上出现一条横向"接缝"
    const farGround = ctx.createLinearGradient(0, horizonY - 170, 0, horizonY + 120);
    farGround.addColorStop(0, CAVE ? 'rgba(10,20,26,0)' : 'rgba(196,216,222,0)');
    farGround.addColorStop(0.58, PAL.hill);
    farGround.addColorStop(0.74, PAL.hill);
    farGround.addColorStop(1, PAL.jungle[1]);
    ctx.fillStyle = farGround;
    ctx.fillRect(-VIEW_OFF_X - 4, horizonY - 170, VIEW_W + VIEW_OFF_X * 2 + 8, 290);
    // 远山（最淡，最高）
    ctx.fillStyle = CAVE ? 'rgba(8,16,22,.85)' : PAL.hill;
    const hillN2 = Math.ceil((VIEW_W + VIEW_OFF_X * 2) / 220) + 3;
    for (let i = 0; i < hillN2; i++) {
      const bx = i * 220 - 120 - VIEW_OFF_X, hh = 120 - (i % 3) * 26;
      ctx.beginPath();
      ctx.moveTo(bx, horizonY + 30);
      ctx.lineTo(bx + 130, horizonY + 30 - hh);
      ctx.lineTo(bx + 260, horizonY + 30);
      ctx.closePath(); ctx.fill();
    }
    // 远景丛林（淡）
    canopy(horizonY + 34, 42, 0, PAL.jungle[0], 0.9, false);
    // 中景丛林（中）
    canopy(horizonY + 62, 50, 6, PAL.jungle[1], 0.96, false);
    // 中景与近景之间的雾（洞穴里是冷雾，不能撒暖白）
    const fogCol = CAVE ? '190,220,235' : '226,240,210';
    const fogM = ctx.createLinearGradient(0, horizonY + 40, 0, horizonY + 130);
    fogM.addColorStop(0, 'rgba(' + fogCol + ',0)');
    fogM.addColorStop(0.5, 'rgba(' + fogCol + ',' + (CAVE ? 0.16 : 0.32) + ')');
    fogM.addColorStop(1, 'rgba(' + fogCol + ',0)');
    ctx.fillStyle = fogM;
    ctx.fillRect(-VIEW_OFF_X - 4, horizonY + 40, VIEW_W + VIEW_OFF_X * 2 + 8, 100);
    // 近景丛林（最实，带叶尖）
    canopy(horizonY + 96, 58, 10, PAL.jungle[2], 1, true);

    // 棕榈剪影
    function palm(px, py, scale, alpha) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = PAL.jungle[2]; ctx.lineWidth = 6 * scale; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.quadraticCurveTo(px + 7 * scale, py - 50 * scale, px + 2 * scale, py - 92 * scale);
      ctx.stroke();
      ctx.strokeStyle = PAL.jungle[1]; ctx.lineWidth = 9 * scale;
      for (let k = 0; k < 7; k++) {
        const a = -Math.PI / 2 + (k - 3) * 0.46;
        ctx.beginPath();
        ctx.moveTo(px + 2 * scale, py - 92 * scale);
        ctx.quadraticCurveTo(
          px + Math.cos(a) * 36 * scale, py - 92 * scale + Math.sin(a) * 22 * scale - 14 * scale,
          px + Math.cos(a) * 60 * scale, py - 92 * scale + Math.sin(a) * 38 * scale + 8 * scale);
        ctx.stroke();
      }
      ctx.restore();
    }
    const palmBase = horizonY + 104;
    palm(DW * 0.10, palmBase, 1.05, 0.92);
    palm(DW * 0.24, palmBase + 8, 0.82, 0.8);
    palm(DW * 0.72, palmBase + 4, 0.98, 0.88);
    palm(DW * 0.87, palmBase + 12, 0.78, 0.78);

    // 远景地面过渡带（近景丛林脚下一层泥地，避免草皮直接接丛林）
    ctx.fillStyle = '#6b7a52';
    ctx.fillRect(-VIEW_OFF_X - 4, horizonY + 118, VIEW_W + VIEW_OFF_X * 2 + 8,
      Math.max(0, toY(ter.surfaceY(cam.x)) - (horizonY + 118)) + 6);
    const gTrans = ctx.createLinearGradient(0, horizonY + 118, 0, toY(ter.surfaceY(cam.x)) + 6);
    gTrans.addColorStop(0, 'rgba(40,70,50,.55)');
    gTrans.addColorStop(1, 'rgba(40,70,50,0)');
    ctx.fillStyle = gTrans;
    ctx.fillRect(0, horizonY + 118, DW, Math.max(0, toY(ter.surfaceY(cam.x)) - (horizonY + 118)) + 6);

    // 地表材质带
    function band(color, width, offset) {
      ctx.beginPath();
      for (let i = 0; i < pts.length; i++) {
    const x = toX(pts[i][0]), y = toY(pts[i][1]) + offset;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = 'round'; ctx.stroke();
    }
    // 草皮：暗边 → 亮草 → 高光 → 草叶
    // ---------- 地形：折线采样 ----------
    const leftW = cam.x - VIEW_W / 2 / s - 2, rightW = cam.x + VIEW_W / 2 / s + 2;
    const stepW = 5 / s;
    const pts = [];
    for (let x = leftW; x <= rightW; x += stepW) pts.push([x, ter.surfaceY(x)]);

    function traceTerrain(extraBottom) {
      ctx.beginPath();
      ctx.moveTo(toX(pts[0][0]), toY(pts[0][1]));
      for (let i = 1; i < pts.length; i++) ctx.lineTo(toX(pts[i][0]), toY(pts[i][1]));
      const bottomY = DH + VIEW_OFF_Y + (extraBottom || 40);
      ctx.lineTo(toX(pts[pts.length - 1][0]), bottomY);
      ctx.lineTo(toX(pts[0][0]), bottomY);
      ctx.closePath();
    }

    // 底色（深石头）
    traceTerrain();
    const rockDeep = ctx.createLinearGradient(0, toY(cam.y), 0, DH);
    rockDeep.addColorStop(0, '#3d4a56');
    rockDeep.addColorStop(1, '#2a3641');
    ctx.fillStyle = rockDeep; ctx.fill();

    // ---------- 石块纹理 ----------
    ctx.save();
    traceTerrain();
    ctx.clip();
    // 见模块级 texHash()
    const stoneW = 128 * cam.zoom, stoneH = 86 * cam.zoom;
    const baseY = toY(cam.y) + 14;
    // 用可视宽度而不是设计宽度，否则宽屏时两侧没有石头纹理
    const colsN = Math.ceil((VIEW_W + VIEW_OFF_X * 2) / stoneW) + 4;
    const rowsN = Math.ceil((VIEW_H + VIEW_OFF_Y * 2 - baseY) / stoneH) + 4;
    for (let row = 0; row < rowsN; row++) {
      for (let col = 0; col < colsN; col++) {
    const ox = (col - 1) * stoneW + (row % 2) * stoneW * 0.5 - VIEW_OFF_X;
    const oy = baseY + row * stoneH;
    const jx = (texHash(col, row) - 0.5) * stoneW * 0.34;
    const jy = (texHash(col + 99, row + 7) - 0.5) * stoneH * 0.30;
    const cx2 = ox + jx, cy2 = oy + jy;
    const rw = stoneW * (0.50 + texHash(col + 3, row + 11) * 0.10);
    const rh = stoneH * (0.48 + texHash(col + 5, row + 13) * 0.10);
    const N = 7 + Math.floor(texHash(col + 21, row + 17) * 4);   // 7~10 边，更圆润
    const poly = [];
    for (let k = 0; k < N; k++) {
      const a = (k / N) * Math.PI * 2 + texHash(col + k, row + k) * 0.5;
      const rr = 1 + (texHash(col * 7 + k, row * 3 + k) - 0.5) * 0.22;  // 扰动减小 → 更圆
      poly.push([cx2 + Math.cos(a) * rw * rr, cy2 + Math.sin(a) * rh * rr]);
    }
    // 主体：深青灰，越往下越暗
    ctx.beginPath();
    poly.forEach((pt, k) => k === 0 ? ctx.moveTo(pt[0], pt[1]) : ctx.lineTo(pt[0], pt[1]));
    ctx.closePath();
    const depth = Math.min(1, (cy2 - baseY) / (DH - baseY + 1));
    const l1 = Math.round(PAL.rock[0] - depth * 40),
          g1 = Math.round(PAL.rock[1] - depth * 38),
          b1 = Math.round(PAL.rock[2] - depth * 36);
    // 主体 + 内部径向渐变（中心亮、边缘暗 → 圆润的立体感）
    const rg = ctx.createRadialGradient(
      cx2 - rw * 0.22, cy2 - rh * 0.34, rh * 0.12,
      cx2, cy2, rw * 1.05);
    rg.addColorStop(0, 'rgb(' + Math.min(255, l1 + 34) + ',' + Math.min(255, g1 + 32) + ',' + Math.min(255, b1 + 30) + ')');
    rg.addColorStop(0.55, 'rgb(' + l1 + ',' + g1 + ',' + b1 + ')');
    rg.addColorStop(1, 'rgb(' + Math.max(0, l1 - 34) + ',' + Math.max(0, g1 - 32) + ',' + Math.max(0, b1 - 30) + ')');
    ctx.beginPath();
    poly.forEach((pt, k) => k === 0 ? ctx.moveTo(pt[0], pt[1]) : ctx.lineTo(pt[0], pt[1]));
    ctx.closePath();
    ctx.fillStyle = rg; ctx.fill();

    // 缝：更宽更深
    ctx.strokeStyle = 'rgba(6,12,18,.85)';
    ctx.lineWidth = Math.max(2, 4.2 * cam.zoom);
    ctx.beginPath();
    poly.forEach((pt, k) => k === 0 ? ctx.moveTo(pt[0], pt[1]) : ctx.lineTo(pt[0], pt[1]));
    ctx.closePath(); ctx.stroke();
      }
    }
    ctx.restore();

    // 地表材质带
    function band(color, width, offset) {
      ctx.beginPath();
      for (let i = 0; i < pts.length; i++) {
    const x = toX(pts[i][0]), y = toY(pts[i][1]) + offset;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = 'round'; ctx.stroke();
    }
    // 草皮：暗边 → 亮草 → 高光 → 草叶
    band(PAL.edge, 16 * cam.zoom, 13 * cam.zoom);               // 草地整体暗边
    band(PAL.grass2, 15 * cam.zoom, 6 * cam.zoom);              // 暗草
    band(PAL.grass, 12 * cam.zoom, 1 * cam.zoom);               // 亮草
    band(PAL.grass3, 5 * cam.zoom, -2 * cam.zoom);              // 顶部高光

    band(PAL.edge, 16 * cam.zoom, 13 * cam.zoom);               // 草地整体暗边
    band(PAL.grass2, 15 * cam.zoom, 6 * cam.zoom);              // 暗草
    band(PAL.grass, 12 * cam.zoom, 1 * cam.zoom);               // 亮草
    band(PAL.grass3, 5 * cam.zoom, -2 * cam.zoom);              // 顶部高光

    // 石头表面的小碎石（跟着地形走，一定在石头内部）
    {
      for (let i = 0; i < pts.length; i += 6) {
        const wx = pts[i][0];
        const h1 = Math.abs(Math.sin(wx * 12.9898) * 43758.5453) % 1;
        const h2 = Math.abs(Math.sin(wx * 39.346) * 24634.6345) % 1;
        if (h1 > 0.30) continue;
        const px = toX(wx);
        const surfY = toY(pts[i][1]);
        const depth = (18 + h2 * 90) * cam.zoom;      // 地表以下 18~108 px
        const py = surfY + depth;
        if (py > DH + VIEW_OFF_Y || py < surfY + 8 * cam.zoom) continue;
        const r2 = (2.5 + h2 * 4) * cam.zoom;
        ctx.beginPath();
        ctx.ellipse(px, py, r2 * 1.3, r2 * 0.8, h1 * 3, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(186,200,210,.22)'; ctx.fill();
        ctx.beginPath();
        ctx.ellipse(px - r2 * 0.25, py - r2 * 0.24, r2 * 0.55, r2 * 0.34, h1 * 3, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,.16)'; ctx.fill();
      }
    }

    // 零星草叶
    ctx.save();
    ctx.strokeStyle = '#5faa42'; ctx.lineWidth = 2.2 * cam.zoom; ctx.lineCap = 'round';
    for (let i = 0; i < pts.length; i += 5) {
      const wx = pts[i][0];
      const hh = texHash(Math.floor(wx * 3), 17);
      if (hh > 0.55) continue;
      const x = toX(wx), y = toY(pts[i][1]) - 2 * cam.zoom;
      const len = (5 + hh * 10) * cam.zoom;
      const lean = (texHash(Math.floor(wx * 5), 31) - 0.5) * 6 * cam.zoom;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + lean, y - len * 0.6, x + lean * 1.6, y - len);
      ctx.stroke();
    }
    ctx.restore();

    // 冰面
    ctx.save();
    for (let i = 0; i < pts.length; i++) {
      if (ter.material[Math.max(0, Math.min(ter.cols - 1, Math.floor(pts[i][0])))] !== 'ice') continue;
      const x0 = toX(pts[i][0]);
      const wpx = stepW * s + 1.5;
      ctx.fillStyle = 'rgba(176,232,246,.92)';
      ctx.fillRect(x0 - wpx / 2, toY(pts[i][1]) - 1 * cam.zoom, wpx, 7 * cam.zoom);
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ctx.fillRect(x0 - wpx / 2, toY(pts[i][1]) - 1 * cam.zoom, wpx, 2 * cam.zoom);
    }
    ctx.restore();

  }

  function drawGrid() {
    if (state.phase !== 'build') return;
    const o = buildOrigin();
    const GW = RAP.BUILD_COLS * BUILD_PX, GH = RAP.BUILD_ROWS * BUILD_PX;
    const HD = 26;                       // 面板标题栏高度
    // 建造台：一块"工程图板"，标题栏 + 细网格线，比原来的橄榄绿玻璃砖干净
    ctx.fillStyle = 'rgba(8,20,28,.58)';
    roundRect(o.x - 12, o.y - HD - 8, GW + 24, GH + HD + 14, 14); ctx.fill();
    ctx.strokeStyle = 'rgba(232,200,122,.42)'; ctx.lineWidth = 2; ctx.stroke();
    // 标题栏
    ctx.fillStyle = 'rgba(16,30,40,.72)';
    roundRect(o.x - 12, o.y - HD - 8, GW + 24, HD, 14); ctx.fill();
    ctx.fillStyle = 'rgba(232,200,122,.30)';
    ctx.fillRect(o.x - 12, o.y - 8, GW + 24, 1.5);
    text('拼装区', o.x - 2, o.y - HD + 10, 12.5, 'rgba(255,233,176,.85)', 'left', true);
    text(RAP.BUILD_COLS + ' × ' + RAP.BUILD_ROWS, o.x + GW + 2, o.y - HD + 10, 11.5,
      'rgba(196,218,236,.72)', 'right', true);
    // 棋盘染色（很淡，只做可读性）
    for (let r = 0; r < RAP.BUILD_ROWS; r++) {
      for (let c = 0; c < RAP.BUILD_COLS; c++) {
        if ((r + c) % 2) continue;
        ctx.fillStyle = 'rgba(255,255,255,.028)';
        ctx.fillRect(o.x + c * BUILD_PX, o.y + r * BUILD_PX, BUILD_PX, BUILD_PX);
      }
    }
    // 网格线
    ctx.strokeStyle = 'rgba(150,200,235,.15)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let c = 0; c <= RAP.BUILD_COLS; c++) {
      const x = Math.round(o.x + c * BUILD_PX) + 0.5;
      ctx.moveTo(x, o.y); ctx.lineTo(x, o.y + GH);
    }
    for (let r = 0; r <= RAP.BUILD_ROWS; r++) {
      const y = Math.round(o.y + r * BUILD_PX) + 0.5;
      ctx.moveTo(o.x, y); ctx.lineTo(o.x + GW, y);
    }
    ctx.stroke();
    // 四角括角，强化"工作区"的框定感
    ctx.strokeStyle = 'rgba(232,200,122,.55)'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    const CK = 12;
    [[o.x, o.y, 1, 1], [o.x + GW, o.y, -1, 1], [o.x, o.y + GH, 1, -1], [o.x + GW, o.y + GH, -1, -1]]
      .forEach(([x, y, sx, sy]) => {
        ctx.beginPath();
        ctx.moveTo(x + sx * CK, y); ctx.lineTo(x, y); ctx.lineTo(x, y + sy * CK);
        ctx.stroke();
      });
    // 拖拽吸附：按住拖动时，光标能落到的格子亮绿（能放）/ 亮红（放不下）
    if (state.mouse.down && (state.dragPart || state.selected !== 'eraser')) {
      const want = state.dragMove ? state.dragMove.part : (state.dragPart || state.selected);
      const cell = cellAt(state.mouse.x, state.mouse.y);
      if (cell && want && want !== 'eraser') {
        let okHere = true;
        if (state.dragMove) okHere = !state.build.cells[cell.r + ',' + cell.c] ||
          (cell.r === state.dragMove.r && cell.c === state.dragMove.c);
        else {
          // 纯检查，不改数据（用 tryPlace 会每帧推进方向，导致"一直旋转"）
          okHere = RAP.canPlace(level(), state.build, want, cell.r, cell.c).ok;
        }
        const cx0 = o.x + cell.c * BUILD_PX, cy0 = o.y + cell.r * BUILD_PX;
        ctx.fillStyle = okHere ? 'rgba(99,217,126,.28)' : 'rgba(224,81,60,.28)';
        roundRect(cx0 + 2, cy0 + 2, BUILD_PX - 4, BUILD_PX - 4, 6); ctx.fill();
        ctx.strokeStyle = okHere ? 'rgba(150,240,170,.9)' : 'rgba(255,150,130,.9)';
        ctx.lineWidth = 2.5;
        roundRect(cx0 + 2, cy0 + 2, BUILD_PX - 4, BUILD_PX - 4, 6); ctx.stroke();
      } else if (state.dragMove) {
        /* 拖动中但光标已经出了网格 → 提前说"松手就卸下"。
         *
         * 不加这一句的话，玩家把零件拖到网格边上时看到的是一片没有任何反馈的
         * 空地，而松手的后果（零件从车上卸下来）是**不可撤销**的（只能再放回去）。
         * 提示紧贴光标，因为这时候玩家的视线就在光标上。 */
        const nm = RAP.PARTS[state.dragMove.part] ? RAP.PARTS[state.dragMove.part].label : '';
        const txt = '松手卸下' + (nm ? ' ' + nm : '') +
          (state.dragMove.n > 1 ? ' ×' + state.dragMove.n : '');
        const tw = txt.length * 13 + 26;
        const bx2 = Math.max(6, Math.min(DW - tw - 6, state.mouse.x + 18));
        const by2 = Math.max(6, state.mouse.y - 40);
        ctx.fillStyle = 'rgba(16,30,40,.95)';
        roundRect(bx2, by2, tw, 26, 8); ctx.fill();
        ctx.strokeStyle = 'rgba(232,200,122,.6)'; ctx.lineWidth = 1.5;
        roundRect(bx2, by2, tw, 26, 8); ctx.stroke();
        text(txt, bx2 + tw / 2, by2 + 17, 12.5, '#ffe9b0', 'center', true);
      }
    }

    // 悬停高亮 + 幽灵零件
    const cell = cellAt(state.mouse.x, state.mouse.y);
    if (cell) {
      if (state.selected === 'eraser') {
        ctx.fillStyle = 'rgba(224,81,60,.28)';
        roundRect(o.x + cell.c * BUILD_PX + 2, o.y + cell.r * BUILD_PX + 2, BUILD_PX - 4, BUILD_PX - 4, 6);
        ctx.fill();
      }
      ctx.strokeStyle = 'rgba(255,235,140,.95)'; ctx.lineWidth = 3;
      roundRect(o.x + cell.c * BUILD_PX + 2, o.y + cell.r * BUILD_PX + 2, BUILD_PX - 4, BUILD_PX - 4, 6); ctx.stroke();
    }
    // 当前选中零件放不下的格子 → 红叉提示
    if (cell && !state.build.cells[cell.r + ',' + cell.c] && state.selected !== 'eraser') {
      // 纯检查，不改数据
      const probe = RAP.canPlace(level(), state.build, state.selected, cell.r, cell.c);
      if (!probe.ok) {
        const cx0 = o.x + cell.c * BUILD_PX + BUILD_PX / 2;
        const cy0 = o.y + cell.r * BUILD_PX + BUILD_PX / 2;
        ctx.strokeStyle = 'rgba(224,81,60,.85)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
        const s2 = BUILD_PX * 0.2;
        ctx.beginPath();
        ctx.moveTo(cx0 - s2, cy0 - s2); ctx.lineTo(cx0 + s2, cy0 + s2);
        ctx.moveTo(cx0 + s2, cy0 - s2); ctx.lineTo(cx0 - s2, cy0 + s2);
        ctx.stroke();
      }
    }

    const ghost = state.dragPart || (state.selected !== 'eraser' ? state.selected : null);
    if (state.mouse.down && (!ghost || ghost === 'eraser')) {
      // 橡皮的幽灵：一块白色橡皮 + 斜线，提示"点这里删掉"
      ctx.save();
      ctx.globalAlpha = 0.7;
      ctx.fillStyle = '#e6ecf2';
      roundRect(state.mouse.x - BUILD_PX * 0.36, state.mouse.y - BUILD_PX * 0.26,
        BUILD_PX * 0.72, BUILD_PX * 0.52, 6); ctx.fill();
      ctx.strokeStyle = '#e0513c'; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(state.mouse.x - BUILD_PX * 0.2, state.mouse.y - BUILD_PX * 0.1);
      ctx.lineTo(state.mouse.x + BUILD_PX * 0.2, state.mouse.y + BUILD_PX * 0.1);
      ctx.stroke();
      ctx.restore();
    } else if (ghost && state.mouse.down) {
      ctx.globalAlpha = 0.55;
      drawPartShape(ghost, state.mouse.x, state.mouse.y, BUILD_PX * 0.84, 0);
      ctx.globalAlpha = 1;
      // 跟着光标显示零件名 —— 拖的时候也知道手里是什么
      if (RAP.PARTS[ghost]) {
        const nm = RAP.PARTS[ghost].label;
        const w = nm.length * 15 + 22;
        ctx.fillStyle = 'rgba(10,18,24,.92)';
        roundRect(state.mouse.x + 18, state.mouse.y - 34, w, 24, 7); ctx.fill();
        text(nm, state.mouse.x + 18 + w / 2, state.mouse.y - 17, 13, '#ffe9b0', 'center', true);
      }
    }
  }

  // 画"喷气/推进方向"箭头：从格心朝 dir 方向
  function drawDirArrow(cx, cy, dir, size, color, glow) {
    const v = RAP.dirVec(dir);
    const len = size * 1.05;                     // 明显伸出格子外
    const startD = size * 0.42;                  // 从格子边缘起，不压住零件
    const sx0 = cx + v[0] * startD, sy0 = cy - v[1] * startD;
    const tailX = sx0 - v[0] * size * 0.1, tailY = sy0 + v[1] * size * 0.1;
    const tipX = cx + v[0] * len, tipY = cy - v[1] * len;
    const head = size * 0.34;
    const col = color || '#E8C87A';
    ctx.save();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    // 尾部喷气短线（表示"从这里喷出去"）
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = glow ? 6 : 5;
    for (const side of [-1, 0, 1]) {
      const px = v[0] === 0 ? side * size * 0.12 : 0;
      const py = v[1] === 0 ? side * size * 0.12 : 0;
      ctx.beginPath();
      ctx.moveTo(tailX - v[0] * size * 0.02 + px, tailY + v[1] * size * 0.02 + py);
      ctx.lineTo(tailX - v[0] * size * 0.16 + px, tailY + v[1] * size * 0.16 + py);
      ctx.stroke();
    }

    // 箭杆：深色打底 → 白边 → 本体色（三种背景都看得清）
    ctx.strokeStyle = 'rgba(16,26,20,.9)'; ctx.lineWidth = glow ? 13 : 11;
    ctx.beginPath(); ctx.moveTo(sx0, sy0); ctx.lineTo(tipX, tipY); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = glow ? 9 : 7;
    ctx.beginPath(); ctx.moveTo(sx0, sy0); ctx.lineTo(tipX, tipY); ctx.stroke();
    ctx.strokeStyle = col; ctx.lineWidth = glow ? 6 : 5;
    ctx.beginPath(); ctx.moveTo(sx0, sy0); ctx.lineTo(tipX, tipY); ctx.stroke();

    // 实心三角箭头
    const ang = Math.atan2(-(tipY - cy), tipX - cx);
    const p1 = [tipX + Math.cos(ang) * head, tipY - Math.sin(ang) * head];
    const p2 = [tipX + Math.cos(ang + 2.5) * head, tipY - Math.sin(ang + 2.5) * head];
    const p3 = [tipX + Math.cos(ang - 2.5) * head, tipY - Math.sin(ang - 2.5) * head];
    ctx.beginPath();
    ctx.moveTo(tipX, tipY); ctx.lineTo(p2[0], p2[1]); ctx.lineTo(p3[0], p3[1]);
    ctx.closePath();
    ctx.fillStyle = col; ctx.fill();
    ctx.strokeStyle = 'rgba(16,26,20,.85)'; ctx.lineWidth = 3; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.restore();
  }

  // mood: 'normal' | 'happy' | 'scared' | 'hurt' | 'dizzy' | 'dead'
  function drawPig(cx, cy, r, angle, mood, extra) {
    mood = mood || 'normal';
    extra = extra || {};
    const tNow = performance.now() / 1000;
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(angle || 0);
    // 受击抖动
    if (extra.shake) {
      ctx.translate(Math.sin(tNow * 70) * r * 0.08, Math.cos(tNow * 63) * r * 0.06);
    }

    // 耳朵（随速度摆动）
    const earSwing = Math.sin(tNow * 3.2) * (extra.earSwing || 0) * r * 0.1;
    ctx.fillStyle = '#5fae4c';
    for (const sx of [-1, 1]) {
      ctx.save();
      ctx.translate(sx * r * 0.58, -r * 0.8 + earSwing * sx);
      ctx.rotate(sx * 0.12 + earSwing * 0.4);
      ctx.beginPath(); ctx.ellipse(0, 0, r * 0.27, r * 0.31, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#a8dd94';
      ctx.beginPath(); ctx.ellipse(0, r * 0.04, r * 0.14, r * 0.16, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#5fae4c';
      ctx.restore();
    }

    // 头
    ctx.fillStyle = COL.pig;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    // 头顶高光（体积感）
    ctx.fillStyle = 'rgba(255,255,255,.16)';
    ctx.beginPath(); ctx.ellipse(-r * 0.2, -r * 0.45, r * 0.5, r * 0.28, -0.3, 0, Math.PI * 2); ctx.fill();
    // 腮红
    ctx.fillStyle = 'rgba(232,120,120,.32)';
    for (const sx of [-1, 1]) {
      ctx.beginPath(); ctx.ellipse(sx * r * 0.6, r * 0.2, r * 0.2, r * 0.13, 0, 0, Math.PI * 2); ctx.fill();
    }

    // ---- 眼睛（表情主体）----
    const eyeY = -r * 0.14;
    const EX = [-r * 0.34, r * 0.34];
    ctx.lineCap = 'round';
    if (mood === 'dead') {
      // × 眼 + 小舌头
      ctx.strokeStyle = '#1d2b1a'; ctx.lineWidth = Math.max(2, r * 0.12);
      for (const ex of EX) {
        ctx.beginPath();
        ctx.moveTo(ex - r * 0.15, eyeY - r * 0.15); ctx.lineTo(ex + r * 0.15, eyeY + r * 0.15);
        ctx.moveTo(ex + r * 0.15, eyeY - r * 0.15); ctx.lineTo(ex - r * 0.15, eyeY + r * 0.15);
        ctx.stroke();
      }
    } else if (mood === 'hurt' || mood === 'dizzy') {
      // >< 眼
      ctx.strokeStyle = '#1d2b1a'; ctx.lineWidth = Math.max(2, r * 0.11);
      for (const [i, ex] of EX.entries()) {
        const dir = i === 0 ? 1 : -1;
        ctx.beginPath();
        ctx.moveTo(ex - dir * r * 0.15, eyeY - r * 0.14);
        ctx.lineTo(ex + dir * r * 0.12, eyeY);
        ctx.lineTo(ex - dir * r * 0.15, eyeY + r * 0.14);
        ctx.stroke();
      }
      // 眩晕星星
      if (mood === 'dizzy') {
        for (let k = 0; k < 3; k++) {
          const a2 = tNow * 3 + k * 2.1;
          const sx2 = Math.cos(a2) * r * 0.55, sy2 = -r * 1.15 + Math.sin(a2) * r * 0.16;
          ctx.fillStyle = '#ffd93d';
          ctx.beginPath();
          for (let q = 0; q < 10; q++) {
            const ang = -Math.PI / 2 + q * Math.PI / 5;
            const rad = (q % 2 === 0) ? r * 0.16 : r * 0.07;
            const px2 = sx2 + Math.cos(ang) * rad, py2 = sy2 + Math.sin(ang) * rad;
            q === 0 ? ctx.moveTo(px2, py2) : ctx.lineTo(px2, py2);
          }
          ctx.closePath(); ctx.fill();
        }
      }
    } else if (mood === 'scared') {
      // 大眼 + 小瞳孔 + 眉毛
      for (const ex of EX) {
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(ex, eyeY, r * 0.19, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#1d2b1a';
        ctx.beginPath(); ctx.arc(ex, eyeY - r * 0.02, r * 0.085, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.9)';
        ctx.beginPath(); ctx.arc(ex + r * 0.03, eyeY - r * 0.07, r * 0.03, 0, Math.PI * 2); ctx.fill();
      }
      ctx.strokeStyle = '#1d2b1a'; ctx.lineWidth = Math.max(1.6, r * 0.07);
      for (const [i, ex] of EX.entries()) {
        const dir = i === 0 ? 1 : -1;
        ctx.beginPath();
        ctx.moveTo(ex - dir * r * 0.2, eyeY - r * 0.3);
        ctx.lineTo(ex + dir * r * 0.16, eyeY - r * 0.24);
        ctx.stroke();
      }
    } else if (mood === 'happy') {
      // ^ ^ 眼 + 张嘴笑
      ctx.strokeStyle = '#1d2b1a'; ctx.lineWidth = Math.max(2, r * 0.11);
      for (const ex of EX) {
        ctx.beginPath();
        ctx.arc(ex, eyeY + r * 0.06, r * 0.15, Math.PI * 1.15, Math.PI * 1.85);
        ctx.stroke();
      }
    } else {
      // normal：圆眼 + 眨眼
      const blink = (tNow % 3.6) > 3.45;
      ctx.fillStyle = '#1d2b1a';
      if (blink) {
        for (const ex of EX) {
          ctx.fillRect(ex - r * 0.14, eyeY - r * 0.02, r * 0.28, r * 0.07);
        }
      } else {
        for (const ex of EX) {
          ctx.beginPath(); ctx.arc(ex, eyeY, r * 0.135, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = 'rgba(255,255,255,.9)';
        for (const ex of EX) {
          ctx.beginPath(); ctx.arc(ex + r * 0.05, eyeY - r * 0.05, r * 0.045, 0, Math.PI * 2); ctx.fill();
        }
      }
    }

    // ---- 嘴 / 鼻 ----
    ctx.fillStyle = '#8fd07a';
    ctx.beginPath(); ctx.ellipse(0, r * 0.3, r * 0.32, r * 0.23, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#4d7a44';
    for (const sx of [-1, 1]) {
      ctx.beginPath(); ctx.arc(sx * r * 0.11, r * 0.3, r * 0.065, 0, Math.PI * 2); ctx.fill();
    }
    // 张开的嘴（开心/惊恐）
    if (mood === 'happy' || mood === 'scared') {
      ctx.fillStyle = '#7a3b3b';
      ctx.beginPath();
      ctx.ellipse(0, r * 0.62, r * 0.2, r * 0.14, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  /* 堆叠徽标：同一格放了 n 个（气球/沙袋）时，右下角一个小圆角数字。
   * 只用形状画是分不出"1 个气球"和"3 个气球"的，而这两个的浮力差 2.4 倍。 */
  function drawStackBadge(x, y, n) {
    const r = 11;
    ctx.save();
    ctx.fillStyle = 'rgba(12,20,26,.92)';
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(232,200,122,.85)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#f4e2b0';
    ctx.font = 'bold 13px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('×' + n, x, y + 0.5);
    ctx.restore();
  }

  function drawPartShape(part, cx, cy, size, dir, hp, spin) {
    const def = RAP.PARTS[part];
    if (!def) {
      ctx.fillStyle = 'rgba(230,236,242,.9)';
      roundRect(cx - size / 2, cy - size / 2, size, size, 4); ctx.fill();
      return;
    }
    const h = size / 2;
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate((dir || 0) * Math.PI / 2);
    // 零件自身投影（厚重感第一步：离地感）
    if (def.structure || def.wheel || def.motor || def.energy || def.interactive || def.liftMass || def.dropOne) {
      ctx.save();
      ctx.globalAlpha = 0.22;
      ctx.fillStyle = '#0a1016';
      ctx.translate(size * 0.06, size * 0.08);
      if (def.wheel) {
        ctx.beginPath(); ctx.arc(0, 0, h * 0.98, 0, Math.PI * 2); ctx.fill();
      } else {
        roundRect(-h * 0.94, -h * 0.94, size * 0.94, size * 0.94, Math.max(3, size * 0.08));
        ctx.fill();
      }
      ctx.restore();
    }

    if (def.structure) {
      /* ---------- 中空木框：木纹 + 铁角包边 + 内壁阴影 ---------- */
      const bw = size * 0.22;
      // 四条边框（木色，带一点渐变感：上浅下深）
      ctx.fillStyle = '#c99354';
      ctx.fillRect(-h, -h, size, bw);
      ctx.fillRect(-h, -h, bw, size);
      ctx.fillStyle = '#b57f42';
      ctx.fillRect(-h, h - bw, size, bw);
      ctx.fillRect(h - bw, -h, bw, size);
      // 木纹
      ctx.strokeStyle = 'rgba(110,72,34,.45)'; ctx.lineWidth = Math.max(1, size * 0.032);
      ctx.beginPath();
      ctx.moveTo(-h + bw, -h + bw * 0.45); ctx.lineTo(h - bw, -h + bw * 0.45);
      ctx.moveTo(-h + bw, h - bw * 0.45); ctx.lineTo(h - bw, h - bw * 0.45);
      ctx.stroke();
      // 内壁阴影（双重：外圈深、内圈更深 → 厚度感）
      ctx.strokeStyle = 'rgba(58,38,18,.55)'; ctx.lineWidth = Math.max(2, size * 0.085);
      ctx.strokeRect(-h + bw, -h + bw, size - bw * 2, size - bw * 2);
      ctx.strokeStyle = 'rgba(28,16,6,.45)'; ctx.lineWidth = Math.max(1, size * 0.04);
      ctx.strokeRect(-h + bw * 1.25, -h + bw * 1.25, size - bw * 2.5, size - bw * 2.5);
      // 铁角包边（四角）
      const cn = size * 0.1;
      ctx.fillStyle = '#6f7a86';
      for (const [sx, sy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
        ctx.beginPath();
        ctx.moveTo(sx * h, sy * h);
        ctx.lineTo(sx * (h - cn * 2.2), sy * h);
        ctx.lineTo(sx * h, sy * (h - cn * 2.2));
        ctx.closePath(); ctx.fill();
      }
      // 外描边
      ctx.strokeStyle = '#7a4f22'; ctx.lineWidth = Math.max(1.5, size * 0.055);
      ctx.strokeRect(-h, -h, size, size);
      // 挂点铆钉
      for (const [dx, dy] of [[-h + bw * 0.5, -h + bw * 0.5], [h - bw * 0.5, h - bw * 0.5]]) {
        ctx.fillStyle = '#3c4650';
        ctx.beginPath(); ctx.arc(dx, dy, size * 0.045, 0, Math.PI * 2); ctx.fill();
      }
      // 阶段损坏：裂纹 / 破损
      const stage = (hp === undefined || hp === null) ? 3 : hp;
      if (stage <= 2) {
        ctx.strokeStyle = 'rgba(28,18,10,.8)'; ctx.lineWidth = Math.max(1.2, size * 0.035);
        ctx.beginPath();
        ctx.moveTo(-h + bw * 0.5, -h + bw * 0.5);
        ctx.lineTo(-h * 0.15, h * 0.05);
        ctx.lineTo(h * 0.2, -h * 0.2);
        ctx.stroke();
      }
      if (stage <= 1) {
        ctx.fillStyle = 'rgba(28,18,10,.32)';
        ctx.fillRect(-h, -h, size, size);
        ctx.strokeStyle = 'rgba(28,18,10,.85)'; ctx.lineWidth = Math.max(1.5, size * 0.04);
        ctx.beginPath();
        ctx.moveTo(h - bw, -h + bw); ctx.lineTo(h * 0.2, h * 0.15);
        ctx.stroke();
      }

    } else if (def.pig) {
      // 统一走 drawPig（带表情），这里只是缩小画在框里
      ctx.restore();
      drawPig(cx, cy, size * 0.34, (dir || 0) * Math.PI / 2, def.__mood || 'normal',
        { shake: def.__shake, earSwing: def.__earSwing || 0 });
      return;
    } else if (def.wheel) {
      /* ---------- 轮子：外胎 + 辐条（唯一允许自转的组件）---------- */
      if (spin) ctx.rotate(spin);
      const isIron = part === 'iron_wheel';
      ctx.fillStyle = '#1c2229';
      ctx.beginPath(); ctx.arc(0, 0, h, 0, Math.PI * 2); ctx.fill();
      // 轮圈
      ctx.fillStyle = isIron ? '#6b7683' : '#a8763e';
      ctx.beginPath(); ctx.arc(0, 0, h * 0.84, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = isIron ? '#8a95a2' : '#c08a4a';
      ctx.beginPath(); ctx.arc(0, 0, h * 0.72, 0, Math.PI * 2); ctx.fill();
      // 辐条：5 根（360/5=72°，避免与轮速形成 60° 周期频闪）
      ctx.strokeStyle = isIron ? '#4e5862' : '#7d5227';
      ctx.lineWidth = Math.max(1.2, size * 0.055);
      for (let k = 0; k < 5; k++) {
        const a = (k / 5) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * h * 0.2, Math.sin(a) * h * 0.2);
        ctx.lineTo(Math.cos(a) * h * 0.7, Math.sin(a) * h * 0.7);
        ctx.stroke();
      }
      // 偏心配重块：打破旋转对称，高速时也能看出在转
      ctx.fillStyle = isIron ? '#3f4852' : '#6b451f';
      ctx.beginPath();
      ctx.arc(h * 0.42, -h * 0.16, Math.max(1.6, size * 0.075), 0, Math.PI * 2);
      ctx.fill();
      // 单侧亮片：进一步强化"转起来"的视觉线索
      ctx.fillStyle = isIron ? 'rgba(220,232,244,.75)' : 'rgba(255,226,180,.8)';
      ctx.beginPath();
      ctx.arc(-h * 0.44, h * 0.3, Math.max(1.2, size * 0.055), 0, Math.PI * 2);
      ctx.fill();
      // 轮毂
      ctx.fillStyle = isIron ? '#c8d2dc' : '#e0b070';
      ctx.beginPath(); ctx.arc(0, 0, h * 0.26, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = isIron ? '#6b7683' : '#a8763e';
      ctx.beginPath(); ctx.arc(0, 0, h * 0.12, 0, Math.PI * 2); ctx.fill();
      // 外缘暗描边（圆柱侧壁感）
      ctx.strokeStyle = 'rgba(8,14,20,.85)';
      ctx.lineWidth = Math.max(2, size * 0.075);
      ctx.beginPath(); ctx.arc(0, 0, h * 0.97, 0, Math.PI * 2); ctx.stroke();
      // 内侧亮环（受光的圆柱内壁）
      ctx.strokeStyle = isIron ? 'rgba(255,255,255,.28)' : 'rgba(255,235,200,.30)';
      ctx.lineWidth = Math.max(1.2, size * 0.035);
      ctx.beginPath(); ctx.arc(0, 0, h * 0.82, 0, Math.PI * 2); ctx.stroke();
      // 高光弧
      ctx.strokeStyle = 'rgba(255,255,255,.32)';
      ctx.lineWidth = Math.max(1, size * 0.05);
      ctx.beginPath(); ctx.arc(0, 0, h * 0.6, -2.5, -0.9); ctx.stroke();

    } else if (def.energy) {
      /* ---------- 电池：电量条 ---------- */
      const pct = (def.__pct !== undefined) ? def.__pct : 1;
      ctx.fillStyle = '#4d7a2e';
      roundRect(-h * 0.56, -h * 0.76, size * 0.56, size * 0.78, 4); ctx.fill();
      ctx.fillStyle = '#e8f5c8';
      roundRect(-h * 0.48, -h * 0.68, size * 0.40, size * 0.62, 3); ctx.fill();
      // 电量
      const bh = size * 0.62 * Math.max(0, Math.min(1, pct));
      ctx.fillStyle = pct > 0.5 ? '#63d97e' : (pct > 0.2 ? '#ffd93d' : '#e0513c');
      ctx.fillRect(-h * 0.48, -h * 0.68 + (size * 0.62 - bh), size * 0.40, bh);
      // 正极
      ctx.fillStyle = '#9fb2c2';
      ctx.fillRect(-h * 0.2, -h * 0.86, size * 0.2, size * 0.1);
      // 闪电
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      ctx.beginPath();
      ctx.moveTo(-h * 0.02, -h * 0.5); ctx.lineTo(h * 0.22, -h * 0.1);
      ctx.lineTo(0, -h * 0.1); ctx.lineTo(h * 0.12, h * 0.3);
      ctx.lineTo(-h * 0.24, -h * 0.04); ctx.lineTo(-h * 0.02, -h * 0.04);
      ctx.closePath(); ctx.fill();

    } else if (def.motor) {
      /* ---------- 马达：机身 + 散热槽 + 出轴 ---------- */
      ctx.fillStyle = '#e06a4a';
      roundRect(-h * 0.72, -h * 0.48, size * 0.72, size * 0.52, 4); ctx.fill();
      ctx.fillStyle = '#b44a30';
      roundRect(-h * 0.72, h * 0.0, size * 0.72, size * 0.1, 2); ctx.fill();
      // 散热槽
      ctx.strokeStyle = 'rgba(60,20,12,.55)'; ctx.lineWidth = Math.max(1, size * 0.035);
      for (let k = 0; k < 3; k++) {
        const xx = -h * 0.55 + k * size * 0.16;
        ctx.beginPath(); ctx.moveTo(xx, -h * 0.36); ctx.lineTo(xx, -h * 0.08); ctx.stroke();
      }
      // 出轴
      ctx.fillStyle = '#5a6672';
      ctx.fillRect(h * 0.0, -h * 0.16, size * 0.2, size * 0.16);
      ctx.fillStyle = '#c8d2dc';
      ctx.beginPath(); ctx.arc(h * 0.22, -h * 0.08, size * 0.09, 0, Math.PI * 2); ctx.fill();
      // 描边
      ctx.strokeStyle = '#8d3b28'; ctx.lineWidth = 2;
      roundRect(-h * 0.72, -h * 0.48, size * 0.72, size * 0.52, 4); ctx.stroke();

    } else if (def.liftMass) {
      /* ---------- 气球：一束（个数由 n 决定，由调用方单独画徽标） ---------- */
      // 扎口绳
      ctx.strokeStyle = '#8a6a4a'; ctx.lineWidth = Math.max(1.2, size * 0.035);
      ctx.beginPath(); ctx.moveTo(0, h * 0.28); ctx.lineTo(0, h * 0.92); ctx.stroke();
      // 球体：底色 + 高光 + 描边
      const rg = ctx.createRadialGradient(-h * 0.22, -h * 0.32, size * 0.04, 0, -h * 0.1, size * 0.56);
      rg.addColorStop(0, '#f6b6c8');
      rg.addColorStop(0.55, def.color);
      rg.addColorStop(1, '#a8455f');
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.ellipse(0, -h * 0.1, size * 0.40, size * 0.46, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(90,30,45,.75)'; ctx.lineWidth = Math.max(1.2, size * 0.035);
      ctx.beginPath(); ctx.ellipse(0, -h * 0.1, size * 0.40, size * 0.46, 0, 0, Math.PI * 2); ctx.stroke();
      // 高光
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ctx.beginPath(); ctx.ellipse(-h * 0.18, -h * 0.34, size * 0.09, size * 0.14, -0.4, 0, Math.PI * 2); ctx.fill();
      // 扎口结
      ctx.fillStyle = '#8a4757';
      ctx.beginPath();
      ctx.moveTo(-size * 0.055, h * 0.28); ctx.lineTo(size * 0.055, h * 0.28); ctx.lineTo(0, h * 0.40);
      ctx.closePath(); ctx.fill();

    } else if (def.dropOne) {
      /* ---------- 沙袋：麻布口袋 + 缝线 + 束口 ---------- */
      const bg = ctx.createLinearGradient(0, -h * 0.6, 0, h * 0.8);
      bg.addColorStop(0, '#cbb083');
      bg.addColorStop(0.6, def.color);
      bg.addColorStop(1, '#8d7448');
      ctx.fillStyle = bg;
      // 袋身：下宽上窄的梯形（束口感）
      ctx.beginPath();
      ctx.moveTo(-h * 0.30, -h * 0.62);
      ctx.lineTo(h * 0.30, -h * 0.62);
      ctx.lineTo(h * 0.62, h * 0.34);
      ctx.quadraticCurveTo(h * 0.62, h * 0.78, 0, h * 0.78);
      ctx.quadraticCurveTo(-h * 0.62, h * 0.78, -h * 0.62, h * 0.34);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(74,56,28,.8)'; ctx.lineWidth = Math.max(1.2, size * 0.035); ctx.stroke();
      // 口子上的束带
      ctx.fillStyle = '#6b563a';
      roundRect(-h * 0.34, -h * 0.70, size * 0.34, size * 0.14, 3); ctx.fill();
      // 缝线
      ctx.strokeStyle = 'rgba(96,74,42,.55)'; ctx.lineWidth = Math.max(1, size * 0.022);
      ctx.beginPath();
      ctx.moveTo(-h * 0.34, h * 0.02); ctx.lineTo(h * 0.34, h * 0.02);
      ctx.moveTo(-h * 0.28, h * 0.34); ctx.lineTo(h * 0.28, h * 0.34);
      ctx.stroke();
      // 麻布高光
      ctx.fillStyle = 'rgba(255,244,214,.28)';
      ctx.beginPath(); ctx.ellipse(-h * 0.26, -h * 0.10, size * 0.11, size * 0.26, -0.2, 0, Math.PI * 2); ctx.fill();

    } else if (def.interactive) {
      /* ---------- 打气筒：筒身 + 活塞 + 压力表 + 出气管 ---------- */
      ctx.fillStyle = '#2f5e78';
      roundRect(-h * 0.34, -h * 0.46, size * 0.34, size * 0.6, 5); ctx.fill();
      // 筒身高光
      ctx.fillStyle = 'rgba(190,235,255,.5)';
      roundRect(-h * 0.28, -h * 0.4, size * 0.09, size * 0.48, 3); ctx.fill();
      // 活塞头
      ctx.fillStyle = def.color;
      roundRect(-h * 0.42, -h * 0.7, size * 0.5, size * 0.2, 5); ctx.fill();
      ctx.strokeStyle = '#1d3a4a'; ctx.lineWidth = Math.max(1.4, size * 0.045);
      roundRect(-h * 0.42, -h * 0.7, size * 0.5, size * 0.2, 5); ctx.stroke();
      // 压力表
      ctx.fillStyle = '#e8f4ff';
      ctx.beginPath(); ctx.arc(-h * 0.02, h * 0.18, size * 0.1, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#1d3a4a'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(-h * 0.02, h * 0.18); ctx.lineTo(-h * 0.02 + size * 0.06, h * 0.18 - size * 0.05); ctx.stroke();
      // 出气管
      ctx.fillStyle = '#8fb8cc';
      ctx.fillRect(-h * 0.02, h * 0.02, size * 0.36, size * 0.14);
      ctx.fillStyle = '#e8f4ff';
      ctx.beginPath(); ctx.arc(h * 0.36, h * 0.09, size * 0.085, 0, Math.PI * 2); ctx.fill();

    } else {
      ctx.fillStyle = def.color; roundRect(-h * 0.8, -h * 0.8, size * 0.8, size * 0.8, 3); ctx.fill();
    }
    ctx.restore();
  }

  function drawBuildCar() {
    const o = buildOrigin();
    const keys = Object.keys(state.build.cells);
    const at = (k) => ({
      x: o.x + (+k.split(',')[1]) * BUILD_PX + BUILD_PX / 2,
      y: o.y + (+k.split(',')[0]) * BUILD_PX + BUILD_PX / 2
    });
    // 先画所有零件（框是空的，能看到后面）
    keys.forEach(k => {
      const cell = state.build.cells[k];
      const p = at(k);
      {
        // 落下弹性：1.22 → 1.0（180ms）
        let sc = 1;
        const t0 = state.popped[k];
        if (t0) {
          const age = (performance.now() - t0) / 180;
          if (age < 1) sc = 1 + 0.22 * Math.sin(Math.PI * age) * (1 - age * 0.4);
          else delete state.popped[k];
        }
        drawPartShape(cell.part, p.x, p.y, BUILD_PX * sc, cell.dir,
          cell.part === 'wood_frame' ? 3 : undefined);
        /* 堆叠徽标：气球/沙袋同一格可以放 1–3 个，形状本身画不出"这里堆了几个"。
         * 用右下角的圆角数字，和托盘上的计数同一套视觉。 */
        const n = RAP.cellCount(cell);
        if (n > 1) drawStackBadge(p.x + BUILD_PX * 0.30, p.y + BUILD_PX * 0.30, n);
      }
    });
    // 方向件箭头：只在「选中该款零件」或「鼠标悬停在该格」时显示
    const hover = cellAt(state.mouse.x, state.mouse.y);
    keys.forEach(k => {
      const cell = state.build.cells[k];
      if (!RAP.isDirectional(cell.part)) return;
      const rc = k.split(',');
      const isHover = hover && hover.r === +rc[0] && hover.c === +rc[1];
      const isSelectedType = (state.selected === cell.part);   // 选了打气筒才显示所有打气筒
      if (!isHover && !isSelectedType) {
        // 只留一个很小的朝向点，不画箭头（保持"这里有方向件"的可读性）
        const p0 = at(k);
        const v0 = RAP.dirVec(cell.dir || 0);
        ctx.fillStyle = 'rgba(255,255,255,.5)';
        ctx.beginPath();
        ctx.arc(p0.x + v0[0] * BUILD_PX * 0.34, p0.y - v0[1] * BUILD_PX * 0.34, BUILD_PX * 0.07, 0, Math.PI * 2);
        ctx.fill();
        return;
      }
      const p = at(k);
      drawDirArrow(p.x, p.y, cell.dir || 0, BUILD_PX, RAP.PARTS[cell.part].color, isHover);
      state.arrowDrawN = (state.arrowDrawN || 0) + 1;   // 供测试统计"这一帧画了几个箭头"
      if (isHover) {
        const vv = RAP.dirVec(cell.dir || 0);
        const wd = { '1,0': '右', '-1,0': '左', '0,1': '上', '0,-1': '下' }[vv[0] + ',' + vv[1]] || '';
        text(wd, p.x + vv[0] * BUILD_PX * 0.8, p.y - vv[1] * BUILD_PX * 0.8 + 5, 14, '#ffffff', 'center', true);
      }
    });

    // 再画框里的内嵌件（小猪），放在框的内壁之上
    keys.forEach(k => {
      const cell = state.build.cells[k];
      if (!cell.inner) return;
      const p = at(k);
      drawPartShape(cell.inner, p.x, p.y, BUILD_PX * 0.62, 0);
    });
  }

  function drawTray() {
    let hoverIdx = -1;
    TRAY.forEach((part, i) => {
      if (hit(trayRect(i), state.mouse.x, state.mouse.y)) hoverIdx = i;
    });
    TRAY.forEach((part, i) => {
      const rect = trayRect(i);
      const left = part === 'eraser' ? 1 : RAP.budgetLeft(level(), part, state.build);
      const sel = state.selected === part;
      ctx.fillStyle = sel ? '#4a7aa8' : 'rgba(20,26,32,.82)';
      roundRect(rect.x, rect.y, rect.w, rect.h, 8); ctx.fill();
      if (sel) { ctx.strokeStyle = '#ffe08a'; ctx.lineWidth = 3; ctx.stroke(); }
      const cx = rect.x + rect.w / 2, cy = rect.y + rect.h / 2 - 4;
      if (part === 'eraser') {
        ctx.fillStyle = '#dde6ee'; roundRect(cx - 14, cy - 12, 28, 24, 4); ctx.fill();
      } else {
        drawPartShape(part, cx, cy, rect.w * 0.46, 0);
      }
      // 数量：用完的用暗红，但必须仍然看得清（原来是 #ff9c86，压在浅地面上对比只有 3.9）
      text(part === 'eraser' ? '' : String(left),
        rect.x + rect.w / 2, rect.y + rect.h + 14, 12,
        left > 0 || part === 'eraser' ? '#ffffff' : '#ffd0c4', 'center');
      // 悬停 / 选中 → 在槽上方显示零件名（"选了什么"必须一眼看到）
      if (i === hoverIdx || state.selected === part) {
        const nm = part === 'eraser' ? '橡皮' : RAP.PARTS[part].label;
        const w = Math.max(72, nm.length * 15 + 26);
        ctx.fillStyle = 'rgba(10,18,24,.92)';
        roundRect(rect.x + rect.w / 2 - w / 2, rect.y - 34, w, 26, 8); ctx.fill();
        text(nm, rect.x + rect.w / 2, rect.y - 16, 14, '#ffe9b0', 'center', true);
      }
    });
  }

  function drawButtons() {
    if (state.phase === 'build') {
      const L = btnRect('launch'), C = btnRect('clear'), U = btnRect('undo');
      const chk = RAP.canLaunch(state.build);
      const LC = { x: L.x + L.w / 2, y: L.y + L.h / 2 };
      const ready = chk.ok;
      // 右侧操作坞（出发 + 零件说明）：统一底板，避免两个浮空按钮各飞各的
      ctx.fillStyle = 'rgba(8,18,26,.55)';
      roundRect(L.x - 14, L.y - 10, 104, 166, 18); ctx.fill();
      ctx.strokeStyle = 'rgba(232,200,122,.24)'; ctx.lineWidth = 1.5; ctx.stroke();
      // 出发：对勾圆钮（未就绪变灰；就绪时外圈呼吸）
      ctx.fillStyle = ready ? '#4a9be0' : 'rgba(90,104,116,.85)';
      ctx.beginPath(); ctx.arc(LC.x, LC.y, L.w / 2, 0, Math.PI * 2); ctx.fill();
      if (ready) {
        const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 300);
        ctx.strokeStyle = 'rgba(255,255,255,' + (0.22 + 0.33 * pulse).toFixed(3) + ')';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(LC.x, LC.y, L.w / 2 + 6 + pulse * 3, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 7; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(LC.x - 14, LC.y + 1); ctx.lineTo(LC.x - 4, LC.y + 11); ctx.lineTo(LC.x + 15, LC.y - 11);
      ctx.stroke();
      text('出发', LC.x, L.y + L.h + 20, 14, ready ? '#dff0ff' : '#93a3ae', 'center', true);

      // 左侧三个小圆钮（图标 + 右侧文字，装在同一个圆角坞里）
      const knob = (rect, drawIcon, label, active) => {
        const c = { x: rect.x + rect.w / 2, y: rect.y + rect.h / 2 };
        ctx.fillStyle = active ? 'rgba(74,123,168,.95)' : 'rgba(24,34,42,.9)';
        ctx.beginPath(); ctx.arc(c.x, c.y, rect.w / 2, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = active ? 'rgba(255,255,255,.55)' : 'rgba(150,170,185,.4)';
        ctx.lineWidth = 2; ctx.stroke();
        drawIcon(c);
        text(label, rect.x + rect.w + 8, c.y + 5, 12.5, active ? '#f0f8ff' : '#d4e2ee', 'left', true);
      };
      const RDOCK = btnRect('rotate');
      ctx.fillStyle = 'rgba(8,18,26,.55)';
      roundRect(C.x - 14, C.y - 14, 148, RDOCK.y + RDOCK.h + 14 - (C.y - 14), 18); ctx.fill();
      ctx.strokeStyle = 'rgba(232,200,122,.24)'; ctx.lineWidth = 1.5; ctx.stroke();
      knob(C, (c) => {
        ctx.fillStyle = '#dce6ee';
        ctx.fillRect(c.x - 8, c.y - 9, 16, 4);
        ctx.fillRect(c.x - 5, c.y - 12, 10, 4);
        ctx.fillRect(c.x - 7, c.y - 4, 14, 15);
      }, '清空 C', false);
      knob(U, (c) => {
        ctx.strokeStyle = '#dce6ee'; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.arc(c.x, c.y, 9, -0.4, 3.9); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(c.x + 9, c.y - 7); ctx.lineTo(c.x + 3, c.y - 12); ctx.lineTo(c.x + 2, c.y - 3);
        ctx.closePath(); ctx.fillStyle = '#dce6ee'; ctx.fill();
      }, '撤销 Z', false);
      const Rr = btnRect('rotate');
      const hc = cellAt(state.mouse.x, state.mouse.y);
      const canRot = !!(hc && state.build.cells[hc.r + ',' + hc.c] &&
        RAP.isDirectional(state.build.cells[hc.r + ',' + hc.c].part));
      knob(Rr, (c) => {
        ctx.strokeStyle = canRot ? '#ffe9b0' : '#dce6ee'; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.arc(c.x, c.y, 9, 0.6, 5.2); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(c.x + 8, c.y - 6); ctx.lineTo(c.x + 12, c.y + 1); ctx.lineTo(c.x + 4, c.y + 1);
        ctx.closePath(); ctx.fillStyle = canRot ? '#ffe9b0' : '#dce6ee'; ctx.fill();
      }, '换方向 R', canRot);
      const HB2 = btnRect('help');
      ctx.fillStyle = state.helpOpen ? 'rgba(74,123,168,.95)' : 'rgba(24,34,42,.85)';
      roundRect(HB2.x, HB2.y, HB2.w, HB2.h, 10); ctx.fill();
      ctx.strokeStyle = 'rgba(232,200,122,.6)'; ctx.lineWidth = 1.5; ctx.stroke();
      text('? 零件说明', HB2.x + HB2.w / 2, HB2.y + 25, 13, '#ffe9b0', 'center', true);
    }

    if (state.phase === 'run' && state.run) {
      // 刹车钮（按住即刹）
      const BK = btnRect('brake');
      if (BK) {
        const on = state.run.car.braking;
        ctx.fillStyle = on ? '#e0513c' : 'rgba(24,34,42,.9)';
        roundRect(BK.x, BK.y, BK.w, BK.h, 15); ctx.fill();
        ctx.strokeStyle = on ? '#ffd9d0' : 'rgba(232,200,122,.65)';
        ctx.lineWidth = 2; ctx.stroke();
        text('刹', BK.x + BK.w / 2, BK.y + 44, 26, on ? '#fff' : '#ffe9b0', 'center', true);
        text('按住', BK.x + BK.w / 2, BK.y + 68, 11, on ? '#ffe0d8' : '#9fb2c2', 'center');
      }
      const groups = state.run.car.groups || [];
      const n = Math.min(3, groups.length);
      const x0 = DW / 2 - (n * 104) / 2;
      for (let i = 0; i < n; i++) {
        const g = groups[i];
        const rect = { x: x0 + i * 104, y: btnRect('interact').y, w: 92, h: 92 };
        // 按钮底色 = 这组零件的颜色（同色 = 同组，一按全启动）
        ctx.fillStyle = 'rgba(10,18,24,.55)'; roundRect(rect.x - 4, rect.y - 4, rect.w + 8, rect.h + 8, 18); ctx.fill();
        ctx.fillStyle = g.color; roundRect(rect.x, rect.y, rect.w, rect.h, 15); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 2; ctx.stroke();
        text(RAP.PARTS[g.part].label, rect.x + rect.w / 2, rect.y + 40, 14, '#10201a', 'center', true);
        text('×' + g.list.length, rect.x + rect.w / 2, rect.y + 62, 15, '#10201a', 'center', true);
        text(String(i + 1), rect.x + 10, rect.y + 18, 12, 'rgba(16,32,26,.75)', 'left');
      }
      // 重开在左上（drawHud 里的绿色圆钮），这里不再放重复按钮
    }
