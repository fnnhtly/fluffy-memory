      for (let i = 0; i < pts.length; i += 6) {
        const wx = pts[i][0];
        const h1 = Math.abs(Math.sin(wx * 12.9898) * 43758.5453) % 1;
        const h2 = Math.abs(Math.sin(wx * 39.346) * 24634.6345) % 1;
        if (h1 > 0.30) continue;
        const px = toX(wx);
        const surfY = toY(pts[i][1]);
        const depth = (18 + h2 * 90) * cam.zoom;      // 地表以下 18~108 px
        const py = surfY + depth;
        if (py > DH + VIEW_OFF_Y || py < surfY + 8 * cam.zoom) continue;
        const r2 = (2.5 + h2 * 4) * cam.zoom;
        ctx.beginPath();
        ctx.ellipse(px, py, r2 * 1.3, r2 * 0.8, h1 * 3, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(186,200,210,.22)'; ctx.fill();
        ctx.beginPath();
        ctx.ellipse(px - r2 * 0.25, py - r2 * 0.24, r2 * 0.55, r2 * 0.34, h1 * 3, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,.16)'; ctx.fill();
      }
    }

    // 零星草叶
    ctx.save();
    ctx.strokeStyle = '#5faa42'; ctx.lineWidth = 2.2 * cam.zoom; ctx.lineCap = 'round';
    for (let i = 0; i < pts.length; i += 5) {
      const wx = pts[i][0];
      const hh = texHash(Math.floor(wx * 3), 17);
      if (hh > 0.55) continue;
      const x = toX(wx), y = toY(pts[i][1]) - 2 * cam.zoom;
      const len = (5 + hh * 10) * cam.zoom;
      const lean = (texHash(Math.floor(wx * 5), 31) - 0.5) * 6 * cam.zoom;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + lean, y - len * 0.6, x + lean * 1.6, y - len);
      ctx.stroke();
    }
    ctx.restore();

    // 冰面
    ctx.save();
    for (let i = 0; i < pts.length; i++) {
      if (ter.material[Math.max(0, Math.min(ter.cols - 1, Math.floor(pts[i][0])))] !== 'ice') continue;
      const x0 = toX(pts[i][0]);
      const wpx = stepW * s + 1.5;
      ctx.fillStyle = 'rgba(176,232,246,.92)';
      ctx.fillRect(x0 - wpx / 2, toY(pts[i][1]) - 1 * cam.zoom, wpx, 7 * cam.zoom);
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ctx.fillRect(x0 - wpx / 2, toY(pts[i][1]) - 1 * cam.zoom, wpx, 2 * cam.zoom);
    }
    ctx.restore();

  }

  function drawGrid() {
    if (state.phase !== 'build') return;
    const o = buildOrigin();
    const PX = o.px;                       // 一格边长 = PPM × zoom（1 格 = 1 米）
    const GW = RAP.BUILD_COLS * PX, GH = RAP.BUILD_ROWS * PX;
    const HD = Math.max(20, PX * 0.55);    // 面板标题栏高度，跟着格子缩
    // 建造台：一块"工程图板"，标题栏 + 细网格线，比原来的橄榄绿玻璃砖干净
    ctx.fillStyle = 'rgba(8,20,28,.58)';
    roundRect(o.x - 12, o.y - HD - 8, GW + 24, GH + HD + 14, 14); ctx.fill();
    ctx.strokeStyle = 'rgba(232,200,122,.42)'; ctx.lineWidth = 2; ctx.stroke();
    // 标题栏
    ctx.fillStyle = 'rgba(16,30,40,.72)';
    roundRect(o.x - 12, o.y - HD - 8, GW + 24, HD, 14); ctx.fill();
    ctx.fillStyle = 'rgba(232,200,122,.30)';
    ctx.fillRect(o.x - 12, o.y - 8, GW + 24, 1.5);
    text('拼装区', o.x - 2, o.y - HD + 10, 12.5, 'rgba(255,233,176,.85)', 'left', true);
    text(RAP.BUILD_COLS + ' × ' + RAP.BUILD_ROWS, o.x + GW + 2, o.y - HD + 10, 11.5,
      'rgba(196,218,236,.72)', 'right', true);
    // 棋盘染色（很淡，只做可读性）
    for (let r = 0; r < RAP.BUILD_ROWS; r++) {
      for (let c = 0; c < RAP.BUILD_COLS; c++) {
        if ((r + c) % 2) continue;
        ctx.fillStyle = 'rgba(255,255,255,.028)';
        ctx.fillRect(o.x + c * PX, o.y + r * PX, PX, PX);
      }
    }
    // 网格线
    ctx.strokeStyle = 'rgba(150,200,235,.15)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let c = 0; c <= RAP.BUILD_COLS; c++) {
      const x = Math.round(o.x + c * PX) + 0.5;
      ctx.moveTo(x, o.y); ctx.lineTo(x, o.y + GH);
    }
    for (let r = 0; r <= RAP.BUILD_ROWS; r++) {
      const y = Math.round(o.y + r * PX) + 0.5;
      ctx.moveTo(o.x, y); ctx.lineTo(o.x + GW, y);
    }
    ctx.stroke();
    // 四角括角，强化"工作区"的框定感
    ctx.strokeStyle = 'rgba(232,200,122,.55)'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    const CK = Math.max(6, PX * 0.27);
    [[o.x, o.y, 1, 1], [o.x + GW, o.y, -1, 1], [o.x, o.y + GH, 1, -1], [o.x + GW, o.y + GH, -1, -1]]
      .forEach(([x, y, sx, sy]) => {
        ctx.beginPath();
        ctx.moveTo(x + sx * CK, y); ctx.lineTo(x, y); ctx.lineTo(x, y + sy * CK);
        ctx.stroke();
      });
    // 拖拽吸附：按住拖动时，光标能落到的格子亮绿（能放）/ 亮红（放不下）
    if (state.mouse.down && (state.dragPart || state.selected !== 'eraser')) {
      const want = state.dragMove ? state.dragMove.part : (state.dragPart || state.selected);
      const cell = cellAt(state.mouse.x, state.mouse.y);
      if (cell && want && want !== 'eraser') {
        let okHere = true;
        if (state.dragMove) okHere = !state.build.cells[cell.r + ',' + cell.c] ||
          (cell.r === state.dragMove.r && cell.c === state.dragMove.c);
        else {
          // 纯检查，不改数据（用 tryPlace 会每帧推进方向，导致"一直旋转"）
          okHere = RAP.canPlace(level(), state.build, want, cell.r, cell.c).ok;
        }
        const cx0 = o.x + cell.c * PX, cy0 = o.y + cell.r * PX;
        ctx.fillStyle = okHere ? 'rgba(99,217,126,.28)' : 'rgba(224,81,60,.28)';
        roundRect(cx0 + 2, cy0 + 2, PX - 4, PX - 4, 6); ctx.fill();
        ctx.strokeStyle = okHere ? 'rgba(150,240,170,.9)' : 'rgba(255,150,130,.9)';
        ctx.lineWidth = 2.5;
        roundRect(cx0 + 2, cy0 + 2, PX - 4, PX - 4, 6); ctx.stroke();
      } else if (state.dragMove) {
        /* 拖动中但光标已经出了网格 → 提前说"松手就卸下"。
         *
         * 不加这一句的话，玩家把零件拖到网格边上时看到的是一片没有任何反馈的
         * 空地，而松手的后果（零件从车上卸下来）是**不可撤销**的（只能再放回去）。
         * 提示紧贴光标，因为这时候玩家的视线就在光标上。 */
        const nm = RAP.PARTS[state.dragMove.part] ? RAP.PARTS[state.dragMove.part].label : '';
        const txt = '松手卸下' + (nm ? ' ' + nm : '') +
          (state.dragMove.n > 1 ? ' ×' + state.dragMove.n : '');
        const tw = txt.length * 13 + 26;
        const bx2 = Math.max(6, Math.min(DW - tw - 6, state.mouse.x + 18));
        const by2 = Math.max(6, state.mouse.y - 40);
        ctx.fillStyle = 'rgba(16,30,40,.95)';
        roundRect(bx2, by2, tw, 26, 8); ctx.fill();
        ctx.strokeStyle = 'rgba(232,200,122,.6)'; ctx.lineWidth = 1.5;
        roundRect(bx2, by2, tw, 26, 8); ctx.stroke();
        text(txt, bx2 + tw / 2, by2 + 17, 12.5, '#ffe9b0', 'center', true);
      }
    }

    // 悬停高亮 + 幽灵零件
    const cell = cellAt(state.mouse.x, state.mouse.y);
    if (cell) {
      if (state.selected === 'eraser') {
        ctx.fillStyle = 'rgba(224,81,60,.28)';
        roundRect(o.x + cell.c * PX + 2, o.y + cell.r * PX + 2, PX - 4, PX - 4, 6);
        ctx.fill();
      }
      ctx.strokeStyle = 'rgba(255,235,140,.95)'; ctx.lineWidth = 3;
      roundRect(o.x + cell.c * PX + 2, o.y + cell.r * PX + 2, PX - 4, PX - 4, 6); ctx.stroke();
    }
    // 当前选中零件放不下的格子 → 红叉提示
    if (cell && !state.build.cells[cell.r + ',' + cell.c] && state.selected !== 'eraser') {
      // 纯检查，不改数据
      const probe = RAP.canPlace(level(), state.build, state.selected, cell.r, cell.c);
      if (!probe.ok) {
        const cx0 = o.x + cell.c * PX + PX / 2;
        const cy0 = o.y + cell.r * PX + PX / 2;
        ctx.strokeStyle = 'rgba(224,81,60,.85)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
        const s2 = PX * 0.2;
        ctx.beginPath();
        ctx.moveTo(cx0 - s2, cy0 - s2); ctx.lineTo(cx0 + s2, cy0 + s2);
        ctx.moveTo(cx0 + s2, cy0 - s2); ctx.lineTo(cx0 - s2, cy0 + s2);
        ctx.stroke();
      }
    }

    const ghost = state.dragPart || (state.selected !== 'eraser' ? state.selected : null);
    if (state.mouse.down && (!ghost || ghost === 'eraser')) {
      // 橡皮的幽灵：一块白色橡皮 + 斜线，提示"点这里删掉"
      ctx.save();
      ctx.globalAlpha = 0.7;
      ctx.fillStyle = '#e6ecf2';
      roundRect(state.mouse.x - PX * 0.36, state.mouse.y - PX * 0.26,
        PX * 0.72, PX * 0.52, 6); ctx.fill();
      ctx.strokeStyle = '#e0513c'; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(state.mouse.x - PX * 0.2, state.mouse.y - PX * 0.1);
      ctx.lineTo(state.mouse.x + PX * 0.2, state.mouse.y + PX * 0.1);
      ctx.stroke();
      ctx.restore();
    } else if (ghost && state.mouse.down) {
      ctx.globalAlpha = 0.55;
      drawPartShape(ghost, state.mouse.x, state.mouse.y, PX * 0.84, 0);
      ctx.globalAlpha = 1;
      // 跟着光标显示零件名 —— 拖的时候也知道手里是什么
      if (RAP.PARTS[ghost]) {
        const nm = RAP.PARTS[ghost].label;
        const w = nm.length * 15 + 22;
        ctx.fillStyle = 'rgba(10,18,24,.92)';
        roundRect(state.mouse.x + 18, state.mouse.y - 34, w, 24, 7); ctx.fill();
        text(nm, state.mouse.x + 18 + w / 2, state.mouse.y - 17, 13, '#ffe9b0', 'center', true);
      }
    }
  }

  // 画"喷气/推进方向"箭头：从格心朝 dir 方向
  function drawDirArrow(cx, cy, dir, size, color, glow) {
    const v = RAP.dirVec(dir);
    const len = size * 1.05;                     // 明显伸出格子外
    const startD = size * 0.42;                  // 从格子边缘起，不压住零件
    const sx0 = cx + v[0] * startD, sy0 = cy - v[1] * startD;
    const tailX = sx0 - v[0] * size * 0.1, tailY = sy0 + v[1] * size * 0.1;
    const tipX = cx + v[0] * len, tipY = cy - v[1] * len;
    const head = size * 0.34;
    const col = color || '#E8C87A';
    ctx.save();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    // 尾部喷气短线（表示"从这里喷出去"）
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = glow ? 6 : 5;
    for (const side of [-1, 0, 1]) {
      const px = v[0] === 0 ? side * size * 0.12 : 0;
      const py = v[1] === 0 ? side * size * 0.12 : 0;
      ctx.beginPath();
      ctx.moveTo(tailX - v[0] * size * 0.02 + px, tailY + v[1] * size * 0.02 + py);
      ctx.lineTo(tailX - v[0] * size * 0.16 + px, tailY + v[1] * size * 0.16 + py);
      ctx.stroke();
    }

    // 箭杆：深色打底 → 白边 → 本体色（三种背景都看得清）
    ctx.strokeStyle = 'rgba(16,26,20,.9)'; ctx.lineWidth = glow ? 13 : 11;
    ctx.beginPath(); ctx.moveTo(sx0, sy0); ctx.lineTo(tipX, tipY); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = glow ? 9 : 7;
    ctx.beginPath(); ctx.moveTo(sx0, sy0); ctx.lineTo(tipX, tipY); ctx.stroke();
    ctx.strokeStyle = col; ctx.lineWidth = glow ? 6 : 5;
    ctx.beginPath(); ctx.moveTo(sx0, sy0); ctx.lineTo(tipX, tipY); ctx.stroke();

    // 实心三角箭头
    const ang = Math.atan2(-(tipY - cy), tipX - cx);
    const p1 = [tipX + Math.cos(ang) * head, tipY - Math.sin(ang) * head];
    const p2 = [tipX + Math.cos(ang + 2.5) * head, tipY - Math.sin(ang + 2.5) * head];
    const p3 = [tipX + Math.cos(ang - 2.5) * head, tipY - Math.sin(ang - 2.5) * head];
    ctx.beginPath();
    ctx.moveTo(tipX, tipY); ctx.lineTo(p2[0], p2[1]); ctx.lineTo(p3[0], p3[1]);
    ctx.closePath();
    ctx.fillStyle = col; ctx.fill();
    ctx.strokeStyle = 'rgba(16,26,20,.85)'; ctx.lineWidth = 3; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.restore();
  }

  // mood: 'normal' | 'happy' | 'scared' | 'hurt' | 'dizzy' | 'dead'
  function drawPig(cx, cy, r, angle, mood, extra) {
    mood = mood || 'normal';
    extra = extra || {};
    const tNow = performance.now() / 1000;
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(angle || 0);
    // 受击抖动
    if (extra.shake) {
      ctx.translate(Math.sin(tNow * 70) * r * 0.08, Math.cos(tNow * 63) * r * 0.06);
    }

    // 耳朵（随速度摆动）
    const earSwing = Math.sin(tNow * 3.2) * (extra.earSwing || 0) * r * 0.1;
    ctx.fillStyle = '#5fae4c';
    for (const sx of [-1, 1]) {
      ctx.save();
      ctx.translate(sx * r * 0.58, -r * 0.8 + earSwing * sx);
      ctx.rotate(sx * 0.12 + earSwing * 0.4);
      ctx.beginPath(); ctx.ellipse(0, 0, r * 0.27, r * 0.31, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#a8dd94';
      ctx.beginPath(); ctx.ellipse(0, r * 0.04, r * 0.14, r * 0.16, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#5fae4c';
      ctx.restore();
    }

    // 头
    ctx.fillStyle = COL.pig;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    // 头顶高光（体积感）
    ctx.fillStyle = 'rgba(255,255,255,.16)';
    ctx.beginPath(); ctx.ellipse(-r * 0.2, -r * 0.45, r * 0.5, r * 0.28, -0.3, 0, Math.PI * 2); ctx.fill();
    // 腮红
    ctx.fillStyle = 'rgba(232,120,120,.32)';
    for (const sx of [-1, 1]) {
      ctx.beginPath(); ctx.ellipse(sx * r * 0.6, r * 0.2, r * 0.2, r * 0.13, 0, 0, Math.PI * 2); ctx.fill();
    }

    // ---- 眼睛（表情主体）----
    const eyeY = -r * 0.14;
    const EX = [-r * 0.34, r * 0.34];
    ctx.lineCap = 'round';
    if (mood === 'dead') {
      // × 眼 + 小舌头
      ctx.strokeStyle = '#1d2b1a'; ctx.lineWidth = Math.max(2, r * 0.12);
      for (const ex of EX) {
        ctx.beginPath();
        ctx.moveTo(ex - r * 0.15, eyeY - r * 0.15); ctx.lineTo(ex + r * 0.15, eyeY + r * 0.15);
        ctx.moveTo(ex + r * 0.15, eyeY - r * 0.15); ctx.lineTo(ex - r * 0.15, eyeY + r * 0.15);
        ctx.stroke();
      }
    } else if (mood === 'hurt' || mood === 'dizzy') {
      // >< 眼
      ctx.strokeStyle = '#1d2b1a'; ctx.lineWidth = Math.max(2, r * 0.11);
      for (const [i, ex] of EX.entries()) {
        const dir = i === 0 ? 1 : -1;
        ctx.beginPath();
        ctx.moveTo(ex - dir * r * 0.15, eyeY - r * 0.14);
        ctx.lineTo(ex + dir * r * 0.12, eyeY);
        ctx.lineTo(ex - dir * r * 0.15, eyeY + r * 0.14);
        ctx.stroke();
      }
      // 眩晕星星
      if (mood === 'dizzy') {
        for (let k = 0; k < 3; k++) {
          const a2 = tNow * 3 + k * 2.1;
          const sx2 = Math.cos(a2) * r * 0.55, sy2 = -r * 1.15 + Math.sin(a2) * r * 0.16;
          ctx.fillStyle = '#ffd93d';
          ctx.beginPath();
          for (let q = 0; q < 10; q++) {
            const ang = -Math.PI / 2 + q * Math.PI / 5;
            const rad = (q % 2 === 0) ? r * 0.16 : r * 0.07;
            const px2 = sx2 + Math.cos(ang) * rad, py2 = sy2 + Math.sin(ang) * rad;
            q === 0 ? ctx.moveTo(px2, py2) : ctx.lineTo(px2, py2);
          }
          ctx.closePath(); ctx.fill();
        }
      }
    } else if (mood === 'scared') {
      // 大眼 + 小瞳孔 + 眉毛
      for (const ex of EX) {
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(ex, eyeY, r * 0.19, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#1d2b1a';
        ctx.beginPath(); ctx.arc(ex, eyeY - r * 0.02, r * 0.085, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.9)';
        ctx.beginPath(); ctx.arc(ex + r * 0.03, eyeY - r * 0.07, r * 0.03, 0, Math.PI * 2); ctx.fill();
      }
      ctx.strokeStyle = '#1d2b1a'; ctx.lineWidth = Math.max(1.6, r * 0.07);
      for (const [i, ex] of EX.entries()) {
        const dir = i === 0 ? 1 : -1;
        ctx.beginPath();
        ctx.moveTo(ex - dir * r * 0.2, eyeY - r * 0.3);
        ctx.lineTo(ex + dir * r * 0.16, eyeY - r * 0.24);
        ctx.stroke();
      }
    } else if (mood === 'happy') {
      // ^ ^ 眼 + 张嘴笑
      ctx.strokeStyle = '#1d2b1a'; ctx.lineWidth = Math.max(2, r * 0.11);
      for (const ex of EX) {
        ctx.beginPath();
        ctx.arc(ex, eyeY + r * 0.06, r * 0.15, Math.PI * 1.15, Math.PI * 1.85);
        ctx.stroke();
      }
    } else {
      // normal：圆眼 + 眨眼
      const blink = (tNow % 3.6) > 3.45;
      ctx.fillStyle = '#1d2b1a';
      if (blink) {
        for (const ex of EX) {
          ctx.fillRect(ex - r * 0.14, eyeY - r * 0.02, r * 0.28, r * 0.07);
        }
      } else {
        for (const ex of EX) {
          ctx.beginPath(); ctx.arc(ex, eyeY, r * 0.135, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = 'rgba(255,255,255,.9)';
        for (const ex of EX) {
          ctx.beginPath(); ctx.arc(ex + r * 0.05, eyeY - r * 0.05, r * 0.045, 0, Math.PI * 2); ctx.fill();
        }
      }
    }

    // ---- 嘴 / 鼻 ----
    ctx.fillStyle = '#8fd07a';
    ctx.beginPath(); ctx.ellipse(0, r * 0.3, r * 0.32, r * 0.23, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#4d7a44';
    for (const sx of [-1, 1]) {
      ctx.beginPath(); ctx.arc(sx * r * 0.11, r * 0.3, r * 0.065, 0, Math.PI * 2); ctx.fill();
    }
    // 张开的嘴（开心/惊恐）
    if (mood === 'happy' || mood === 'scared') {
      ctx.fillStyle = '#7a3b3b';
      ctx.beginPath();
      ctx.ellipse(0, r * 0.62, r * 0.2, r * 0.14, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  /* 堆叠徽标：同一格放了 n 个（气球/沙袋）时，右下角一个小圆角数字。
   * 只用形状画是分不出"1 个气球"和"3 个气球"的，而这两个的浮力差 2.4 倍。 */
  function drawStackBadge(x, y, n) {
    const r = 11;
    ctx.save();
    ctx.fillStyle = 'rgba(12,20,26,.92)';
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(232,200,122,.85)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#f4e2b0';
    ctx.font = 'bold 13px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('×' + n, x, y + 0.5);
    ctx.restore();
  }

  /* ══════════ 结构件的"焊接"边（第 69 轮，用户要求）══════════
   *
   * 用户原话：「我想让车上的零件都连起来，比如两个木框的两边粘连起来，
   * 不会在下坡时各自转动」。
   *
   * 先量清楚（tools/probe_part_rotation.js / probe_seam_width.js）：
   *   · 行驶期三块木框相对车身的角度**恒为 0**，car.a 从 -17° 转到 -25° 时
   *     它们一起转 —— 车**本来就是刚体**，没有"各自转动"这回事；
   *   · 但两块木框接缝处的木色横带是 **0.451 格宽**，而单块边框只有 0.225 格。
   *     正好是 A 的右边框 + B 的左边框**并排成一道墙**。
   *
   * 眼睛看到那道双倍厚的隔断，就把它读成"两个独立的箱子贴在一起"；
   * 车一倾斜，这条粗墙跟着转，于是更像"各自在转"。
   *
   * 修法：相邻的两个结构件**共用一面墙**——只由其中一方画，另一方跳过。
   * 谁画按 (行, 列) 字典序决定：小的那个画。这样
   *   · 一条共享边恰好被画一次（不会两条、也不会零条）；
   *   · 结果与遍历顺序无关（不能靠"先画谁"来决定，那是隐式状态）。
   *
   * 返回本地坐标系下的四条边：true = 这一侧要画墙。null = 整块四边都画。
   *
   * 为什么按"本地"返回：drawPartShape 里的 ctx 已经按 dir 旋转过了，
   * 而相邻关系是**网格**里的事 —— 两者差一个 −dir·90° 的旋转。
   * 这个换算只写在这里一份，别在绘制里再算一遍。
   */
  const WELD_GRID = [[0, 1], [1, 0], [0, -1], [-1, 0]];   // 右 / 下 / 左 / 上（行增大向下）
  const WELD_NAMES = ['right', 'down', 'left', 'up'];
  function weldedEdges(hasStruct, r, c, dir) {
    if (r === undefined || r === null || c === undefined || c === null) return null;
    if (!hasStruct(r, c)) return null;
    const d = ((dir || 0) % 4 + 4) % 4;
    const out = { right: true, down: true, left: true, up: true };
    for (let g = 0; g < 4; g++) {
      const nr = r + WELD_GRID[g][0], nc = c + WELD_GRID[g][1];
      if (!hasStruct(nr, nc)) continue;
      /* 谁负责这面共享墙：(行,列) 字典序小的那个。
       * 用坐标而不是"遍历顺序"来决定，是因为遍历顺序会随 build.order 变，
       * 同一辆车在建造期和行驶期可能画出不同的缝。 */
      const mine = (r < nr) || (r === nr && c < nc);
      if (!mine) continue;
      const local = ((g - d) % 4 + 4) % 4;
      out[WELD_NAMES[local]] = true;
    }
    /* 邻居存在但我不是"负责方"→ 那一条不画。上面只把要画的设成 true，
     * 所以这里要把"邻居存在且不由我画"的边显式关掉。 */
    for (let g = 0; g < 4; g++) {
      const nr = r + WELD_GRID[g][0], nc = c + WELD_GRID[g][1];
      if (!hasStruct(nr, nc)) continue;
      const mine = (r < nr) || (r === nr && c < nc);
      if (mine) continue;
      const local = ((g - d) % 4 + 4) % 4;
      out[WELD_NAMES[local]] = false;
    }
    return out;
  }
  /* 建造期的 hasStruct：从 state.build.cells 现查 */
  function buildHasStruct(r, c) {
    const cell = state.build.cells[r + ',' + c];
    if (!cell) return false;
    const d = RAP.PARTS[cell.part];
    return !!(d && d.structure);
  }

  /* 行驶期的 hasStruct：从**这一局的车**里查（不是 state.build ——
   * 车出发后 build 可能已经被改过，或者框已经碎了）。
   * 用零件的 (r, c) 当网格坐标，和建造期完全一致。 */
  function runHasStruct(r, c) {
    const car = state.run && state.run.car;
    if (!car) return false;
    return (car.parts || []).some(p =>
      p.r === r && p.c === c && p.def && p.def.structure);
  }

  function drawPartShape(part, cx, cy, size, dir, hp, spin, pct, edges) {
    const def = RAP.PARTS[part];
    if (!def) {
      ctx.fillStyle = 'rgba(230,236,242,.9)';
      roundRect(cx - size / 2, cy - size / 2, size, size, 4); ctx.fill();
      return;
    }
    const h = size / 2;
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate((dir || 0) * Math.PI / 2);
    /* 零件底下的**方块投影已经删掉**（用户原话：「你的机关会带黑底方块希望修改一下」）。
     *
     * 原来这里是：在零件后下方偏移 6%/8%，画一个 roundRect 铺满 0.94 格、深色 #0a1016、
     * alpha 0.22 —— 目的是"离地感"。但方框本身是**空心**的（四条边），
     * 而投影是**实心一整格**，于是玩家看到的是：一个中空的木框，
     * 底下压着一块比框还大的黑方砖。那不是阴影，那是零件自带的底板。
     *
     * 修法不是把它调淡（0.22 → 0.10 依然是"黑底方块"，只是更浅），
     * 而是**让投影跟着真实轮廓走**：只有轮子有圆形投影（它确实是圆的），
     * 结构件不再画投影 —— 中空的东西不该投出一块实心的影子。
     */
    if (def.wheel) {
      ctx.save();
      ctx.globalAlpha = 0.18;
      ctx.fillStyle = '#0a1016';
      ctx.beginPath(); ctx.arc(size * 0.05, size * 0.06, h * 0.98, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    if (def.structure) {
      /* ---------- 结构框：木框 / 岩框 ----------
       * 岩框（璃月岩造物）走同一套拓扑，但换材质与配色：
       * 灰绿石色、更厚的边、并有凿痕。玩家必须**一眼分出哪个更结实**，
       * 因为两者只差耐久（3 vs 9）和质量（1.2 vs 2.4）——
       * 画得一样的话，那组取舍就只剩数值了。
       *
       * 第 69 轮：四条边**可以分别关掉**（见 weldedEdges）。
       * 关掉的是"和邻居共享的那一面墙" —— 由邻居负责画。
       * 不这么做的话，两块并排木框的接缝是两条边框叠加，
       * 实测 0.451 格厚（单块只有 0.225），眼睛读成"两个箱子"。
       * 用户那句「不会在下坡时各自转动」，说的就是这个观感。 */
      const E = edges || { right: true, down: true, left: true, up: true };
      const isStone = (def.hp || 0) >= 6;
      const bw = size * (isStone ? 0.26 : 0.22);
      /* 每条边画成一个矩形。共享边直接跳过 —— 不是画淡，是**不画**：
       * 画淡了还剩一条浅缝，那仍然在说"这里是两块"。 */
      if (isStone) {
        ctx.fillStyle = '#8b9288';
        if (E.up) ctx.fillRect(-h, -h, size, bw);
        if (E.left) ctx.fillRect(-h, -h, bw, size);
        ctx.fillStyle = '#6e7568';
        if (E.down) ctx.fillRect(-h, h - bw, size, bw);
        if (E.right) ctx.fillRect(h - bw, -h, bw, size);
        // 凿痕（只在外露的边上刻，缝里不刻）
        ctx.strokeStyle = 'rgba(40,46,40,.5)'; ctx.lineWidth = Math.max(1, size * 0.03);
        ctx.beginPath();
        if (E.up || E.left) {
          ctx.moveTo(-h + bw * 0.4, -h + bw * 2.2); ctx.lineTo(-h + bw * 2.4, -h + bw * 0.5);
        }
        if (E.down || E.right) {
          ctx.moveTo(h - bw * 2.2, h - bw * 0.5); ctx.lineTo(h - bw * 0.5, h - bw * 2.2);
        }
        ctx.stroke();
      } else {
        // 四条边框（木色，带一点渐变感：上浅下深）
        ctx.fillStyle = '#c99354';
        if (E.up) ctx.fillRect(-h, -h, size, bw);
        if (E.left) ctx.fillRect(-h, -h, bw, size);
        ctx.fillStyle = '#b57f42';
        if (E.down) ctx.fillRect(-h, h - bw, size, bw);
        if (E.right) ctx.fillRect(h - bw, -h, bw, size);
      }
      // 木纹（同理，只画在外露的上下边上）
      ctx.strokeStyle = 'rgba(110,72,34,.45)'; ctx.lineWidth = Math.max(1, size * 0.032);
      ctx.beginPath();
      if (E.up) {
        ctx.moveTo(-h + bw, -h + bw * 0.45); ctx.lineTo(h - bw, -h + bw * 0.45);
      }
      if (E.down) {
        ctx.moveTo(-h + bw, h - bw * 0.45); ctx.lineTo(h - bw, h - bw * 0.45);
      }
      ctx.stroke();
      /* 内壁阴影：原来是一条闭合 strokeRect（四边都有）。
       * 共享边不该有内壁阴影 —— 那一侧根本没有"壁"，是通的。 */
      ctx.strokeStyle = 'rgba(58,38,18,.55)'; ctx.lineWidth = Math.max(2, size * 0.085);
      ctx.beginPath();
      if (E.up) { ctx.moveTo(-h + bw, -h + bw); ctx.lineTo(h - bw, -h + bw); }
      if (E.down) { ctx.moveTo(-h + bw, h - bw); ctx.lineTo(h - bw, h - bw); }
      if (E.left) { ctx.moveTo(-h + bw, -h + bw); ctx.lineTo(-h + bw, h - bw); }
      if (E.right) { ctx.moveTo(h - bw, -h + bw); ctx.lineTo(h - bw, h - bw); }
      ctx.stroke();
      ctx.strokeStyle = 'rgba(28,16,6,.45)'; ctx.lineWidth = Math.max(1, size * 0.04);
      ctx.beginPath();
      if (E.up) { ctx.moveTo(-h + bw * 1.25, -h + bw * 1.25); ctx.lineTo(h - bw * 1.25, -h + bw * 1.25); }
      if (E.down) { ctx.moveTo(-h + bw * 1.25, h - bw * 1.25); ctx.lineTo(h - bw * 1.25, h - bw * 1.25); }
      if (E.left) { ctx.moveTo(-h + bw * 1.25, -h + bw * 1.25); ctx.lineTo(-h + bw * 1.25, h - bw * 1.25); }
      if (E.right) { ctx.moveTo(h - bw * 1.25, -h + bw * 1.25); ctx.lineTo(h - bw * 1.25, h - bw * 1.25); }
      ctx.stroke();
      /* 铁角包边：只在**真正的角**上画 —— 两条相邻的边都外露时才是角。
       * 焊在一起的地方不是角，是接缝。 */
      const cn = size * 0.1;
      ctx.fillStyle = '#6f7a86';
      const corners = [
        [-1, -1, E.up, E.left], [1, -1, E.up, E.right],
        [-1, 1, E.down, E.left], [1, 1, E.down, E.right]
      ];
      for (const [sx, sy, e1, e2] of corners) {
        if (!e1 || !e2) continue;
        ctx.beginPath();
        ctx.moveTo(sx * h, sy * h);
        ctx.lineTo(sx * (h - cn * 2.2), sy * h);
        ctx.lineTo(sx * h, sy * (h - cn * 2.2));
        ctx.closePath(); ctx.fill();
      }
      // 外描边：逐边，跳过共享边
      ctx.strokeStyle = '#7a4f22'; ctx.lineWidth = Math.max(1.5, size * 0.055);
      ctx.beginPath();
      if (E.up) { ctx.moveTo(-h, -h); ctx.lineTo(h, -h); }
      if (E.down) { ctx.moveTo(-h, h); ctx.lineTo(h, h); }
      if (E.left) { ctx.moveTo(-h, -h); ctx.lineTo(-h, h); }
      if (E.right) { ctx.moveTo(h, -h); ctx.lineTo(h, h); }
      ctx.stroke();
      /* 挂点铆钉：画在"外露的左上角 / 右下角"内侧。
       * 那两个位置原来是固定的两点；现在只在对应两边都外露时才画。 */
      const rivets = [
        [-h + bw * 0.5, -h + bw * 0.5, E.up && E.left],
        [h - bw * 0.5, h - bw * 0.5, E.down && E.right]
      ];
      ctx.fillStyle = '#3c4650';
      for (const [dx, dy, on] of rivets) {
        if (!on) continue;
        ctx.beginPath(); ctx.arc(dx, dy, size * 0.045, 0, Math.PI * 2); ctx.fill();
      }
      // 阶段损坏：裂纹 / 破损
      const stage = (hp === undefined || hp === null) ? 3 : hp;
      if (stage <= 2) {
        ctx.strokeStyle = 'rgba(28,18,10,.8)'; ctx.lineWidth = Math.max(1.2, size * 0.035);
        ctx.beginPath();
        ctx.moveTo(-h + bw * 0.5, -h + bw * 0.5);
        ctx.lineTo(-h * 0.15, h * 0.05);
        ctx.lineTo(h * 0.2, -h * 0.2);
        ctx.stroke();
      }
      if (stage <= 1) {
        ctx.fillStyle = 'rgba(28,18,10,.32)';
        ctx.fillRect(-h, -h, size, size);
        ctx.strokeStyle = 'rgba(28,18,10,.85)'; ctx.lineWidth = Math.max(1.5, size * 0.04);
        ctx.beginPath();
        ctx.moveTo(h - bw, -h + bw); ctx.lineTo(h * 0.2, h * 0.15);
        ctx.stroke();
      }

    } else if (def.pig) {
      // 统一走 drawPig（带表情），这里只是缩小画在框里
      ctx.restore();
      drawPig(cx, cy, size * 0.34, (dir || 0) * Math.PI / 2, def.__mood || 'normal',
        { shake: def.__shake, earSwing: def.__earSwing || 0 });
      return;
    } else if (def.wheel) {
      /* ---------- 轮子：外胎 + 辐条（唯一允许自转的组件）---------- */
      if (spin) ctx.rotate(spin);
      const isIron = part === 'iron_wheel';
      ctx.fillStyle = '#1c2229';
      ctx.beginPath(); ctx.arc(0, 0, h, 0, Math.PI * 2); ctx.fill();
      // 轮圈
      ctx.fillStyle = isIron ? '#6b7683' : '#a8763e';
      ctx.beginPath(); ctx.arc(0, 0, h * 0.84, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = isIron ? '#8a95a2' : '#c08a4a';
      ctx.beginPath(); ctx.arc(0, 0, h * 0.72, 0, Math.PI * 2); ctx.fill();
      // 辐条：5 根（360/5=72°，避免与轮速形成 60° 周期频闪）
      ctx.strokeStyle = isIron ? '#4e5862' : '#7d5227';
      ctx.lineWidth = Math.max(1.2, size * 0.055);
      for (let k = 0; k < 5; k++) {
        const a = (k / 5) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * h * 0.2, Math.sin(a) * h * 0.2);
        ctx.lineTo(Math.cos(a) * h * 0.7, Math.sin(a) * h * 0.7);
        ctx.stroke();
      }
      // 偏心配重块：打破旋转对称，高速时也能看出在转
      ctx.fillStyle = isIron ? '#3f4852' : '#6b451f';
      ctx.beginPath();
      ctx.arc(h * 0.42, -h * 0.16, Math.max(1.6, size * 0.075), 0, Math.PI * 2);
      ctx.fill();
      // 单侧亮片：进一步强化"转起来"的视觉线索
      ctx.fillStyle = isIron ? 'rgba(220,232,244,.75)' : 'rgba(255,226,180,.8)';
      ctx.beginPath();
      ctx.arc(-h * 0.44, h * 0.3, Math.max(1.2, size * 0.055), 0, Math.PI * 2);
      ctx.fill();
      // 轮毂
      ctx.fillStyle = isIron ? '#c8d2dc' : '#e0b070';
      ctx.beginPath(); ctx.arc(0, 0, h * 0.26, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = isIron ? '#6b7683' : '#a8763e';
      ctx.beginPath(); ctx.arc(0, 0, h * 0.12, 0, Math.PI * 2); ctx.fill();
      // 外缘暗描边（圆柱侧壁感）
      ctx.strokeStyle = 'rgba(8,14,20,.85)';
      ctx.lineWidth = Math.max(2, size * 0.075);
      ctx.beginPath(); ctx.arc(0, 0, h * 0.97, 0, Math.PI * 2); ctx.stroke();
      // 内侧亮环（受光的圆柱内壁）
      ctx.strokeStyle = isIron ? 'rgba(255,255,255,.28)' : 'rgba(255,235,200,.30)';
      ctx.lineWidth = Math.max(1.2, size * 0.035);
      ctx.beginPath(); ctx.arc(0, 0, h * 0.82, 0, Math.PI * 2); ctx.stroke();
      // 高光弧
      ctx.strokeStyle = 'rgba(255,255,255,.32)';
      ctx.lineWidth = Math.max(1, size * 0.05);
      ctx.beginPath(); ctx.arc(0, 0, h * 0.6, -2.5, -0.9); ctx.stroke();

    } else if (def.energy) {
      /* ---------- 电池：电量条 ---------- */
      /* pct 由调用方传进来（函数第 8 个参数），默认 1。
       *
       * 原来是 `def.__pct !== undefined ? def.__pct : 1` —— 而 `__pct`
       * 在整份文件里**只被读过、从没被写过**，于是电池图标永远满格：
       * 马达没电了还是满的。1-3《电池够不够》的三星条件是「能量剩 ≥ 30」，
       * 也就是说这一关的注意力全在电量上，而车上的电量条是假的。
       * 探针（tools/probe_battery_icon.js）量到电量 112→0 时
       * 电池那块像素的绿像素数与纵向跨度和满电时**一模一样**。 */
      const pct0 = (pct !== undefined && pct !== null) ? pct : 1;
      const p1 = Math.max(0, Math.min(1, pct0));
      ctx.fillStyle = '#4d7a2e';
      roundRect(-h * 0.56, -h * 0.76, size * 0.56, size * 0.78, 4); ctx.fill();
      ctx.fillStyle = '#e8f5c8';
      roundRect(-h * 0.48, -h * 0.68, size * 0.40, size * 0.62, 3); ctx.fill();
      // 电量
      const bh = size * 0.62 * p1;
      ctx.fillStyle = p1 > 0.5 ? '#63d97e' : (p1 > 0.2 ? '#ffd93d' : '#e0513c');
      ctx.fillRect(-h * 0.48, -h * 0.68 + (size * 0.62 - bh), size * 0.40, bh);
      // 正极
      ctx.fillStyle = '#9fb2c2';
      ctx.fillRect(-h * 0.2, -h * 0.86, size * 0.2, size * 0.1);
      // 闪电
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      ctx.beginPath();
      ctx.moveTo(-h * 0.02, -h * 0.5); ctx.lineTo(h * 0.22, -h * 0.1);
      ctx.lineTo(0, -h * 0.1); ctx.lineTo(h * 0.12, h * 0.3);
      ctx.lineTo(-h * 0.24, -h * 0.04); ctx.lineTo(-h * 0.02, -h * 0.04);
      ctx.closePath(); ctx.fill();

    } else if (def.seedKind) {
      /* ---------- 种子（风 / 岩 / 雷）：一颗发光的晶体 ----------
       *
       * 第 71 轮重写。旧版是"动力源"，用点数的数量表示容量（岩种 5 点、风种 2 点）
       * —— 用户要求删掉动力容量，所以那些小点没有意义了。
       * 现在每颗种子用**形状 + 颜色 + 角标**表达三件不同的事：
       *
       *   形状：风种是菱形（气流）、岩种是六边形（结晶）、雷种是四角星（电）
       *   颜色：青 / 金 / 紫
       *   角标：一个小的效果图标（风纹 / 石纹 / 闪电），说明它**干什么**
       *
       * 三个种子是**完全不同**的机制（抬升 / 托高 / 冲刺），
       * 所以不能只靠颜色区分 —— 色盲玩家和缩略图尺寸下都会糊成一片。
       * 形状差异是这里唯一的可靠区分手段。 */
      const SK = def.seedKind;
      const isGeo = SK === 'geo', isElec = SK === 'electro';
      const glow = isGeo ? '#ffd77a' : (isElec ? '#c9a8ff' : '#8ff0dc');
      // 外发光
      ctx.save();
      ctx.globalAlpha = 0.30;
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(0, 0, h * 0.92, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      const R1 = h * (isGeo ? 0.60 : 0.54);
      ctx.beginPath();
      if (isElec) {
        /* 四角星：四个尖角，比菱形更"锐" —— 一眼和另外两个分开 */
        for (let k = 0; k < 8; k++) {
          const a = (k / 8) * Math.PI * 2 - Math.PI / 2;
          const rr = (k % 2 === 0) ? R1 : R1 * 0.42;
          const px2 = Math.cos(a) * rr, py2 = Math.sin(a) * rr;
          k === 0 ? ctx.moveTo(px2, py2) : ctx.lineTo(px2, py2);
        }
      } else if (isGeo) {
        for (let k = 0; k < 6; k++) {
          const a = (k / 6) * Math.PI * 2 - Math.PI / 2;
          const px2 = Math.cos(a) * R1, py2 = Math.sin(a) * R1;
          k === 0 ? ctx.moveTo(px2, py2) : ctx.lineTo(px2, py2);
        }
      } else {
        for (let k = 0; k < 4; k++) {          // 菱形
          const a = (k / 4) * Math.PI * 2 - Math.PI / 2;
          const px2 = Math.cos(a) * R1, py2 = Math.sin(a) * R1 * 0.86;
          k === 0 ? ctx.moveTo(px2, py2) : ctx.lineTo(px2, py2);
        }
      }
      ctx.closePath();
      const cg = ctx.createLinearGradient(-R1, -R1, R1, R1);
      cg.addColorStop(0, isGeo ? '#ffe9b0' : (isElec ? '#efe0ff' : '#c8f6ea'));
      cg.addColorStop(0.55, def.color);
      cg.addColorStop(1, isGeo ? '#a8762a' : (isElec ? '#6a3fa8' : '#2f8a78'));
      ctx.fillStyle = cg; ctx.fill();
      ctx.strokeStyle = isGeo ? 'rgba(110,74,20,.9)'
        : (isElec ? 'rgba(74,30,110,.9)' : 'rgba(20,74,66,.9)');
      ctx.lineWidth = Math.max(1.4, size * 0.045); ctx.stroke();
      // 内部亮核
      ctx.fillStyle = 'rgba(255,255,255,.72)';
      ctx.beginPath(); ctx.arc(-R1 * 0.18, -R1 * 0.22, R1 * 0.22, 0, Math.PI * 2); ctx.fill();
      /* 一次性角标：右下角一个"用掉就没了"的符号。
       * 旧版这里画的是容量点数（岩 5 点、风 2 点）—— 那是容量系统的痕迹。
       * 现在两个种子都是**一次性**的，所以角标改成"一圈断开的弧"，
       * 和 HUD 上"已用"的图标同一套视觉。 */
      ctx.strokeStyle = isGeo ? '#7a5a18' : (isElec ? '#5a2f88' : '#1f6a5c');
      ctx.lineWidth = Math.max(1.4, size * 0.05);
      ctx.beginPath();
      ctx.arc(0, h * 0.66, size * 0.10, -0.9 * Math.PI, 0.55 * Math.PI);
      ctx.stroke();

    } else if (def.catchesWind) {
      /* ---------- 伞 / 风之翼：会吃风的零件 ----------
       *
       * 它们只在风场里有意义，所以画成**张开的兜**：一眼看出"这东西吃风"。
       * 伞是半圆 + 一根柄；风之翼是两片后掠的翼面 + 一道骨架。
       * 两者的差别在**张开角度**（风之翼更平更宽 = 吃更多风），
       * 和数值上的 1.0 / 1.8 对得上。 */
      const isWing = def.catchesWind > 1.2;
      if (isWing) {
        ctx.fillStyle = def.color;
        for (const side of [-1, 1]) {
          ctx.beginPath();
          ctx.moveTo(0, -h * 0.10);
          ctx.quadraticCurveTo(side * h * 0.62, -h * 0.62, side * h * 0.98, -h * 0.06);
          ctx.quadraticCurveTo(side * h * 0.52, h * 0.10, 0, h * 0.24);
          ctx.closePath(); ctx.fill();
        }
        ctx.strokeStyle = 'rgba(30,74,96,.85)'; ctx.lineWidth = Math.max(1.2, size * 0.035);
        for (const side of [-1, 1]) {
          ctx.beginPath();
          ctx.moveTo(0, -h * 0.10);
          ctx.quadraticCurveTo(side * h * 0.62, -h * 0.62, side * h * 0.98, -h * 0.06);
          ctx.stroke();
        }
      } else {
        ctx.fillStyle = def.color;
        ctx.beginPath();
        ctx.moveTo(-h * 0.92, h * 0.06);
        ctx.quadraticCurveTo(0, -h * 0.94, h * 0.92, h * 0.06);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(120,74,20,.85)'; ctx.lineWidth = Math.max(1.2, size * 0.035);
        ctx.stroke();
        // 伞面的辐条
        ctx.strokeStyle = 'rgba(120,74,20,.45)'; ctx.lineWidth = Math.max(1, size * 0.026);
        for (let k = -1; k <= 1; k++) {
          ctx.beginPath();
          ctx.moveTo(0, h * 0.06);
          ctx.lineTo(k * h * 0.62, -h * 0.34);
          ctx.stroke();
        }
      }
      // 共同的柄 / 龙骨：从伞面中心一路顶到格子下沿（和驱动件同一条规矩 ——
      // 「零件都要连起来」，它必须接在下面那一格上）
      ctx.strokeStyle = isWing ? '#2f5a66' : '#8a5a28';
      ctx.lineWidth = Math.max(1.6, size * 0.05);
      ctx.beginPath();
      ctx.moveTo(0, h * 0.06); ctx.lineTo(0, h * 0.96);
      ctx.stroke();

    } else if (def.tool) {
      /* ---------- 驱动件（风车桨 / 喷气口） ----------
       * 这两个件必须一眼看出"它朝哪边出力"，所以画成**带叶片的轮**（风车桨）
       * 或**带口的喷管**（喷气口），箭头由 drawDirArrow 另外加。
       *
       * ⚠ 第 70 轮：叶片原来画到 h*0.78 ≈ 0.39 格，而格子只有一格 ——
       * 它和相邻的木框之间**留了 0.35 格的背景缝**（tools/probe_part_gaps.js 量的）。
       * 那正是用户说的「零件没有连起来」：风车桨看起来是浮在车顶上的一件东西。
       * 现在加一圈**安装座**：一个实心的深色底板，把零件和格子边连成一体。
       * 座子比叶片宽，所以视觉上"焊"在车上了，叶片仍然露在外面看得出朝哪边吹。 */
      /* 安装立杆 + 底座横梁：把驱动件"焊"在下面那一格上。
       *
       * ⚠ 这条改了五遍，每一遍都是量出来的，记下来（量具：tools/test_parts_connected.js）：
       *   1. 整块横向底板（h*0.52 → h*0.82）→ 底边没到格子边，留缝；
       *   2. 加宽到整格（但 `roundRect` 第三个参数是**宽度**，
       *      我写成 `size*0.98` 却当成右边界用）→ 只覆盖到格子中心；
       *   3. 高度写成 `size*1.34`（以为是三分之一格，实际是 1.34 格）
       *      → 铺到下面那一格里，盖住了木框；
       *   4. 改成中心细杆 + 短法兰 → 底边只覆盖 0.62 格宽，
       *      接缝覆盖率量到 76%，仍然看得出缝；
       *   5. 现在：细杆负责"看得出连着一根"，横梁**铺满 0.92 格**负责"接缝不漏"。
       * 不用整块板，是因为用户明确说过「你的机关会带黑底方块希望修改一下」——
       * 一根杆 + 一道梁是"结构"，一整块是不透光的底片。 */
      const stemW = size * 0.26;
      const stemGrad = ctx.createLinearGradient(-stemW / 2, 0, stemW / 2, 0);
      stemGrad.addColorStop(0, '#2c424c');
      stemGrad.addColorStop(0.45, '#4a6670');
      stemGrad.addColorStop(1, '#22343c');
      ctx.fillStyle = stemGrad;
      ctx.fillRect(-stemW / 2, 0, stemW, h * 0.86);
      ctx.strokeStyle = 'rgba(150,190,210,.5)'; ctx.lineWidth = Math.max(1, size * 0.028);
      ctx.strokeRect(-stemW / 2, 0, stemW, h * 0.86);
      /* 底座横梁：贴在格子下沿，铺满整个宽度。
       * 它的作用是**把接缝填满** —— 用户那句「两个木框的两边粘连起来」
       * 对驱动件同样成立：驱动件下面是木框，中间不能露出背景。 */
      const railH = size * 0.17;
      const railGrad = ctx.createLinearGradient(0, h - railH, 0, h);
      railGrad.addColorStop(0, '#4a6670');
      railGrad.addColorStop(0.5, '#3a5460');
      railGrad.addColorStop(1, '#26383f');
      ctx.fillStyle = railGrad;
      roundRect(-h * 0.92, h - railH, size * 0.92, railH, 3); ctx.fill();
      ctx.strokeStyle = 'rgba(170,210,230,.6)'; ctx.lineWidth = Math.max(1, size * 0.026);
      roundRect(-h * 0.92, h - railH, size * 0.92, railH, 3); ctx.stroke();
      // 梁上两枚铆钉，说明它是"固定件"而不是装饰
      ctx.fillStyle = 'rgba(196,224,238,.8)';
      ctx.beginPath(); ctx.arc(-h * 0.66, h - railH / 2, size * 0.038, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(h * 0.66, h - railH / 2, size * 0.038, 0, Math.PI * 2); ctx.fill();
      const isJet = (def.thrust || 0) >= 8;
      if (isJet) {
        // 喷气口：一段短管 + 一圈口沿
        ctx.fillStyle = '#8a6a5a';
        roundRect(-h * 0.55, -h * 0.34, size * 0.50, size * 0.68, 5); ctx.fill();
        ctx.fillStyle = def.color;
        roundRect(h * 0.02, -h * 0.30, size * 0.26, size * 0.60, 4); ctx.fill();
        ctx.strokeStyle = '#5a3a2a'; ctx.lineWidth = Math.max(1.3, size * 0.04);
        roundRect(h * 0.02, -h * 0.30, size * 0.26, size * 0.60, 4); ctx.stroke();
        // 喷出的三股气（静态，方向朝右 = dir 0）
        ctx.strokeStyle = 'rgba(255,220,180,.75)'; ctx.lineWidth = Math.max(1.2, size * 0.038);
        for (let k = -1; k <= 1; k++) {
          ctx.beginPath();
          ctx.moveTo(h * 0.32, k * h * 0.22);
          ctx.lineTo(h * 0.82, k * h * 0.30);
          ctx.stroke();
        }
      } else {
        // 风车桨：三片叶 + 中心轴
        ctx.strokeStyle = 'rgba(30,60,70,.85)'; ctx.lineWidth = Math.max(1.3, size * 0.04);
        for (let k = 0; k < 3; k++) {
          const a = (k / 3) * Math.PI * 2 + (spin || 0) * 0.5;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(Math.cos(a + 0.5) * h * 0.55, Math.sin(a + 0.5) * h * 0.55,
                               Math.cos(a) * h * 0.78, Math.sin(a) * h * 0.78);
          ctx.stroke();
          ctx.fillStyle = def.color;
          ctx.beginPath();
          ctx.ellipse(Math.cos(a) * h * 0.55, Math.sin(a) * h * 0.55,
                      h * 0.26, h * 0.13, a, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = '#2f5a66';
        ctx.beginPath(); ctx.arc(0, 0, h * 0.20, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#bfeaf4';
        ctx.beginPath(); ctx.arc(0, 0, h * 0.10, 0, Math.PI * 2); ctx.fill();
      }

    } else if (def.oneShot) {
      /* ---------- 霄灯：一盏会烧完的纸灯 ---------- */
      ctx.fillStyle = def.color;
      roundRect(-h * 0.42, -h * 0.52, size * 0.42, size * 0.72, 6); ctx.fill();
      ctx.strokeStyle = 'rgba(120,60,20,.85)'; ctx.lineWidth = Math.max(1.3, size * 0.04);
      roundRect(-h * 0.42, -h * 0.52, size * 0.42, size * 0.72, 6); ctx.stroke();
      // 灯芯的光
      ctx.fillStyle = 'rgba(255,240,180,.90)';
      ctx.beginPath(); ctx.arc(0, h * 0.02, h * 0.16, 0, Math.PI * 2); ctx.fill();
      // 底部开口
      ctx.fillStyle = '#7a4a20';
      ctx.fillRect(-h * 0.30, h * 0.20, size * 0.30, size * 0.10);

    } else if (def.motor) {
      /* ---------- 马达：机身 + 散热槽 + 出轴 ---------- */
      ctx.fillStyle = '#e06a4a';
      roundRect(-h * 0.72, -h * 0.48, size * 0.72, size * 0.52, 4); ctx.fill();
      ctx.fillStyle = '#b44a30';
      roundRect(-h * 0.72, h * 0.0, size * 0.72, size * 0.1, 2); ctx.fill();
      // 散热槽
      ctx.strokeStyle = 'rgba(60,20,12,.55)'; ctx.lineWidth = Math.max(1, size * 0.035);
      for (let k = 0; k < 3; k++) {
        const xx = -h * 0.55 + k * size * 0.16;
        ctx.beginPath(); ctx.moveTo(xx, -h * 0.36); ctx.lineTo(xx, -h * 0.08); ctx.stroke();
      }
      // 出轴
      ctx.fillStyle = '#5a6672';
      ctx.fillRect(h * 0.0, -h * 0.16, size * 0.2, size * 0.16);
      ctx.fillStyle = '#c8d2dc';
      ctx.beginPath(); ctx.arc(h * 0.22, -h * 0.08, size * 0.09, 0, Math.PI * 2); ctx.fill();
      // 描边
      ctx.strokeStyle = '#8d3b28'; ctx.lineWidth = 2;
      roundRect(-h * 0.72, -h * 0.48, size * 0.72, size * 0.52, 4); ctx.stroke();

    } else if (def.liftMass) {
      /* ---------- 气球：一束（个数由 n 决定，由调用方单独画徽标） ---------- */
      /* 扎口绳：原来只画到 h*0.92 —— 差 0.04 格没顶到格子下沿，
       * 于是"气球下面的木框"和气球之间露出一条背景缝，
       * test_parts_connected.js 量到 56%。绳子本来就该系在框上，
       * 现在直接顶到 +h，和下面那块木框接上。 */
      ctx.strokeStyle = '#8a6a4a'; ctx.lineWidth = Math.max(1.2, size * 0.035);
      ctx.beginPath(); ctx.moveTo(0, h * 0.28); ctx.lineTo(0, h); ctx.stroke();
      // 球体：底色 + 高光 + 描边
      const rg = ctx.createRadialGradient(-h * 0.22, -h * 0.32, size * 0.04, 0, -h * 0.1, size * 0.56);
      rg.addColorStop(0, '#f6b6c8');
      rg.addColorStop(0.55, def.color);
      rg.addColorStop(1, '#a8455f');
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.ellipse(0, -h * 0.1, size * 0.40, size * 0.46, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(90,30,45,.75)'; ctx.lineWidth = Math.max(1.2, size * 0.035);
      ctx.beginPath(); ctx.ellipse(0, -h * 0.1, size * 0.40, size * 0.46, 0, 0, Math.PI * 2); ctx.stroke();
      // 高光
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ctx.beginPath(); ctx.ellipse(-h * 0.18, -h * 0.34, size * 0.09, size * 0.14, -0.4, 0, Math.PI * 2); ctx.fill();
      // 扎口结
      ctx.fillStyle = '#8a4757';
      ctx.beginPath();
      ctx.moveTo(-size * 0.055, h * 0.28); ctx.lineTo(size * 0.055, h * 0.28); ctx.lineTo(0, h * 0.40);
      ctx.closePath(); ctx.fill();

    } else if (def.dropOne) {
      /* ---------- 沙袋：麻布口袋 + 缝线 + 束口 ---------- */
      const bg = ctx.createLinearGradient(0, -h * 0.6, 0, h * 0.8);
      bg.addColorStop(0, '#cbb083');
      bg.addColorStop(0.6, def.color);
      bg.addColorStop(1, '#8d7448');
      ctx.fillStyle = bg;
      // 袋身：下宽上窄的梯形（束口感）
      ctx.beginPath();
      ctx.moveTo(-h * 0.30, -h * 0.62);
      ctx.lineTo(h * 0.30, -h * 0.62);
      ctx.lineTo(h * 0.62, h * 0.34);
      ctx.quadraticCurveTo(h * 0.62, h * 0.78, 0, h * 0.78);
      ctx.quadraticCurveTo(-h * 0.62, h * 0.78, -h * 0.62, h * 0.34);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(74,56,28,.8)'; ctx.lineWidth = Math.max(1.2, size * 0.035); ctx.stroke();
      // 口子上的束带
      ctx.fillStyle = '#6b563a';
      roundRect(-h * 0.34, -h * 0.70, size * 0.34, size * 0.14, 3); ctx.fill();
      // 缝线
      ctx.strokeStyle = 'rgba(96,74,42,.55)'; ctx.lineWidth = Math.max(1, size * 0.022);
      ctx.beginPath();
      ctx.moveTo(-h * 0.34, h * 0.02); ctx.lineTo(h * 0.34, h * 0.02);
      ctx.moveTo(-h * 0.28, h * 0.34); ctx.lineTo(h * 0.28, h * 0.34);
      ctx.stroke();
      // 麻布高光
      ctx.fillStyle = 'rgba(255,244,214,.28)';
      ctx.beginPath(); ctx.ellipse(-h * 0.26, -h * 0.10, size * 0.11, size * 0.26, -0.2, 0, Math.PI * 2); ctx.fill();

    } else if (def.interactive) {
      /* ---------- 打气筒：筒身 + 活塞 + 压力表 + 出气管 ---------- */
      ctx.fillStyle = '#2f5e78';
      roundRect(-h * 0.34, -h * 0.46, size * 0.34, size * 0.6, 5); ctx.fill();
      // 筒身高光
      ctx.fillStyle = 'rgba(190,235,255,.5)';
      roundRect(-h * 0.28, -h * 0.4, size * 0.09, size * 0.48, 3); ctx.fill();
      // 活塞头
      ctx.fillStyle = def.color;
      roundRect(-h * 0.42, -h * 0.7, size * 0.5, size * 0.2, 5); ctx.fill();
      ctx.strokeStyle = '#1d3a4a'; ctx.lineWidth = Math.max(1.4, size * 0.045);
      roundRect(-h * 0.42, -h * 0.7, size * 0.5, size * 0.2, 5); ctx.stroke();
      // 压力表
      ctx.fillStyle = '#e8f4ff';
      ctx.beginPath(); ctx.arc(-h * 0.02, h * 0.18, size * 0.1, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#1d3a4a'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(-h * 0.02, h * 0.18); ctx.lineTo(-h * 0.02 + size * 0.06, h * 0.18 - size * 0.05); ctx.stroke();
      // 出气管
      ctx.fillStyle = '#8fb8cc';
      ctx.fillRect(-h * 0.02, h * 0.02, size * 0.36, size * 0.14);
      ctx.fillStyle = '#e8f4ff';
      ctx.beginPath(); ctx.arc(h * 0.36, h * 0.09, size * 0.085, 0, Math.PI * 2); ctx.fill();
      /* ⚠ 打气筒的筒身到 h*0.14 就结束了，格子下沿在 +h ——
       * 中间 0.36 格是空的。test_parts_connected.js 在 1-2 量到
       * "pump ↔ wood_frame 连接段 0%"，也就是打气筒看起来悬在车顶上方。
       * 补一根进气管接到底：它本来就该插进车里打气。 */
      ctx.fillStyle = '#3f6f88';
      ctx.fillRect(-size * 0.07, h * 0.10, size * 0.14, h * 0.90);
      ctx.strokeStyle = '#1d3a4a'; ctx.lineWidth = Math.max(1, size * 0.03);
      ctx.strokeRect(-size * 0.07, h * 0.10, size * 0.14, h * 0.90);
      // 底部法兰
      ctx.fillStyle = '#28516a';
      roundRect(-h * 0.44, h * 0.82, size * 0.44, size * 0.16, 3); ctx.fill();

    } else {
      ctx.fillStyle = def.color; roundRect(-h * 0.8, -h * 0.8, size * 0.8, size * 0.8, 3); ctx.fill();
    }
    ctx.restore();
  }

  function drawBuildCar() {
    const o = buildOrigin();
    const PX = o.px;
    const keys = Object.keys(state.build.cells);
    const at = (k) => ({
      x: o.x + (+k.split(',')[1]) * PX + PX / 2,
      y: o.y + (+k.split(',')[0]) * PX + PX / 2
    });
    // 先画所有零件（框是空的，能看到后面）
    keys.forEach(k => {
      const cell = state.build.cells[k];
      const p = at(k);
      {
        // 落下弹性：1.22 → 1.0（180ms）
        let sc = 1;
        const t0 = state.popped[k];
        if (t0) {
          const age = (performance.now() - t0) / 180;
          if (age < 1) sc = 1 + 0.22 * Math.sin(Math.PI * age) * (1 - age * 0.4);
          else delete state.popped[k];
        }
        drawPartShape(cell.part, p.x, p.y, PX * sc, cell.dir,
          cell.part === 'wood_frame' ? 3 : undefined, undefined, undefined,
          /* 焊接边：和相邻的结构件共用一面墙（第 69 轮）。
           * 建造期用 buildHasStruct（从 state.build.cells 现查）。 */
          weldedEdges(buildHasStruct, +k.split(',')[0], +k.split(',')[1], cell.dir));
        /* 堆叠徽标：气球/沙袋同一格可以放 1–3 个，形状本身画不出"这里堆了几个"。
         * 用右下角的圆角数字，和托盘上的计数同一套视觉。 */
        const n = RAP.cellCount(cell);
        if (n > 1) drawStackBadge(p.x + PX * 0.30, p.y + PX * 0.30, n);
      }
    });
    // 方向件箭头：只在「选中该款零件」或「鼠标悬停在该格」时显示
    const hover = cellAt(state.mouse.x, state.mouse.y);
    keys.forEach(k => {
      const cell = state.build.cells[k];
      if (!RAP.isDirectional(cell.part)) return;
      const rc = k.split(',');
      const isHover = hover && hover.r === +rc[0] && hover.c === +rc[1];
      const isSelectedType = (state.selected === cell.part);   // 选了打气筒才显示所有打气筒
      if (!isHover && !isSelectedType) {
        // 只留一个很小的朝向点，不画箭头（保持"这里有方向件"的可读性）
        const p0 = at(k);
        const v0 = RAP.blowVec(cell.part, cell.dir || 0);
        ctx.fillStyle = 'rgba(255,255,255,.5)';
        ctx.beginPath();
        ctx.arc(p0.x + v0[0] * PX * 0.34, p0.y - v0[1] * PX * 0.34, PX * 0.07, 0, Math.PI * 2);
        ctx.fill();
        return;
      }
      const p = at(k);
      /* 箭头画的是**风/喷流的方向**（第 68 轮，用户要求：
       * 「为什么不把风相关的零件的箭头改成风的方向，让车受反作用力沿风的
       * 反方向运动」）。对 blowsAir 的零件（风车桨/喷气口），箭头与车受力方向
       * 相反 —— 桨把空气往左推，车就向右跑。`blowVec` 是那唯一一份换算，
       * 行驶期的风特效读的也是它。 */
      const bv = RAP.blowVec(cell.part, cell.dir || 0);
      const arrowDir = (bv[0] === 1 && bv[1] === 0) ? 0
        : (bv[0] === 0 && bv[1] === 1) ? 1
        : (bv[0] === -1 && bv[1] === 0) ? 2 : 3;
      drawDirArrow(p.x, p.y, arrowDir, PX, RAP.PARTS[cell.part].color, isHover);
      state.arrowDrawN = (state.arrowDrawN || 0) + 1;   // 供测试统计"这一帧画了几个箭头"
      if (isHover) {
        const vv = RAP.blowVec(cell.part, cell.dir || 0);
        const wd = { '1,0': '往右吹', '-1,0': '往左吹', '0,1': '往上吹', '0,-1': '往下吹' }[vv[0] + ',' + vv[1]] || '';
        text(wd, p.x + vv[0] * PX * 0.8, p.y - vv[1] * PX * 0.8 + 5, 14, '#ffffff', 'center', true);
      }
    });

    // 再画框里的内嵌件（小猪），放在框的内壁之上
    keys.forEach(k => {
      const cell = state.build.cells[k];
      if (!cell.inner) return;
      const p = at(k);
      drawPartShape(cell.inner, p.x, p.y, PX * 0.62, 0);
    });
  }

  function drawTray() {
    let hoverIdx = -1;
    TRAY.forEach((part, i) => {
      if (hit(trayRect(i), state.mouse.x, state.mouse.y)) hoverIdx = i;
    });
    // 托盘底板：一条贯通的深色长条，让"这是本关的零件箱"成为一个整体
    if (TRAY.length) {
      const r0 = trayRect(0), rN = trayRect(TRAY.length - 1);
      ctx.fillStyle = 'rgba(8,18,26,.55)';
      roundRect(r0.x - 12, r0.y - 12, (rN.x + rN.w) - r0.x + 24, r0.h + 34, 16); ctx.fill();
      ctx.strokeStyle = 'rgba(232,200,122,.22)'; ctx.lineWidth = 1.5; ctx.stroke();
    }
    TRAY.forEach((part, i) => {
      const rect = trayRect(i);
      const left = part === 'eraser' ? 1 : RAP.budgetLeft(level(), part, state.build);
      const sel = state.selected === part;
      ctx.fillStyle = sel ? '#4a7aa8' : 'rgba(20,26,32,.82)';
      roundRect(rect.x, rect.y, rect.w, rect.h, 10); ctx.fill();
      if (sel) { ctx.strokeStyle = '#ffe08a'; ctx.lineWidth = 3; ctx.stroke(); }
      const cx = rect.x + rect.w / 2, cy = rect.y + rect.h / 2 - 6;
      if (part === 'eraser') {
        ctx.fillStyle = '#dde6ee'; roundRect(cx - 18, cy - 14, 36, 28, 5); ctx.fill();
      } else {
        drawPartShape(part, cx, cy, rect.w * 0.56, 0);
      }
      /* 数字键徽标（1..9）。托盘跟着关卡变长变短之后，"这是我按 3 拿的那个"
       * 必须有个固定的说法 —— 键盘快捷键本来就在（keydown 里的 '1'..'9'），
       * 但界面上没有任何地方告诉过玩家。画在左上角，不挡零件本体。
       *
       * ⚠ 底色必须是**实心深色**。第一版用 rgba(232,200,122,.16) 这种
       * 近乎透明的金，10px 小字压在草绿底上只有 2.72 —— 对比度审计当场报红。
       * 小字号对底色比对字号敏感得多：徽标这种东西要么看得清，要么干脆不画。 */
      if (i < 9) {
        ctx.fillStyle = 'rgba(10,18,24,.88)';
        roundRect(rect.x + 3, rect.y + 3, 17, 16, 5); ctx.fill();
        ctx.strokeStyle = 'rgba(232,200,122,.45)'; ctx.lineWidth = 1;
        roundRect(rect.x + 3, rect.y + 3, 17, 16, 5); ctx.stroke();
        text(String(i + 1), rect.x + 11.5, rect.y + 15, 10.5,
          sel ? '#ffe9b0' : '#e8d29a', 'center', true);
      }
      /* 数量：**一律白色**，用"有没有货"区分靠的是滑条/透明度，不是颜色。
       *
       * 颜色历史（三次都栽在同一件事上）：
       *   #ff9c86 → 3.9；#ffd0c4 → 4.18；#ff8f78 → 2.62。
       * 根因是托盘的底不是纯深色：它是半透明深色叠在**草地**上，
       * 实测 bg ≈ rgb(87,105,98) —— 中等亮度、带绿。
       * 在这种底上，任何"浅红/珊瑚色"都比白色暗，反而更糊。
       *
       * 白色在这个底上 5.83，稳稳过线；而"用完"的语义已经由
       * 数字本身（0）和槽位的暗色表达，不需要再靠颜色重复一遍。 */
      text(part === 'eraser' ? '' : String(left),
        rect.x + rect.w / 2, rect.y + rect.h + 16, 13,
        '#ffffff', 'center');
      // 悬停 / 选中 → 在槽上方显示零件名（"选了什么"必须一眼看到）
      if (i === hoverIdx || state.selected === part) {
        const nm = part === 'eraser' ? '橡皮' : RAP.PARTS[part].label;
        const w = Math.max(78, nm.length * 16 + 28);
        ctx.fillStyle = 'rgba(10,18,24,.92)';
        roundRect(rect.x + rect.w / 2 - w / 2, rect.y - 36, w, 28, 8); ctx.fill();
        text(nm, rect.x + rect.w / 2, rect.y - 17, 15, '#ffe9b0', 'center', true);
      }
    });
  }

  /* ---------- 观察键（第 64 轮，用户要求） ----------
   *
   * 「在物品栏加个观察键，点击一下就可以移动视角」
   *
   * 做成**开关**而不是一次性动作，因为视角是"我要一直看着它"，不是"按一下挪一下"。
   * 开着的时候金色底 + 外圈呼吸，而且**按钮自己会亮**——这是唯一一处
   * 告诉玩家"现在点零件不会放下去"的东西。没有这个反馈，
   * 玩家会以为零件放坏了（这是真会发生的误判）。
   *
   * 位置紧贴托盘最右一格：观察的对象是这条托盘上的车，手不用离开托盘区。
   */
  function drawObserveBtn() {
    const r = observeBtnRect();
    const on = !!state.observe;
    const hov = hit(r, state.mouse.x, state.mouse.y);
    ctx.fillStyle = on ? 'rgba(232,200,122,.92)'
      : (hov ? 'rgba(44,64,80,.94)' : 'rgba(16,30,40,.92)');
    roundRect(r.x, r.y, r.w, r.h, 9); ctx.fill();
    ctx.strokeStyle = on ? 'rgba(255,255,255,.78)' : 'rgba(232,200,122,.55)';
    ctx.lineWidth = on ? 2.5 : 1.5;
    roundRect(r.x, r.y, r.w, r.h, 9); ctx.stroke();
    const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
    const ink = on ? '#1b2a33' : '#ffe9b0';
    // 眼睛：上下两段弧 + 瞳孔（"观察"这个词最省事的象形）
    ctx.strokeStyle = ink; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx - 12, cy);
    ctx.quadraticCurveTo(cx, cy - 11, cx + 12, cy);
    ctx.quadraticCurveTo(cx, cy + 11, cx - 12, cy);
    ctx.closePath(); ctx.stroke();
    ctx.fillStyle = ink;
    ctx.beginPath(); ctx.arc(cx, cy, 4.2, 0, Math.PI * 2); ctx.fill();
    if (on) {
      const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 280);
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.25 + 0.35 * pulse).toFixed(3) + ')';
      ctx.lineWidth = 3;
      roundRect(r.x - 4, r.y - 4, r.w + 8, r.h + 8, 12); ctx.stroke();
    }
    // 文字与托盘的"剩余数量"同一条基线（y+h+14），一排读下来不歪
    text('观察', cx, r.y + r.h + 14, 12, on ? '#ffe9b0' : '#ffffff', 'center');
  }

  /* 「回拼装区」（第 66 轮，用户要求：
   * 「为什么不增加一个让视角立刻回拼装区的按钮」）。
   *
   * 图标用「准心 + 向内的四个角标」：四个角标是"取景框回到画面中心"的通用符号，
   * 比画一辆小车更省地方，也不会和托盘里的零件图形混淆。
   * 按下时 hasHome 为 true 才亮；玩家本来就在默认视角时它是灰的 ——
   * 一个永远是亮色的按钮等于在骗人说"按了会有事发生"。
   */
  function drawRecentreBtn() {
    const r = recentreRect();
    const hov = hit(r, state.mouse.x, state.mouse.y);
    const away = buildViewAwayFromHome();
    ctx.fillStyle = away ? (hov ? 'rgba(74,123,168,.98)' : 'rgba(30,52,70,.96)')
      : 'rgba(16,30,40,.72)';
    roundRect(r.x, r.y, r.w, r.h, 9); ctx.fill();
    ctx.strokeStyle = away ? 'rgba(232,200,122,.75)' : 'rgba(140,158,172,.35)';
    ctx.lineWidth = away ? 2 : 1.4;
    roundRect(r.x, r.y, r.w, r.h, 9); ctx.stroke();
    const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
    const ink = away ? '#ffe9b0' : 'rgba(190,206,218,.55)';
    // 四个角标（取景框）
    ctx.strokeStyle = ink; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    const K = 11, L2 = 6;
    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sy]) => {
      ctx.beginPath();
      ctx.moveTo(cx + sx * K, cy + sy * (K - L2));
      ctx.lineTo(cx + sx * K, cy + sy * K);
      ctx.lineTo(cx + sx * (K - L2), cy + sy * K);
      ctx.stroke();
    });
    // 中心一个点（"车就在这儿"）
    ctx.fillStyle = ink;
    ctx.beginPath(); ctx.arc(cx, cy, 3.2, 0, Math.PI * 2); ctx.fill();
    /* 文字颜色**不跟着按钮变灰**。理由和「出发」那颗钮一样：
     * 这两颗钮的说明字是玩家唯一的线索，压在草地（bg ≈ rgb(63,82,77)）上，
     * 灰到 3.40 就等于没有。灰按钮 + 白字是标准做法。 */
    text('回位', cx, r.y + r.h + 14, 12, '#ffffff', 'center');
  }

  /* 镜头离默认视角有多远？按钮亮不亮、以及"点了会不会真的动"，都读这一个判断。
   * 阈值 0.8 米 / 0.12 倍 zoom：小于它就当"已经在拼装区了"，不值得闪一下。 */
  function buildViewAwayFromHome() {
    if (!state.buildView) return false;
    const home = buildViewDefault(level());
    const v = state.buildView;
    return Math.hypot(v.x - home.x, v.y - home.y) > 0.8 ||
      Math.abs(v.zoom - home.zoom) > 0.12;
  }


  /* ---------- 浮动虚拟摇杆（第 64 轮，用户要求） ----------
   *
   * 「长按屏幕出摇杆控制，结束长按摇杆就立刻消失」
   *
   * 出现的**位置就是按下的位置**（不是固定角落），松手立刻消失 ——
   * 所以它是"临时"的：不常驻、不占屏幕、不需要玩家先去角落找它。
   *
   * 画在所有 UI 之上（见 frameBody 里的调用顺序）：它出现的地方
   * 常常正好压在托盘或网格上，被盖住就看不出自己推了多远。
   * 盘面和摇杆头用的是**同一份** JOY_R/JOY_DEAD（绘制与判定同源）。
   */
  function drawJoystick() {
    const j = state.joystick;
    if (!j) return;
    ctx.save();
    // 底盘
    ctx.fillStyle = 'rgba(10,20,26,.42)';
    ctx.beginPath(); ctx.arc(j.ox, j.oy, JOY_R, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(232,200,122,.55)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(j.ox, j.oy, JOY_R, 0, Math.PI * 2); ctx.stroke();
    // 四向刻度（推出去多少、往哪个方向，靠这四条读）
    ctx.strokeStyle = 'rgba(232,200,122,.35)'; ctx.lineWidth = 1.5;
    for (let i = 0; i < 4; i++) {
      const a = i * Math.PI / 2;
      ctx.beginPath();
      ctx.moveTo(j.ox + Math.cos(a) * (JOY_R - 3), j.oy + Math.sin(a) * (JOY_R - 3));
      ctx.lineTo(j.ox + Math.cos(a) * (JOY_R - 9), j.oy + Math.sin(a) * (JOY_R - 9));
      ctx.stroke();
    }
    // 摇杆头：推出死区才变金色（"没推"与"推了"必须一眼可分）
    const mag = Math.hypot(j.dx || 0, j.dy || 0);
    ctx.fillStyle = mag > 0 ? 'rgba(232,200,122,.95)' : 'rgba(230,238,246,.9)';
    ctx.beginPath(); ctx.arc(j.x, j.y, 22, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(j.x, j.y, 22, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  /* 打气筒的蓄力进度（0~1，按 0.8 秒到顶）。
   *
   * 抽成函数而不是散在绘制里，是为了让测试能**读同一个数**去断言"镀环画对了"——
   * 上一轮的木框耐久条就是靠这个办法才让像素测试和渲染同源的。
   * 返回 -1 表示"这一帧根本没有被按住的打气筒"（没装、没按、或不是打气筒）。
   */
  function pumpChargeOf(run) {
    if (!run || !run.car) return -1;
    var gs = run.car.groups || [];
    for (var i = 0; i < gs.length; i++) {
      if (gs[i].part === 'pump' && gs[i].on) {
        return Math.max(0, Math.min(1, (run.car.pumpCharge || 0) / 0.8));
      }
    }
    return -1;
  }

  /* `batteryPctOf` 已删（第 63 轮）：电量机制不存在了。
   * 它读的 `car.energyMax` / `car.energy` 引擎从不赋值 ——
   * audit_dead_reads 把它列成"读空"的第 2 条。
   * 现在要显示的是**动力供给/需求**，见 hudPowerLine()。 */

  function drawButtons() {
    if (state.phase === 'build') {
      const L = btnRect('launch'), C = btnRect('clear'), U = btnRect('undo');
      const chk = RAP.canLaunch(state.build);
      const LC = { x: L.x + L.w / 2, y: L.y + L.h / 2 };
      const ready = chk.ok;
      // 右侧操作坞（出发 + 零件说明）：统一底板，避免两个浮空按钮各飞各的
      ctx.fillStyle = 'rgba(8,18,26,.55)';
      roundRect(L.x - 14, L.y - 10, 104, 166, 18); ctx.fill();
      ctx.strokeStyle = 'rgba(232,200,122,.24)'; ctx.lineWidth = 1.5; ctx.stroke();
      // 出发：对勾圆钮（未就绪变灰；就绪时外圈呼吸）
      ctx.fillStyle = ready ? '#4a9be0' : 'rgba(90,104,116,.85)';
      ctx.beginPath(); ctx.arc(LC.x, LC.y, L.w / 2, 0, Math.PI * 2); ctx.fill();
      if (ready) {
        const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 300);
        ctx.strokeStyle = 'rgba(255,255,255,' + (0.22 + 0.33 * pulse).toFixed(3) + ')';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(LC.x, LC.y, L.w / 2 + 6 + pulse * 3, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 7; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(LC.x - 14, LC.y + 1); ctx.lineTo(LC.x - 4, LC.y + 11); ctx.lineTo(LC.x + 15, LC.y - 11);
      ctx.stroke();
      /* 未就绪时这颗钮是灰的，但**字必须是白的**：这一行是"要你做点什么"的
       * 唯一提示，跟着按钮一起变灰就读不出来了。
       * 底色是半透明深色压在草地上（实测 bg ≈ rgb(82,94,93)），
       * #c3d2de 在这里只有 4.36 —— 差一点点过不了 4.5 的小字门槛。
       * 灰按钮 + 白字是标准做法，也不必为此把按钮压得更黑。 */
      text('出发', LC.x, L.y + L.h + 20, 14, ready ? '#dff0ff' : '#ffffff', 'center', true);

      // 左侧三个小圆钮（图标 + 右侧文字，装在同一个圆角坞里）
      const knob = (rect, drawIcon, label, active) => {
        const c = { x: rect.x + rect.w / 2, y: rect.y + rect.h / 2 };
        ctx.fillStyle = active ? 'rgba(74,123,168,.95)' : 'rgba(24,34,42,.9)';
        ctx.beginPath(); ctx.arc(c.x, c.y, rect.w / 2, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = active ? 'rgba(255,255,255,.55)' : 'rgba(150,170,185,.4)';
        ctx.lineWidth = 2; ctx.stroke();
        drawIcon(c);
        text(label, rect.x + rect.w + 8, c.y + 5, 12.5, active ? '#f0f8ff' : '#d4e2ee', 'left', true);
      };
      const RDOCK = btnRect('rotate');
      ctx.fillStyle = 'rgba(8,18,26,.55)';
      roundRect(C.x - 14, C.y - 14, 148, RDOCK.y + RDOCK.h + 14 - (C.y - 14), 18); ctx.fill();
      ctx.strokeStyle = 'rgba(232,200,122,.24)'; ctx.lineWidth = 1.5; ctx.stroke();
      knob(C, (c) => {
        ctx.fillStyle = '#dce6ee';
        ctx.fillRect(c.x - 8, c.y - 9, 16, 4);
        ctx.fillRect(c.x - 5, c.y - 12, 10, 4);
        ctx.fillRect(c.x - 7, c.y - 4, 14, 15);
      }, '清空 C', false);
      knob(U, (c) => {
        ctx.strokeStyle = '#dce6ee'; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.arc(c.x, c.y, 9, -0.4, 3.9); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(c.x + 9, c.y - 7); ctx.lineTo(c.x + 3, c.y - 12); ctx.lineTo(c.x + 2, c.y - 3);
        ctx.closePath(); ctx.fillStyle = '#dce6ee'; ctx.fill();
      }, '撤销 Z', false);
      const Rr = btnRect('rotate');
      const hc = cellAt(state.mouse.x, state.mouse.y);
      const canRot = !!(hc && state.build.cells[hc.r + ',' + hc.c] &&
        RAP.isDirectional(state.build.cells[hc.r + ',' + hc.c].part));
      knob(Rr, (c) => {
        ctx.strokeStyle = canRot ? '#ffe9b0' : '#dce6ee'; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.arc(c.x, c.y, 9, 0.6, 5.2); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(c.x + 8, c.y - 6); ctx.lineTo(c.x + 12, c.y + 1); ctx.lineTo(c.x + 4, c.y + 1);
        ctx.closePath(); ctx.fillStyle = canRot ? '#ffe9b0' : '#dce6ee'; ctx.fill();
      }, '换方向 R', canRot);
      const HB2 = btnRect('help');
      ctx.fillStyle = state.helpOpen ? 'rgba(74,123,168,.95)' : 'rgba(24,34,42,.85)';
      roundRect(HB2.x, HB2.y, HB2.w, HB2.h, 10); ctx.fill();
      ctx.strokeStyle = 'rgba(232,200,122,.6)'; ctx.lineWidth = 1.5; ctx.stroke();
      text('? 零件说明', HB2.x + HB2.w / 2, HB2.y + 25, 13, '#ffe9b0', 'center', true);
    }

    if (state.phase === 'run' && state.run) {
      /* 刹车钮已删（用户要求：「我希望你删掉刹车按钮」）。
       * 这一块原来画一个 92×92 的「刹 / 按住」方钮。
       * 删掉之后右下角空出来了 —— 那里现在是关卡箱底的呼吸区，
       * 也是将来「提示」按钮的落点（见 buildHintRect）。 */
      const groups = state.run.car.groups || [];
      const n = Math.min(3, groups.length);
      const x0 = DW / 2 - (n * 104) / 2;
      /* 打气筒的蓄力进度。探针实测（tools/probe_pump_charge_feedback.js）：
       * 按住蓄力到满、松手放气，交互钮那块 92×92 的画面变化量是 143 像素，
       * 而以**同样的等待时长**取的两次静置之间就有 104 像素的噪声
       * —— 两者同一量级，也就是说"按住"这件事在画面上什么都没发生。
       *
       * 可这一关的玩法就是"按多久决定推多大"（0.35 倍 vs 1.0 倍，接近 3 倍差）。
       * 玩家完全没有依据判断"该松手了"，只能数秒。
       * 现在按钮外圈加一道镀环：越满越接近闭合，还差最后一段时会闪。 */
      const pc = pumpChargeOf(state.run);
      for (let i = 0; i < n; i++) {
        const g = groups[i];
        const rect = { x: x0 + i * 104, y: btnRect('interact').y, w: 92, h: 92 };
        // 按钮底色 = 这组零件的颜色（同色 = 同组，一按全启动）
        ctx.fillStyle = 'rgba(10,18,24,.55)'; roundRect(rect.x - 4, rect.y - 4, rect.w + 8, rect.h + 8, 18); ctx.fill();
        ctx.fillStyle = g.color; roundRect(rect.x, rect.y, rect.w, rect.h, 15); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 2; ctx.stroke();
        if (pc >= 0 && g.part === 'pump') {
          /* 蓄力环：贴着按钮外沿画一段圆弧，从正上方顺时针填充。
           * 底色先压一圈暗的，让"还差多少"有个刻度感；
           * 满了之后转成金色并加一层呼吸光晕 —— 那正是"可以松手了"的信号。 */
          const cx2 = rect.x + rect.w / 2, cy2 = rect.y + rect.h / 2;
          const rr = rect.w / 2 + 7;
          ctx.strokeStyle = 'rgba(8,18,26,.72)'; ctx.lineWidth = 7;
          ctx.beginPath(); ctx.arc(cx2, cy2, rr, 0, Math.PI * 2); ctx.stroke();
          const full = pc >= 0.98;
          ctx.strokeStyle = full ? '#ffe9b0' : '#7fd4ff';
          ctx.lineWidth = 6; ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.arc(cx2, cy2, rr, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * pc);
          ctx.stroke();
          if (full) {
            const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 110);
            ctx.strokeStyle = 'rgba(255,233,176,' + (0.18 + 0.32 * pulse).toFixed(3) + ')';
            ctx.lineWidth = 11;
            ctx.beginPath(); ctx.arc(cx2, cy2, rr, 0, Math.PI * 2); ctx.stroke();
          }
        }
        text(RAP.PARTS[g.part].label, rect.x + rect.w / 2, rect.y + 40, 14, '#10201a', 'center', true);
        text('×' + g.list.length, rect.x + rect.w / 2, rect.y + 62, 15, '#10201a', 'center', true);
        text(String(i + 1), rect.x + 10, rect.y + 18, 12, 'rgba(16,32,26,.75)', 'left');
      }
      // 重开在左上（drawHud 里的绿色圆钮），这里不再放重复按钮
    }

    if (state.phase === 'resolved') {
      // 结算页的两个按钮由 drawResult 一并绘制（跟随卡片滑入 + 主次分级），
      // 这里再画一遍会盖在上面，变成一坨没描边的绿块。
    }
  }

  /* 把预览条画出来。只读：不动 state.build、不动镜头。
   * 数据全部来自真地形（RAP.makeTerrain 的 surfaceY / matAt），
   * 画的不是 mapRows 的近似 —— 玩家看到的曲线必须就是他待会儿真要跑的那条曲线，
   * 否则"照着预览装轮子"会被地形打脸。 */
  function drawBuildPreview(ter) {
    if (state.phase !== 'build') return;
    /* 每帧一个标记，和 arrowDrawN 同型：测试靠它确认"这一帧真的画了"。
     * 只有几何函数存在、却从来没被调用，是另一种假绿 —— 所以这个数必须由
     * 绘制函数自己写，测试再从 state 上读回来。 */
    state.previewDrawN = 1;
    const lv = level();
    const G = buildPreviewGeom(lv);
    const R = G.R;
    const bm = BIOMES[lv.biome] || BIOMES.field;

    ctx.save();
    // 底板：和统计卡同一套夜间面板
    ctx.fillStyle = 'rgba(10,18,24,.74)';
    roundRect(R.x, R.y, R.w, R.h, 8); ctx.fill();
    ctx.strokeStyle = 'rgba(232,200,122,.32)'; ctx.lineWidth = 1;
    roundRect(R.x, R.y, R.w, R.h, 8); ctx.stroke();
    // 裁到条内：地形曲线、旗杆都不许跑出条外（1-6 的崖顶正好贴到条顶）
    ctx.beginPath(); ctx.rect(R.x + 1, R.y + 1, R.w - 2, R.h - 2); ctx.clip();

    // 天空：一条极淡的渐变，让"上方"有方向感（洞穴关更暗）
    const sky = ctx.createLinearGradient(0, G.yTop, 0, G.yBot);
    sky.addColorStop(0, 'rgba(' + (bm.cave ? '28,48,60' : '120,170,200') + ',.20)');
    sky.addColorStop(1, 'rgba(8,14,20,.0)');
    ctx.fillStyle = sky; ctx.fillRect(R.x, G.yTop, R.w, G.innerH);

    // 岩体：沿地表线填到底部
    /* 逐 2 像素采样：1-3 有 64 列而条宽只有约 1230px，逐列采样会漏掉平缓段。
     * 同时把**真正交给 lineTo 的坐标**记进 state.previewProfile ——
     * 测试要核对的是"画出来的那条线"，不是另算一遍的同名公式
     * （本项目踩过三次"量具读的是另一个对象"）。 */
    const pvPts = [];
    const STEP_X = 2;
    const x0g = G.xOf(G.c0), x1g = G.xOf(G.c1);
    const dxg = Math.max(1e-6, x1g - x0g);
    const wcOf = x => G.c0 + (x - x0g) / dxg * (G.c1 - G.c0);
    ctx.beginPath();
    ctx.moveTo(x0g, G.yBot);
    for (let x = x0g; x <= x1g; x += STEP_X) {
      const y = G.yOf(ter.surfaceY(wcOf(x)));
      ctx.lineTo(x, y);
      pvPts.push(x, y);
    }
    ctx.lineTo(x1g, G.yBot);
    ctx.closePath();
    ctx.fillStyle = 'rgb(' + bm.rock.join(',') + ')';
    ctx.fill();
    state.previewProfile = pvPts;

    /* 地表线按材质分段上色 —— 冰面/石头/泥地在这关是**玩法差别**（冰面摩擦力 0.05、
     * 石头 0.45、泥地 0.6），不区分的话这条条只回答"陡不陡"，回答不了"滑不滑"。
     * 逐列画而不是逐像素：材质本来就是按列定义的（ter.matAt 也是向下取整到列）。 */
    const MATC = { ice: '#9FE3F2', stone: '#94A3AE', mud: '#B0A070' };
    for (let c = G.c0; c < G.c1; c++) {
      const x0 = G.xOf(c), x1 = G.xOf(c + 1);
      const m = ter.matAt(c + 0.5);
      ctx.beginPath();
      ctx.moveTo(x0, G.yOf(ter.surfaceY(c)));
      ctx.lineTo(x1, G.yOf(ter.surfaceY(c + 1)));
      ctx.strokeStyle = MATC[m] || '#B0A070';
      ctx.lineWidth = m === 'ice' ? 2.6 : 2.0;
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    // 起点：绿点（和场上起点一致）
    {
      const sx = G.xOf(lv.start.col), sy = G.yOf(ter.surfaceY(lv.start.col + 0.5));
      ctx.fillStyle = '#63d97e';
      ctx.beginPath(); ctx.arc(sx, Math.max(G.yTop + 2, sy - 2), 3, 0, Math.PI * 2); ctx.fill();
    }

    // 木箱：金色小方块，贴在地表线上 —— 玩家靠它判断"要不要绕一趟"
    (lv.boxes || []).forEach(b => {
      if (b.col < G.c0 || b.col > G.c1) return;
      const bx = G.xOf(b.col), by = Math.max(G.yTop + 3, G.yOf(ter.surfaceY(b.col + 0.5)) - 3);
      ctx.fillStyle = '#d9a441';
      roundRect(bx - 3, by - 6, 6, 6, 1.5); ctx.fill();
      ctx.strokeStyle = 'rgba(120,80,20,.9)'; ctx.lineWidth = 1;
      roundRect(bx - 3, by - 6, 6, 6, 1.5); ctx.stroke();
    });

    // 终点旗：和场上同一个颜色，位置就是终点列
    {
      const gx = G.xOf(lv.goal.col), gy = G.yOf(ter.surfaceY(lv.goal.col + 0.5));
      ctx.strokeStyle = '#e8f0e0'; ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(gx, Math.max(G.yTop + 2, gy - 1));
      ctx.lineTo(gx, Math.max(G.yTop + 2, gy - 15));
      ctx.stroke();
      const top = Math.max(G.yTop + 2, gy - 15);
      ctx.fillStyle = COL.flag;
      ctx.beginPath();
      ctx.moveTo(gx, top); ctx.lineTo(gx + 9, top + 3.5); ctx.lineTo(gx, top + 7);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  /* 顶栏（第 62 轮改版）。
   *
   * 用户原话：「我希望你把关卡选择都缩到左上角的关卡里面，而不是在上面裸排一排，
   * 不仅不好看，还没有给第一关和未来的许多关卡留位置」。
   *
   * 原来这里是 `levels.forEach` 一关一个 tab，六个关卡把顶栏排满，
   * 而且**第 0 个 tab 是「☰ 关卡」抽屉**，第 1..N 个是关卡直选 ——
   * 于是"关卡"和"1-1"并排，玩家分不清哪个是入口哪个是内容；
   * 更实际的问题是：加到第 20 关时这一排会冲出屏幕（每格 86px，20 格 1720px）。
   *
   * 现在只剩**一颗**「关卡」按钮（左上角），后面跟一颗"当前关"的胶囊显示你在哪。
   * 选关本身进抽屉（levelSelect 页）。位置留给关卡数量的是抽屉，不是顶栏。 */
  /* 「提示」按钮 + 提示卡。
   *
   * 按钮本身画成一颗灯泡：灯泡是"我想不出来"的国际符号，
   * 比一个「?」更贴切 —— 项目里已经有「? 零件说明」了，
   * 两个都用问号会让玩家分不清"查规则"和"要提示"。
   *
   * 卡片贴在按钮左边展开（右对齐），这样它永远不会被按钮自己挡住，
   * 也不会盖住底部的托盘和出发钮。 */
  function drawHintBtn() {
    const r = hintRect();
    const has = state.hintTier > 0;
    ctx.fillStyle = has ? 'rgba(58,44,16,.94)' : 'rgba(16,30,40,.92)';
    roundRect(r.x, r.y, r.w, r.h, 8); ctx.fill();
    ctx.strokeStyle = has ? 'rgba(255,215,120,.9)' : 'rgba(232,200,122,.55)';
    ctx.lineWidth = 1.5; roundRect(r.x, r.y, r.w, r.h, 8); ctx.stroke();
    const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
    // 灯泡：玻璃泡 + 灯丝 + 灯座
    ctx.fillStyle = has ? '#ffd93d' : '#ffe9b0';
    ctx.beginPath(); ctx.arc(cx, cy - 3, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = has ? '#8a6a20' : '#9fb2c2';
    ctx.fillRect(cx - 4, cy + 5, 8, 3);
    ctx.fillRect(cx - 3, cy + 9, 6, 2);
    // 玻璃泡里的一道亮线（不画会像一颗实心球）
    ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(cx - 2.5, cy - 5); ctx.lineTo(cx + 1, cy - 1); ctx.stroke();
  }

  function drawHintCard() {
    if (!state.hintOpen) return;
    const lv = level();
    const tier = Math.min(state.hintTier, 2);
    const body = hintFor(lv, tier);
    const r = hintRect();
    const W = 460, PAD = 18;
    // 简易折行：按字符数切（中文等宽，够用；英文靠空格断）
    const perLine = 22;
    const lines = [];
    let rest = body;
    while (rest.length > perLine && lines.length < 6) {
      let cut = perLine;
      // 尽量在空格/标点处断，避免把词切两半
      const sp = rest.lastIndexOf(' ', perLine);
      if (sp > perLine * 0.5) cut = sp + 1;
      lines.push(rest.slice(0, cut));
      rest = rest.slice(cut);
    }
    if (rest) lines.push(rest);
    const H = 62 + lines.length * 26 + 34;
    /* 卡片从按钮**右侧**展开（按钮现在在左栏）。
     * 原来是 `r.x + r.w - W`（右对齐），那是按钮在右上角时的写法；
     * 照搬过来会让卡片跑到屏幕左边外面去（x 变成负数）。 */
    const X = r.x + r.w + 12;
    const Y = Math.max(60, Math.min(DH - H - 24, r.y - 20));
    ctx.save();
    ctx.fillStyle = 'rgba(14,28,34,.97)';
    roundRect(X, Y, W, H, 14); ctx.fill();
    ctx.strokeStyle = 'rgba(232,200,122,.75)'; ctx.lineWidth = 2;
    roundRect(X, Y, W, H, 14); ctx.stroke();
    // 标题 + 层数点
    text('提示 · ' + (lv ? lv.levelId : ''), X + PAD, Y + 30, 15, '#ffd93d', 'left', true);
    for (let i = 0; i < 3; i++) {
      const dx = X + W - PAD - 12 - i * 16;
      ctx.fillStyle = i <= tier ? '#ffd93d' : 'rgba(120,140,155,.5)';
      ctx.beginPath(); ctx.arc(dx, Y + 25, 4, 0, Math.PI * 2); ctx.fill();
    }
    // 正文
    lines.forEach((ln, i) => {
      text(ln, X + PAD, Y + 62 + i * 26, 14.5, '#e2eef8', 'left');
    });
    // 底部：还能不能要点
    const canMore = state.hintTier < 2;
    const by = Y + H - 20;
    text(canMore ? '再点一次「提示」看下一层 ▸' : '已经是最后一层了',
      X + PAD, by, 12.5, canMore ? 'rgba(150,200,235,.9)' : 'rgba(150,170,186,.85)', 'left');
    text('点任意处关闭', X + W - PAD, by, 12, 'rgba(150,170,186,.85)', 'right');
    ctx.restore();
  }

  function drawTabs() {
    const t = tabRect(0);
    const active = state.levelSelect;
    ctx.fillStyle = active ? '#3a6490' : 'rgba(12,20,26,.88)';
    roundRect(t.x, t.y, t.w, t.h, 7); ctx.fill();
    ctx.strokeStyle = active ? 'rgba(255,255,255,.5)' : 'rgba(232,200,122,.32)';
    ctx.lineWidth = 1.5; roundRect(t.x, t.y, t.w, t.h, 7); ctx.stroke();
    text('☰ 关卡', t.x + t.w / 2, t.y + 21, 13, '#ffe9b0', 'center', true);
    /* 当前关胶囊：紧跟在按钮右边。没有它的话，玩家在建造页看不出自己在第几关
     * （原来靠"哪颗 tab 高亮"回答，现在 tab 只剩一颗）。 */
    const lv = level();
    if (lv) {
      const cl = lv.levelId + '　' + (lv.name || '');
      const cw = Math.max(96, cl.length * 13 + 24);
      const cx = t.x + t.w + 10, cy = t.y + 3;
      ctx.fillStyle = 'rgba(12,20,26,.6)';
      roundRect(cx, cy, cw, t.h - 6, 6); ctx.fill();
      text(cl, cx + 12, cy + 18, 12.5, '#cfe2f0', 'left');
    }
  }

  /* 右上角静音钮：喇叭图形 + 打斜杠表示静音。
   * 不用 emoji（🔇/🔊 在不同机器上字形差别很大，还可能缺字），
   * 用两条 path 画：喇叭 = 一个梯形 + 一段弧，静音 = 一道斜杠。 */
  function drawMuteBtn() {
    const m = muteRect();
    const on = SFX.isMuted();
    ctx.fillStyle = on ? 'rgba(60,26,26,.92)' : 'rgba(16,30,40,.92)';
    roundRect(m.x, m.y, m.w, m.h, 7); ctx.fill();
    ctx.strokeStyle = on ? 'rgba(255,150,130,.85)' : 'rgba(232,200,122,.55)';
    ctx.lineWidth = 1.5; roundRect(m.x, m.y, m.w, m.h, 7); ctx.stroke();
    const cx = m.x + m.w / 2, cy = m.y + m.h / 2;
    ctx.fillStyle = on ? '#ff9f8a' : '#ffe9b0';
    // 喇叭：小方块 + 一个张开的喇叭口
    ctx.beginPath();
    ctx.moveTo(cx - 9, cy - 3); ctx.lineTo(cx - 4, cy - 3);
    ctx.lineTo(cx + 2, cy - 8); ctx.lineTo(cx + 2, cy + 8);
    ctx.lineTo(cx - 4, cy + 3); ctx.lineTo(cx - 9, cy + 3);
    ctx.closePath(); ctx.fill();
    if (on) {
      // 静音：一道斜杠从左下到右上
      ctx.strokeStyle = '#ff6b52'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(cx - 10, cy + 9); ctx.lineTo(cx + 10, cy - 9);
      ctx.stroke();
    } else {
      // 有声：两段同心弧
      ctx.strokeStyle = '#ffe9b0'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(cx + 2, cy, 6, -0.9, 0.9); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx + 2, cy, 10, -0.9, 0.9); ctx.stroke();
    }
  }

  /* 「飞过终点但没落地」提示条的文案。抽成纯函数是为了让测试能直接断言
   * "什么时候该显、什么时候不该显"，而不是去数像素。
   * probe_over_goal.js 量过：标准解在 t=9.47 越过终点线时还在 15 米高空，
   * 到 12.53 才落回地面判赢 —— 所以这条提示在**赢的那一局**里也会出现 3 秒，
   * 它必须是"随高度实时消失的读数"，不能做成一次性 toast。 */
  function overGoalNotice(run) {
    if (!run || !run.car || !run.terrain) return null;
    const lv = level();
    if (!lv || !lv.goal) return null;
    if (run.car.x < lv.goal.col) return null;
    const alt = Math.abs(run.car.y - run.terrain.surfaceY(run.car.x));
    if (alt <= RAP.Params.goalMaxAlt) return null;
    return { alt, text: '⚠ 还在 ' + alt.toFixed(1) + ' 米高空 —— 落回地面才算到' };
  }

  /* 「快要被判没进展了」的倒计时。
   *
   * 引擎每帧写 run.noGainFor（已经多久没有实质进展），这里只负责
   * 把它翻译成玩家能懂的一句话。**两个数必须来自同一个字段** ——
   * 界面上的"还剩 3 秒"和引擎里的"到 8 秒判负"如果各算一遍，
   * 这个项目已经因此踩过三次坑（第三颗星的名字、关卡卡片几何、零件行数）。
   *
   * 为什么不从第 0 秒就显示：每局开头都在起跑，玩家会看到一个常驻的
   * 黄色警告条，变成纯噪音。所以只在剩不到 4 秒时才出现 ——
   * 那时玩家确实还来得及补救（扔沙袋、按打气筒）。 */
  function progressWarning(run) {
    if (!run || !run.car) return null;
    const W = RAP.Params.progressWindow;
    const left = W - (run.noGainFor || 0);
    if (left > 4.0 || left <= 0) return null;
    return { left, text: '⚠ ' + Math.max(1, Math.ceil(left)) + ' 秒内没有进展就要判负 —— 靠不了近、也升不高' };
  }

  function drawHud() {
    const built = RAP.buildVehicle(level(), state.build);
    const mass = built ? built.mass : 0;
    /* 建造期顶栏（第 71 轮重写）。
     *
     * 旧版这里显示**动力配置**（"动力 2 / 1"）—— 容量系统删掉之后这个数
     * 没有意义了。现在显示的是这一版真正要玩家判断的东西：**车上装了几颗种子**。
     * 种子是一次性的，所以"还能用几次"就是"还剩几颗"，一目了然。
     *
     * ⚠ 不能显示成"动力 0 / 0"或者"无动力件"：那会让玩家以为系统还在，
     * 只是自己没装。整行都要换掉。 */
    const seedN = built ? built.parts.filter(p => p.def && p.def.seedKind).length : 0;
    const windN = built ? built.parts.filter(p => p.def && p.def.catchesWind).length : 0;
    const powTxt = seedN === 0 ? '无种子'
      : ('种子 ' + seedN + (windN ? ('　吃风件 ' + windN) : '　（没带伞，风场没用）'));
    let line = `${level().levelId} ${level().name}　总重 ${mass.toFixed(1)} kg　${powTxt}` +
      `　交互键 ${built ? built.interactives.length : 0}/${RAP.Params.interactCap}`;
    /* 建造期就把"净重"算给玩家看 —— 气球/沙袋的全部意义都在这个数上：
     * 净重 > 0 贴地跑，净重 < 0 才飞得起来。不显示的话，
     * 玩家只能靠反复发射去试"到底挂几个气球能飞"。 */
    let liftLine = '';
    if (built && (built.liftMass > 0 || built.sandbagCount > 0)) {
      const net = built.netMass;
      liftLine = `浮力 ${built.liftMass.toFixed(1)}　压舱 ${(built.sandbagCount * RAP.PARTS.sandbag.mass).toFixed(1)}` +
        `　净重 ${net.toFixed(1)} kg　${net < 0 ? '会飘起来' : '压得住'}`;
    }    let boxLine = '';
    if (state.phase === 'run' && state.run) {
      const car = state.run.car;
      /* 行驶期顶栏第二行（第 71 轮重写）。
       *
       * 旧版显示「动力 2 / 1」—— 容量系统删掉之后这个数不存在了。
       * 现在这一行说三件**玩家此刻必须知道**的事：
       *   · 种子用了几颗（一次性，用了就没了）
       *   · 车现在处于什么特殊状态（冲刺 / 在风场里 / 站在岩柱上）
       *   · 速度
       *
       * 状态是用**同一个来源**算的（state.windField / car.dashT / groundY vs terrain），
       * 不是再判一遍 —— 否则 HUD 说"在风场里"而引擎不抬升，玩家会以为引擎坏了。 */
      const used = state.run.seedUse
        ? (state.run.seedUse.anemo + state.run.seedUse.geo + state.run.seedUse.electro) : 0;
      const seedTotal = car.parts.filter(p => p.def && p.def.seedKind).length;
      const tag = [];
      if (car.dashT > 0) tag.push('冲刺 ' + car.dashT.toFixed(1) + 's');
      if (state.run.windField) {
        const inField = Math.hypot(car.x - state.run.windField.x,
          car.y - state.run.windField.y) <= state.run.windField.r;
        tag.push(inField ? (car.windCatch > 0 ? '乘风中' : '风场里·没带伞') : '风场在附近');
      }
      if (state.run.pillars && state.run.pillars.length) tag.push('岩柱');
      const powText = seedTotal === 0 ? '无种子'
        : ('种子 用 ' + used + ' / ' + seedTotal + (tag.length ? '　' + tag.join('　') : ''));
      line = `总重 ${car.mass.toFixed(1)} kg　${powText}` +
        `　速度 ${Math.hypot(car.vx, car.vy).toFixed(1)} m/s`;
      boxLine = `木箱 ${state.run.boxesGot}/${state.run.boxes.length}`;
      if (car.liftMass > 0 || car.sandbagCount > 0) {
        const leftBags = car.sandbagCount || 0;
        liftLine = `气球 ${car.parts.filter(p => p.def.liftMass).reduce((a, p) => a + (p.n || 0), 0)}` +
          `　沙袋 ${leftBags}　净重 ${car.netMass.toFixed(1)} kg　${car.netMass < 0 ? '↑ 上升中' : '↓ 会落下'}`;
      }
    }
    /* 给测试留一个读取口：HUD 这一行是"玩家唯一能看到的浮力信息"，
     * 断言它比断言 car.netMass 更有意义（前者才是玩家实际读到的）。 */
    liftLineCache = liftLine;

    // 左上：暂停 / 重来（可点击）；右上：帮助
    if (state.phase === 'run') {
      const PB = btnRect('pause'), RB = btnRect('restartRun');
      const pc = { x: PB.x + PB.w / 2, y: PB.y + PB.h / 2 };
      ctx.fillStyle = state.paused ? '#63bf3f' : '#e0513c';
      ctx.beginPath(); ctx.arc(pc.x, pc.y, PB.w / 2, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff';
      if (state.paused) {
        ctx.beginPath();
        ctx.moveTo(pc.x - 6, pc.y - 10); ctx.lineTo(pc.x + 10, pc.y);
        ctx.lineTo(pc.x - 6, pc.y + 10); ctx.closePath(); ctx.fill();
      } else {
        ctx.fillRect(pc.x - 7, pc.y - 10, 5, 20);
        ctx.fillRect(pc.x + 2, pc.y - 10, 5, 20);
      }
      const rc = { x: RB.x + RB.w / 2, y: RB.y + RB.h / 2 };
      ctx.fillStyle = '#63bf3f';
      ctx.beginPath(); ctx.arc(rc.x, rc.y, RB.w / 2, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(rc.x, rc.y, 10, -0.6, 3.6); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(rc.x + 10, rc.y - 8); ctx.lineTo(rc.x + 11, rc.y + 2);
      ctx.lineTo(rc.x + 1, rc.y); ctx.closePath();
      ctx.fillStyle = '#fff'; ctx.fill();
      const HB = btnRect('help');
      const hcx = HB.x + HB.w / 2, hcy = HB.y + HB.h / 2;
      ctx.fillStyle = 'rgba(24,34,42,.88)';
      ctx.beginPath(); ctx.arc(hcx, hcy, HB.w / 2, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(232,200,122,.7)'; ctx.lineWidth = 2; ctx.stroke();
      text('?', hcx, hcy + 8, 22, '#ffe9b0', 'center', true);
    }
    if (state.paused && state.phase === 'run') {
      fillScreen('rgba(6,12,14,.52)');
      // 暂停面板：标题 + 两行真实可点的动作，别再只丢一行说明文字
      const P = pausePanel(), RR = pauseRowRects();
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
      ctx.fillStyle = 'rgba(12,24,30,.96)';
      roundRect(P.x, P.y, P.w, P.h, 16); ctx.fill();
      ctx.restore();
      ctx.strokeStyle = 'rgba(232,200,122,.5)'; ctx.lineWidth = 2;
      roundRect(P.x, P.y, P.w, P.h, 16); ctx.stroke();
      text('已暂停', DW / 2, P.y + 52, 30, '#ffe9b0', 'center', true);
      /* 自动暂停要写清**是谁按的暂停**。玩家自己按 Esc 看见这张卡，和
       * 切了个窗口回来迎面看见这张卡，是完全不同的两件事 ——
       * 不说清楚，玩家会以为游戏自己卡死了。 */
      text(state.autoPaused ? '窗口切走了，已经替你暂停' : '时间已停住，可以慢慢想',
        DW / 2, P.y + 78, 13, state.autoPaused ? '#ffd79a' : '#8fa3b4', 'center');

      const row = (r, label, key, main) => {
        ctx.fillStyle = main ? 'rgba(232,200,122,.92)' : 'rgba(24,40,50,.92)';
        roundRect(r.x, r.y, r.w, r.h, 10); ctx.fill();
        ctx.strokeStyle = main ? 'rgba(255,241,196,.9)' : 'rgba(232,200,122,.4)';
        ctx.lineWidth = 1.5; roundRect(r.x, r.y, r.w, r.h, 10); ctx.stroke();
        text(label, r.x + r.w / 2 - 16, r.y + 28, 15, main ? '#20180a' : '#e3eef6', 'center', true);
        // 右侧键帽
        ctx.fillStyle = main ? 'rgba(32,24,10,.18)' : 'rgba(255,255,255,.10)';
        roundRect(r.x + r.w - 54, r.y + 11, 38, 22, 6); ctx.fill();
        text(key, r.x + r.w - 35, r.y + 27, 11.5, main ? '#20180a' : '#9fb2c2', 'center', true);
      };
      row(RR.resume, '继续开', '空格', true);
      row(RR.back, '回建造（保留拼装）', 'R', false);
      text('Esc 也可以继续', DW / 2, P.y + P.h + 26, 12, 'rgba(190,212,228,.78)', 'center');
    }

    // 顶部信息条
    ctx.fillStyle = 'rgba(10,18,24,.88)'; roundRect(84, 90, 700, 30, 8); ctx.fill();
    ctx.strokeStyle = COL.goldDim; ctx.lineWidth = 1; ctx.stroke();
    text(line, 96, 111, 14, '#eaf4fb');

    // 行驶期的进度轨：告诉玩家"现在离终点还有多远"，顺带给出木箱/终点标记
    if (state.phase === 'run' && state.run) {
