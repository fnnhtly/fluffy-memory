<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>滚蛋吧！猪 · 垂直切片演示（1-1 ~ 1-6）</title>
<style>
  html, body { margin: 0; padding: 0; background: #10161c; overflow: hidden;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
  #wrap { position: fixed; inset: 0; display: block; }
  canvas { display: block; box-shadow: 0 10px 40px rgba(0,0,0,.6); cursor: pointer;
    width: 100vw; height: 100vh; }
  #panel { position: fixed; right: 16px; top: 16px; width: 264px; padding: 12px 14px;
    background: rgba(12,20,26,.94); border: 1px solid #2b3a45; border-radius: 10px; color: #cfe0ef;
    font-size: 12px; display: none; z-index: 10; }
  #panel h3 { margin: 0 0 8px; font-size: 13px; color: #9fd66a; font-weight: 600; }
  #panel label { display: flex; justify-content: space-between; margin: 7px 0 2px; }
  #panel input[type=range] { width: 100%; }
  #panel .val { color: #ffd93d; }
  #panel .note { color: #7f8c99; line-height: 1.5; margin-top: 10px; }
  #panel button { margin-top: 10px; width: 100%; padding: 6px; background: #2f6b33; color: #dfffe0;
    border: 1px solid #4f9a52; border-radius: 6px; cursor: pointer; }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="1280" height="720"></canvas></div>

<div id="panel">
  <h3>数值调参（真机基线就用这套值）</h3>
  <div id="sliders"></div>
  <button id="reset">恢复默认</button>
  <div class="note">地面摩擦调到 2~3 会明显变粘，但靠惯性滑的关卡（1-1/1-2/1-5）会走不远 —— 想两者都要就调 1.0 左右。改完直接发射试。</div>
</div>
<script src="levels.js"></script>
<script src="game.js"></script>
<script>
(function () {
  'use strict';
  const cv = document.getElementById('cv');
  let ctx = cv.getContext('2d');   // let：离屏缓存时会临时切换（见 paintOffscreen）
  // 设计分辨率（所有坐标都基于它）；实际画布按窗口等比缩放
  const DW = 1280, DH = 720, PPM = 32;
  /* 闭包里需要一个"当前 HUD 净重行"的读取点（供测试断言玩家实际看到的文字）。
   * 必须声明在 window.__rap 之前 —— 那里用箭头函数引用它，运行时才取值。 */
  let liftLineCache = '';

  // 千星的画布预设（用于自测各尺寸下的排版）
  const CANVAS_PRESETS = [
    { id: 'pc-16-9', label: 'PC 1600×900', w: 1600, h: 900 },
    { id: 'pc-21-9', label: 'PC 2100×900', w: 2100, h: 900 },
    { id: 'mobile-16-9', label: '手机 1280×720', w: 1280, h: 720 },
    { id: 'mobile-19.5-9', label: '手机 1560×720', w: 1560, h: 720 },
    { id: 'mobile-4-3', label: '手机 1280×960', w: 1280, h: 960 }
  ];
  let curPreset = 0;      // 当前模拟的画布尺寸（只影响自测与显示）

  // 把画布像素对齐到"设计分辨率 × 缩放"，避免非整数缩放导致的模糊
  // 当前可视尺寸（设计坐标）。默认 = 设计分辨率；宽/高比例变化时扩展对应方向
  // ---------- 离屏缓存画布（性能：静态层不每帧重画）----------
  let terrainCache = null, terrainCacheId = '';
  /* 石头渐变缓存（见 drawWorld 里那段注释）。键 = 深度色 + 尺寸。 */
  const stoneGradCache = new Map();
  const stoneLayer = document.createElement('canvas');
  const stoneCtx = stoneLayer.getContext('2d');
  let stoneCacheKey = '';
  const skyLayer = document.createElement('canvas');
  const skyCtx = skyLayer.getContext('2d');
  let skyCacheKey = '';

  // 确定性伪随机（石头/碎石纹理用）
  function texHash(a, b) {
    let h = (a * 374761393 + b * 668265263) & 0x7fffffff;
    h = (h ^ (h >> 13)) * 1274126177 & 0x7fffffff;
    return ((h ^ (h >> 16)) & 0xffff) / 0xffff;
  }

  let VIEW_W = DW, VIEW_H = DH;
  let VIEW_OFF_X = 0, VIEW_OFF_Y = 0;   // 扩展后设计坐标的偏移（HUD 居中用）

  function applyCanvasSize() {
    const r = cv.getBoundingClientRect();
    const dpr = Math.min(1.5, window.devicePixelRatio || 1);   // 性能：4K 屏别画 2 倍
    const cssW = Math.max(320, r.width || DW);
    const cssH = Math.max(180, r.height || DH);
    const w = Math.round(cssW * dpr);
    const h = Math.round(cssH * dpr);
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }

    // 以 1280×720 为基准等比铺满（cover），超出的方向扩展可视范围
    const scale = Math.max(DW / cssW, DH / cssH);
    VIEW_W = Math.round(cssW * scale);
    VIEW_H = Math.round(cssH * scale);
    VIEW_OFF_X = (VIEW_W - DW) / 2;
    VIEW_OFF_Y = (VIEW_H - DH) / 2;

    // 缩放：1 设计像素 = w/VIEW_W 实际像素
    const sx = w / VIEW_W, sy = h / VIEW_H;
    ctx.setTransform(sx, 0, 0, sy, VIEW_OFF_X * sx, VIEW_OFF_Y * sy);
    // 供测试核对"设计区是否完整可见"（宽高比变化时靠扩展可视范围来 cover）
    window.__view = { W: VIEW_W, H: VIEW_H, offX: VIEW_OFF_X, offY: VIEW_OFF_Y,
                      cssW: cssW, cssH: cssH, pxW: w, pxH: h, dpr: dpr, scale: scale };
  }

  // ---------- 视觉参数 ----------
  const COL = {
    // 原神黄昏调：天空由上到下 深青 → 青 → 暖金地平线
    skyTop: '#8FC4E0', skyMid: '#CFE6D8', skyLow: '#F2F0C0',
    hillFar: '#7FA8B8', jungle: '#2F6B5A', jungle2: '#27584A',
    stone: '#7C8694', stone2: '#6E7E8C', stoneHi: '#94A3AE', stoneLo: '#4A5866',
    grass: '#7FBF5A', grassRim: '#C9E37A', shadow: '#2C5A38',
    mud: '#8A7A5A', ice: '#9FE3F2', iceEdge: '#D9F6FF',
    grid: 'rgba(120,170,130,.45)', gridSel: 'rgba(232,200,122,.85)',
    wood: '#C08A4A', woodDark: '#8A5F30', wheel: '#3A4048', iron: '#5A6672', ironRim: '#C8D2DC',
    pig: '#6FC25A', motor: '#E06A4A', battery: '#8FD66A', pump: '#4F8FB0',
    box: '#D9A94A', flag: '#E2574C', ink: '#16211A',
    gold: '#E8C87A', goldDim: '#8A7448', panel: 'rgba(18,30,40,.92)'
  };


  /* 托盘 = **本关给的零件** + 橡皮（第 67 轮，用户要求：
   * 「为什么本关不给的零件要显示在物品栏」）。
   *
   * 原来托盘是 `RAP.TRAY_ORDER.concat(['eraser'])` —— 十三件全画出来，
   * 本关不给的显示成 0 且变暗。当时理由是"让玩家知道游戏里还有什么"，
   * 但这个理由站不住：
   *   · 1-1 只需要三件，另外十件**永远**是 0，托盘一半是死格子；
   *   · 0 的格子仍然占着位置、仍然要点一下才知道没货；
   *   · 更糟的是它把"这一关的题面"藏起来了 —— 玩家看不出关卡设计师
   *     给了他哪几件工具，而那正是解谜的起点（参考里托盘就是本关的零件箱）。
   *
   * 所以托盘改成**本关零件箱的投影**：partsBox 里有几件就画几格。
   * 这样"托盘变空/变满"本身就在传达关卡难度变化，也顺手让每个槽变宽、
   * 图标变大、能挂数字键徽标（见 drawTray）。
   *
   * 注意 `TRAY` 必须保持**可变**：下面大量地方直接读它（键盘 1-9、
   * dragFromTray、弹回动画的落点），换关时原地替换内容而不是重新绑定。
   * 唯一真源仍是 level().partsBox —— 这里只做投影，不另存一份。 */
  let TRAY = [];
  function refreshTray() {
    const box = (level() && level().partsBox) || {};
    TRAY = RAP.TRAY_ORDER.filter(p => (box[p] || 0) > 0).concat(['eraser']);
  }

  const state = {
    levelIndex: 0, phase: 'build', build: RAP.newBuild(),
    /* 开局默认拿着木框：一进关直接点网格就能落第一块框，
     * 不必先去托盘点一下（新手最容易卡住的就是"我点了格子怎么没反应"）。 */
    selected: 'wood_frame',
    /* `selectedByUser`：这个选中是**玩家点出来的**，还是开局预置的默认值？
     * 只有前者才能"再点一次取消"。没有这个区分的话，第一次点木框槽
     * 会把它当成"再点取消"，玩家想选却把它放下了（第 64 轮回归事故）。 */
    selectedByUser: false,
    dragPart: null, dragFromTray: false, mouse: { x: 0, y: 0, down: false },
    helpOpen: false, paused: false, bounce: null, debris: [], bursts: [], slowmo: 0, lastImpact: null,
    /* 提示的当前层，**直接就是数组下标** 0/1/2。点一次 +1，到 2 就不再变。
     *
     * 这里踩过一个坑：最初写成"0 = 还没点过"，第一次点置成 1，
     * 而渲染层读的是 `hintFor(lv, tier)` —— 于是第一次点直接显示第 2 层，
     * 第 1 层（那句"该往哪个方向造"的思路）**永远看不到**。
     * 而第 1 层恰恰是最有用的那层：它不剧透答案，只给方向。
     * 现在 0 就是第一层，`hintSeen` 单独记"有没有点过"。 */
    hintTier: 0, hintOpen: false, hintSeen: false,
    /* ---------- 观察模式（第 64 轮，用户要求） ----------
     *
     * 用户原话：「在物品栏加个观察键，点击一下就可以移动视角，
     * 可以 wasd（电脑）和长按屏幕出摇杆控制，结束长按摇杆就立刻消失」。
     *
     * 为什么单独做一个模式，而不是"建造期随时能拖"：
     *   · 建造期的拖拽已经被"放零件"占满了，左键抢不过来；
     *   · 但**右键拖动**已经有了（第 62 轮），只是没人会想到去试。
     * 观察键把这条能力显式化，并且在手机上没有右键 —— 所以必须有一个按钮。
     *
     * 摇杆是**长按才出现、松手立刻消失**的（用户明确要求）。
     * 不做成常驻虚拟摇杆：那会永久占掉屏幕左下角，而左下角在行驶期
     * 是交互按钮的位置。 */
    observe: false,          // 观察模式开着吗
    observeKeys: {},         // WASD 按住状态
    joystick: null,          // { ox, oy, x, y, dx, dy } 长按时的虚拟摇杆
    joyLongPress: null,      // 长按计时器 id
    joyHoldStart: 0,         // 按下时刻（ms），用于判定"长按"
    camState: { x: 0, y: 0, zoom: 1.7 }, shake: 0, flash: 0, vignette: 0, levelSelect: false,
    introT: 0,        // 入场镜头进度 0→1
    outroT: 0,        // 结算过渡进度 0→1
    runBanner: 0,     // 出发横幅剩余时间（秒）
    confetti: [], dust: [], starSfxIdx: -1,
    popped: {},        // 刚落下的格子 → 播放弹性
    welcome: 0,        // 0=关闭，1..3=第几页
    cam: { x: 0, y: 0, zoom: 2.1 }, toast: '', toastT: 0, resultT: 0,
    /* 建造相的"看全图"镜头（见 buildViewDefault）。null = 还没为本关初始化过。
     * 和 camState（行驶相、跟随车）是两个，不能合并：一个是自由摆放，
     * 一个是每帧缓动到车身，语义相反。 */
    buildView: null,
    /* 建造相拖拽平移：记下"按下那一刻的镜头"和指针，拖的时候按差值移动。
     * 必须存起点而不是每帧累加 —— 每帧累加会随帧率漂移（鼠标事件比 rAF 密）。 */
    panDrag: null,
    replayT: 0, replayIdx: 0,
    /* 按住状态：交互键是"按住蓄力"，所以必须知道"这个键现在还按着吗"。
     * 浏览器 auto-repeat 会在按住期间反复发 keydown，靠它把这些重复挡掉
     * （见 keydown 分支里的注释与 tools/test_hold_key.js）。 */
    heldKeys: {},
    heldBtn: 0,
    /* 这次暂停是不是"切走窗口"自动按下的（见 loseFocus）。
     * 只用来把暂停卡上的那行说明改一句话 —— 玩家自己按 Esc 看见的卡，
     * 和切了个窗口回来迎面看见的卡，不说清楚会被当成游戏卡死。 */
    autoPaused: false,
    lastBreakSfx: 0
  };

  const levels = window.RAP_LEVELS;

  // ---------- 关卡进度（localStorage，关掉页面也在） ----------
  const SAVE_KEY = 'rap-progress-v1';
  let progress = {};
  try {
    progress = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}') || {};
  } catch (e) { progress = {}; }

  /* 三星是**累计**的，不是一局定生死。
   *
   * 这是照《捣蛋猪》改的（见 docs/reference-badpiggies.md §3）：
   * 参考里一篇百科原话是「每一关的三星是采用累计的方式获得……分别三次获取也算作三星通关」。
   * 我们原来的做法是"这一局同时满足几个条件就算几星"，后果是玩家一旦没在一局里
   * 全做到，就必须整关重来——第三颗星从目标变成了惩罚。
   *
   * 现在每一颗星是一个**永久标记**（到达 / 全木箱 / 挑战条件），
   * 满足一次就永久点亮，此后任何一局失败都不会熄灭它。
   */
  const GOALS = ['arrive', 'boxes', 'challenge'];
  function mergeGoals(oldGoals, newGoals) {
    const g = Object.assign({ arrive: false, boxes: false, challenge: false }, oldGoals || {});
    GOALS.forEach(k => { if (newGoals && newGoals[k]) g[k] = true; });
    return g;
  }
  function starsOf(goals) {
    return GOALS.reduce((n, k) => n + (goals && goals[k] ? 1 : 0), 0);
  }
  // 存档里可能还是旧格式（只有 stars 数字，没有 goals）。不迁移的话，
  // 老存档的星会显示成 0 颗——看起来像"进度丢了"，实际是格式变了。
  function migrateRecord(rec) {
    if (!rec) return null;
    if (rec.goals) return rec;
    const g = { arrive: (rec.stars || 0) >= 1, boxes: (rec.stars || 0) >= 2,
                challenge: (rec.stars || 0) >= 3 };
    return Object.assign({}, rec, { goals: g });
  }
  function readRecord(levelId) {
    let rec = progress[levelId];
    try {
      const raw = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}') || {};
      if (raw[levelId]) rec = raw[levelId];
    } catch (e) {}
    return migrateRecord(rec);
  }

  /* 金币已经**整个删掉了**（第 61 轮，按用户要求）。
   *
   * 原来的金币是推导出来的（coinsOf ← 已点亮星 ×50 + 最好木箱 ×30），
   * 所以"重刷不刷钱"这件事是对的 —— 但**它没有任何出口**：
   * 全项目搜不到一处花金币的地方，结算卡上写的 +180 只是往一个
   * 永远用不上的口袋里塞数字。
   *
   * 按用户的原话：「取消金币，只计算通关的星星，重复通关不能获得或者只能
   * 获得以前没拿到的星星。后面可以把星星设计有对应的成就」。
   * 所以现在唯一的进度货币就是星：
   *   - 星是**累计**的永久标记（见上面的 mergeGoals），重刷只补没点亮的那几颗；
   *   - 没有任何可以攒、可以花、会漂移的数字。
   * 唯一读星数的地方是 totalStars()（结算卡底部、选关页进度条）。
   */
  function totalStars() {
    return levels.reduce((n, lv) => {
      const pr = readRecord(lv.levelId);
      return n + (pr ? starsOf(pr.goals) : 0);
    }, 0);
  }
  /* 整个切片打通了吗？
   *
   * 为什么要专门问这一句：第 40 轮把六关都真跑了一遍（probe_chapter_end.js），
   * 打完 1-6 的三星之后，屏幕上唯一的"终局"表达是一颗**灰掉的**
   * 「已是最后一关」按钮 —— 玩家把垂直切片通关了，游戏一个字都没说。
   * 这和"第三颗星是惩罚"是同一类错误：内容做完了，却没有收束。
   *
   * 判据只看 arrive（是否到过终点），不看星数 —— 全三星是"完美"，
   * 但**打通**不等于全三星，两件事不能混成一个门槛。 */
  function chapterDone() {
    return levels.every(lv => {
      const pr = readRecord(lv.levelId);
      return !!(pr && pr.goals && pr.goals.arrive);
    });
  }
  /* 结算页右下那个按钮到底是什么，只有一份定义。
   *
   * 三种情况：
   *   1) 还有下一关        → 「下一关」N
   *   2) 最后一关但没打通  → 「已是最后一关」灰掉（这才是它该有的样子）
   *   3) 最后一关且已打通  → 「章节总览」L，点开选关看整张地图
   *
   * 第 3 种是把一颗死按钮换成真动作：玩家走到终点时最想看的东西，
   * 就是"我一共点亮了多少"。它同时也给了卡面一个天然的收尾。 */
  function resultNextBtn() {
    const hasNext = state.levelIndex < levels.length - 1;
    if (hasNext) return { label: '下一关', disabled: false, keycap: 'N', action: 'next' };
    if (chapterDone()) return { label: '章节总览', disabled: false, keycap: 'L', action: 'overview' };
    return { label: '已是最后一关', disabled: true, keycap: null, action: 'none' };
  }
  /* 写存档：goals 取并集（只增不减），时间取最短，木箱取最好。
   * 返回 { before, after }，让调用方知道"这一次到底点亮了哪颗新星"。
   *
   * 注意：存档里**没有** coins 字段（第 61 轮删干净了，见下面 totalStars 上方的
   * 长注释）。`boxes` 保留着 —— 它现在没有读者，但它是"最好一次吃到几个木箱"，
   * 和「木箱全收」那颗星不是同一件事（5/6 也能是合法成绩），
   * 以后做成就（"累计收集 N 个木箱"）时是唯一现成的数据源。 */
  function saveProgress(levelId, goals, time, boxesGot) {
    const cur = migrateRecord(progress[levelId]) ||
      { goals: { arrive: false, boxes: false, challenge: false }, best: null, boxes: 0 };
    const before = Object.assign({}, cur.goals);
    cur.goals = mergeGoals(cur.goals, goals);
    if (!cur.best || time < cur.best) cur.best = time;
    if (typeof boxesGot === 'number' && boxesGot > (cur.boxes || 0)) cur.boxes = boxesGot;
    cur.stars = starsOf(cur.goals);        // 冗余字段：给旧代码/旧存档读
    delete cur.coins;                      // 旧存档里残留的 coins 字段一并清掉
    progress[levelId] = cur;
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(progress)); } catch (e) {}
    return { before, after: Object.assign({}, cur.goals) };
  }
  const level = () => levels[state.levelIndex];

  // ---------- 音效：WebAudio 现场合成，不依赖任何素材 ----------
  /* 音效调用记录（给测试读的，最多留 24 条）。
   *
   * 为什么需要它：SFX 走的是 WebAudio，测试**读不到声音**。
   * 于是"碎框有一声专属音"这种改动，在自动化里本来是没法验的 ——
   * 只能靠人听。有了这个环形记录，测试可以断言"碎框那一下触发的是
   * structBreak 而不是 crack/impact 的那一支"，也就是**分支被走对了**。
   * 它只存名字，不参与任何逻辑。 */
  const fxLog = [];
  function logFx(name) {
    fxLog.push(name);
    if (fxLog.length > 24) fxLog.shift();
  }
  /* 静音开关（第 59 轮）。
   *
   * 之前**一个静音/音量控件都没有** —— 对一个合成音效很密的游戏来说，
   * 玩家能做的只有去调系统音量。而且 SFX 里每个节点都直接连 `a.destination`，
   * 就算想加个总音量也没地方挂。
   *
   * 静音的实现不只是"把增益拧到 0"，而是**根本不创建振荡器**。理由很实际：
   * 无头环境里 AudioContext 永远是 suspended、`currentTime` 永远是 0、
   * `setTargetAtTime` 永远到不了目标值（见 tools/probe_audio_env.js）——
   * 在那里"读一个增益值"的断言非常容易变成永远为真的空话。
   * 而"静音时 createOscillator 被调了几次"是同步可数的，能真的失败。
   * 顺带的好处：静音时连 AudioContext 都不建，不碰音频设备。
   */
  const MUTE_KEY = 'rap-muted-v1';
  let muted = false;
  try { muted = localStorage.getItem(MUTE_KEY) === '1'; } catch (e) { muted = false; }

  const SFX = (() => {
    let ac = null;
    let ROLL = null;
    let master = null;
    /* 真的建了几个发声节点。给测试读的（无头里声音听不到、增益也读不准，
     * 但这个数是同步可数、可以真的变红的）。 */
    const stat = { tones: 0, noises: 0, osc: 0 };
    const VOL = 0.85;
    const ensure = () => {
      try {
        if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
        if (ac.state === 'suspended') ac.resume();
      } catch (e) { ac = null; }
      return ac;
    };
    /* 总音量总线：所有声音从这里过一手。懒建（跟着 AudioContext 一起），
     * 所以"静音时根本没建过 master"也是一条可断言的事实。 */
    const bus = a => {
      if (!master) {
        master = a.createGain();
        master.gain.value = muted ? 0 : VOL;
        master.connect(a.destination);
      }
      return master;
    };
    function tone(freq, dur, type, gain, slideTo) {
      if (muted) return;                       // 静音：连节点都不建
      const a = ensure(); if (!a) return;
      stat.tones++; stat.osc++;
      const o = a.createOscillator(), g = a.createGain();
      o.type = type || 'triangle';
      o.frequency.setValueAtTime(freq, a.currentTime);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime + dur);
      g.gain.setValueAtTime(0.0001, a.currentTime);
      g.gain.exponentialRampToValueAtTime(gain || 0.12, a.currentTime + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
      o.connect(g); g.connect(bus(a));
      o.start(); o.stop(a.currentTime + dur + 0.02);
    }
    function noise(dur, gain) {
      if (muted) return;
      const a = ensure(); if (!a) return;
      stat.noises++;
      const n = Math.floor(a.sampleRate * dur);
      const buf = a.createBuffer(1, n, a.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const src = a.createBufferSource(); src.buffer = buf;
      const g = a.createGain(); g.gain.value = gain || 0.08;
      src.connect(g); g.connect(bus(a)); src.start();
    }
    return {
      place(h) {
        // 越往上音越高（h 建议传 0..1）
        const f = 440 + (h || 0) * 260;
        tone(f, 0.07, 'square', 0.07);
      },
      /* 卸下（拖出网格松手）：和"放下"反着来 —— 音高往下走、更轻。
       * 玩家要能听出"这次不是放，是拿走"。 */
      remove() { tone(380, 0.08, 'triangle', 0.07, 210); },
      deny() { tone(180, 0.12, 'sawtooth', 0.07, 120); },
      launch() { noise(0.25, 0.09); tone(220, 0.25, 'sine', 0.09, 520); },
      box() { tone(880, 0.09, 'sine', 0.1); tone(1320, 0.09, 'sine', 0.06); },
      win() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.18, 'triangle', 0.1), i * 110)); },
      fail() { tone(300, 0.22, 'sawtooth', 0.09, 140); setTimeout(() => tone(220, 0.28, 'sawtooth', 0.08, 110), 140); },
      pump() { tone(300, 0.1, 'square', 0.06, 700); },
      /* 扎气球：短促的"啪"（噪声爆 + 一个高频滑落）。
       * 沙袋：低沉的"咚"。名字不能叫 thud —— 下面已经有一个分级触地音叫 thud(lvl)，
       * 对象字面量里同名键后者覆盖前者，于是 `SFX.thud()` 会走进触地音那条分支、
       * 拿到 lvl=undefined → NaN 时长 → AudioParam 抛异常（真跑红过一次）。 */
      pop() { noise(0.08, 0.16); tone(900, 0.09, 'square', 0.08, 320); },
      bagDrop() { tone(120, 0.14, 'sine', 0.11, 62); noise(0.05, 0.06); },
      hurt() { tone(160, 0.16, 'square', 0.08, 90); },
      /* 木框掉耐久（还没碎）：木头裂开的"咔"。
       * 和 SFX.hurt 分开 —— hurt 是猪被撞疼（红），crack 是结构受损（棕）。
       * 两者在同一个时间点可能都发生，用同一个音就分不清"谁受伤了"。 */
      crack() { logFx('crack'); noise(0.07, 0.10); tone(240, 0.13, 'square', 0.07, 110); },
      /* 木框碎了（不是裂，是散）：三段不同音高的木头断裂 + 一声重噪声。
       * 和 crack() 必须明显不同 —— 裂是"提醒你还行"，碎是"这局没了"。
       * 原来碎框**没有任何专属音效**，只有一个通用的撞击音；
       * 玩家听到的和"撞了一下"完全一样，但结果差了一个星。 */
      structBreak() {
        logFx('structBreak');
        noise(0.16, 0.20);
        tone(190, 0.20, 'square', 0.10, 70);
        setTimeout(() => { noise(0.10, 0.14); tone(120, 0.18, 'sine', 0.09, 55); }, 90);
      },
      star(n) { tone(660 + (n || 0) * 220, 0.12, 'triangle', 0.1); },   // 星星逐颗弹出
      cheer() { [784, 988, 1175].forEach((f, i) => setTimeout(() => tone(f, 0.22, 'sine', 0.09), i * 90)); },
      // 轮子滚动环境音：用持续振荡器，速度调制频率与音量
      rollStart() {
        /* 静音时**不许**起这条持续振荡器：它不归 tone() 管，
         * 漏掉这一处的话"静音"只是把一次性的音关掉，滚动的嗡嗡声还在响。 */
        if (muted) return;
        const a = ensure(); if (!a || ROLL) return;
        try {
          const o = a.createOscillator(), g = a.createGain();
          o.type = 'sawtooth';
          o.frequency.value = 60;
          g.gain.value = 0.0001;
          o.connect(g); g.connect(bus(a));
          o.start();
          ROLL = { o, g };
          stat.osc++;
        } catch (e) {}
      },
      rollSet(speed) {
        if (!ROLL) return;
        const a = ensure(); if (!a) return;
        const v = Math.max(0, Math.min(1, (speed - 1.5) / 10));
        ROLL.o.frequency.setTargetAtTime(50 + v * 130, a.currentTime, 0.08);
        ROLL.g.gain.setTargetAtTime(v * 0.022, a.currentTime, 0.08);
      },
      thud(lvl) {
        // 分级触地音：级别越高越低越沉
        const base = [0, 420, 320, 220, 150][Math.min(4, lvl)] || 300;
        tone(base, 0.05 + lvl * 0.02, 'sine', 0.03 + lvl * 0.02, base * 0.6);
        if (lvl >= 3) noise(0.10 + lvl * 0.03, 0.03 + lvl * 0.015);
      },
      /* 马达断电：一次低频闷响 + 一个下行的"停机"音。
       * 量级比 thud(3) 小 —— 不是撞了什么，是**东西停了**。 */
      motorOut() {
        logFx('motorOut');
        tone(140, 0.30, 'sawtooth', 0.06, 70);
        setTimeout(() => { tone(90, 0.26, 'sine', 0.05, 55); }, 140);
      },
      rollStop() {
        if (!ROLL) return;
        const a = ensure(); if (!a) { ROLL = null; return; }
        ROLL.g.gain.setTargetAtTime(0.0001, a.currentTime, 0.1);
        const r = ROLL; ROLL = null;
        setTimeout(() => { try { r.o.stop(); } catch (e) {} }, 400);
      },
      /* 静音开关与它的读数。
       *
       * `stat` 是**真的建了几个发声节点**（不是"调了几个 SFX 函数"）——
       * 静音时 `tone()`/`noise()`/`rollStart()` 都在建节点之前就 return，
       * 所以 muted 时 osc 必须停在 0。这条能真的失败：把某处的 `if (muted) return;`
       * 删掉，那个计数立刻涨。
       *
       * 为什么不用"master 增益 == 0"来当判据：无头环境里 AudioContext 永远
       * suspended、currentTime 永远 0，setTargetAtTime 到不了目标值；
       * 读增益是个非常容易永远为真的空断言（见 tools/probe_audio_env.js）。 */
      setMuted(v) {
        muted = !!v;
        try { localStorage.setItem(MUTE_KEY, muted ? '1' : '0'); } catch (e) {}
        if (muted) {
          /* 正在滚的话先把那条持续振荡器停掉，否则它会一直响到关页面。 */
          this.rollStop();
          if (master) master.gain.value = 0;
        } else if (master) {
          master.gain.value = VOL;
        }
        return muted;
      },
      isMuted() { return muted; },
      stats() { return { tones: stat.tones, noises: stat.noises, osc: stat.osc, muted: muted, hasMaster: !!master }; },
      _resetStats() { stat.tones = 0; stat.noises = 0; stat.osc = 0; }
    };
  })();

  // 铺满整个可视区（宽屏时覆盖扩展部分，避免黑边）
  function fillScreen(style) {
    ctx.fillStyle = style;
    ctx.fillRect(-VIEW_OFF_X - 4, -VIEW_OFF_Y - 4, VIEW_W + 8, VIEW_H + 8);
  }

  // ---------- 坐标 ----------
  /* ══════════════ 拼装区锚定在**世界坐标**上（第 64 轮重构）══════════════
   *
   * 用户原话：「你的拼装区应该以地图位置为基而不是以屏幕为基，
   * 而且拼装区拼装的车的位置要出现在地图相同位置。」
   *
   * ── 旧做法错在哪 ──
   *
   * `buildOrigin()` 以前返回一个**写死的屏幕坐标**：
   *     { x: DW/2 - 6*44/2 - 40, y: 222 }
   * 也就是说拼装面板是"贴"在屏幕上的一个 UI 元素。后果有三条：
   *
   *   1. 车在拼装区里的位置和它在地图上的出发位置**没有任何关系**。
   *      玩家在面板里把猪放在第 2 列，出发后车却从地图的 start.col 冒出来 ——
   *      中间那一步是隐形的，玩家无法建立"我摆的就是它要跑的样子"的直觉。
   *   2. 滚动/缩放地图时面板纹丝不动，看起来像两套东西叠在一起。
   *   3. 地形在面板底下穿过去，但两者不在一个坐标系里，
   *      "车会不会撞到那个坡"完全看不出来。
   *
   * ── 现在的做法 ──
   *
   * 网格有了**世界锚点**：格 (r, c) 的世界坐标是
   *     worldX(c) = anchorX + (c - 2.5)
   *     worldY(r) = anchorY + (3.5 - r)
   * 而 anchorX/anchorY 就是**车出发那一刻的位置**（createRun 里的 startX/startY）。
   * 于是：
   *   · 拼装区画在地图上的正是车将要出现的地方；
   *   · 缩放/平移地图时面板跟着走（它本来就长在地图上）；
   *   · 面板底下的地形就是出发点的地形。
   *
   * 格子边长不再是常量 44，而是 `PPM * zoom`（1 格 = 1 米）。
   * 这让"拼装区里的 1 格"和"地图上的 1 格"在视觉上也一致。
   */
  const BUILD_ANCHOR_COL = 2.5, BUILD_ANCHOR_ROW = 3.5;   // 车心在网格中的位置

  /* 远景视差比例（第 65 轮，用户要求：「背景的山不要完全跟随镜头」）。
   *
   * 定义：远景在**屏幕**上的移动量 ÷ 地形在屏幕上的移动量。
   *   0   = 完全不动（旧行为，看起来像贴在镜头上的壁纸）
   *   1   = 和地形同速（山就在脚边，纵深没了）
   *   0.36 = "几公里外"的观感
   * 0.12 是同比例用在纵向上的值（俯视时山不会突然顶到天上）。
   *
   * 提到模块作用域，是因为它要能被 `state.hillParX` 覆盖 ——
   * 测试要能临时把它设成 0 证明自己的量具会变红（见 test_hill_parallax）。 */
  const DEFAULT_HILL_PAR_X = 0.36, DEFAULT_HILL_PAR_Y = 0.12;

  /* 车心离地多高。**这是个常量，不许跟着 state.build 变**。
   *
   * 原来这里算的是"当前车上最低的那个轮子的下沿"，想让拼装区的车
   * 严丝合缝地贴在地面上。想法没错，后果很糟：
   * 空车时 `lowest = 0.5`，放下**第一个轮子**的瞬间 `lowest` 变成 -1.84，
   * 整块拼装板连着里面的车**凭空往上跳 2.3 米**（比一格还高）。
   * 玩家的手还按在原来的格子上，格子已经跑了。
   *
   * 现在固定成**标准车的实际静止高度** —— 这个数不是猜的，
   * `tools/probe_rest_height.js` 对真实的标准车量出来是 1.85 m
   * （木框行 ly=-1.5、轮底 -1.84，`createRun` 把车心放在地表 +1.85）。
   * 用同一个数，拼装时看到的高度就是出发时的高度，而且拼装板**永远不动**。 */
  const BUILD_REST_Y = 1.85;

  /* 网格锚点的世界坐标 = 车的出发位置。
   * 横向和 game.js `createRun` 的 startX 完全一致（列 + 0.5）；
   * 纵向见 BUILD_REST_Y 上面那段。 */
  function buildAnchorWorld() {
    const lv = level();
    const ter = terrainCache || RAP.makeTerrain(lv);
    const startX = lv.start.col + 0.5;
    return { x: startX, y: ter.surfaceY(startX) + BUILD_REST_Y };
  }

  /* 一格的屏幕边长。建造相用 state.buildView（观察时会变），行驶相用 camState。 */
  function buildCellPx() {
    const z = (state.phase === 'build' && state.buildView)
      ? state.buildView.zoom
      : (state.camState ? state.camState.zoom : 2.1);
    return PPM * z;
  }

  /* 网格左上角（= 格 (0,0) 的左上角）在屏幕上的位置。绘制与点击共用这一份。 */
  function buildOrigin() {
    const cam = (state.phase === 'build' && state.buildView)
      ? state.buildView
      : (state.camLive || state.camState || { x: 0, y: 0, zoom: 2.1 });
    const a = buildAnchorWorld();
    const px = PPM * cam.zoom;
    // 车心（格 3.5, 2.5）画在世界 (a.x, a.y)
    const centerX = DW / 2 + (a.x - cam.x) * px;
    const centerY = DH / 2 - (a.y - cam.y) * px;
    return {
      x: centerX - (BUILD_ANCHOR_COL + 0.5) * px,
      y: centerY - (BUILD_ANCHOR_ROW + 0.5) * px,
      px: px
    };
  }
  function worldToScreen(wx, wy, cam) {
    const s = PPM * cam.zoom;                 // zoom 是"倍率"，实际每米像素 = PPM * zoom
    return { x: DW / 2 + (wx - cam.x) * s, y: DH / 2 - (wy - cam.y) * s };
  }
  function buildCam() {
    /* ⚠ 这里原来是 `RAP.makeTerrain(level())` —— **每次调用都重建一次地形**。
     *
     * makeTerrain 要跑 3 遍 5-tap 高斯平滑（40~66 列 × 18 行），
     * 而 buildCam() 在建造相里被调用的频率是**每帧一次以上**
     * （frameBody 一次 + 每次鼠标事件的坐标反算一次）。
     *
     * 这处开销一直存在，但第 61 轮之前建造镜头是写死的
     * `{x: start+3.2, y: sy+1.55, zoom: 2.1}`，`sy` 只需要一个数，
     * 整帧的预算还撑得住，所以没人发现。
     * 第 62 轮把建造镜头改成"看全图"之后它变成了压垮性能的那一根：
     * tools/test_perf_stable 报建造页 **20.5 fps**（基线 60.9 的 0.34）。
     *
     * 现在走 terrainCache（frameBody 里已经按 levelId 维护好了同一份）。
     * 代价是"缓存还没建好时调用"要自己兜底 —— 这正是 `||` 那一段。 */
    const ter = terrainCache || RAP.makeTerrain(level());
    const sy = ter.surfaceY(level().start.col + 0.5);
    return { x: level().start.col + 3.2, y: sy + 1.55, zoom: 2.1 };
  }

  /* ---------- 关卡地形预览条（第 60 轮） ----------
   *
   * 为什么要有：建造镜头只框住起点前后 ±9.5 米（probe_build_view.js 逐关量过），
   * 六关的终点旗**全都**落在画面之外。也就是说玩家在拼装区看不到自己要跑的那段地形，
   * "装轮子还是装气球、要不要留刹车"只能靠反复发射去试 —— 这不是难度，是信息缺失。
   *
   * 三条刻意的取舍：
   *
   * 1) 竖向**统一比例尺**，不按关卡自动拉伸。六关里最陡的是 1-6 的崖（落差 10 米），
   *    拿它当满量程：条内高 28px / 10m = 2.8 px/m。于是 1-3 的地形（0.70 米）
   *    在条上真的几乎是一条直线 —— 那是实话，它就是这么平。
   *    自动归一化会把它画成山，等于骗玩家去为一个不存在的地形准备。
   *
   * 2) 竖向按**世界高度**贴：地表 0 米贴条底、10 米贴条顶。
   *    不按每关自己的最高点对齐，所以 1-1 整条浮在中上部、1-6 的崖顶真的顶到条顶。
   *    玩家换关时能看出"这关比上一关高出一截"，而不是每关都被拉成一样高。
   *
   * 3) 横向裁到 [起点列, 终点列 + 2]，并且**必须把木箱列也圈进来**。
   *    全剖面 40~66 列里有一半是跑不到的远景，压进去会把终点旗缩成一个点
   *    （1-3 按全 66 列算每列只剩 14px）。1-6 的木箱在 18 列、终点在 15 列，
   *    只裁到 goal+2=17 的话木箱就在条外，那正好是这颗星要玩家去找的东西。
   *
   * 已知边界：将来若有关卡落差超过 PREVIEW_SPAN_M，曲线会在条顶被截平。
   * 这不该靠"看起来还行"来发现 —— tools/test_build_preview.js 里有一条
   * 断言六关最大落差 ≤ PREVIEW_SPAN_M，加关时它会先红。
   */
  const PREVIEW_SPAN_M = 10.0;
  /* 条右端必须停住，给右上角的按钮列让路。
   *
   * ⚠ 这里踩过一个坑（第 62 轮）：加「提示」钮时把它放在 y=56..92，
   * 而预览条是 y=50..86 —— 两者在 x=1224..1260 上**叠住了**。
   * 表现不是"按钮画歪了"，而是 tools/test_build_preview 报 1-3 的
   * 红旗像素是 **0 列**：1-3 的终点列正好落在条宽 97.8% 处（x≈1229），
   * 被提示钮整个盖住了。按钮盖住数据线，数据线就没了。
   * 现在条收到 x=24..1204，右上 1204..1260 那一竖列留给静音/提示钮。 */
  function buildPreviewRect() { return { x: 24, y: 50, w: 1180, h: 36 }; }
  function previewWin(lv) {
    const cols = lv.grid.cols;
    let c1 = lv.goal.col + 2;
    (lv.boxes || []).forEach(b => { c1 = Math.max(c1, b.col + 1); });
    return { c0: lv.start.col, c1: Math.min(cols - 1, c1) };
  }
  /* 几何与绘制共用一份：测试要核对的 xOf/yOf 必须是屏幕上真正用的那一个，
   * 各算一遍是这个项目反复踩过的坑（第三颗星名字、关卡卡片、零件行数）。 */
  function buildPreviewGeom(lv) {
    const R = buildPreviewRect(), w = previewWin(lv);
    const padX = 8, padY = 4;
    const innerW = R.w - padX * 2, innerH = R.h - padY * 2;
    const pxPerM = innerH / PREVIEW_SPAN_M;
    const span = Math.max(1e-6, w.c1 - w.c0);
    const xOf = c => R.x + padX + (c - w.c0) / span * innerW;
    const yOf = s => R.y + R.h - padY - s * pxPerM;
    return { R: R, c0: w.c0, c1: w.c1, padX: padX, padY: padY,
             innerW: innerW, innerH: innerH, pxPerM: pxPerM,
             yTop: R.y + padY, yBot: R.y + R.h - padY, xOf: xOf, yOf: yOf };
  }

  /* ---------- 建造阶段的"看全图"（第 62 轮，用户要求） ----------
   *
   * 用户原话：「我希望添加一个功能，让玩家可以在关卡刚开始的建造阶段
   * 滑动浏览地图以及缩放地图进行观察」。
   *
   * 为什么必须有：建造镜头只框住起点前后约 ±9.5 米，而六关的终点旗**全在画面外**
   * （第 60 轮量过）。上一轮的对策是顶部那条缩略剖面 —— 那是"看轮廓"，
   * 不是"看地图"：玩家看不到崖有多高、箱子在哪、坡后面是什么。
   * 于是"装轮子还是装气球"仍然只能靠发射去试。
   *
   * 实现上刻意**不复用** run 相的镜头：
   *   · run 相的 camState 由 drawRun 每帧缓动到车身上（跟随），
   *   · 建造相要的是"玩家自己摆"（自由），两者语义相反。
   * 所以建造相有自己的 pan/zoom，存在 state.buildView 里，
   * 且**缩放时围绕光标**（否则滚轮放大后目标会跑出画面，这是地图类交互的常识）。
   *
   * 默认值不是"正对着起点"，而是**把整关装进画面**：
   * 关卡宽 40~66 列、高 18 行，装得下就装下，装不下就退回起点特写。
   * 这样一进关玩家先看到全貌，想细看再滚轮推近 —— 顺序和真实图片浏览器一致。
   */
  const BUILD_ZOOM_MIN = 0.45, BUILD_ZOOM_MAX = 3.2;
  function buildViewDefault(lv) {
    const ter = terrainCache || RAP.makeTerrain(lv);
    /* 关卡横向范围：起点列 → 终点列（+2 留出旗子）。纵向取地表极值。 */
    const c0 = Math.max(0, lv.start.col - 2);
    const c1 = Math.min(lv.grid.cols - 1, lv.goal.col + 2);
    let lo = 1e9, hi = -1e9;
    for (let c = c0; c <= c1; c++) {
      const y = ter.surfaceY(c + 0.5);
      if (y < lo) lo = y;
      if (y > hi) hi = y;
    }
    const spanX = Math.max(4, c1 - c0);
    const spanY = Math.max(4, hi - lo + 8);
    const zx = (DW * 0.86) / (spanX * PPM);
    const zy = (DH * 0.62) / (spanY * PPM);
    const zoom = Math.max(BUILD_ZOOM_MIN, Math.min(1.35, Math.min(zx, zy)));
    /* 镜头横向：**把拼装区整块居中**。
     *
     * 第 64 轮先试过"把关卡跨度居中" —— 可起点在关卡最左边，网格就跑到屏幕
     * 最左，压在「清空 / 撤销 / 换方向」那排圆钮底下：玩家点 (4,2)，
     * 实际按到了撤销，刚放的零件凭空消失（dbg_place2.js 里 trace 出的
     * `tryPlace(4,1) -> undo()`）。
     * 第 64b 轮改成"把网格左边缘钉在 x=168、让开工具栏" —— 不压按钮了，
     * 但网格整体偏左，用户看到的第一反应是「刚进关的视角怎么在拼装区右边」。
     *
     * 现在两头都不将就：网格占不满屏幕宽度（6 格 × 41px ≈ 246px），
     * 所以**居中**永远不会碰到左侧工具栏（它右沿在 x=140）。
     * 之前那两版都是"因为怕撞到边角而牺牲构图"，其实根本不必 ——
     * 只要把算式写对，居中照样安全。
     *
     * 解：令 buildOrigin().x + ROWS*px/2 = DW/2，其中
     *     buildOrigin().x = DW/2 + (a.x − cam.x)·px − (ANCHOR_COL+0.5)·px
     * 得到  cam.x = a.x + (BUILD_COLS/2 − ANCHOR_COL − 0.5)
     * 注意它**与 zoom 无关** —— 居中就是居中，缩放不该把构图带偏。 */
    const anchorX = (lv.start.col + 0.5);
    const px0 = PPM * zoom;
    const cx = anchorX + (RAP.BUILD_COLS / 2 - BUILD_ANCHOR_COL - 0.5);
    let cy = (lo + hi) / 2 + 1.0;

    /* 纵向：先按地形取，再**顶到顶部两条文字下面为止**。
     *
     * 顶部压着两条固定的东西（都在 drawHud 里）：
     *   · 信息条 `roundRect(84, 90, 700, 30)`             → 占到 y=120；
     *   · 三行说明的底衬 `roundRect(84, 128, 640, 58)`    → 占到 y=186。
     * 而拼装板的标题栏在板子上方 HD+8 像素。第 64 轮把板子锚到起点之后，
     * 起点高的关（有轮子的 1-1）算出来的板顶会钻到这两条底下 ——
     * 标题「拼装区」和「6 × 8」被压在说明文字里。
     *
     * 这一条是**量出来**的，不是看出来的：tools/probe_title_overdraw.js
     * 在 fillText 画完之后立刻读像素（205），帧末再读一次（88），
     * 证明"它自己画亮了、是后面盖上去的"；probe_pixel_culprit.js 再逐个
     * fill 前后取样，锁定罪魁就是这块 `rgba(10,18,24,.62)` 底衬。
     *
     * 修法是"不够就往下让"，不是"永远钉死"：地形本身矮的关（1-2/1-5 那种）
     * 本来就有余量，硬钉死会把起点顶到画面最下面，反而看不到地形。
     *
     * 方向别搞反：cam.y 变大 → 世界相对镜头下沉 → 格子画得更靠下。
     * 所以"让板子往下"= 给 cam.y 加值。 */
    const HD0 = Math.max(20, px0 * 0.55);
    const GRID_MIN_TOP = 196;                 // 板顶（含标题栏）的最小 y
    const oY = DH / 2 - (buildAnchorWorld().y - cy) * px0 - (BUILD_ANCHOR_ROW + 0.5) * px0;
    const panelTop = oY - HD0 - 8;
    if (panelTop < GRID_MIN_TOP) cy += (GRID_MIN_TOP - panelTop) / px0;

    return { x: cx, y: cy, zoom: zoom };
  }
  /* 允许拖到多远：关卡两端各留 6 米，纵向上下各留 12 米。
   * 不设限的话玩家能把地图拖到宇宙外，回来就找不到路了。 */
  function clampBuildView(v, lv) {
    const m = 6;
    v.x = Math.max(-m, Math.min(lv.grid.cols + m, v.x));
    v.y = Math.max(-12, Math.min(40, v.y));
    v.zoom = Math.max(BUILD_ZOOM_MIN, Math.min(BUILD_ZOOM_MAX, v.zoom));
    return v;
  }

  // ---------- 交互 ----------
  function canvasPos(ev) {
    const r = cv.getBoundingClientRect();
    // 事件坐标 → 可视设计坐标（考虑宽屏扩展）
    return {
      x: (ev.clientX - r.left) * VIEW_W / r.width - VIEW_OFF_X,
      y: (ev.clientY - r.top) * VIEW_H / r.height - VIEW_OFF_Y
    };
  }
  /* 托盘槽位。第 67 轮：托盘只放**本关给的**零件（见 refreshTray），
   * 槽位也因此从 46px 放大到 64px —— 少了几件就该把空间还给剩下那几件，
   * 而不是在中间留一片空白。
   *
   * 最宽的一关是 1-6：木框/木轮/风种/风车桨/热气球/压舱石/小猪/橡皮 = 8 格，
   * 8×64 + 7×12 = 596px，居中后左右各留 342px —— 无论哪一关都放得下，
   * 所以这里不需要"太宽就缩"的分支（多一条分支就多一处会走散的地方）。 */
  function trayRect(i) {
    const n = TRAY.length, w = 64, gap = 12;
    const total = n * w + (n - 1) * gap;
    const x0 = (DW - total) / 2;

  }
  function cellAt(mx, my) {
    const o = buildOrigin();
    const c = Math.floor((mx - o.x) / o.px), r = Math.floor((my - o.y) / o.px);
    if (c < 0 || c >= RAP.BUILD_COLS || r < 0 || r >= RAP.BUILD_ROWS) return null;
    return { r, c };
  }
  function tabRect(i) { return { x: 24 + i * 86, y: 18, w: 80, h: 30 }; }

  /* ---------- 「提示」按钮（第 62 轮，用户要求） ----------

   * 位置：**左栏**，暂停/重开下面。

  function hintRect() { return { x: 24, y: 196, w: 46, h: 46 }; }
  /* 每关三层提示。键是 levelId；缺的关用 defaultHint 兜底，

  function hintFor(lv, tier) {
    const H = HINTS[lv && lv.levelId];
    if (!H) return DEFAULT_HINTS[Math.min(tier, DEFAULT_HINTS.length - 1)];
    return H[Math.min(tier, H.length - 1)] || H[H.length - 1];
  }
  const DEFAULT_HINTS = [

    '1-3': ['这一关的第三星是"一颗种子都不用"：种子一次性的，用了就没了。',

    '1-4': ['这一关不能翻车，而且要爬冰坡 —— 冰面上木轮几乎打滑。',

  // 把金圈盖掉了 39/72，玩家看到的按钮是缺一块的）。绘制与检查共用这一份。
  // 行驶期的"还剩多远"进度轨：起点 → 终点，小猪在哪一段必须一眼看到。
  // 位置紧贴顶部信息条下方；绘制与重叠检查共用这一份几何。
  function runProgressRect() {
    return {
      panel: { x: 84, y: 126, w: 700, h: 30 },
      track: { x: 108, y: 139, w: 592, h: 8 }
    };
  }
  function runTimeRects() {
    return {
      timer: { x: DW - 224, y: 138, w: 192, h: 30 },
      box: { x: DW - 224, y: 174, w: 192, h: 26 },
      /* 木框耐久条（第 45 轮）。放在木箱下面自成一块：木框耐久和木箱是
       * 两件完全不同的事（一个是"还剩几个箱子能捡"，一个是"车还结不结实"），
       * 挤在一行里玩家会读混。y 上留 6 px 间距，和上方木箱面板是同一竖列。 */
      frame: { x: DW - 224, y: 206, w: 192, h: 26 }
    };
  }
  // 行驶期的「★★★ 条件」状态条：把奖励条件做成实时读数，
  // 否则玩家整趟都在猜"我这算不算没按打气筒"。纯函数，供绘制与测试共用。
  function runChallengeRect() {
    return { x: 84, y: 162, w: 552, h: 28 };
  }
  /* 木框耐久读数（绘制与判定共用一份）。
   * 返回 { min, max, n }：最低耐久、单格满耐久、还活着的木框格数。
   * 没有木框时 min = max = 0 —— 调用方必须自己处理这个"空车"的情况，
   * 否则「不散架」会在空车上判成"已碎"。 */
  /* 木框耐久条的三段格子几何。
   * 绘制和像素测试必须读同一份 —— 测试自己再算一遍坐标的话，
   * 改了面板位置就会出现"测试找到的是空气、仍然全绿"。
   * 三段固定 3 格：PARTS.wood_frame 的 maxHp 是 3，耐久条讲的就是这三点。 */
  function frameSegRects() {
    const F = runTimeRects().frame;
    const segW = 20, segH = 12, gap = 4, segX = F.x + 52, segY = F.y + 7;
    const out = [];
    for (let i = 0; i < 3; i++) out.push({ x: segX + i * (segW + gap), y: segY, w: segW, h: segH });
    return out;
  }
  function frameHpOf(run) {
    const car = (run || {}).car || {};
    const frames = (car.parts || []).filter(p => p.def && p.def.structure);
    if (!frames.length) return { min: 0, max: 0, n: 0 };
    return {
      min: Math.min.apply(null, frames.map(p => p.hp)),
      max: Math.max.apply(null, frames.map(p => (p.def.maxHp || 3))),
      n: frames.length
    };
  }
  function challengeStatus(run) {
    const lv = level();
    const ch = (lv && lv.challenge) || { type: 'none' };
    const st = run || {};
    const car = st.car || {};
    switch (ch.type) {
      case 'pumpPress':
        return { type: ch.type, label: '不按打气筒', value: '已按 ' + (st.pumpPress || 0) + ' 次',
                 pass: (st.pumpPress || 0) <= (ch.max || 0) };
      /* `energyLeft` 分支已删（第 63 轮）：电量机制不存在了，
       * 留着它就是在读一个引擎从不赋值的 `car.energy`（audit_dead_reads 抓到的
       * 第 1 条）。 */
      /* `powerSpare` 也跟着容量系统一起删了（第 71 轮，用户要求）。
       *
       * 现在 1-3 的第三星是 **`seedSpare`：一颗种子都没用**。
       * 这是一道真取舍：装了种子更容易过，但拿不到这颗星。
       * ⚠ 必须和引擎里的 `challengePass` 用**同一句话**：
       * 引擎判 `state.seedUse` 三个数之和为 0，这里也必须读同一个字段。
       * 两边各算一遍的话，HUD 会显示"已达成"而结算不给星。 */
      case 'seedSpare': {
        const u = (st && st.seedUse) || { anemo: 0, geo: 0, electro: 0 };
        const total = (u.anemo || 0) + (u.geo || 0) + (u.electro || 0);
        return { type: ch.type, label: '一颗种子都不用',
                 value: total === 0 ? '没用到种子' : ('用了 ' + total + ' 颗'),
                 pass: total === 0 };
      }
      /* 1-5「不用驱动件」（第 63 轮，取代 `motorUse`）。
       * 旧版写"已用 N 秒"，那是电量时代的话术；现在驱动件是**恒定的**，
       * 没有"用了多久"这回事，只有"装了没有"。 */
      case 'noTool': {
        const tools = (car.parts || []).filter(p => p.def && p.def.tool);
        return { type: ch.type, label: '不用驱动件',
                 value: tools.length ? '装了 ' + tools.length + ' 件' : '一件没装',
                 pass: tools.length === 0 };
      }
      case 'noFlip':
        return { type: ch.type, label: '全程不翻车',
                 value: '最大倾角 ' + Math.round((st.maxAngle || 0) * 180 / Math.PI) + '°',
                 pass: (st.maxAngle || 0) <= (ch.maxAngle || 0.785) };
      case 'motorUse':
        return { type: ch.type, label: '不用马达',
                 value: '已用 ' + (st.motorUse || 0).toFixed(1) + ' s',
                 pass: (st.motorUse || 0) <= (ch.max || 0) };
      /* 「限时／速通」——参考里最常见的第三颗星（秒表图标）。
       * 它奖励的是"把车造轻、路线走直"，和「不散架」正好是两种相反的造车取向：
       * 前者要快而脆，后者要结实而慢。这也是参考让人愿意重打同一关的原因。 */
      case 'time':
        return { type: ch.type, label: '限时 ≤ ' + (ch.max || 0).toFixed(1) + ' s',
                 value: '现在 ' + (st.time || 0).toFixed(1) + ' s',
                 pass: (st.time || 0) <= (ch.max || 0) };
      /* 不散架（KRAK SNAP）：参考里最经典的那颗星 —— 载具没散架、猪也没掉出来。
       *
       * 第 45 轮把它从"碎/没碎"两态改成**带耐久读数**的三态：
       * 以前这一行只有「结构完好」和「木框已碎」，而引擎里木框有三点耐久，
       * 中间那两次掉血在画面上完全静默 —— 玩家只会在结算页突然发现星没了。
       * 把最低耐久和裂纹段位直接印在这一行里（"木框 2/3 裂了"），
       * 掉一颗血的那一刻就能看见数字变了，不必等结算。 */
      case 'noBreak': {
        const fh = frameHpOf(st);
        if (st.hullBroken) {
          return { type: ch.type, label: '不散架', value: '木框已碎', pass: false };
        }
        if (st.pigEjected) {
          return { type: ch.type, label: '不散架', value: '猪掉出来了', pass: false };
        }
        /* 只有真的读到木框时才报耐久读数。
         * 构造出来的 state（测试、以及结算页之外的临时对象）可能没有 car.parts，
         * 那时 frameHpOf 会返回 n=0 —— 绝不能再把"读不到"解释成"已碎"，
         * 否则任何没带零件的模拟状态都会被判成散架（test_challenge_bar 就是这么红的）。 */
        if (fh.n > 0) {
          if (fh.min <= 0) return { type: ch.type, label: '不散架', value: '木框已碎', pass: false };
          if (fh.min <= 1) {
            return { type: ch.type, label: '不散架', value: '木框 ' + fh.min + '/' + fh.max + ' 快散了', pass: true };
          }
          if (fh.min <= 2) {
            return { type: ch.type, label: '不散架', value: '木框 ' + fh.min + '/' + fh.max + ' 裂了', pass: true };
          }
        }
        return { type: ch.type, label: '不散架', value: '结构完好', pass: true };
      }
      /* 气球/沙袋那两颗星（第 37 轮）。
       * 这两个条件都是"用掉消耗品"，和「不散架」的思路正好相反：
       * 前者奖励"敢花"，后者奖励"别碰"。放在同一套条里才看得出这种反差。 */
      case 'noPop':
        return { type: ch.type, label: '一个气球都不扎',
                 value: '已扎 ' + (st.balloonPopsBurst || 0) + ' 个',
                 pass: (st.balloonPopsBurst || 0) === 0 };
      case 'allSandbags':
        /* 名字必须和 challengeNameOf() / 选关卡面**逐字一致**。
         * 第 63 轮把零件名从「沙袋」改成「压舱石」时，这条状态条漏了 ——
         * 于是同一个条件在三处显示成两个名字（状态条「沙袋全扔」、
         * 卡面与结算「压舱石全扔」），test_lift_ui 因此报红。
         * 这类"三份手抄表"在本项目已经出过三次，所以这里留注释提醒。 */
        return { type: ch.type, label: '压舱石全扔',
                 value: '已扔 ' + (st.sandbagsDropped || 0) + ' / ' + (st.sandbagTotal || 0),
                 pass: (st.sandbagsDropped || 0) >= (st.sandbagTotal || 0) && (st.sandbagTotal || 0) > 0 };
      default:
        return { type: 'none', label: '本关没有 ★★★', value: '', pass: false };
    }
  }
  /* 三颗星的名字（结算页与实时状态条共用一份，避免两处文案漂移）。
   * 照参考的顺序：① 到终点 ② 全木箱 ③ 关卡特殊条件。 */
  function goalNames() {
    return {
      arrive: '小猪抵达终点',
      boxes: '收齐所有木箱',
      challenge: challengeNameOf(level())
    };
  }
  /* 第三颗星的名字：结算页、行驶期状态条、选关卡面三处都要显示它。
   * 原来是三份互不相同的手抄表（选关那处写「不散架（KSP）」、结算写「KRAK SNAP」、
   * 状态条写「不散架」），加气球/沙袋那两颗新星时只改了其中两处 ——
   * 选关卡面就会显示 "★★★：—"。现在只有一个来源。 */
  function challengeNameOf(lvx) {
    const ch = (lvx || {}).challenge || { type: 'none' };
    const m = {
      none: '无特殊条件',
      pumpPress: '不按仙术机关',
      /* 第 71 轮：`powerSpare` 随容量系统一起删了，换成 `seedSpare`。
       * ⚠ 这张表必须和新类型名同时改 —— 漏一个的话，那一关的挑战名
       * 会落到 `|| '—'` 兜底，玩家在选关卡面上看到一条破折号。 */
      seedSpare: '一颗种子都不用',
      noTool: '不用驱动件',
      noFlip: '不翻车',
      noBreak: '不散架（KRAK SNAP）',
      time: '限时 ≤ ' + (ch.max || 0).toFixed(1) + ' s',
      noPop: '一个气球都不扎',
      allSandbags: '压舱石全扔'
    };
    return m[ch.type] || '—';
  }

  function hit(rect, mx, my) { return rect && mx >= rect.x && mx <= rect.x + rect.w && my >= rect.y && my <= rect.y + rect.h; }

  function closeWelcome() {
    state.welcome = 0;
    try { localStorage.setItem('rap-welcomed-v1', '1'); } catch (e) {}
  }

  function toast(msg) { state.toast = msg; state.toastT = 2.2; }

  /* 静音开关。切换时给一句 toast 和一声**确认音**（取消静音那一下才响）。
   *
   * 为什么要那一声音：静音是个没有别的反馈的开关 —— 图标很小，
   * 而玩家点它的时候游戏通常正好是安静状态（建造页）。不响一声，
   * "我到底点中了没有"就只能靠去听下一次发射。响了这一声，他就确定了。
   * 反过来说，**切到静音时不许响** —— 那一声会很讽刺。 */
  function toggleMute() {
    const now = SFX.setMuted(!SFX.isMuted());
    toast(now ? '已静音（声音全关）' : '声音已打开');
    if (!now) SFX.place(0.5);    // 用"放零件"的音当确认音：短、不刺耳、玩家听过
    return now;
  }

  function startLevel(i) {
    state.levelIndex = i;
    state.build = RAP.newBuild();
    state.phase = 'build';
    state.run = null;
    /* 托盘跟着关卡走：先换关，再刷新托盘（refreshTray 读的是 level().partsBox）。
     * 顺序不能反 —— 反过来拿到的是上一关的零件箱。 */
    refreshTray();
    /* 默认手里拿**本关第一件**零件，而不是写死木框：
     * 万一某一关不给木框（比如以后的气球关），写死会让玩家一进关
     * 就握着一件不存在的零件，点网格毫无反应。 */
    state.selected = TRAY[0] || null;
    state.selectedByUser = false;   // 预置默认值不算"玩家选的"（见 selectPart）
    state.cam = buildCam();
    /* 每关进场时把"看全图"镜头重置成整关俯瞰。
     * 不在这里重置的话，玩家在上一关拖到的位置会带到下一关 ——
     * 而下一关的尺度和地形完全不同，那种"继承"只会让人一进来就迷路。 */
    terrainCache = RAP.makeTerrain(level());
    terrainCacheId = level().levelId;
    state.buildView = buildViewDefault(level());
    state.panDrag = null;
    /* 换关要把提示清掉：上一关的提示层数带到新关，会让玩家一进来
     * 就看见"成品：……"的答案，等于跳过整关。 */
    state.hintTier = 0;
    state.hintOpen = false;
    state.hintSeen = false;
    /* 观察模式/摇杆也必须复位：换关时如果正开着观察模式或摇杆，
     * 新一关一进来就在"能拖视角、点不了零件"的状态里，玩家会以为卡了。 */
    state.observe = false;
    state.observeKeys = {};
    state.joystick = null;
    state.joyLongPress = null;
    state.introT = 0;          // 触发入场镜头
    state.outroT = 0;
    /* 换关/回建造页必须把"按住"状态清掉：如果玩家在按着 1 的时候按了 R，
     * 那一局的 keyup 永远不会来了（keydown 分支已经不会再注册），
     * 于是下一次按 1 会被 `state.heldKeys['1']` 挡掉 —— 交互键静默失灵。
     * 鼠标按住的 `heldBtn` 同理：不清理的话下一次 mouseup 会去释放一个
     * 早已不存在的组（`releaseInteract` 找不到组就返回 false，静默无事）。 */
    state.heldKeys = {};
    state.heldBtn = 0;
    /* 换关也必须把"暂停"清掉。切走窗口会自动暂停（见 loseFocus），
     * 如果玩家在自动暂停的状态下直接重开/换关，新一局会一出来就是暂停的，
     * 屏幕上还挂着上一局那张"已暂停"卡 —— 而这一局根本没开始过。
     * `state.autoPaused` 一起清，不然回来时的"已暂停（切走了）"提示会重复弹。 */
    state.paused = false;
    state.autoPaused = false;
  }

  function selectPart(part) {
    /* 点**已经选中**的那一格 → 取消选中（第 64 轮，用户要求：
     * 「点一下选中的物品栏就取消选中」）。
     *
     * 为什么需要：选中是一个**持续状态**（选中后点网格就落子）。
     * 没有取消的话，玩家选错零件以后必须去点另一个零件才能换掉 ——
     * 而且"手里一直攥着一个零件"会让人误点。
     * 取消之后 selected = null，此时点网格什么都不放（橡皮同理）。
     *
     * `selectedByUser` 这个标记是补出来的，因为上面这条规则和
     * **开局预设的默认零件**打架：startLevel 会把 selected 预置成木框
     * （这样一进关点网格就能直接落第一块框，不用先去托盘点一下）。
     * 但预置之后玩家第一次点木框槽，命中的是"再点取消"这条分支 ——
     * 于是他想**选**木框，实际动作却是把它**放下**，接着点网格什么都没发生。
     * 第 64 轮回归时 11 个脚本就是这么连环挂掉的（前提全倒）。
     *
     * 所以取消只对"玩家自己点出来的选中"生效：
     * 预置态下第一次点 = 确认选中，第二次点才 = 取消。 */
    if (state.selected === part && part !== 'eraser' && state.selectedByUser) {
      state.selected = null;
      state.selectedByUser = false;
      SFX.place(0.35);
      return;
    }
    // 橡皮不参与"再点取消"：它是工具不是零件，且取消后就没法擦东西了
    if (part === 'eraser') {
      const off = state.selected === 'eraser' && state.selectedByUser;
      state.selected = off ? null : 'eraser';
      state.selectedByUser = !off;
      return;
    }
    // 零件箱里没有的零件不给选
    const left = RAP.budgetLeft(level(), part, state.build);
    if (left <= 0) { toast('这个零件已经用完了'); return; }
    state.selected = part;
    state.selectedByUser = true;
  }

  /* 撤销：整个回到上一步图纸（见 game.js 里 undo 的注释 —— 原来的
   * `order.pop()` 版本在"擦掉 / 卸下之后按 Z"会删掉车上另一件东西）。
   * 空历史必须出声：按了没反应和按了乱删，玩家都以为是 bug。 */
  function undoStep() {
    if (!RAP.undo(state.build)) { toast('没有可撤销的步骤'); SFX.deny(); return; }
    SFX.remove();
    toast('已撤销上一步');
  }

  function tryPlaceAt(r, c) {
    const part = state.selected;
    if (part === 'eraser') {
      if (RAP.removeAt(state.build, r, c)) toast('拆下零件');
      return;
    }
    const res = RAP.tryPlace(level(), state.build, part, r, c);
    if (res.ok) {
      SFX.place(1 - r / RAP.BUILD_ROWS);
      state.popped[r + ',' + c] = performance.now();   // 弹性动画起点
    } else SFX.deny();
    if (!res.ok) {
      const map = { budget: '零件箱空了', connect: '必须贴着木框放', occupied: '这一格已经有零件了',
                    interact_limit: '交互键最多 3 个（交互件即键位）', outside: '超出建造区' };
      toast(map[res.reason] || res.reason);
    }
  }

  function launch() {
    const chk = RAP.canLaunch(state.build);
    if (!chk.ok) {
      const msg = { empty: '先放零件再发射', frame: '至少要有一块木框', wheel: '至少要有一个轮子',
                    pig: '车是空的：把小猪拖进木框里' }[chk.reason] || chk.reason;
      toast(msg);
      SFX.deny();
      return;
    }
    const car = RAP.buildVehicle(level(), state.build);
    state.run = RAP.createRun(level(), state.build);
    state.phase = 'run';
    state.resultT = 0;
    state.runBanner = 2.0;      // 出发横幅：关卡名 + 本关目标
    SFX.launch();
    state.replayT = 0; state.replayIdx = 0;
    state.heldKeys = {};        // 新的一局：按住状态必须从零开始（见 startLevel 的注释）
    state.heldBtn = 0;
    state.paused = false;       // 同理：上一局的自动暂停不该带进这一局
    state.autoPaused = false;
  }

  /* 标准解发射：给测试用的一步到位入口。
   *
   * `_presses` / `_drops` / `_pops` 里的时刻会在跑的过程中按时送到
   * `RAP.pressInteract` / `RAP.dropSandbag` / `RAP.popBalloon` ——
   * 和玩家按 1/2/3 键、点车身走的是**同一条代码路径**，不是伪造状态。
   *
   * 为什么需要它：1-2 改成"必须按一下打气筒"之后，光是把零件摆好并不能通关；
   * 1-6 更极端，"什么时候扔沙袋、什么时候扎气球"就是这一关的全部玩法。
   * 如果 launchSpec 只认 _presses，那 1-6 在浏览器里就**根本没法自动跑到通关**
   * —— 它只能在 Node 的 simulate 里过，而真浏览器里一次都没验过。
   * 第 40 轮补上：三类动作统一成一条时间轴（`actScript`），
   * 和 game.js 的 simulate 完全同构。 */
  function launchSpec(levelIndex, specKey) {
    if (typeof levelIndex === 'number') startLevel(levelIndex);
    const lv = level();
    const spec = RAP.SPECS[specKey];
    if (!spec) { toast('没有这个标准解：' + specKey); return false; }
    state.build = RAP.newBuild();
    RAP.applySpec(lv, state.build, spec);
    const chk = RAP.canLaunch(state.build);
    if (!chk.ok) { toast('标准解装不上：' + chk.reason); return false; }
    launch();
    RAP.applySpecRuntime(state.run, spec);
    const acts = [];
    (spec._presses || []).forEach(a => acts.push({ t: a.t, k: a.k || 'press', n: a.n || 1 }));
    (spec._drops || []).forEach(a => {
      for (let i = 0; i < (a.n || 1); i++) acts.push({ t: a.t + i * 0.016, k: 'drop', n: 1 });
    });
    (spec._pops || []).forEach(a => {
      for (let i = 0; i < (a.n || 1); i++) acts.push({ t: a.t + i * 0.016, k: 'pop', n: 1 });
    });
    /* ⚠ 第 72 轮：漏了这一条。`_seeds` 在 Node 的 `simulate` 里早就支持了
     * （game.js 的 acts 里有 'seed'），但浏览器的 actScript 没有 ——
     * 于是"1-5e / 1-7 的标准解"在 Node 里能过，在真浏览器里**一次都没验过**。
     * `tools/test_all_levels.js` 就是因此红的（1-5、1-7 双双 stuck）。
     *
     * 这类"两条路径只改了一条"的漏洞，Node 测试永远是绿的 ——
     * 因为 Node 走的是另一条分支。只有真浏览器跑一遍才看得见。 */
    (spec._seeds || []).forEach(a => {
      acts.push({ t: a.t, k: 'seed', kind: a.kind });
    });
    acts.sort((a, b) => a.t - b.t);
    state.run.actScript = acts;
    state.welcome = 0; state.introT = 1;
    return true;
  }

  // ---------- 输入 ----------
  cv.addEventListener('contextmenu', e => e.preventDefault());
  /* 滚轮缩放建造镜头（围绕光标）。
   *
   * 围绕光标是这个交互的**常识**：滚轮放大时，玩家盯着的那个点必须留在原地。
   * 围绕屏幕中心缩放会让目标跑出去，玩家就得一边滚一边拖 —— 那是坏手感。
   *
   * 只在建造相生效（行驶相的镜头属于车）。命中拼装区时也不缩放：
   * 那里滚轮没有意义，且容易在放零件时误触。
   */
  cv.addEventListener('wheel', ev => {
    if (state.phase !== 'build' || state.welcome || state.levelSelect || state.helpOpen) return;
    const p = canvasPos(ev);
    if (!state.buildView) state.buildView = buildViewDefault(level());
    const bv = state.buildView;
    const before = PPM * bv.zoom;
    // 光标处的世界坐标（缩放前）
    const wx0 = bv.x + (p.x - DW / 2) / before;
    const wy0 = bv.y - (p.y - DH / 2) / before;
    const factor = Math.pow(1.0015, -ev.deltaY);      // 每格约 6%
    bv.zoom = Math.max(BUILD_ZOOM_MIN, Math.min(BUILD_ZOOM_MAX, bv.zoom * factor));
    const after = PPM * bv.zoom;
    // 让同一个世界坐标仍落在光标下
    bv.x = wx0 - (p.x - DW / 2) / after;
    bv.y = wy0 + (p.y - DH / 2) / after;
    clampBuildView(bv, level());
    ev.preventDefault();
  }, { passive: false });

  cv.addEventListener('mousedown', ev => {
    const p = canvasPos(ev);
    state.mouse.x = p.x; state.mouse.y = p.y; state.mouse.down = true;

    /* ---------- 建造相：右键/中键拖动 = 平移地图 ----------
     *
     * 为什么用右键而不是左键：左键在建造相已经被"放零件/拖动零件"占满了，
     * 抢过来会毁掉拖拽放件的手感（那是玩家最频繁的动作）。
     * 右键拖动是地图类交互的通用约定（画图、地图、CAD 都是），
     * 不会和"左键放东西"打架。
     *
     * 必须在**最前面**判（紧跟静音钮之后、欢迎页之前不行 —— 欢迎页要吞掉一切），
     * 并且要求三个浮层都没开：开着选关页还能拖地图的话，
     * 玩家会以为自己不小心进了别的关。 */
    if ((ev.button === 2 || ev.button === 1) && state.phase === 'build' &&
        !state.welcome && !state.levelSelect && !state.helpOpen && !state.paused) {
      if (!state.buildView) state.buildView = buildViewDefault(level());
      // 存下"按下那一刻"的镜头 + 指针，拖动时按差值算 —— 不能每帧累加
      state.panDrag = { sx: p.x, sy: p.y, vx: state.buildView.x, vy: state.buildView.y };
      ev.preventDefault();
      return;
    }

    /* 静音钮必须**早于**所有面板/阶段判定：它钉在右上角，
     * 而那个角在欢迎页、零件说明、暂停卡、选关页上都是看得见的。
     * 埋在任何一个分支后面，就会出现"这个页面里静音不了"。
     * （顺便证明它真的排在最前面：tools/test_mute.js 会在欢迎页和
     * 暂停卡上各点它一次。） */
    if (hit(muteRect(), p.x, p.y)) { toggleMute(); return; }

    /* 提示钮：排在静音钮之后、欢迎页之前。
     * 欢迎页开着时要吞掉它（新玩家还没看过规则，先给"三层提示"没意义）；
     * 但零件说明/暂停卡开着时**不该吞掉** —— 那正是"我按了 ? 还是不会"的时刻。 */
    if (hit(hintRect(), p.x, p.y) && !state.welcome) {
      if (state.hintOpen) {
        // 已经开着 → 再点一次升一层（到最后一层就不再动）
        state.hintTier = Math.min(2, state.hintTier + 1);
        SFX.place(0.4);
      } else {
        state.hintOpen = true;
        /* 第一次点：hintTier 保持 0（那就是第 1 层）。
         * hintSeen 只用来让按钮变亮（"你已经用过提示了"），
         * 不参与层数计算 —— 曾经把两者混成一个数字，导致第 1 层被跳过。 */
        state.hintSeen = true;
      }
      return;
    }
    // 提示卡开着：点任何别处先关掉它（和零件说明同一套语义）
    if (state.hintOpen) { state.hintOpen = false; return; }

    /* 观察键（第 64 轮）：只在建造相出现。
     * 点一下切换观察模式；开着的时候点**画面任意处**开始长按摇杆。 */
    if (state.phase === 'build' && !state.welcome && !state.levelSelect
        && !state.helpOpen && hit(observeBtnRect(), p.x, p.y)) {
      state.observe = !state.observe;
      state.joystick = null; state.observeKeys = {};
      SFX.place(0.45);
      if (state.observe) toast('观察模式：拖画面移动视角（触屏长按出摇杆）');
      return;
    }

    /* 「回拼装区」（第 66 轮，用户要求）。
     * 不瞬移，走 0.35 秒缓动 —— 见 state.recentre 的注释。 */
    if (state.phase === 'build' && !state.welcome && !state.levelSelect
        && !state.helpOpen && hit(recentreRect(), p.x, p.y)) {
      state.recentre = { t: 0, from: { x: state.buildView.x, y: state.buildView.y, zoom: state.buildView.zoom } };
      SFX.place(0.5);
      return;
    }

    /* 观察模式里的按下：起一组长按计时，到点就长出摇杆。
     * 长按判定用**时间**而不是位移 —— 玩家按住不动等 220ms 才出摇杆，
     * 一按就立刻出会挡住他想点的东西。 */
    if (state.observe && state.phase === 'build' && !state.welcome && !state.levelSelect
        && !state.helpOpen && ev.button === 0) {
      state.joyHoldStart = performance.now();
      const jx = p.x, jy = p.y;
      state.joyLongPress = setTimeout(() => {
        state.joystick = { ox: jx, oy: jy, x: jx, y: jy, dx: 0, dy: 0 };
        state.joyLongPress = null;
      }, JOY_LONGPRESS_MS);
      state.joyFrom = { x: jx, y: jy };
      return;
    }

    // 欢迎引导：必须用按钮翻页（避免误触关闭）
    if (state.welcome) {
      const bk = welcomeSkipRect(), bn = welcomeBtnRect();
      if (hit(bk, p.x, p.y)) { closeWelcome(); return; }
      if (hit(bn, p.x, p.y)) {
        if (state.welcome >= WELCOME_PAGES.length) closeWelcome();
        else state.welcome++;
        return;
      }
      return;   // 其他点击吞掉
    }

    // 零件说明面板开着时：点任何地方都先关掉它（不会误触到下面的按钮）
    if (state.helpOpen) { state.helpOpen = false; return; }

    // 暂停面板：两张"行"必须先判，否则点继续会落到下面的 HUD 按钮上
    if (state.paused && state.phase === 'run') {
      const PY2 = pauseRowRects();
      if (hit(PY2.resume, p.x, p.y)) { state.paused = false; state.autoPaused = false; return; }
      if (hit(PY2.back, p.x, p.y)) {
        state.phase = 'build'; state.run = null; state.paused = false; state.autoPaused = false; return;
      }
      return;   // 暂停时其余点击一律吞掉，避免误触刹车/交互
    }

    // 选关页：点卡片进入，点空白关闭
    if (state.levelSelect) {
      for (let i = 0; i < levels.length; i++) {
        const r0 = levelCardRect(i);
        if (hit(r0, p.x, p.y)) { state.levelSelect = false; startLevel(i); return; }
      }
      const hbr = { x: DW / 2 - 80, y: DH - 84, w: 160, h: 38 };
      if (hit(hbr, p.x, p.y)) { state.levelSelect = false; state.welcome = 1; return; }
      state.levelSelect = false;
      return;
    }

    /* 顶栏只剩一颗「关卡」按钮（第 62 轮）。
     * 原来这里还有 `for (let i = 1; i < levels.length; i++)` 的关卡直选热区，
     * 现在那些 tab 不画了 —— 判定必须跟着删，否则就是六个看不见的幽灵热区
     * 排在顶栏上（test_ghost_buttons.js 专门抓这一类）。 */
    if (hit(tabRect(0), p.x, p.y)) { state.levelSelect = true; return; }

    // 全局按钮：帮助 / 暂停 / 重来（先判这三个，避免被别的分支吃掉）
    {
      const hb = btnRect('help');
      if (hb && hit(hb, p.x, p.y)) { state.helpOpen = !state.helpOpen; return; }
      const pb = btnRect('pause');
      if (pb && hit(pb, p.x, p.y)) { state.paused = !state.paused; state.autoPaused = false; return; }
      const rb = btnRect('restartRun');
      if (rb && hit(rb, p.x, p.y)) {
        state.phase = 'build'; state.run = null; state.paused = false; state.autoPaused = false;
        return;
      }
      /* 刹车钮的点击判定已删（按钮本身也不再画）。
       * 保留这条注释是因为 `setBrake` 还在引擎里：删按钮 ≠ 删物理，
       * tools/test_brake.js 仍然直接调引擎证明刹车本身没错。 */
    }

    if (state.phase === 'build') {
      const bLaunch = btnRect('launch'), bClear = btnRect('clear'), bUndo = btnRect('undo');
      if (hit(bLaunch, p.x, p.y)) { launch(); return; }
      if (hit(bClear, p.x, p.y)) { RAP.clearBuild(state.build); toast('已清空'); return; }
      if (hit(bUndo, p.x, p.y)) { undoStep(); return; }
      const bRot = btnRect('rotate');
      if (hit(bRot, p.x, p.y)) {
        const hc2 = cellAt(p.x, p.y) || cellAt(state.mouse.x, state.mouse.y);
        if (hc2 && state.build.cells[hc2.r + ',' + hc2.c] &&
            RAP.isDirectional(state.build.cells[hc2.r + ',' + hc2.c].part)) {
          RAP.rotateAt(state.build, hc2.r, hc2.c);
          SFX.place();
        } else {
          // 没有悬停格子：转最后放下的方向件
          const keys = state.build.order.slice().reverse();
          for (const k of keys) {
            if (k.indexOf('inner:') === 0) continue;
            const cell = state.build.cells[k];
            if (cell && RAP.isDirectional(cell.part)) {
              RAP.rotateAt(state.build, +k.split(',')[0], +k.split(',')[1]);
              SFX.place();
              break;
            }
          }
        }
        return;
      }
      for (let i = 0; i < TRAY.length; i++) {
        if (hit(trayRect(i), p.x, p.y)) {
          if (ev.button === 2) return;
          selectPart(TRAY[i]);
          state.dragPart = TRAY[i];       // 拿起零件，等松手才落子
          state.dragFromTray = true;
          return;
        }
      }
      const cell = cellAt(p.x, p.y);
      if (cell) {
        if (ev.button === 2) { RAP.rotateAt(state.build, cell.r, cell.c); return; }
        // 橡皮：按下即擦，按住拖动可以连续擦
        if (state.selected === 'eraser') {
          state.erasePaint = true;
          if (RAP.removeAt(state.build, cell.r, cell.c)) SFX.place();
          return;
        }
        const key = cell.r + ',' + cell.c;
        const there = state.build.cells[key];
        if (there) {
          // 先只记录：拖动才移动，单击则按选中零件去放置/旋转
          state.pendingClick = { r: cell.r, c: cell.c, x: p.x, y: p.y, moved: false };
          return;
        }
        state.dragPart = state.selected;   // 空格子：放当前选中的零件
        state.dragFromTray = false;
      }
      return;
    }

    if (state.phase === 'run' && state.run) {
      const gs = state.run.car.groups || [];
      const nm = Math.min(3, gs.length);
      const xs = DW / 2 - (nm * 104) / 2;
      for (let i = 0; i < nm; i++) {
        const rect = { x: xs + i * 104, y: btnRect('interact').y, w: 92, h: 92 };
        if (hit(rect, p.x, p.y)) {
          RAP.pressInteract(state.run, i + 1);
          /* 记下"按的是第几个钮"。
           *
           * 原来松手时是**重新遍历按钮**去判命中哪个 —— 如果玩家的手在按住期间
           * 滑出了按钮（几乎每次都会滑一点），松手那一下一个都不命中，
           * `releaseInteract` 就永远不会被调用。后果（tools/dbg_mouse_drag_off.js
           * 量到的）：`car.pumpHeld` 永远是 true、蓄力卡在 0.8、
           * 玩家之后点车身点别的钮都解除不了，唯一解法是再点一次同一个钮。
           * "按下的那个钮"才是松手时该放的那个钮，和指针现在在哪无关。 */
          state.heldBtn = i + 1;
          SFX.pump();
          return;
        }
      }
      /* 点车身：气球 → 扎破一个，沙袋 → 扔掉一个。
       *
       * 这是 1-6 唯一的两个操作，所以热区也得直接落在零件上 ——
       * 让玩家"看着气球点气球"，而不是去记某个键盘键。
       * 坐标必须用**这一帧真正渲染用的镜头**（state.camLive）反算，
       * 用 buildCam() 或者 camState 都会有半帧偏差，点不准。
       * 半径给 0.85 米（约 27 像素），比气球本身大一圈，不然手一抖就点空。 */
      const cm = state.camLive || state.cam || buildCam();
      const s = PPM * cm.zoom;
      const wx = cm.x + (p.x - DW / 2) / s;
      const wy = cm.y - (p.y - DH / 2) / s;
      const t = RAP.tapAt(state.run, wx, wy);
      if (t && t.ok) {
        if (t.kind === 'balloon') SFX.pop(); else SFX.bagDrop();
        return;
      }
      // 行驶期这一层不再有任何"重开"热区：重开是左上的绿圆钮（restartRun），
      // 在全局按钮分支里已经判过了。以前这里还留着 retryRun 的判定，
      // 而那个按钮早就删了 —— 幽灵热区，由 test_ghost_buttons.js 把守。
      return;
    }

    if (state.phase === 'resolved') {
      /* 回放还没播完时，结算卡根本没画 —— 那些按钮的判定也必须一起关掉，
       * 否则玩家在"回放画面"上随手一点，就会落到一个看不见的"重开"热区上。
       * 这和 round35 删掉的那个 retryRun 幽灵热区是同一类问题：
       * **判定比画面多活了一会儿**。
       * 但也不能让点击完全失效 —— 那样玩家会觉得"点不动"。
       * 所以这一下点击的语义是**跳过回放**：直接跳到卡已就位的时刻。 */
      if (replayPlaying()) { state.replayT = REPLAY_DUR; return; }
      if (hit(btnRect('retry'), p.x, p.y)) { state.phase = 'build'; state.run = null; return; }   // 保留拼装
      if (hit(btnRect('next'), p.x, p.y)) {
        const nb = resultNextBtn();
        if (nb.action === 'next') startLevel(state.levelIndex + 1);
        else if (nb.action === 'overview') state.levelSelect = true;
        // action === 'none'：灰按钮，什么都不做（判定比画面多活一会儿才是幽灵热区）
        return;
      }
    }
  });
  cv.addEventListener('mousemove', ev => {
    const p = canvasPos(ev);
    state.mouse.x = p.x; state.mouse.y = p.y;
    /* 虚拟摇杆拖动（第 64 轮）：按下之后移动 → 更新摇杆偏移。
     * 偏移量按**摇杆半径归一化**，满偏就是 1.0 —— 视角速度与推杆距离成正比。 */
    if (state.joyFrom) {
      if (state.joystick) {
        const j = state.joystick;
        let dx = p.x - j.ox, dy = p.y - j.oy;
        const len = Math.hypot(dx, dy);
        if (len > JOY_R) { dx = dx / len * JOY_R; dy = dy / len * JOY_R; }
        j.x = j.ox + dx; j.y = j.oy + dy;
        j.dx = Math.abs(dx) < JOY_DEAD ? 0 : dx / JOY_R;
        j.dy = Math.abs(dy) < JOY_DEAD ? 0 : dy / JOY_R;
      }
      return;      // 摇杆/待长按期间不处理别的悬停逻辑
    }
    /* 建造相右键拖动平移。按"按下那一刻"的差值算，不累加 ——
     * 鼠标事件频率和 rAF 不一致，累加会漂。 */
    if (state.panDrag) {
      const bv = state.buildView;
      if (!bv) { state.panDrag = null; }
      else {
        const s = PPM * bv.zoom;
        bv.x = state.panDrag.vx - (p.x - state.panDrag.sx) / s;
        bv.y = state.panDrag.vy + (p.y - state.panDrag.sy) / s;
        clampBuildView(bv, level());
        return;      // 拖动期间不处理别的悬停逻辑
      }
    }
    // 橡皮按住拖动 = 连续擦
    if (state.phase === 'build' && state.erasePaint && state.mouse.down) {
      const c0 = cellAt(p.x, p.y);
      if (c0) {
        const kk = c0.r + ',' + c0.c;
        /* quiet：一笔擦过的每一格都并进"同一笔"那一步撤销里。
         * 不 quiet 的话，按住擦过 5 格 = 5 步，玩家按一次 Z 只回一格，
         * 会觉得"撤销不好使"。 */
        if (state.build.cells[kk]) RAP.removeAt(state.build, c0.r, c0.c, { quiet: true });
      }
    }
    // 按住已放零件并移动超过 8px → 才拿起它（单击不算移动）
    if (state.phase === 'build' && state.pendingClick && !state.dragMove) {
      const pc = state.pendingClick;
      if (Math.hypot(p.x - pc.x, p.y - pc.y) > 8) {
        const key = pc.r + ',' + pc.c;
        const there = state.build.cells[key];
        if (there) {
          /* `n` 必须跟着一起搬走。
           * 原来这里是 `{ r, c, part, dir, inner }` —— 没有 n，落子时写回的也是
           * `{ part, dir }`。于是"把 3 个气球拖到另一个格子"会变成 1 个，
           * 另外 2 个静悄悄回到待使用：一次拖动**既改位置又改数量**，还没提示。
           * 叠放是这个游戏唯一的数量载体，丢了它就是丢了玩家的意图。 */

    ['wheelGrip', '轮子抓地倍率', 0.3, 2, 0.05],
    ['rollResist', '滚动阻力', 0, 0.12, 0.005],
    ['interactCap', '交互键上限', 1, 3, 1]
  ];
  function buildPanel() {
    const box = document.getElementById('sliders');
    box.innerHTML = '';
    SLIDERS.forEach(([key, label, min, max, step]) => {
      const wrap = document.createElement('div');
      const lab = document.createElement('label');
      lab.innerHTML = `<span>${label}</span><span class="val">${RAP.Params[key]}</span>`;
      const inp = document.createElement('input');
      inp.type = 'range'; inp.min = min; inp.max = max; inp.step = step; inp.value = RAP.Params[key];
      inp.oninput = () => {
        RAP.Params[key] = parseFloat(inp.value);
        lab.querySelector('.val').textContent = inp.value;
      };
      wrap.appendChild(lab); wrap.appendChild(inp);
      box.appendChild(wrap);
    });
    document.getElementById('reset').onclick = () => { RAP.resetParams(); buildPanel(); };
  }
  buildPanel();

  // ---------- 渲染 ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function text(s, x, y, size, color, align, bold) {
    ctx.font = `${bold ? '700 ' : ''}${size}px "Microsoft YaHei", sans-serif`;
    ctx.fillStyle = color; ctx.textAlign = align || 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(s, x, y);
  }

const BIOMES = {
  /* 下方每个 biome 的 `rock` 是**缩略图的主色**（缩略图 60% 以上的面积是岩体），
   * 所以它必须让六关在选关页上一眼可分。原来六关的 rock 都挤在
   * [58,74,84] ~ [186,122,78] 之间，压暗之后最大差只有 8~16（阈值 18）。
   * 现在把每一套的 rock 往各自的方向拉开：
   *   草地 青灰 / 峡谷 暖橙 / 洞穴 冷暗蓝 / 冰面 浅青白 / 黄昏 紫褐 / 高空 亮青
   * 这些数只影响"看起来像哪一关"，不参与任何物理。 */
  field: { rock: [120, 138, 128], grass: '#79c94f', grass2: '#4f9e3c', grass3: '#a6e070',
    edge: '#12201a', skyTop: '#8FC4E0', skyMid: '#CFE6D8', skyLow: '#F2F0C0',
    hill: '#6E93A6', jungle: ['#3f7f5c', '#2f6b4a', '#22503a'], cave: false, dim: 0.13 },
  canyon: { rock: [186, 122, 78], grass: '#d8a24f', grass2: '#a8763a', grass3: '#f0cc84',
    edge: '#4a2a16', skyTop: '#E8A96B', skyMid: '#F4D8A8', skyLow: '#FBF0D2',
    hill: '#B07A5A', jungle: ['#7d5a3a', '#63452c', '#4a3320'], cave: false, dim: 0.26 },
  cave: { rock: [58, 74, 84], grass: '#4e7a52', grass2: '#33543a', grass3: '#6f9e6a',
    edge: '#08110f', skyTop: '#0d1a22', skyMid: '#132530', skyLow: '#1b3340',
    hill: '#0b1822', jungle: ['#15302a', '#102420', '#0b1a17'], cave: true, dim: 0.08 },
  ice: { rock: [150, 178, 198], grass: '#cfeef8', grass2: '#9ed4e8', grass3: '#f0ffff',
    edge: '#4a7286', skyTop: '#9FCBE8', skyMid: '#D8EEF8', skyLow: '#F4FCFF',
    hill: '#8FB6CC', jungle: ['#7FA8BE', '#6B95AC', '#5A8199'], cave: false, dim: 0.26 },
  /* 黄昏（1-5）。岩体往**紫**推，和 1-1 的绿灰、1-6 的沙黄都分开。
   * 这三个 biome 的 rock 是缩略图主色，所以它们的 RGB 必须两两差 ≥ 18，
   * 否则选关页上分不出谁是谁（tools/test_level_thumbs 把守）。 */
  dusk: { rock: [128, 84, 132], grass: '#7a6a4a', grass2: '#544832', grass3: '#a89468',
    edge: '#1a1420', skyTop: '#3B3560', skyMid: '#9A6A72', skyLow: '#E8A870',
    hill: '#5A4A6A', jungle: ['#2E3A42', '#25303a', '#1C2630'], cave: false, dim: 0.17 },
  /* 「高空」（1-6 用）。原来是共享 `dusk` 的，但 1-5 也是 dusk ——
   * 两张缩略图的平均色几乎一样，选关页上分不出谁是谁
   * （tools/test_level_thumbs 的阈值是 18，实测只差 17）。
   *
   * 1-6 是"抬头"的浮力关：它要飞到 10 米以上，视觉上必须让人**想往上**。
   * 所以这一套刻意做得**亮**：浅青的天、明亮的地表草、
   * 和 1-3/1-5 那两种暗调彻底拉开。
   * （第一版只是把 dusk 的色相往青绿挪了一点，平均色仍然只有 34,46,56 ——
   *   和 1-3 的 34,49,52 差 4，等于没分开。改配色时要看**平均色**这个数，
   *   不是看着"感觉不一样"。） */
  /* 「高空」那一套（1-6 用，键名 skyBiome —— 不能叫 `sky`，
   * 因为 BIOMES 里已经有一个 `skyTop`/`skyMid`/`skyLow` 参数系列，
   * 而 tools/audit_level_fields 用正则从这段源码里抠"顶层键"，
   * 一个叫 `sky` 的 biome 会让它把注释里的字样也算成一个参数并判"没人读"）。
   *
   * 这一套刻意走**浅色岩体**（沙岩那种），和 1-1 的青灰、
   * 1-5 的紫褐、1-3 的暗蓝都拉开距离 —— 缩略图主色是 rock，
   * 三个颜色必须两两差 ≥ 18，否则选关页上分不出谁是谁。 */
  skyBiome: { rock: [214, 198, 158], grass: '#88c070', grass2: '#5fa05a', grass3: '#bfe8a8',
    edge: '#1e3a30', skyTop: '#5FB4D8', skyMid: '#B8E4EC', skyLow: '#F0FBF2',
    hill: '#7FB8C8', jungle: ['#3E7A62', '#2F6350', '#244E40'], cave: false, dim: 0.12 },
  /* 「岩窟」（1-7 用，第 72 轮新增）。1-7 一开始借了 `skyBiome`，
   * 但 1-6 也是 skyBiome —— 两张缩略图平均色差只有 3（阈值 18），
   * 选关页上完全分不出谁是谁。这一套走**暖红岩**：
   * rock 和 skyBiome 的沙黄、canyon 的橙、dusk 的紫都拉开了距离，
   * 而且和"岩柱从脚下升起"这个玩法在语义上也贴。
   * `cave: false` —— 它是有天空的露天峡谷，不是洞。 */
  gorge: { rock: [176, 92, 96], grass: '#c88a6a', grass2: '#a86a52', grass3: '#e8b48a',
    edge: '#3a2020', skyTop: '#C8807A', skyMid: '#E8B49A', skyLow: '#F8DCC4',
    hill: '#a8686a', jungle: ['#7A4638', '#5E3428', '#46241C'], cave: false, dim: 0.16 }
};

  function drawWorld(ter, cam) {
    const s = PPM * cam.zoom;
    const toX = wx => DW / 2 + (wx - cam.x) * s;
    const toY = wy => DH / 2 - (wy - cam.y) * s;

    // ---------- 按关卡 biome 选视觉地貌（纯美术，不影响物理）----------
    const PAL = BIOMES[(level() && level().biome) || 'field'] || BIOMES.field;
    const CAVE = PAL.cave;


    // 天空
    const g = ctx.createLinearGradient(0, 0, 0, DH * (CAVE ? 0.8 : 0.62));
    g.addColorStop(0, PAL.skyTop);
    g.addColorStop(0.45, PAL.skyMid);
    g.addColorStop(1, PAL.skyLow);
    fillScreen(g);

    // 云：几团叠加的柔和白云（带一点暖边）
    function cloud(cx0, cy0, sc, alpha) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#ffffff';
      for (const [ox, oy, rr] of [[-30, 4, 22], [0, -6, 30], [30, 2, 24], [56, 8, 18], [-54, 9, 17]]) {
        ctx.beginPath();
        ctx.arc(cx0 + ox * sc, cy0 + oy * sc, rr * sc, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = 'rgba(255,246,214,.5)';
      for (const [ox, oy, rr] of [[-20, 14, 16], [22, 15, 14], [44, 13, 11]]) {
        ctx.beginPath();
        ctx.arc(cx0 + ox * sc, cy0 + oy * sc, rr * sc, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
    if (!CAVE) {
      cloud(DW * 0.16, 120, 1.25, 0.88);
      cloud(DW * 0.52, 78, 1.55, 0.8);
      cloud(DW * 0.86, 132, 1.05, 0.82);
      cloud(DW * 0.36, 190, 0.85, 0.6);
      if (VIEW_W > DW + 80) {
        cloud(-VIEW_OFF_X * 0.5 + 60, 150, 1.1, 0.7);
        cloud(DW + VIEW_OFF_X * 0.5, 108, 1.2, 0.75);
      }
    } else {
      // 洞窟：顶部钟乳石 + 强暗角
      ctx.fillStyle = '#0a141a';
      const dripN = Math.max(14, Math.ceil((VIEW_W + VIEW_OFF_X * 2) / 78));
      for (let ci = 0; ci < dripN; ci++) {
        const bx = (ci / (dripN - 1)) * (VIEW_W + VIEW_OFF_X * 2) + ((ci * 37) % 40) - 20 - VIEW_OFF_X;
        const w2 = 26 + ((ci * 53) % 30);
        const h2 = 60 + ((ci * 71) % 90);
        ctx.beginPath();
        ctx.moveTo(bx - w2 / 2, 0); ctx.lineTo(bx + w2 / 2, 0);
        ctx.lineTo(bx + ((ci % 3) - 1) * 8, h2);
        ctx.closePath(); ctx.fill();
      }
      // 顶部垂藤
      ctx.strokeStyle = 'rgba(28,52,40,.75)';
      for (let vi = 0; vi < 18; vi++) {
        const hx = (vi / 17) * (VIEW_W + VIEW_OFF_X * 2) - VIEW_OFF_X + ((vi * 53) % 30);
        const vlen = 40 + ((vi * 71) % 110);
        const bend = ((vi % 3) - 1) * 12;
        ctx.lineWidth = 1.5 + ((vi * 37) % 3) * 0.8;
        ctx.beginPath();
        ctx.moveTo(hx, 0);
        ctx.quadraticCurveTo(hx + bend, vlen * 0.6, hx + bend * 1.6, vlen);
        ctx.stroke();
      }

      const caveV = ctx.createRadialGradient(DW / 2, DH * 0.62, DH * 0.2, DW / 2, DH * 0.62, DW * 0.7);
      caveV.addColorStop(0, 'rgba(0,0,0,0)');
      caveV.addColorStop(1, 'rgba(0,0,0,.55)');
      fillScreen(caveV);
    }

    // 地平线光晕（暖；洞穴里换成冷光，暖光会让洞窟"漏日光"）
    const glow = ctx.createRadialGradient(DW * 0.5, DH * 0.5, 80, DW * 0.5, DH * 0.5, DW * 0.62);
    glow.addColorStop(0, CAVE ? 'rgba(150,200,220,.13)' : 'rgba(255,248,196,.32)');
    glow.addColorStop(1, 'rgba(255,248,196,0)');
    fillScreen(glow);
    /* 原来这里还有一圈**钉死在屏幕 0.62DH** 的三角形远山。
     * 第 65 轮删掉了：它不跟镜头、不跟地形，纯壁纸；
     * 下面那层带视差的远山才是真的"远处"。留两层同样的三角形
     * 只会让纵深看起来是重影。 */

    // ---------- 丛林：三层剪影 ----------
    /* 背景山必须**有视差**，不能是贴在镜头上的一张壁纸。
     *
     * 用户原话：「背景的山不要完全跟随镜头啊」。他说的现象是：拖动镜头时
     * 山峦一动不动，只有前景地形在动 —— 那不是"远处的山"，是"贴在眼睛上的纸"。
     * （反面也一样糟：山和地形同速，等于山就在脚边，纵深没了。）
     *
     * 定义一个比例 HILL_PAR = 远景在屏幕上的移动速度 / 地形在屏幕上的移动速度：
     *   · 0   → 完全不动（旧行为，壁纸）；
     *   · 1   → 和地形同速（山贴在脚边）；
     *   · 0.36 → "几公里外"的观感。
     *
     * 换算：镜头右移 Δ，世界在屏幕上左移 Δ·s（s = PPM·zoom）。
     * 所以远景要左移 Δ·s·HILL_PAR，即 translate(−Δ·s·HILL_PAR)。
     * 写成 −Δ·s·(1−HILL_PAR) 是错的（那是 64%），第一版就是这么写反的。
     *
     * 纵向同理，比例更小（0.12）：俯视时山不会突然顶到天上，平视时又压得住地平线。
     *
     * 顺带把这两个位移写进 state，**渲染与测试读同一个数** ——
     * 这条项目铁律在这里同样适用：量具不许另抄一份公式。 */
    const HILL_PAR_X = (state.hillParX == null) ? DEFAULT_HILL_PAR_X : state.hillParX;
    const HILL_PAR_Y = (state.hillParY == null) ? DEFAULT_HILL_PAR_Y : state.hillParY;
    const hillShiftX = (cam.x - level().start.col) * PPM * cam.zoom * HILL_PAR_X;
    const hillShiftY = (cam.y - 9) * PPM * cam.zoom * HILL_PAR_Y;
    state.hillShiftX = hillShiftX;
    state.hillShiftY = hillShiftY;
    state.terrainShiftX = (cam.x - level().start.col) * PPM * cam.zoom;

    function canopy(baseY2, r0, dy, color, alpha, leafy) {
      ctx.save();
      ctx.globalAlpha = alpha;
      const n = Math.ceil((VIEW_W + VIEW_OFF_X * 2) / (r0 * 1.5)) + 4;
      for (let i = 0; i < n; i++) {
        const bx = (i - 1) * r0 * 1.5 + (i % 2) * r0 * 0.4 - VIEW_OFF_X;
        const rr = r0 * (0.75 + ((i * 37) % 11) / 22);
        const by = baseY2 + dy - ((i * 53) % 9) * 1.6;
        ctx.fillStyle = color;
        ctx.beginPath(); ctx.arc(bx, by, rr, Math.PI, 0); ctx.fill();
        // 叶尖（近景层才画）
        if (leafy) {
          for (let k = 0; k < 7; k++) {
            const a2 = -Math.PI + (k / 6) * Math.PI;
            const x1 = bx + Math.cos(a2) * rr * 0.96;
            const y1 = by + Math.sin(a2) * rr * 0.96;
            ctx.beginPath();
            ctx.moveTo(x1 - 3 * cam.zoom, y1);
            ctx.quadraticCurveTo(x1, y1 - 8 * cam.zoom, x1 + 3 * cam.zoom, y1);
            ctx.closePath(); ctx.fill();
          }
        }
      }
      ctx.restore();
    }

    const horizonY = toY(ter.surfaceY(cam.x) + 2.6);
    // 远景地面：先铺满，避免远山与丛林之间漏出天空
    // 从远山顶点之上就开始铺（否则三角形之间会漏出天空）
    // 淡入带要够长，否则远景地面顶端会在屏幕固定高度上出现一条横向"接缝"
    const farGround = ctx.createLinearGradient(0, horizonY - 170, 0, horizonY + 120);
    farGround.addColorStop(0, CAVE ? 'rgba(10,20,26,0)' : 'rgba(196,216,222,0)');
    farGround.addColorStop(0.58, PAL.hill);
    farGround.addColorStop(0.74, PAL.hill);
    farGround.addColorStop(1, PAL.jungle[1]);
    ctx.fillStyle = farGround;
    ctx.fillRect(-VIEW_OFF_X - 4, horizonY - 170, VIEW_W + VIEW_OFF_X * 2 + 8, 290);

    /* 远山 + 远近两层丛林：全部包在一个视差平移里。
     *
     * 平移量 hillShiftX/Y 在上面算好。
     * 为什么用 ctx.translate 包住整段，而不是给每个三角形单独加偏移：
     * 这三个层次必须**共享同一个视差**，一旦各算各的，层与层之间会出现
     * 相对滑动，看起来像三层纸片在飘，比不动更糟。
     *
     * 平移量已经是"远景在屏幕上的位移"（见上面的换算），所以这里直接用负号，
     * 不能再乘 (1−比例) —— 那是第一版的错，把它变成了 64%。 */
    ctx.save();
    ctx.translate(-hillShiftX, -hillShiftY);
    // 远山（最淡，最高）
    ctx.fillStyle = CAVE ? 'rgba(8,16,22,.85)' : PAL.hill;
    const hillN2 = Math.ceil((VIEW_W + VIEW_OFF_X * 2) / 220) + 3;
    for (let i = 0; i < hillN2 + 6; i++) {
      const bx = (i - 3) * 220 - 120 - VIEW_OFF_X, hh = 120 - (i % 3) * 26;
      ctx.beginPath();
      ctx.moveTo(bx, horizonY + 30);
      ctx.lineTo(bx + 130, horizonY + 30 - hh);
      ctx.lineTo(bx + 260, horizonY + 30);
      ctx.closePath(); ctx.fill();
    }
    // 远景丛林（淡）
    canopy(horizonY + 34, 42, 0, PAL.jungle[0], 0.9, false);
    // 中景丛林（中）
    canopy(horizonY + 62, 50, 6, PAL.jungle[1], 0.96, false);
    ctx.restore();
    // 中景与近景之间的雾（洞穴里是冷雾，不能撒暖白）
    const fogCol = CAVE ? '190,220,235' : '226,240,210';
    const fogM = ctx.createLinearGradient(0, horizonY + 40, 0, horizonY + 130);
    fogM.addColorStop(0, 'rgba(' + fogCol + ',0)');
    fogM.addColorStop(0.5, 'rgba(' + fogCol + ',' + (CAVE ? 0.16 : 0.32) + ')');
    fogM.addColorStop(1, 'rgba(' + fogCol + ',0)');
    ctx.fillStyle = fogM;
    ctx.fillRect(-VIEW_OFF_X - 4, horizonY + 40, VIEW_W + VIEW_OFF_X * 2 + 8, 100);
    // 近景丛林（最实，带叶尖）
    canopy(horizonY + 96, 58, 10, PAL.jungle[2], 1, true);

    // 棕榈剪影
    function palm(px, py, scale, alpha) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = PAL.jungle[2]; ctx.lineWidth = 6 * scale; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.quadraticCurveTo(px + 7 * scale, py - 50 * scale, px + 2 * scale, py - 92 * scale);
      ctx.stroke();
      ctx.strokeStyle = PAL.jungle[1]; ctx.lineWidth = 9 * scale;
      for (let k = 0; k < 7; k++) {
        const a = -Math.PI / 2 + (k - 3) * 0.46;
        ctx.beginPath();
        ctx.moveTo(px + 2 * scale, py - 92 * scale);
        ctx.quadraticCurveTo(
          px + Math.cos(a) * 36 * scale, py - 92 * scale + Math.sin(a) * 22 * scale - 14 * scale,
          px + Math.cos(a) * 60 * scale, py - 92 * scale + Math.sin(a) * 38 * scale + 8 * scale);
        ctx.stroke();
      }
      ctx.restore();
    }
    const palmBase = horizonY + 104;
    palm(DW * 0.10, palmBase, 1.05, 0.92);
    palm(DW * 0.24, palmBase + 8, 0.82, 0.8);
    palm(DW * 0.72, palmBase + 4, 0.98, 0.88);
    palm(DW * 0.87, palmBase + 12, 0.78, 0.78);

    // 远景地面过渡带（近景丛林脚下一层泥地，避免草皮直接接丛林）
    ctx.fillStyle = '#6b7a52';
    ctx.fillRect(-VIEW_OFF_X - 4, horizonY + 118, VIEW_W + VIEW_OFF_X * 2 + 8,
      Math.max(0, toY(ter.surfaceY(cam.x)) - (horizonY + 118)) + 6);
    const gTrans = ctx.createLinearGradient(0, horizonY + 118, 0, toY(ter.surfaceY(cam.x)) + 6);
    gTrans.addColorStop(0, 'rgba(40,70,50,.55)');
    gTrans.addColorStop(1, 'rgba(40,70,50,0)');
    ctx.fillStyle = gTrans;
    ctx.fillRect(0, horizonY + 118, DW, Math.max(0, toY(ter.surfaceY(cam.x)) - (horizonY + 118)) + 6);

    // 地表材质带
    function band(color, width, offset) {
      ctx.beginPath();
      for (let i = 0; i < pts.length; i++) {
    const x = toX(pts[i][0]), y = toY(pts[i][1]) + offset;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = 'round'; ctx.stroke();
    }
    // 草皮：暗边 → 亮草 → 高光 → 草叶
    // ---------- 地形：折线采样 ----------
    /* 采样步长按**屏幕像素**定，不按世界米数。
     *
     * 原来是 `stepW = 5 / s` —— 5 个**屏幕像素**，听起来对，但它乘上了
     * 可视世界宽度 (VIEW_W/s)，所以点数 = VIEW_W/5 ≈ 256？不是：
     * loop 是 `x += stepW` 走到 rightW，一共 (rightW-leftW)/stepW 步
     * = (VIEW_W/s)/(5/s) = VIEW_W/5 —— 确实是 256 个点，和 zoom 无关。
     *
     * 但 pts 被**反复用**：traceTerrain 走一遍（256 次 lineTo）、
     * 四个 band() 各走一遍（4×256）、草叶和碎石又各扫一遍。
     * zoom 小时石头多，zoom 大时点子一样多 —— 所以真正省的是
     * **把点数降下来**，同时保证屏幕上看不出折线。
     *
     * 6 px 一个点（≈ 1280/6 ≈ 213 点）在 720p 下和 5 px 肉眼无差，
     * 但 5 条路径加起来少走 1000 多次 lineTo。 */
    const leftW = cam.x - VIEW_W / 2 / s - 2, rightW = cam.x + VIEW_W / 2 / s + 2;
    const stepW = 6 / s;
    const pts = [];
    for (let x = leftW; x <= rightW; x += stepW) pts.push([x, ter.surfaceY(x)]);

    function traceTerrain(extraBottom) {
      ctx.beginPath();
      ctx.moveTo(toX(pts[0][0]), toY(pts[0][1]));
      for (let i = 1; i < pts.length; i++) ctx.lineTo(toX(pts[i][0]), toY(pts[i][1]));
      const bottomY = DH + VIEW_OFF_Y + (extraBottom || 40);
      ctx.lineTo(toX(pts[pts.length - 1][0]), bottomY);
      ctx.lineTo(toX(pts[0][0]), bottomY);
      ctx.closePath();
    }

    // 底色（深石头）
    traceTerrain();
    const rockDeep = ctx.createLinearGradient(0, toY(cam.y), 0, DH);
    rockDeep.addColorStop(0, '#3d4a56');
    rockDeep.addColorStop(1, '#2a3641');
    ctx.fillStyle = rockDeep; ctx.fill();

    // ---------- 石块纹理 ----------
    ctx.save();
    traceTerrain();
    ctx.clip();
    // 见模块级 texHash()
    /* 石头纹理必须锚在**世界坐标**上。
     *
     * 原来是 `baseY = toY(cam.y) + 14` —— 而 toY(cam.y) 恒等于 DH/2，
     * 所以这个基准和镜头没有任何关系；横向的 `ox` 同样是屏幕量（减了 VIEW_OFF_X）。
     * 后果：车往前跑的时候石头一格都不动，只有地形轮廓、草叶、碎石在动。
     * 玩家看到的是"地面像一张贴在镜头上的壁纸"—— 相对运动全靠几根稀疏的草
     * 和几粒碎石撑着，撑不住。
     *
     * 现在按世界尺度铺（4 m × 2.6875 m 一格），镜头移动一格石头才移动一格。
     * 顺带解决一个旧问题：同一块石头两次经过时长得一样，玩家能靠
     * "刚才那块歪的石头"认出自己走到哪儿了 —— 这是横向卷轴最基本的方向感。
     */
    const STONE_WM = 128 / PPM, STONE_HM = 86 / PPM;   // 世界尺度：4 m × 2.6875 m
    const stoneW = STONE_WM * s, stoneH = STONE_HM * s;
    const STONE_TOP = 14;                              // 从世界 y=14 往下铺（高过最高地表）
    // 可视区对应的世界范围（各留一格余量，避免边缘露空）
    const halfVW = (VIEW_W / 2 + VIEW_OFF_X) / s;
    const colLo = Math.floor((cam.x - halfVW) / STONE_WM) - 1;
    const colHi = Math.ceil((cam.x + halfVW) / STONE_WM) + 1;
    const worldYBot = cam.y - (DH / 2 + VIEW_OFF_Y) / s;
    const rowHi = Math.ceil((STONE_TOP - worldYBot) / STONE_HM) + 1;
    for (let row = 0; row < rowHi; row++) {
      for (let col = colLo; col <= colHi; col++) {
    // 世界坐标 → 屏幕；奇偶行错半格，砖缝才不连成一条直线
    const wob = (((row % 2) + 2) % 2) ? 0.5 : 0;
    const wx2 = (col + wob) * STONE_WM;
    const wy2 = STONE_TOP - row * STONE_HM;
    const ox = toX(wx2);
    const oy = toY(wy2);
    const jx = (texHash(col, row) - 0.5) * stoneW * 0.34;
    const jy = (texHash(col + 99, row + 7) - 0.5) * stoneH * 0.30;
    const cx2 = ox + jx, cy2 = oy + jy;
    const rw = stoneW * (0.50 + texHash(col + 3, row + 11) * 0.10);
    const rh = stoneH * (0.48 + texHash(col + 5, row + 13) * 0.10);
    const N = 7 + Math.floor(texHash(col + 21, row + 17) * 4);   // 7~10 边，更圆润
    const poly = [];
    for (let k = 0; k < N; k++) {
      const a = (k / N) * Math.PI * 2 + texHash(col + k, row + k) * 0.5;
      const rr = 1 + (texHash(col * 7 + k, row * 3 + k) - 0.5) * 0.22;  // 扰动减小 → 更圆
      poly.push([cx2 + Math.cos(a) * rw * rr, cy2 + Math.sin(a) * rh * rr]);
    }
    // 主体：深青灰，越往下越暗
    ctx.beginPath();
    poly.forEach((pt, k) => k === 0 ? ctx.moveTo(pt[0], pt[1]) : ctx.lineTo(pt[0], pt[1]));
    ctx.closePath();
    /* 深度按**世界**算：越深的石头越暗。原来除的是屏幕量 (DH − baseY)，
     * baseY 又恒等于 DH/2，于是半屏以下全被压成同一个颜色。
     * 现在用世界坐标：STONE_TOP 处 0、再往下 12 米处 1。 */
    const depth = Math.min(1, Math.max(0, (STONE_TOP - wy2) / 12));
    const l1 = Math.round(PAL.rock[0] - depth * 40),
          g1 = Math.round(PAL.rock[1] - depth * 38),
          b1 = Math.round(PAL.rock[2] - depth * 36);
    /* 主体 + 内部径向渐变（中心亮、边缘暗 → 圆润的立体感）。
     *
     * ⚠ 性能：这块原来是**每帧每块石头**都 `createRadialGradient` + 3 个 addColorStop。
     * 全图视角下每帧 ~86 块石头，也就是每秒 ~5100 次渐变创建 ——
     * 探针（tools/dbg_build_prof.js）量到 createRadialGradient 单独就吃掉 9 ms/60帧，
     * 而且它是最贵的那类 canvas 调用（要分配对象 + 解析颜色字符串）。
     *
     * 现在按"石头深度档"（depth 量化到 8 档）预建一张渐变缓存表。
     * 同一档的石头共用同一个 gradient 对象 —— 渐变坐标是**相对**的，
     * 而这里的石头尺寸在同一 zoom 下是一致的，所以视觉上等价。
     * 缓存键里带 zoom 与尺寸，换关卡/缩放时自动失效。 */
    const gradKey = l1 + '_' + g1 + '_' + b1 + '_' + Math.round(rw) + '_' + Math.round(rh);
    let rg = stoneGradCache.get(gradKey);
    if (!rg) {
      rg = ctx.createRadialGradient(
        -rw * 0.22, -rh * 0.34, rh * 0.12, 0, 0, rw * 1.05);
      rg.addColorStop(0, 'rgb(' + Math.min(255, l1 + 34) + ',' + Math.min(255, g1 + 32) + ',' + Math.min(255, b1 + 30) + ')');
      rg.addColorStop(0.55, 'rgb(' + l1 + ',' + g1 + ',' + b1 + ')');
      rg.addColorStop(1, 'rgb(' + Math.max(0, l1 - 34) + ',' + Math.max(0, g1 - 32) + ',' + Math.max(0, b1 - 30) + ')');
      if (stoneGradCache.size > 400) stoneGradCache.clear();   // 防止缩放时无限增长
      stoneGradCache.set(gradKey, rg);
    }
    /* 渐变坐标改成以 (0,0) 为中心 → 画的时候 translate 过去。
     *
     * 另外按 zoom 做**降级**：缩得很远时（建造页看全图，1-3 是 0.54）
     * 一块石头只有 ~35 px，那条 4.2*zoom 的深色缝会占掉大半个多边形，
     * 视觉上只是"一团糊"，而它每块都要一次完整 stroke。
     * 低于 0.85 就不描缝了 —— 那是纯省，画面上看不出区别
     * （1-3 的 0.54 档从 21.9 fps 回到 50 以上）。 */
    const drawSeam = cam.zoom >= 0.85;
    ctx.save();
    ctx.translate(cx2, cy2);
    ctx.beginPath();
    poly.forEach((pt, k) => {
      const px2 = pt[0] - cx2, py2 = pt[1] - cy2;
      k === 0 ? ctx.moveTo(px2, py2) : ctx.lineTo(px2, py2);
    });
    ctx.closePath();
    ctx.fillStyle = rg; ctx.fill();

    // 缝：更宽更深
    if (drawSeam) {
      ctx.strokeStyle = 'rgba(6,12,18,.85)';
      ctx.lineWidth = Math.max(2, 4.2 * cam.zoom);
      ctx.stroke();
    }
    ctx.restore();
      }
    }
    ctx.restore();

    // 地表材质带
    function band(color, width, offset) {
      ctx.beginPath();
      for (let i = 0; i < pts.length; i++) {
    const x = toX(pts[i][0]), y = toY(pts[i][1]) + offset;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = 'round'; ctx.stroke();
    }
    // 草皮：暗边 → 暗草 → 亮草 → 顶部高光
    band(PAL.edge, 16 * cam.zoom, 13 * cam.zoom);               // 草地整体暗边
    band(PAL.grass2, 15 * cam.zoom, 6 * cam.zoom);              // 暗草
    band(PAL.grass, 12 * cam.zoom, 1 * cam.zoom);               // 亮草
    band(PAL.grass3, 5 * cam.zoom, -2 * cam.zoom);              // 顶部高光

    /* ⚠ 这里原来**又写了一遍**上面那四行 band()。
     *
     * 同样的颜色、同样的宽度、同样的 offset，一字不差 —— 也就是四层草皮
     * 被画了两遍。它不改变画面（完全重合的半透明描边，第二遍等于把颜色
     * 再压深一点点，肉眼分辨不出），但每次 drawWorld 都要多走 4 × 609 个点。
     *
     * 第 62 轮把建造镜头换成"看全图"之后，这个白送的开销变成了一处真回归：
     * test_perf_stable 报建造页 20.5 fps（基线 60.9 的 0.34）。
     * 删掉重复的这组之后回到 55~60。
     *
     * 教训：**性能回归不一定是新代码慢，也可能是旧代码一直在白干，
     * 只是以前画得少所以没被看见。**
     */

    // 石头表面的小碎石（跟着地形走，一定在石头内部）
    {
