    if (state.phase === 'resolved') {
      // 结算页的两个按钮由 drawResult 一并绘制（跟随卡片滑入 + 主次分级），
      // 这里再画一遍会盖在上面，变成一坨没描边的绿块。
    }
  }

  function drawTabs() {
    levels.forEach((lv, i) => {
      const t = tabRect(i), active = i === state.levelIndex;
      ctx.fillStyle = active ? '#3a6490' : 'rgba(12,20,26,.88)';
      roundRect(t.x, t.y, t.w, t.h, 7); ctx.fill();
      if (i === 0) {
        text('☰ 关卡', t.x + t.w / 2, t.y + 21, 13, '#ffe9b0', 'center', true);
      } else {
        text(lv.levelId, t.x + t.w / 2, t.y + 21, 14, active ? '#fff' : '#9fb2c2', 'center', active);
      }
    });
  }

  /* 「飞过终点但没落地」提示条的文案。抽成纯函数是为了让测试能直接断言
   * "什么时候该显、什么时候不该显"，而不是去数像素。
   * probe_over_goal.js 量过：标准解在 t=9.47 越过终点线时还在 15 米高空，
   * 到 12.53 才落回地面判赢 —— 所以这条提示在**赢的那一局**里也会出现 3 秒，
   * 它必须是"随高度实时消失的读数"，不能做成一次性 toast。 */
  function overGoalNotice(run) {
    if (!run || !run.car || !run.terrain) return null;
    const lv = level();
    if (!lv || !lv.goal) return null;
    if (run.car.x < lv.goal.col) return null;
    const alt = Math.abs(run.car.y - run.terrain.surfaceY(run.car.x));
    if (alt <= RAP.Params.goalMaxAlt) return null;
    return { alt, text: '⚠ 还在 ' + alt.toFixed(1) + ' 米高空 —— 落回地面才算到' };
  }

  /* 「快要被判没进展了」的倒计时。
   *
   * 引擎每帧写 run.noGainFor（已经多久没有实质进展），这里只负责
   * 把它翻译成玩家能懂的一句话。**两个数必须来自同一个字段** ——
   * 界面上的"还剩 3 秒"和引擎里的"到 8 秒判负"如果各算一遍，
   * 这个项目已经因此踩过三次坑（第三颗星的名字、关卡卡片几何、零件行数）。
   *
   * 为什么不从第 0 秒就显示：每局开头都在起跑，玩家会看到一个常驻的
   * 黄色警告条，变成纯噪音。所以只在剩不到 4 秒时才出现 ——
   * 那时玩家确实还来得及补救（扔沙袋、按打气筒）。 */
  function progressWarning(run) {
    if (!run || !run.car) return null;
    const W = RAP.Params.progressWindow;
    const left = W - (run.noGainFor || 0);
    if (left > 4.0 || left <= 0) return null;
    return { left, text: '⚠ ' + Math.max(1, Math.ceil(left)) + ' 秒内没有进展就要判负 —— 靠不了近、也升不高' };
  }

  function drawHud() {
    const built = RAP.buildVehicle(level(), state.build);
    const mass = built ? built.mass : 0;
    const energy = built ? built.energyMax : 0;
    let line = `${level().levelId} ${level().name}　总重 ${mass.toFixed(1)} kg　能量 ${Math.round(energy)}　交互键 ${built ? built.interactives.length : 0}/${RAP.Params.interactCap}`;
    /* 建造期就把"净重"算给玩家看 —— 气球/沙袋的全部意义都在这个数上：
     * 净重 > 0 贴地跑，净重 < 0 才飞得起来。不显示的话，
     * 玩家只能靠反复发射去试"到底挂几个气球能飞"。 */
    let liftLine = '';
    if (built && (built.liftMass > 0 || built.sandbagCount > 0)) {
      const net = built.netMass;
      liftLine = `浮力 ${built.liftMass.toFixed(1)}　压舱 ${(built.sandbagCount * RAP.PARTS.sandbag.mass).toFixed(1)}` +
        `　净重 ${net.toFixed(1)} kg　${net < 0 ? '会飘起来' : '压得住'}`;
    }    let boxLine = '';
    if (state.phase === 'run' && state.run) {
      const car = state.run.car;
      line = `总重 ${car.mass.toFixed(1)} kg　能量 ${Math.round(car.energy)}　速度 ${Math.hypot(car.vx, car.vy).toFixed(1)} m/s`;
      boxLine = `木箱 ${state.run.boxesGot}/${state.run.boxes.length}`;
      if (car.liftMass > 0 || car.sandbagCount > 0) {
        const leftBags = car.sandbagCount || 0;
        liftLine = `气球 ${car.parts.filter(p => p.def.liftMass).reduce((a, p) => a + (p.n || 0), 0)}` +
          `　沙袋 ${leftBags}　净重 ${car.netMass.toFixed(1)} kg　${car.netMass < 0 ? '↑ 上升中' : '↓ 会落下'}`;
      }
    }
    /* 给测试留一个读取口：HUD 这一行是"玩家唯一能看到的浮力信息"，
     * 断言它比断言 car.netMass 更有意义（前者才是玩家实际读到的）。 */
    liftLineCache = liftLine;

    // 左上：暂停 / 重来（可点击）；右上：帮助
    if (state.phase === 'run') {
      const PB = btnRect('pause'), RB = btnRect('restartRun');
      const pc = { x: PB.x + PB.w / 2, y: PB.y + PB.h / 2 };
      ctx.fillStyle = state.paused ? '#63bf3f' : '#e0513c';
      ctx.beginPath(); ctx.arc(pc.x, pc.y, PB.w / 2, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff';
      if (state.paused) {
        ctx.beginPath();
        ctx.moveTo(pc.x - 6, pc.y - 10); ctx.lineTo(pc.x + 10, pc.y);
        ctx.lineTo(pc.x - 6, pc.y + 10); ctx.closePath(); ctx.fill();
      } else {
        ctx.fillRect(pc.x - 7, pc.y - 10, 5, 20);
        ctx.fillRect(pc.x + 2, pc.y - 10, 5, 20);
      }
      const rc = { x: RB.x + RB.w / 2, y: RB.y + RB.h / 2 };
      ctx.fillStyle = '#63bf3f';
      ctx.beginPath(); ctx.arc(rc.x, rc.y, RB.w / 2, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(rc.x, rc.y, 10, -0.6, 3.6); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(rc.x + 10, rc.y - 8); ctx.lineTo(rc.x + 11, rc.y + 2);
      ctx.lineTo(rc.x + 1, rc.y); ctx.closePath();
      ctx.fillStyle = '#fff'; ctx.fill();
      const HB = btnRect('help');
      const hcx = HB.x + HB.w / 2, hcy = HB.y + HB.h / 2;
      ctx.fillStyle = 'rgba(24,34,42,.88)';
      ctx.beginPath(); ctx.arc(hcx, hcy, HB.w / 2, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(232,200,122,.7)'; ctx.lineWidth = 2; ctx.stroke();
      text('?', hcx, hcy + 8, 22, '#ffe9b0', 'center', true);
    }
    if (state.paused && state.phase === 'run') {
      fillScreen('rgba(6,12,14,.52)');
      // 暂停面板：标题 + 两行真实可点的动作，别再只丢一行说明文字
      const P = pausePanel(), RR = pauseRowRects();
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
      ctx.fillStyle = 'rgba(12,24,30,.96)';
      roundRect(P.x, P.y, P.w, P.h, 16); ctx.fill();
      ctx.restore();
      ctx.strokeStyle = 'rgba(232,200,122,.5)'; ctx.lineWidth = 2;
      roundRect(P.x, P.y, P.w, P.h, 16); ctx.stroke();
      text('已暂停', DW / 2, P.y + 52, 30, '#ffe9b0', 'center', true);
      text('时间已停住，可以慢慢想', DW / 2, P.y + 78, 13, '#8fa3b4', 'center');

      const row = (r, label, key, main) => {
        ctx.fillStyle = main ? 'rgba(232,200,122,.92)' : 'rgba(24,40,50,.92)';
        roundRect(r.x, r.y, r.w, r.h, 10); ctx.fill();
        ctx.strokeStyle = main ? 'rgba(255,241,196,.9)' : 'rgba(232,200,122,.4)';
        ctx.lineWidth = 1.5; roundRect(r.x, r.y, r.w, r.h, 10); ctx.stroke();
        text(label, r.x + r.w / 2 - 16, r.y + 28, 15, main ? '#20180a' : '#e3eef6', 'center', true);
        // 右侧键帽
        ctx.fillStyle = main ? 'rgba(32,24,10,.18)' : 'rgba(255,255,255,.10)';
        roundRect(r.x + r.w - 54, r.y + 11, 38, 22, 6); ctx.fill();
        text(key, r.x + r.w - 35, r.y + 27, 11.5, main ? '#20180a' : '#9fb2c2', 'center', true);
      };
      row(RR.resume, '继续开', '空格', true);
      row(RR.back, '回建造（保留拼装）', 'R', false);
      text('Esc 也可以继续', DW / 2, P.y + P.h + 26, 12, 'rgba(190,212,228,.78)', 'center');
    }

    // 顶部信息条
    ctx.fillStyle = 'rgba(10,18,24,.88)'; roundRect(84, 90, 700, 30, 8); ctx.fill();
    ctx.strokeStyle = COL.goldDim; ctx.lineWidth = 1; ctx.stroke();
    text(line, 96, 111, 14, '#eaf4fb');

    // 行驶期的进度轨：告诉玩家"现在离终点还有多远"，顺带给出木箱/终点标记
    if (state.phase === 'run' && state.run) {
      const PR = runProgressRect();
      ctx.fillStyle = 'rgba(10,18,24,.80)';
      roundRect(PR.panel.x, PR.panel.y, PR.panel.w, PR.panel.h, 8); ctx.fill();
      ctx.strokeStyle = 'rgba(232,200,122,.22)'; ctx.lineWidth = 1; ctx.stroke();
      const lv = level(), tr = PR.track;
      const c0 = lv.start.col, c1 = lv.goal.col;
      const span = Math.max(1, c1 - c0);
      const at = c => tr.x + Math.max(0, Math.min(1, (c - c0) / span)) * tr.w;
      ctx.fillStyle = 'rgba(255,255,255,.12)';
      roundRect(tr.x, tr.y, tr.w, tr.h, 4); ctx.fill();
      const pcol = state.run.car.x;    // 车心世界 x（米）= 列号，因为 1 格 = 1 m
      const px = at(pcol);
      const doneW = Math.max(0, px - tr.x);
      if (doneW > 0) {
        const pg2 = ctx.createLinearGradient(tr.x, 0, px, 0);
        pg2.addColorStop(0, 'rgba(232,200,122,.85)'); pg2.addColorStop(1, '#ffe9b0');
        ctx.fillStyle = pg2; roundRect(tr.x, tr.y, doneW, tr.h, 4); ctx.fill();
      }
      // 木箱刻度
      (state.run.boxes || []).forEach(b => {
        if (b.got) return;
        const bx2 = at(b.col + 0.5);
        ctx.fillStyle = 'rgba(232,200,122,.75)';
        ctx.fillRect(bx2 - 1.5, tr.y - 3, 3, tr.h + 6);
      });
      // 终点旗刻度
      ctx.fillStyle = '#eef6ff';
      ctx.fillRect(at(c1 + 0.5) - 1.5, tr.y - 5, 3, tr.h + 10);
      // 小猪头
      ctx.fillStyle = '#ffd0d8';
      ctx.beginPath(); ctx.arc(px, tr.y + tr.h / 2, 6.5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(24,34,42,.85)'; ctx.lineWidth = 1.5; ctx.stroke();
      // 剩余距离（数字）
      const left2 = Math.max(0, (c1 - pcol));
      text('距终点 ' + left2.toFixed(0) + ' m', PR.panel.x + PR.panel.w - 12, PR.panel.y + 20, 12,
        left2 < 5 ? '#b6ff9e' : 'rgba(200,222,238,.9)', 'right');
      text('起点', PR.panel.x + 12, PR.panel.y + 20, 11, 'rgba(160,186,206,.85)', 'left');

      // ★★★ 条件实时状态：整趟都能看到"现在还满不满足"，不必等到结算才知道
      const CR = runChallengeRect();
      const cs = challengeStatus(state.run);
      ctx.fillStyle = 'rgba(10,18,24,.80)';
      roundRect(CR.x, CR.y, CR.w, CR.h, 8); ctx.fill();
      ctx.strokeStyle = cs.pass ? 'rgba(182,255,158,.34)' : 'rgba(224,129,106,.38)';
      ctx.lineWidth = 1; ctx.stroke();
      text((cs.pass ? '★ ' : '✕ ') + '★★★：' + cs.label,
        CR.x + 12, CR.y + 19, 12, cs.pass ? '#b6ff9e' : '#ffb4a2', 'left', true);
      if (cs.pass && cs.value) {
        text(cs.value, CR.x + CR.w - 12, CR.y + 19, 12, 'rgba(200,222,238,.85)', 'right');
      } else if (!cs.pass && cs.value) {
        text(cs.value, CR.x + CR.w - 12, CR.y + 19, 12, '#ffb4a2', 'right');
      }
    }
    if (state.phase === 'build') {
      // 三行说明文字底衬（亮天空下必须，否则白字看不见）
      ctx.fillStyle = 'rgba(10,18,24,.62)';
      roundRect(84, 128, 640, 58, 8); ctx.fill();

      // ---- 右侧整车统计卡 ----
      {
        const CX = DW - 232, CY = 148, CW = 200, CH = 188;
        ctx.fillStyle = 'rgba(12,20,26,.78)';
        roundRect(CX, CY, CW, CH, 12); ctx.fill();
        ctx.strokeStyle = 'rgba(232,200,122,.32)'; ctx.lineWidth = 1; ctx.stroke();
        text('整车', CX + 14, CY + 24, 13, '#9fd66a', 'left', true);
        let cgOff = 0, hasCar = built && built.parts.length > 0;
        if (hasCar) {
          let mx2 = 0, mm2 = 0;
          built.parts.forEach(pp => { mx2 += pp.lx * pp.def.mass; mm2 += pp.def.mass; });
          cgOff = mx2 / mm2 - built.center.x;
        }
        const rows2 = [
          ['质量', mass.toFixed(1) + ' kg', false],
          ['能量', String(Math.round(energy)), false],
          ['交互键', (built ? built.interactives.length : 0) + ' / ' + RAP.Params.interactCap, false],
          ['零件数', String(built ? built.parts.length : 0), false],
          ['重心偏移', hasCar ? ((cgOff >= 0 ? '+' : '−') + Math.abs(cgOff).toFixed(2) + ' m') : '—', Math.abs(cgOff) > 0.7]
        ];
        rows2.forEach((r, i) => {
          const yy = CY + 54 + i * 27;
          text(r[0], CX + 14, yy, 12, '#8fb6c9', 'left');
          text(r[1], CX + CW - 14, yy, 14, r[2] ? '#ff8f77' : '#e8f2fa', 'right', true);
        });
      }

      // 重心偏移：让玩家知道"车头偏重 / 整体太高"
      if (built && built.parts.length) {
        let mx = 0, my = 0, mm = 0;
        built.parts.forEach(pp => { mx += pp.lx * pp.def.mass; my += pp.ly * pp.def.mass; mm += pp.def.mass; });
        const cgx = mx / mm - built.center.x;
        const wheelY = built.wheels.length ? built.wheels.reduce((a, w) => a + w.ly, 0) / built.wheels.length : built.hull.minY;
        const tall = (my / mm) - wheelY;
        const cgText = `重心 前后${cgx >= 0 ? '+' : '−'}${Math.abs(cgx).toFixed(2)}　轮上高度 ${tall.toFixed(2)} m`;
        text(cgText, 96, 168, 12, Math.abs(cgx) > 0.7 ? '#ff8f77' : '#a8cbe0');
      }
      // 操作提示（画布内，放最底部一行，不与零件槽重叠）
      // 操作提示：加深色底衬，保证在任何地貌上都看得清
      {
        /* 拖出网格 = 卸下，这条是**新语义**（第 43 轮才有的），必须写在这里：
         * 它不是"顺手提醒"，而是一个玩家猜不到的手势。
         * 原来这里只写"拖动可移动"—— 那会让人以为拖出去也能"移"，
         * 松手才发现零件没了。 */
        const tipTxt = '左键放件 · 拖动可移动 · 拖出网格=卸下 · 右键/R 换方向 · Z 撤销 · C 清空 · 空格出发 · T 调参 · H 零件说明 · L 选关';
        ctx.font = '10.5px "Microsoft YaHei", sans-serif';
        const tw = ctx.measureText(tipTxt).width;
        ctx.fillStyle = 'rgba(10,18,24,.66)';
        roundRect(DW / 2 - tw / 2 - 12, DH - 136, tw + 24, 20, 10); ctx.fill();
        text(tipTxt, DW / 2, DH - 122, 10.5, 'rgba(214,230,242,.88)', 'center');
      }
      const boxParts = Object.keys(level().partsBox || {})
        .map(k => (RAP.PARTS[k] ? RAP.PARTS[k].label : k) + '×' + level().partsBox[k]).join('　');
      text('零件箱：' + (boxParts || '无') + '　　分数：★★ 拿木箱　★★★ ' +
        ({ none: '本关没有', pumpPress: '不按打气筒', energyLeft: '能量剩≥30', noFlip: '不翻车', motorUse: '不用马达',
           noPop: '一个气球都不扎', allSandbags: '沙袋全扔' }
          [(level().challenge || {}).type] || (level().challenge || {}).type || '—'),
        96, 148, 12, '#b9cbd8');
    }

    if (state.phase === 'run' && state.run) {
      const RT = runTimeRects();
      ctx.fillStyle = 'rgba(10,18,24,.88)';
      roundRect(RT.timer.x, RT.timer.y, RT.timer.w, RT.timer.h, 8); ctx.fill();
      ctx.strokeStyle = COL.goldDim; ctx.lineWidth = 1; ctx.stroke();
      text(state.run.time.toFixed(2) + ' s', RT.timer.x + RT.timer.w - 16, RT.timer.y + 21, 16, '#ffd93d', 'right');
      if (boxLine) {
        ctx.fillStyle = 'rgba(10,18,24,.88)';
        roundRect(RT.box.x, RT.box.y, RT.box.w, RT.box.h, 8); ctx.fill();
        text(boxLine, RT.box.x + RT.box.w - 16, RT.box.y + 19, 13, '#cfe0ef', 'right');
      }
      /* 木框耐久条（第 45 轮）。
       *
       * 为什么非加这一条：引擎里木框有 3 点耐久，drawPartShape 也早就画好了
       * 「裂纹」和「破损」两档美术 —— 但在此之前玩家**只可能看到完好或碎**：
       * 掉 1 点、掉 2 点这两次，画面上只有木头上一道淡淡的缝，没有读数、没有声音；
       * 「不散架」这颗星却已经悄悄没了。也就是说这颗星一直在惩罚玩家看不见的东西。
       * 这里把耐久摊开成段 + 数字，掉血那一刻读数就变，玩家还来得及反应。 */
      const FH = frameHpOf(state.run);
      if (FH.n > 0 && FH.min > 0) {
        const F = RT.frame;
        ctx.fillStyle = 'rgba(10,18,24,.88)';
        roundRect(F.x, F.y, F.w, F.h, 8); ctx.fill();
        const low = FH.min <= 1, mid = FH.min === 2;
        ctx.strokeStyle = low ? 'rgba(224,129,106,.62)' : (mid ? 'rgba(232,200,122,.55)' : COL.goldDim);
        ctx.lineWidth = 1; ctx.stroke();
        text('木框', F.x + 10, F.y + 18, 12, 'rgba(200,222,238,.9)', 'left');
        // 三段格子：实心 = 还剩的耐久，空心 = 已经裂掉的段
        const segs = frameSegRects();
        for (let i = 0; i < segs.length; i++) {
          const sg = segs[i], on = i < FH.min;
          ctx.fillStyle = on
            ? (low ? 'rgba(224,129,106,.92)' : (mid ? 'rgba(232,200,122,.92)' : 'rgba(159,214,106,.85)'))
            : 'rgba(255,255,255,.10)';
          roundRect(sg.x, sg.y, sg.w, sg.h, 3); ctx.fill();
          ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 1;
          roundRect(sg.x, sg.y, sg.w, sg.h, 3); ctx.stroke();
        }
        text(FH.min + '/' + FH.max, F.x + F.w - 12, F.y + 18, 12,
          low ? '#ffb4a2' : (mid ? '#ffe9b0' : '#cfe0ef'), 'right', true);
      }
      /* 气球/沙袋的实时状态：剩几个气球、还剩几个沙袋、净重多少。
       * 这是这一关唯一的"仪表盘" —— 玩家要靠它判断"现在扔/现在扎"。 */
      if (liftLine) {
        const LW = 300, LX = DW / 2 - LW / 2, LY = RT.box.y + RT.box.h + 6;
        ctx.fillStyle = 'rgba(10,18,24,.88)';
        roundRect(LX, LY, LW, 24, 8); ctx.fill();
        ctx.strokeStyle = 'rgba(232,200,122,.35)'; ctx.lineWidth = 1; ctx.stroke();
        const rising = state.run.car.netMass < 0;
        text(liftLine, LX + LW / 2, LY + 17, 12, rising ? '#9fe08a' : '#cfe0ef', 'center');
      }
      /* 行驶期的两条"实时警报"，按出现顺序自上而下排，避免互相压住：
       *   1. 飞过终点但没落地（probe_over_goal.js 量过：赢的那一局里
       *      这个状态也要持续 3 秒，所以不能做成一次性 toast）；
       *   2. 快要被判「没有进展」了。
       *
       * 第 2 条是新加的：引擎里 8 秒没更靠近终点也没升高就判负，
       * 而在此之前玩家**完全无从得知**自己正在被判负 —
       * 尤其是"车在慢慢溜"的那种局，看起来一切正常。
       * 做成倒计时而不是警告灯：告诉他还剩几秒，他才有机会做点什么。 */
      {
        const warns = [];
        const og = overGoalNotice(state.run);
        if (og) warns.push({ text: og.text, bg: 'rgba(38,16,14,.90)', line: 'rgba(224,129,106,.55)', fg: '#ffb4a2' });
        const pw = progressWarning(state.run);
        if (pw) warns.push({ text: pw.text, bg: 'rgba(40,32,10,.92)', line: 'rgba(232,200,122,.55)', fg: '#ffe9b0' });
        let wy = runTimeRects().box.y + 24 + 34;
        warns.forEach(w => {
          const w2 = 320, x2 = DW / 2 - w2 / 2;
          ctx.fillStyle = w.bg;
          roundRect(x2, wy, w2, 24, 8); ctx.fill();
          ctx.strokeStyle = w.line; ctx.lineWidth = 1; ctx.stroke();
          text(w.text, x2 + w2 / 2, wy + 17, 12, w.fg, 'center');
          wy += 28;
        });
      }
    }

    // ---- 出发横幅：读秒 2 秒，告诉玩家"这是第几关、这关要干什么" ----
    if (state.phase === 'run' && state.runBanner > 0) {
      const t = state.runBanner;
      // 0~0.25 淡入，1.6~2.0 淡出
      const a = Math.min(1, (2.0 - t) / 0.25) * Math.min(1, t / 0.4);
      if (a > 0.01) {
        const lv = level();
        const goals = [];
        if (lv.boxes && lv.boxes.length) goals.push('拿 ' + lv.boxes.length + ' 个木箱');
        goals.push('把小猪送到终点旗');
        /* 气球/沙袋的操作是"点车身"，没有按钮、也没在引导里教过 ——
         * 不在这 2 秒的横幅里说一句，玩家会挂着一堆气球乱撞，
         * 完全不知道"点一下就能扎"。横幅只在开局出现，正好是唯一该说的地方。 */
        const pb = lv.partsBox || {};
        if (pb.balloon) goals.push('点气球扎破');
        if (pb.sandbag) goals.push('点沙袋扔掉');
        ctx.save();
        ctx.globalAlpha = a;
        // 上下两条渐隐金线，中间留一条"胶片带"
        const bandY = 232, bandH = 104;
        const bg2 = ctx.createLinearGradient(0, bandY, 0, bandY + bandH);
        bg2.addColorStop(0, 'rgba(8,16,22,0)');
        bg2.addColorStop(0.28, 'rgba(8,16,22,.72)');
        bg2.addColorStop(0.72, 'rgba(8,16,22,.72)');
        bg2.addColorStop(1, 'rgba(8,16,22,0)');
        ctx.fillStyle = bg2; ctx.fillRect(0, bandY, DW, bandH);
        const ln = ctx.createLinearGradient(0, 0, DW, 0);
        ln.addColorStop(0, 'rgba(232,200,122,0)');
        ln.addColorStop(0.5, 'rgba(232,200,122,.6)');
        ln.addColorStop(1, 'rgba(232,200,122,0)');
        ctx.fillStyle = ln;
        ctx.fillRect(0, bandY + 30, DW, 1.2);
        ctx.fillRect(0, bandY + 72, DW, 1.2);
        // 关卡号 + 名字（轻微从右滑入）
        const sl = (1 - Math.min(1, (2.0 - t) / 0.3)) * 26;
        text(lv.levelId + '　' + lv.name, DW / 2 + sl, bandY + 62, 30, '#ffe9b0', 'center', true);
        text(goals.join('　·　'), DW / 2, bandY + 92, 13, 'rgba(228,240,250,.95)', 'center');
        ctx.restore();
      }
    }
  }

  function ordered_parts_for_arrows(car) {
    return car.parts.filter(p => RAP.isDirectional(p.part) && !p.inner);
  }

  function drawRun(elapsed) {
    const st = state.run;
    if (!st) return;
    const car = st.car;
    // ---- 镜头：弹簧跟随 + 速度拉远 + 撞击震屏 ----
    {
      const spdNow = Math.hypot(car.vx, car.vy);
      const surfY = Math.max(car.y, st.terrain.surfaceY(car.x));
      const targetX = car.x + 2.0 + Math.min(1.6, spdNow * 0.14);   // 越快看得越远
      const targetY = surfY + 1.5;
      const targetZoom = 1.85 - Math.min(0.45, spdNow * 0.035);     // 越快视野越大
      const cs = state.camState;
      const k = 1 - Math.pow(0.001, Math.min(0.1, elapsed));         // 平滑系数（与帧率无关）
      cs.x += (targetX - cs.x) * k;
      cs.y += (targetY - cs.y) * k;
      cs.zoom += (targetZoom - cs.zoom) * k * 0.6;
      // 震屏衰减
      if (state.shake > 0) state.shake = Math.max(0, state.shake - elapsed * 3.2);
      const shk = state.shake;
      var cam = {
        x: cs.x + (Math.random() - 0.5) * shk * 0.55,
        y: cs.y + (Math.random() - 0.5) * shk * 0.55,
        zoom: cs.zoom
      };
    }
    drawWorld(st.terrain, cam);
    // 木箱
    st.boxes.forEach(b => {
      if (b.got) return;
      const p = worldToScreen(b.col + 0.5, st.terrain.surfaceY(b.col + 0.5) + 0.5, cam);
      const s = PPM * cam.zoom * 0.8;
      ctx.save();
      ctx.globalAlpha = 0.25;
      ctx.fillStyle = '#16211a';
      ctx.beginPath();
      ctx.ellipse(p.x, p.y + s * 0.55, s * 0.6, s * 0.16, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.fillStyle = COL.box; roundRect(p.x - s / 2, p.y - s / 2, s, s, 4); ctx.fill();
      ctx.strokeStyle = '#8a6a2a'; ctx.lineWidth = 2; ctx.stroke();
    });
    // 掉出来的东西（框碎了之后真的会掉下来）
    (st.loose || []).forEach(L => {
      const sp = worldToScreen(L.x, L.y, cam);
      const rr = PPM * cam.zoom * L.r;
      ctx.save();
      ctx.globalAlpha = 0.22; ctx.fillStyle = '#16211a';
      const gy = worldToScreen(L.x, st.terrain.surfaceY(L.x), cam);
      ctx.beginPath(); ctx.ellipse(sp.x, gy.y, rr * 0.9, rr * 0.25, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      const isPig = RAP.PARTS[L.part] && RAP.PARTS[L.part].pig;
      // 拖尾：按速度反推 3 个残影（看得出"被甩飞"）
      if (Math.hypot(L.vx, L.vy) > 1.2) {
        for (let k = 1; k <= 3; k++) {
          const tp = worldToScreen(L.x - L.vx * 0.045 * k, L.y - L.vy * 0.045 * k, cam);
          ctx.save();
          ctx.globalAlpha = 0.24 - k * 0.06;
          if (isPig) drawPig(tp.x, tp.y, rr * (1 - k * 0.1), -L.a, 'dizzy');
          else drawPartShape(L.part, tp.x, tp.y, rr * 2 * (1 - k * 0.1), 0);
          ctx.restore();
        }
      }
      if (isPig) drawPig(sp.x, sp.y, rr, -L.a, 'dead');
      else drawPartShape(L.part, sp.x, sp.y, rr * 2, 0);
    });

    drawDebris(cam);
    drawBursts(cam);
    drawDust(cam);
    drawConfetti(cam);

    // ---- 速度线（高速时在屏幕边缘流动）----
    {
      const spd2 = Math.hypot(car.vx, car.vy);
      if (spd2 > 4.5) {
        const a0 = Math.min(0.34, (spd2 - 4.5) / 14);
        ctx.save();
        ctx.strokeStyle = 'rgba(255,255,255,' + a0.toFixed(3) + ')';
        ctx.lineWidth = 2.5;
        ctx.lineCap = 'round';
        for (let i = 0; i < 5; i++) {
          const yy = 200 + i * 92 + Math.sin(performance.now() / 240 + i) * 8;
          const len = 60 + Math.sin(performance.now() / 180 + i * 2) * 34;
          const off = (performance.now() / 8 + i * 137) % (DW + 200) - 100;
          ctx.beginPath();
          ctx.moveTo(off, yy);
          ctx.lineTo(off + len, yy);
          ctx.stroke();
        }
        ctx.restore();
      }
    }

    // 终点旗
    const gp = worldToScreen(level().goal.col + 0.5, st.terrain.surfaceY(level().goal.col + 0.5), cam);
    ctx.fillStyle = '#e8f0e0'; ctx.fillRect(gp.x - 2, gp.y - 70 * cam.zoom / 2, 4, 70 * cam.zoom / 2);
    ctx.fillStyle = COL.flag;
    ctx.beginPath();
    ctx.moveTo(gp.x + 2, gp.y - 70 * cam.zoom / 2);
    ctx.lineTo(gp.x + 34, gp.y - 58 * cam.zoom / 2);
    ctx.lineTo(gp.x + 2, gp.y - 46 * cam.zoom / 2);
    ctx.closePath(); ctx.fill();

    const ca = Math.cos(car.a), sa = Math.sin(car.a);   // 后面多处要用（箭头/车体/阴影）

    // 推进方向箭头：行驶时不再显示（避免干扰画面，方向在建造期已确认）

    // ---- 闪帧 + 暗角（撞击反馈）----
    if (state.flash > 0) {
      state.flash = Math.max(0, state.flash - elapsed * 7);
      ctx.fillStyle = 'rgba(255,255,255,' + (state.flash * 0.5).toFixed(3) + ')';
      ctx.fillRect(0, 0, DW, DH);
    }
    if (state.vignette > 0) {
      state.vignette = Math.max(0, state.vignette - elapsed * 1.6);
      const vg = ctx.createRadialGradient(DW / 2, DH / 2, DH * 0.34, DW / 2, DH / 2, DH * 0.92);
      vg.addColorStop(0, 'rgba(180,40,30,0)');
      vg.addColorStop(1, 'rgba(180,40,30,' + (state.vignette * 0.30).toFixed(3) + ')');
      fillScreen(vg);
    }

    // ---- 小猪表情判定 ----
    {
      const car2 = state.run.car;
      const sp2 = Math.hypot(car2.vx, car2.vy);
      const ca2 = Math.cos(car2.a), sa2 = Math.sin(car2.a);
      // 车体最低点离地高度（不是车心）
      const lowY = car2.y + (car2.hull ? car2.hull.minY : -0.6) * ca2;
      const gap = Math.max(0, lowY - st.terrain.surfaceY(car2.x));
      const now2 = state.run.time;
      let mood = 'normal';
      if (!car2.hasPig) mood = 'dead';
      else if ((state.run.lastImpactAt || -9) > now2 - 0.7) mood = 'dizzy';
      else if (state.run.pigHP < 3) mood = 'hurt';
      else if (gap > 1.2 || sp2 > 9) mood = 'scared';
      else if ((state.run.lastBoxAt || -9) > now2 - 1.0) mood = 'happy';
      else if (state.run.result === 'win') mood = 'happy';
      state.pigMood = mood;
      state.pigShake = mood === 'dizzy' || mood === 'hurt';
      state.pigEarSwing = Math.min(1, sp2 / 6);
    }

    // 接触阴影（立体感第二步：物体与地面的关系）
    const shY = st.terrain.surfaceY(car.x);
    const shP = worldToScreen(car.x, shY + 0.02, cam);
    ctx.save();
    ctx.globalAlpha = 0.28;
    ctx.fillStyle = '#16211a';
    ctx.beginPath();
    ctx.ellipse(shP.x, shP.y, PPM * cam.zoom * 1.5, PPM * cam.zoom * 0.22, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 车
    // 先画非 inner 件，再画 inner（框里的猪要在框内壁之上）
    const ordered = car.parts.slice().sort((a, b) => (a.inner ? 1 : 0) - (b.inner ? 1 : 0));
    // 把表情状态挂到猪零件的 def 上（def 是共享对象，画完就还原）
    car.parts.forEach(p => {
      if (p.def.pig) {
        p.def.__mood = state.pigMood || 'normal';
        p.def.__shake = state.pigShake;
        p.def.__earSwing = state.pigEarSwing || 0;
      }
    });
    ordered.forEach(p => {
      const wx = car.x + p.lx * ca - p.ly * sa;
      const wy = car.y + p.lx * sa + p.ly * ca;
      const s = worldToScreen(wx, wy, cam);
      const size = PPM * cam.zoom * (p.inner ? 0.62 : 1.0);
      // 只有轮子允许自转：按行驶距离累积角度
      let spin = 0;
      if (p.def.wheel) {
        const r = p.def.radius || 0.5;
        spin = (car.odo || 0) / r;            // 里程 / 半径 = 弧度
      }
      const baseRot = p.def.wheel ? 0 : ((p.dir || 0) + (car.a * 180 / Math.PI) / 90);
      drawPartShape(p.part, s.x, s.y, size, baseRot, p.hp, spin);
      /* 行驶期也要看得到"这一格还挂着几个气球 / 还有几个沙袋"。
       * 用和建造期同一个徽标，视觉上是同一套语言；≤1 不画，免得满屏数字。
       * 可点提示：还活着的气球画一圈淡金虚线，告诉玩家"这个能点"。 */
      const n = p.n || 1;
      if (n > 1) drawStackBadge(s.x + size * 0.30, s.y + size * 0.30, n);
      if (p.def.liftMass && n > 0) {
        ctx.save();
        ctx.strokeStyle = 'rgba(255,230,170,.40)';
        ctx.lineWidth = 1.4;
        ctx.setLineDash([3, 3]);
        ctx.beginPath(); ctx.arc(s.x, s.y, size * 0.56, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
      }
    });
    // 车体里没有猪的话（零件箱没放），提示一下
    if (!car.hasPig) {
      const tip = worldToScreen(car.x, car.y + 1.4, cam);
      text('车是空的：把小猪拖进木框里', tip.x, tip.y, 13, '#ffb4a2', 'center');
    }
    // ---------- 失败回放：整段轨迹 + 镜头跟随 + 定格 ----------
    if (st.phase === 'resolved' && st.result === 'fail' && st.replay && st.replay.length) {
      state.replayT += elapsed;
      const frames = st.replay;
      /* 回放**先播完，结算卡再滑入**。
       *
       * 这是量出来的：原来两者是同时进行的，而结算卡是 760×424、
       * 位置正好盖住屏幕中央（x 260..1020, y 150..574）—— 回放的车就画在那儿。
       * 用 tools/dbg_replay_visible.js 数像素：卡片滑入后「卡外」的气球粉
       * 只剩 293 个（摘掉气球只掉 17 个），而卡片不画时是 5283 个。
       * 也就是说**回放这一整段，玩家一帧都没看见**。
       *
       * 改法不是把回放挪到左边（卡片太大，挪到哪都被压住），而是**排序**：
       * 先让玩家看 2.8 秒回放，卡再进来。2.8 秒是算出来的：
       * 60 帧轨迹在 0.45 倍速下要 6.5 秒 —— 太长，没人会看完；
       * 压到 2.8 秒刚好把"怎么出的事"播完一遍。 */
      const raw = Math.min(frames.length - 1 + 12,
        state.replayT / REPLAY_DUR * (frames.length - 1));
      const idx = Math.min(frames.length - 1, Math.floor(raw));
      const f = frames[idx];
      const isLast = idx >= frames.length - 1;

      // 暗化背景
      fillScreen('rgba(8,14,18,.62)');

      // 回放专用镜头（跟着回放点 + 稍微拉近）
      const rcam = { x: f.x + 1.0, y: f.y + 1.2, zoom: 1.9 };

      // 轨迹线
      ctx.save();
      ctx.strokeStyle = 'rgba(160,220,255,.28)';
      ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
      ctx.beginPath();
      for (let i = 0; i <= idx; i++) {
        const p2 = worldToScreen(frames[i].x, frames[i].y, rcam);
        i === 0 ? ctx.moveTo(p2.x, p2.y) : ctx.lineTo(p2.x, p2.y);
      }
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();

      // 回放中的车：画**真正那辆车**（用录下来的位姿 + 实际的零件）
      const rp = worldToScreen(f.x, f.y, rcam);
      {
        const ca3 = Math.cos(f.a || 0), sa3 = Math.sin(f.a || 0);
        const ordered3 = st.car.parts.slice()
          .sort((a, b) => (a.inner ? 1 : 0) - (b.inner ? 1 : 0));
        ordered3.forEach(p => {
          const wx = f.x + p.lx * ca3 - p.ly * sa3;
          const wy = f.y + p.lx * sa3 + p.ly * ca3;
          const sp3 = worldToScreen(wx, wy, rcam);
          const size3 = PPM * rcam.zoom * (p.inner ? 0.62 : 1.0);
          let spin3 = 0;
          if (p.def.wheel) spin3 = (st.car.odo || 0) / (p.def.radius || 0.5);
          const rot3 = p.def.wheel ? 0 : ((p.dir || 0) + (f.a * 180 / Math.PI) / 90);
          /* 这里原来是画"三个方块 + 两个圆"的示意图 —— 和玩家刚造的那辆车
           * 长得完全不一样（木框/马达/气球/沙袋全被抹平成一个方块），
           * 失败回放最该回答的问题恰恰是"我那辆车到底怎么出事的"。
           * 现在直接按录下来的位姿，用**同一套零件画法**重画。 */
          drawPartShape(p.part, sp3.x, sp3.y, size3, rot3, p.hp, spin3);
        });
      }

      // 定格：出事那一刻的冲击波
      if (isLast) {
        const age = Math.min(1, (raw - (frames.length - 1)) / 12);
        if (age < 1) {
          ctx.save();
          ctx.strokeStyle = 'rgba(255,120,90,' + (1 - age).toFixed(2) + ')';
          ctx.lineWidth = 6 * (1 - age) + 1;
          ctx.beginPath();
          ctx.arc(rp.x, rp.y, 20 + age * 120, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
      }

      // 进度条
      const barW = 420, barX = DW / 2 - barW / 2, barY = DH - 92;
      ctx.fillStyle = 'rgba(10,18,24,.85)';
      roundRect(barX, barY, barW, 10, 5); ctx.fill();
      const prog = idx / Math.max(1, frames.length - 1);
      ctx.fillStyle = '#e8816a';
      roundRect(barX, barY, Math.max(6, barW * prog), 10, 5); ctx.fill();

      // 标题（回放这一屏不追"还剩几个沙袋"，标题会变长压到进度条；归因写在结算卡上）
      text('回放 · ' + failText(st.failReason), DW / 2, 120, 22, '#ffb4a2', 'center', true);
      /* 副标题原来写 `speed + '× 慢放'`，改成"压进固定时长"之后 speed 就不是
       * 那个意思了（60 帧 / 2.8 秒 ≈ 实速），继续写"0.45× 慢放"是骗人的。
       * 现在写**真实进度**：1.4 / 3.0 s —— 玩家能看出还剩多少，也顺手
       * 告诉他自己可以点一下跳过。 */
      const totalS = (frames.length - 1) / 20;
      text(isLast ? '出事的那一刻'
        : (Math.min(totalS, Math.max(0, idx) / 20)).toFixed(1) + ' / ' + totalS.toFixed(1) + ' s',
        DW / 2, 148, 13,
        isLast ? '#ffd93d' : 'rgba(200,218,232,.7)', 'center');
      if (!isLast) {
        // 跳过提示：点击/空格现在真的能跳过，那就得说一声（否则等于藏了个操作）
        ctx.globalAlpha = 0.5 + 0.5 * Math.sin(performance.now() / 380);
        text('点击跳过回放', DW / 2, DH - 66, 12, 'rgba(200,218,232,.9)', 'center');
        ctx.globalAlpha = 1;
      }
    }
  }

  /* 失败原因的**具体化**：把"卡住了：动力或重心不对"翻译成
   * "你还剩 3 个沙袋没扔"。
   *
   * 这是量出来的：`probe_1_6_inaction.js` 跑了 1-6 的三种玩家 ——
   *   一个沙袋都不扔      → fail stuck @14.27s
   *   扔了但没扎气球      → fail flew_away @11.87s
   *   扔了也扎了（标准解）→ win  @12.53s
   * 也就是说 1-6 里"啥也不干"的失败文案是「卡住了：动力或重心不对」。
   * 车上明明挂着 3 个沙袋、6 个气球，一个都没动 —— 这句诊断是**错的**，
   * 玩家会去改轮子、加马达（这一关根本没有马达）。
   *
   * 判据只看"车上还剩什么"，不需要任何新状态：车停下时如果还有沙袋，
   * 那就是最可能的原因；还有气球没扎，也一样。两句话必须能同时出现，
   * 因为它们说的是两件不同的事（减重 / 减浮力）。 */
  function failCulprit(st) {
    if (!st || !st.car) return '';
    const bags = st.car.sandbagCount || 0;
    const bal = (st.car.parts || []).filter(p => p.def && p.def.liftMass)
      .reduce((a, p) => a + (p.n || 0), 0);
    const tips = [];
    if (bags > 0) tips.push('还剩 ' + bags + ' 个沙袋没扔（点车身）');
    if (bal > 0) tips.push('还剩 ' + bal + ' 个气球没扎（点车身）');
    return tips.join('，');
  }

  function failText(reason) {
    return ({ pig_dead: '猪受伤过重', pig_lost: '小猪掉队了', out_of_bounds: '掉出地图',
              flew_away: '飘得太高，飞出地图了',
              /* 「卡住」和「没进展」必须分开写 —— 玩家对这两种局面的反应完全不同：
               *   卡住 = 车停了 → 该想想动力/轮子；
               *   没进展 = 车在动但没在前进 → 该想想重心/配重/路线。
               * 原来两者共用一句"卡住了：动力或重心不对"，而后者根本不卡，
               * 玩家会以为游戏判定出错。 */
              stuck: '卡住了：动力或重心不对',
              no_progress: '一直在原地打转：8 秒没能更靠近终点',
              timeout: '超时', empty: '没放零件' })[reason] || reason;
  }

  function badge(cx, cy, r, ring, fill) {
    ctx.fillStyle = ring; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(cx, cy, r * 0.78, 0, Math.PI * 2); ctx.fill();
  }

  /* 失败回放的时长与"是否还在播"。
   *
   * 抽成函数是因为它现在被三处共用：绘制（drawRun）、
   * 结算卡的出场时机（drawResult）、以及输入（鼠标热区 / 键盘）。
   * 三处各写一遍 `state.replayT < 2.8` 是必须避免的 ——
   * 这个项目已经因为"同一个事实抄了多份"踩过三次坑（第三颗星的名字、
   * 关卡卡片几何、零件行数）。 */
  const REPLAY_DUR = 2.8;
  function replayPlaying() {
    const st = state.run;
    if (!st || st.phase !== 'resolved' || st.result !== 'fail') return false;
    if (!st.replay || !st.replay.length) return false;
    return (state.replayT || 0) < REPLAY_DUR;
  }

  function drawResult(elapsed) {
    const st = state.run;
    /* 失败回放没播完之前，**结算卡不出现**。
     *
     * 两者原来同时画，而卡片 760×424 正好盖住屏幕中央 —— 回放的车就画在那儿。
     * tools/dbg_replay_visible.js 量过：卡片滑入后「卡外」的气球粉只剩 293 个
     * （摘掉气球只掉 17 个），而卡片不画时是 5283 个（摘掉气球掉 3320 个）。
     * 结论很硬：**回放这一段玩家一个像素都没看到**。
     *
     * 现在回放先独占 REPLAY_DUR 秒，卡再滑入。提前返回也让 fillScreen
     * 别压暗 —— 暗幕同样会吃掉回放的对比度。 */
    if (replayPlaying()) return;
    fillScreen('rgba(8,14,10,.58)');
    const win = st.result === 'win';

    // 卡片从顶部滑入
    state.resultT = Math.min(1, (state.resultT || 0) + elapsed);
    const ease = 1 - Math.pow(1 - state.resultT, 3);
    const cardY = 150 - (1 - ease) * 420;

    const W = 760, H = 424, X = DW / 2 - W / 2;
    // 卡片：深蓝夜色 + 金线，和 HUD / 建造坞同一套语言（原来是一整块纯绿，像另一个游戏）
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 26; ctx.shadowOffsetY = 10;
    ctx.fillStyle = win ? 'rgba(14,28,34,.96)' : 'rgba(30,18,20,.96)';
    roundRect(X, cardY, W, H, 18); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = win ? 'rgba(232,200,122,.55)' : 'rgba(224,129,106,.55)';
    ctx.lineWidth = 2; roundRect(X, cardY, W, H, 18); ctx.stroke();
    // 顶部色条：语义色，但只占一条细线，不铺满整张卡
    const accent = win ? '#63d97e' : '#e8816a';
    ctx.save();
    ctx.beginPath(); roundRect(X, cardY, W, H, 18); ctx.clip();
    // 细线两端收淡，避免像贴了一条电工胶带
    const ag = ctx.createLinearGradient(X, 0, X + W, 0);
    ag.addColorStop(0, 'rgba(0,0,0,0)');
    ag.addColorStop(0.18, accent);
    ag.addColorStop(0.82, accent);
    ag.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = ag;
    ctx.fillRect(X, cardY + 1.5, W, 2);
    const tg = ctx.createLinearGradient(X, cardY, X, cardY + 96);
    tg.addColorStop(0, win ? 'rgba(99,217,126,.14)' : 'rgba(224,129,106,.14)');
    tg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = tg; ctx.fillRect(X, cardY, W, 96);
    ctx.restore();

    text(win ? '到达终点！' : '这一趟失败了', X + 42, cardY + 86, 36,
      win ? '#ffe9b0' : '#ffb4a2', 'left', true);

    // 三枚圆形徽章：猪 / 星 / 秒表
    const by = cardY + 172;
    const bx = [X + 168, X + W / 2, X + W - 168];
    const RING = 'rgba(232,200,122,.30)';
    badge(bx[0], by, 46, RING, '#2f5a3e');
    drawPig(bx[0], by, 26, 0);
    badge(bx[1], by, 46, RING, win ? '#4a3a12' : '#2a3038');
    // 星形
    ctx.fillStyle = win ? '#ffd93d' : '#6a747c';
    ctx.beginPath();
    for (let k = 0; k < 10; k++) {
      const ang = -Math.PI / 2 + k * Math.PI / 5;
      const rad = (k % 2 === 0) ? 24 : 10;
      ctx[k === 0 ? 'moveTo' : 'lineTo'](bx[1] + Math.cos(ang) * rad, by + Math.sin(ang) * rad);
    }
    ctx.closePath(); ctx.fill();
    badge(bx[2], by, 46, RING, win ? '#4a3a12' : '#2a3038');
    // 秒表指针：分针从圆心向上，指针从圆心斜向
    ctx.strokeStyle = win ? '#e8c87a' : '#7c868e'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(bx[2], by); ctx.lineTo(bx[2], by - 20); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx[2], by); ctx.lineTo(bx[2] + 13, by + 7); ctx.stroke();
    ctx.fillStyle = win ? '#e8c87a' : '#7c868e';
    ctx.beginPath(); ctx.arc(bx[2], by, 3.5, 0, Math.PI * 2); ctx.fill();

    // 星级音效（每弹出一颗响一次）
    {
      const shown = Math.min(3, Math.floor(Math.max(0, ((state.resultT || 0) - 0.25) * 4 / 1.2)));
      if (shown > (state.starSfxIdx || 0) && win) {
        state.starSfxIdx = shown;
        SFX.star(shown - 1);
      }
    }

    /* 三颗星 = 三个**永久标记**（到达 / 全木箱 / 特殊条件），累计制。
     * 参考里「分别三次获取也算作三星通关」，所以这里画的不是"这一局拿了几颗"，
     * 而是"这一关现在一共亮了几颗"，并把**这一局新点亮**的那颗标上 NEW。
     * 玩家失败一次不该看到星全灭 —— 那会让累计制退回一局定生死。 */
    const tgoals = state.totalGoals || (win ? st.starGoals : null) ||
      { arrive: false, boxes: false, challenge: false };
    const newG = state.newGoals || [];
    const gnames = goalNames();
    for (let i = 0; i < 3; i++) {
      const pop = Math.max(0, Math.min(1, (state.resultT - 0.25 - i * 0.12) * 4));
      if (pop <= 0) continue;
      const gk = GOALS[i];
      const on = !!tgoals[gk];
      const isNew = on && newG.indexOf(gk) >= 0;
      const cx = X + W / 2 - 108 + i * 108, cy = cardY + 268;
      ctx.save();
      ctx.translate(cx, cy); ctx.scale(pop, pop);
      if (isNew) {
        // 新点亮的星：一圈金色光环（只在这一局真的推进进度时出现）
        ctx.fillStyle = 'rgba(255,217,61,.20)';
        ctx.beginPath(); ctx.arc(0, 0, 40, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = on ? '#ffd93d' : 'rgba(255,255,255,.16)';
      ctx.beginPath();
      for (let k = 0; k < 10; k++) {
        const ang = -Math.PI / 2 + k * Math.PI / 5;
        const rad = (k % 2 === 0) ? 26 : 11;
        ctx[k === 0 ? 'moveTo' : 'lineTo'](Math.cos(ang) * rad, Math.sin(ang) * rad);
      }
      ctx.closePath(); ctx.fill();
      if (on) {
        ctx.strokeStyle = 'rgba(120,86,10,.6)'; ctx.lineWidth = 1.5; ctx.stroke();
      }
      ctx.restore();
      // 星下面的小标签：说清这颗星是哪一件事。
      // 未点亮的也要看得清 —— 玩家得先看见"还差什么"才可能去补，所以用 70% 白而不是暗灰。
      text(gnames[gk] || gk, cx, cy + 46, 11,
        on ? (isNew ? '#ffe9b0' : 'rgba(214,232,244,.9)') : 'rgba(214,228,240,.72)', 'center');
      if (isNew) text('NEW', cx, cy - 44, 10, '#ffd93d', 'center', true);
    }

    text(`用时 ${st.time.toFixed(2)} s`, X + 42, cardY + 400, 16, '#cfe0ec', 'left');
    text(`木箱 ${st.boxesGot}/${st.boxes.length}`, X + W / 2 - 40, cardY + 400, 16, '#cfe0ec', 'center');
    text(`能量剩 ${Math.round(st.car.energy)}`, X + W - 42, cardY + 400, 16, '#cfe0ec', 'right');

    // 这一关的累计星数 —— 让"还差一颗"变成一件看得见的事
    text('本关 ★ ' + starsOf(tgoals) + ' / 3　总计 ★ ' + totalStars() + ' / ' + (levels.length * 3),
      X + W / 2, cardY + 428, 13, 'rgba(200,222,238,.85)', 'center');

    if (!win) {
      /* 失败原因分两行：第一行是引擎判的**类**（卡住 / 没进展 / 飘走），
       * 第二行是这一局**具体还剩什么没做**。合成一行会到 40 多个字，
       * 760px 的卡面装不下（probe_hud_text 量到的"文字墙"阈值是 700px）。 */
      text('原因：' + failText(st.failReason), X + 42, cardY + 344, 15, '#ffc9bb', 'left');
      const tip = failCulprit(st);
      if (tip && (st.failReason === 'stuck' || st.failReason === 'no_progress' ||
                  st.failReason === 'timeout')) {
        text('还能试：' + tip, X + 42, cardY + 366, 13, '#ffe9b0', 'left');
      }
    } else {
      // 列出这一局**没**点亮的那几颗，并直接说清怎么拿
      const missing = GOALS.filter(k => !tgoals[k]);
      if (!missing.length) {
        /* 说清"本关"，因为最后一张卡上同一行右侧还会出现"整章通关 · 全三星"。
         * 两处都只写"全三星"会读成同一件事，玩家分不出哪个是本关的。 */
        text('本关三星达成！', X + 42, cardY + 352, 15, '#b6ff9e', 'left', true);
      } else {
        text('还差：' + missing.map(k => gnames[k]).join(' / '), X + 42, cardY + 352, 15,
          '#8fa3b4', 'left');
      }
    }
    /* 章节收束：这是**最后一关**、而且六关都到过终点时，卡片上必须有一句话
     * 承认"你把这一段打完了"。
     *
     * 原来这里什么都没有 —— 打穿 1-6 之后，屏幕上唯一的终局表达是右下角
     * 一颗灰掉的「已是最后一关」。玩家不知道自己是不是打完了、后面还有没有。
     * 星级按"全三星"和"打通"分开说：只打通了也是通关，不该逼人刷满 18 星
     * 才配看到一句话。 */
    if (win && state.levelIndex === levels.length - 1 && chapterDone()) {
      const tot = levels.length * 3, got = totalStars();
      const per = tot > 0 ? Math.min(1, got / tot) : 1;
      const done = got >= tot;
      const by2 = cardY + 352;
      text(done ? '整章通关 · 全三星！' : '整章通关！',
        X + W - 42, by2, 15, done ? '#ffd93d' : '#b6ff9e', 'right', true);
      // 进度小字：只用"拿到几颗星"，不发明新指标
      text(done ? '六关 ' + tot + ' 颗星全亮' : '全章 ★ ' + got + ' / ' + tot + '　还可以回头补星',
        X + W - 42, by2 + 22, 12,
        done ? '#ffe9b0' : 'rgba(200,222,238,.8)', 'right');
      // 一条极短的金线，把"收束"和上面的战报在视觉上分开
      ctx.save();
      const lg = ctx.createLinearGradient(X + W - 300, 0, X + W - 42, 0);
      lg.addColorStop(0, 'rgba(232,200,122,0)');
      lg.addColorStop(1, 'rgba(232,200,122,.7)');
      ctx.strokeStyle = lg; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(X + W - 300, by2 - 20); ctx.lineTo(X + W - 42, by2 - 20); ctx.stroke();
      ctx.restore();
      void per;
    }

    // 新纪录徽章（滑入后 0.7s 登场，带轻微弹跳）
    if (win && state.newBest) {
      const bt = Math.max(0, Math.min(1, ((state.resultT || 0) - 0.7) * 4));
      if (bt > 0) {
        const scale = 1 + 0.25 * Math.sin(Math.PI * Math.min(1, bt * 1.6)) * (1 - bt * 0.5);
        ctx.save();
        ctx.globalAlpha = Math.min(1, bt * 2);
        ctx.translate(X + 400, cardY + 62);
        ctx.scale(scale, scale);
        const bw2 = 168, bh2 = 40;
        ctx.fillStyle = '#ffd93d';
        roundRect(-bw2 / 2, -bh2 / 2, bw2, bh2, 10); ctx.fill();
        ctx.strokeStyle = '#8a6a10'; ctx.lineWidth = 2; ctx.stroke();
        text('★ 新纪录！', 0, 7, 18, '#5a4300', 'center', true);
        ctx.restore();
        // 旧纪录对比
        if (state.oldBest) {
          ctx.save();
          ctx.globalAlpha = Math.min(1, bt * 1.6);
          text('旧纪录 ' + state.oldBest.toFixed(2) + ' s', X + 400, cardY + 100, 12, '#b6ff9e', 'center');
          ctx.restore();
        }
      }
    }
    // 星级提升提示
    if (win && state.newStarRecord && !state.newBest) {
      const bt2 = Math.max(0, Math.min(1, ((state.resultT || 0) - 0.7) * 4));
      if (bt2 > 0) {
        ctx.save();
        ctx.globalAlpha = bt2;
        ctx.fillStyle = 'rgba(255,217,61,.9)';
        roundRect(X + W - 234, cardY + 54, 168, 34, 9); ctx.fill();
        text('星级提升！', X + W - 150, cardY + 77, 16, '#5a4300', 'center', true);
        ctx.restore();
      }
    }

    // 金币 + 评级（滑入后 0.55s 登场）
    const coinT = Math.max(0, Math.min(1, ((state.resultT || 0) - 0.55) * 4));
    if (coinT > 0) {
      ctx.save();
      ctx.globalAlpha = coinT;
      const cy2 = cardY + 74;       // 与标题同一行右侧（新纪录徽章下方不会挡）
      /* 金币：这一局**实际进钱包**多少（主循环里前后各读一次总数算的差）。
       * 原来写死 `coinsOf(1, boxes) = +80`，但钱包是推导出来的：
       * 重刷同一关没有新标记，钱包一分不动，卡上却仍写 "+80" ——
       * 实测连打三遍，实增 180 / 0 / 0，卡上三次全是 "+80"。
       * 现在 0 就明说「已拿满」，不再假装在攒钱。 */
      const coins = state.coinGain || 0;
      const badgeX = X + W - 190;
      /* 失败局**什么都不写**：既不许写 +N（钱没进），也不许写「已拿满」——
       * 后者是"这一关你已经全拿到了"的意思，放在失败卡上读起来像在嘲讽。
       * 这条是 tools/probe_fail_card.js 抓出来的：第一版把 else 分支写成了
       * 无条件「已拿满」，于是失败卡上同时出现「这一趟失败了」和「已拿满」。 */
      if (win) {
        ctx.fillStyle = coins > 0 ? '#f0c040' : 'rgba(150,168,182,.55)';
        ctx.beginPath(); ctx.arc(badgeX, cy2, 15, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = coins > 0 ? '#8a6a10' : 'rgba(90,104,116,.7)';
        ctx.beginPath(); ctx.arc(badgeX, cy2, 9, 0, Math.PI * 2); ctx.fill();
        if (coins > 0) text('+' + coins, badgeX + 26, cy2 + 7, 20, '#ffd93d', 'left', true);
        else text('已拿满', badgeX + 24, cy2 + 6, 14, 'rgba(190,208,222,.8)', 'left', true);
      }
      // 评级：看**累计**星数（累计 3 星 = S），而不是这一局
      const accStars = starsOf(tgoals);
      const grade = !win ? 'F' : (accStars >= 3 ? 'S' : (accStars === 2 ? 'A' : 'B'));
      const gx = X + W - 44;
      ctx.fillStyle = win ? (grade === 'S' ? '#ffd93d' : (grade === 'A' ? '#8fd66a' : '#7fb0d0')) : '#e8816a';
      ctx.beginPath(); ctx.arc(gx, cy2, 19, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2; ctx.stroke();
      text(grade, gx, cy2 + 8, 22, '#12222c', 'center', true);

      ctx.restore();
    }

    // 底部两个按钮（跟随卡片滑入）：主按钮金色描边，次按钮深底金线
    // 每个按钮右侧带键帽 —— 键盘真的能按（空格 / N），写了就得兑现
    const btnY = cardY + H + 34;
    const btn = (bx2, bw, label, primary, disabled, keycap) => {
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 5;
      ctx.fillStyle = disabled ? 'rgba(30,40,48,.9)'
        : (primary ? 'rgba(232,200,122,.95)' : 'rgba(16,30,40,.95)');
      roundRect(bx2, btnY, bw, 72, 14); ctx.fill();
      ctx.restore();
      ctx.strokeStyle = disabled ? 'rgba(140,155,168,.35)' : (primary ? '#fff1c4' : 'rgba(232,200,122,.65)');
      ctx.lineWidth = 2; roundRect(bx2, btnY, bw, 72, 14); ctx.stroke();
      const shift = keycap && !disabled ? -14 : 0;
      text(label, bx2 + bw / 2 + shift, btnY + 44, 18,
        disabled ? '#8d9aa4' : (primary ? '#20180a' : '#ffe9b0'), 'center', true);
      if (keycap && !disabled) {
        const kw = keycap.length > 2 ? 52 : 34;
        ctx.fillStyle = primary ? 'rgba(32,24,10,.16)' : 'rgba(255,255,255,.10)';
        roundRect(bx2 + bw - kw - 16, btnY + 24, kw, 24, 6); ctx.fill();
        text(keycap, bx2 + bw - kw / 2 - 16, btnY + 41, 11.5,
          primary ? '#20180a' : '#9fb2c2', 'center', true);
      }
    };
    btn(DW / 2 - 300, 260, '重试（保留拼装）', false, false, '空格');
    {
      const nb = resultNextBtn();
      btn(DW / 2 + 40, 260, nb.label, true, nb.disabled, nb.keycap);
    }
    state.resultBtnY = btnY;
  }

  /* 零件一览的行高。9 件零件下 32px 刚好一行不压一行，
   * 同时把卡高压到 408 —— 卡底 540，下面还留得出按钮的位置。 */
  const PART_ROW_H = 32;

  const WELCOME_PAGES = [    {
      title: '欢迎来到「滚蛋吧！猪」',
      lines: [
        '你是一个猪车工程师。',
        '用木框搭车、装轮子、把小猪塞进木框里，',
        '让车带着小猪跑到终点旗子。',
        '',
        '物理是真的：重心偏了会翻、装太重会跑不动。'
      ],
      art: 'car'
    },
    {
      /* 用户明确要求：引导不要"建造三步"，要一页说清每种结构是干什么的。
       *
       * 这一页原来写死 7 件零件的文案，加气球/沙袋时忘了改 —— 一个玩家看完"零件一览"
       * 仍然不知道那两件是干什么的。所以现在**从 RAP.TRAY_ORDER 现推**：
       * 名称与说明都取 def.label / def.desc，类别从标志位拼。
       * 这样以后再加零件，这一页自动跟着长。 */
      title: '零件一览 · 每样东西负责什么',
      art: 'parts'
    },
    {
      title: '跑起来之后',
      lines: [
        '左上红钮 = 暂停，绿钮 = 回建造（零件保留）',
        '右下「刹」= 按住刹车，随时能停',
        '底部彩色按钮 = 同色同类零件一起启动（打气筒等）',
        '已装的零件拖出网格松手 = 卸下，回到待使用',
        '★ 通关　★★ 拿到木箱　★★★ 每关的特殊条件',
        '按 L 打开选关，进度会保存。'
      ],
      art: 'run'
    }
  ];

  /* 「零件一览」的行内容由 PARTS 现推，不再手抄一份。
   * 手抄的版本在加气球/沙袋那一轮漏掉了两件 —— 玩家看完引导仍然不知道新零件干什么。
   * 类别用标志位拼，说明直接用 def.desc，两边只有一份来源。 */
  function welcomePartRows() {
    const CAT = p => {
      const d = RAP.PARTS[p];
      if (d.pig) return '乘客';
      const t = [];
      if (d.structure) t.push('结构');
      if (d.wheel) t.push('轮');
      if (d.motor) t.push('动力');
      if (d.energy) t.push('能量');
      if (d.liftMass) t.push('浮力');
      if (d.dropOne) t.push('压舱');
      if (d.interactive && !d.liftMass && !d.dropOne) t.push('手动');
      return t.join(' / ') || '零件';
    };
    return RAP.TRAY_ORDER.map(p => [p, CAT(p), RAP.PARTS[p].desc || '']);
  }

  // 引导卡几何：绘制与点击共用，按钮放到卡片下方（和结算页同一套"对话框 + 底部动作"）
  function welcomeCard() {
    const page = WELCOME_PAGES[(state.welcome || 1) - 1] || WELCOME_PAGES[0];
    /* 零件一览的高度必须跟着行数走：9 件零件 × 32 行 = 288，加首行 100 与底部留白，
     * 卡高 408。写死 380 会让最后一行压出卡外（排版审计会红）。 */
    const h = page.art === 'parts'
      ? 100 + welcomePartRows().length * PART_ROW_H + 20
      : 306;
    return { x: (DW - 760) / 2, y: 132, w: 760, h: h };
  }
  function welcomeBtnRect() {
    const C = welcomeCard();
    return { x: DW / 2 + 120, y: C.y + C.h + 22, w: 180, h: 54 };
  }
  function welcomeSkipRect() {
    const C = welcomeCard();
    return { x: DW / 2 - 300, y: C.y + C.h + 22, w: 180, h: 54 };
  }

  function drawWelcome() {
    if (!state.welcome) return;
    const page = WELCOME_PAGES[state.welcome - 1];
    if (!page) { state.welcome = 0; return; }
    fillScreen('rgba(4,9,13,.90)');

    const C = welcomeCard(), W = C.w, H = C.h, X = C.x, Y = C.y;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 28; ctx.shadowOffsetY = 12;
    ctx.fillStyle = 'rgba(14,28,36,.97)'; roundRect(X, Y, W, H, 18); ctx.fill();
    ctx.restore();
    // 描边要自己开路径（只设 strokeStyle 再 stroke() 会描到上一条残留路径上）
    ctx.strokeStyle = 'rgba(232,200,122,.5)'; ctx.lineWidth = 2;
    roundRect(X, Y, W, H, 18); ctx.stroke();
    // 标题栏分隔金线
    const hg = ctx.createLinearGradient(X, 0, X + W, 0);
    hg.addColorStop(0, 'rgba(232,200,122,.55)');
    hg.addColorStop(1, 'rgba(232,200,122,0)');

        // 职责：长说明会被卡右边挤出去，先量再缩

      });
    } else {

  // 关卡地形缩略图：把 mapRows 压成一条剖面。
  // 早期版本只有 44px 高、单色填充，看不出"这关有冰面 / 有坑 / 箱子在哪"。
  // 现在：草皮层 + 岩体两层、冰面单独配色、木箱与起终点都标出来。
  function drawLevelThumb(lv, x, y, w, h) {
    const rows = lv.mapRows || [];
    const cols = (lv.grid && lv.grid.cols) || (rows[0] || '').length;
    if (!cols || !rows.length) return;
    const SOLID = c => c === '#' || c === '=' || c === 'v' || c === 'n' || c === '/';
    const top = [];
    const isIce = [];
    for (let c = 0; c < cols; c++) {
      let rr = rows.length, ice = false;
      for (let r = 0; r < rows.length; r++) {
        const ch = rows[r][c];
        if (SOLID(ch)) { rr = r; ice = (ch === '='); break; }
      }
      top.push(rr); isIce.push(ice);
    }
    const maxRow = rows.length;
    const bh = BIOMES[lv.biome] || BIOMES.field;
    const sy = i => y + h - ((maxRow - top[i]) / maxRow) * h;   // 第 i 列地表 y
    const sx = i => x + (i / Math.max(1, cols - 1)) * w;

    // 底：一条淡的"天"，让洞穴/黄昏关的色差先说话
    const hex2rgb = hx => {
      const s2 = String(hx || '#000000').replace('#', '');
      return [parseInt(s2.substr(0, 2), 16) || 0, parseInt(s2.substr(2, 2), 16) || 0,
              parseInt(s2.substr(4, 2), 16) || 0];
    };
    const sky = ctx.createLinearGradient(0, y, 0, y + h);
    sky.addColorStop(0, 'rgba(' + hex2rgb(bh.skyTop).join(',') + ',.5)');
    sky.addColorStop(1, 'rgba(8,14,20,.55)');
    ctx.fillStyle = sky;
    roundRect(x, y, w, h, 6); ctx.fill();

    // 岩体：比草皮暗一档，形成"土层厚度"的感觉
    ctx.beginPath();
    ctx.moveTo(x, y + h);
    for (let c = 0; c < cols; c++) ctx.lineTo(sx(c), sy(c));
    ctx.lineTo(x + w, y + h);
    ctx.closePath();
    ctx.fillStyle = 'rgb(' + bh.rock.join(',') + ')';
    ctx.fill();

    // 草皮：沿地表线两侧各画一条，冰面段单独配色
    for (let c = 0; c + 1 < cols; c++) {
      ctx.beginPath();
      ctx.moveTo(sx(c), sy(c)); ctx.lineTo(sx(c + 1), sy(c + 1));
      ctx.strokeStyle = isIce[c] ? '#bfe9ff' : bh.grass;
      ctx.lineWidth = isIce[c] ? 3.2 : 2.2;
      ctx.lineCap = 'round';
      ctx.stroke();
    }
    // 冰面：加几道短斜线，和草皮区分开（不靠颜色也能认）
    for (let c = 0; c + 1 < cols; c++) {
      if (!isIce[c]) continue;
      ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 1;
      const mx = (sx(c) + sx(c + 1)) / 2, my = (sy(c) + sy(c + 1)) / 2;
      ctx.beginPath();
      ctx.moveTo(mx - 2, my + 3); ctx.lineTo(mx + 2, my - 1); ctx.stroke();
    }

    // 木箱
    (lv.boxes || []).forEach(b => {
      const c = Math.max(0, Math.min(cols - 1, b.col));
      const bx2 = sx(c), by2 = sy(c) - 4;
      ctx.fillStyle = '#d9a441';
      roundRect(bx2 - 3, by2 - 5, 6, 6, 1.5); ctx.fill();
      ctx.strokeStyle = 'rgba(120,80,20,.9)'; ctx.lineWidth = 1;
      roundRect(bx2 - 3, by2 - 5, 6, 6, 1.5); ctx.stroke();
    });

    // 起点 / 终点：起终点用小圆点 + 旗，跟场上一致
    const sc = Math.max(0, Math.min(cols - 1, (lv.start && lv.start.col) || 0));
    const gc = Math.max(0, Math.min(cols - 1, (lv.goal && lv.goal.col) || cols - 1));
    ctx.fillStyle = '#63d97e';
    ctx.beginPath(); ctx.arc(sx(sc), Math.max(y + 4, sy(sc) - 4), 3.2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#e8f0e0'; ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(sx(gc), Math.max(y + 4, sy(gc) - 2));
    ctx.lineTo(sx(gc), Math.max(y + 4, sy(gc) - 15)); ctx.stroke();
    ctx.fillStyle = COL.flag;
    ctx.beginPath();
    ctx.moveTo(sx(gc), Math.max(y + 4, sy(gc) - 15));
    ctx.lineTo(sx(gc) + 8, Math.max(y + 4, sy(gc) - 12));
    ctx.lineTo(sx(gc), Math.max(y + 4, sy(gc) - 9));
    ctx.closePath(); ctx.fill();

    ctx.strokeStyle = 'rgba(232,200,122,.25)'; ctx.lineWidth = 1;
    roundRect(x, y, w, h, 6); ctx.stroke();
  }

  function drawLevelSelect() {
    if (!state.levelSelect) return;
    // 选关是"独立一屏"：用不透明底，底下的建造 UI 一点都别透出来
    fillScreen('#08111a');
    // 顶部一层极淡的暖光，避免整屏死黑
    const svg = ctx.createRadialGradient(DW * 0.5, -60, 40, DW * 0.5, -60, DH * 0.95);
    svg.addColorStop(0, 'rgba(232,200,122,.10)');
    svg.addColorStop(1, 'rgba(232,200,122,0)');
    fillScreen(svg);
    text('选择关卡', DW / 2, 92, 30, '#ffe9b0', 'center', true);
    text('★★ 拿木箱　★★★ 每关的特殊条件', DW / 2, 124, 13, '#9fb2c2', 'center');
    // 标题下的金色细线，和结算卡同一套语言
    const lg = ctx.createLinearGradient(0, 0, DW, 0);
    lg.addColorStop(0, 'rgba(232,200,122,0)');
    lg.addColorStop(0.5, 'rgba(232,200,122,.55)');
    lg.addColorStop(1, 'rgba(232,200,122,0)');
    ctx.fillStyle = lg; ctx.fillRect(0, 138, DW, 1.5);

    const L = levelCardsLayout();
    const CW = L.CW, CH = L.CH;
    levels.forEach((lv, i) => {
      const x = L.x0 + i * (CW + L.GAP);
      const y = L.y;
      // 每次都从 localStorage 重新读，避免只在启动时读一次
      const pr = readRecord(lv.levelId) ||
        { goals: { arrive: false, boxes: false, challenge: false }, best: null, boxes: 0 };
      const prStars = starsOf(pr.goals);
      const isCur = i === state.levelIndex;
      // 卡面
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 7;
      ctx.fillStyle = isCur ? 'rgba(20,44,38,.98)' : 'rgba(14,28,34,.96)';
      roundRect(x, y, CW, CH, 14); ctx.fill();
      ctx.restore();
      // 描边必须自己开一条路径：之前只设了 strokeStyle 就 stroke()，
      // 描的是上一个残留路径，所以卡片根本没有边框。
      ctx.strokeStyle = isCur ? 'rgba(232,200,122,.85)' : 'rgba(232,200,122,.26)';
      ctx.lineWidth = isCur ? 2.5 : 1.5;
      roundRect(x, y, CW, CH, 14); ctx.stroke();
      // 当前关卡：左侧金条（比整卡变绿更克制）
      if (isCur) {
        ctx.save();
        ctx.beginPath(); roundRect(x, y, CW, CH, 14); ctx.clip();
        ctx.fillStyle = 'rgba(232,200,122,.9)';
        ctx.fillRect(x, y + 10, 3.5, CH - 20);
        ctx.restore();
      }
      // 关卡号
      text(lv.levelId, x + CW / 2, y + 42, 26, isCur ? '#ffe9b0' : '#e8f2fa', 'center', true);
      text(lv.name, x + CW / 2, y + 70, 15, '#cfe0ee', 'center');
      // 星级：三颗星各自代表一个永久标记（到达 / 全木箱 / 特殊条件）。
      // 参考里这三颗是"分别达成也算"，所以这里必须按标记点亮，而不是按星星数量涂满。
      GOALS.forEach((gk, k) => {
        const cx2 = x + CW / 2 - 44 + k * 44, cy2 = y + 104;
        const on = !!pr.goals[gk];
        ctx.fillStyle = on ? '#ffd93d' : 'rgba(255,255,255,.14)';
        ctx.beginPath();
        for (let q = 0; q < 10; q++) {
          const ang = -Math.PI / 2 + q * Math.PI / 5;
          const rad = (q % 2 === 0) ? 15 : 6.5;
          const px2 = cx2 + Math.cos(ang) * rad, py2 = cy2 + Math.sin(ang) * rad;
          q === 0 ? ctx.moveTo(px2, py2) : ctx.lineTo(px2, py2);
        }
        ctx.closePath(); ctx.fill();
        if (on) {
          ctx.strokeStyle = 'rgba(120,86,10,.65)'; ctx.lineWidth = 1.2; ctx.stroke();
        }
      });
      // 最佳时间
      text(pr.best ? '最佳 ' + pr.best.toFixed(2) + ' s' : '未通关',
        x + CW / 2, y + 140, 12, pr.best ? '#9fe0a8' : '#7f97a6', 'center');
      // 第三颗星的条件（说清"这颗星要做什么"）
      const gn = challengeNameOf(lv);
      text('★★★：' + gn, x + CW / 2, y + 166, 11,
        pr.goals.challenge ? '#b6ff9e' : '#8fb6c9', 'center');
      // 零件箱
      // 地形缩略图：从 44px 加高到 56px，能看出坡度和坑的深浅
      drawLevelThumb(lv, x + 12, y + 172, CW - 24, 56);
      /* 零件箱清单：卡片宽度现在是自适应的（6 关时只有 187），
       * 9 个零件的清单在 10px 下就可能超出卡面。所以先量再定字号，
       * 宁可小一号也不出卡 —— 出卡的文字在选关页看起来像是渲染坏了。 */
      const boxTxt = Object.keys(lv.partsBox || {})
        .map(k => (RAP.PARTS[k] ? RAP.PARTS[k].label : k) + lv.partsBox[k]).join(' ');
      let bxSize = 10;
      ctx.font = `700 ${bxSize}px "Microsoft YaHei", sans-serif`;
      while (bxSize > 7 && ctx.measureText(boxTxt).width > CW - 16) {
        bxSize -= 0.5;
        ctx.font = `700 ${bxSize}px "Microsoft YaHei", sans-serif`;
      }
      text(boxTxt, x + CW / 2, y + 240, bxSize, 'rgba(212,228,240,.82)', 'center');
    });
    // 底部进度条带：填掉卡片下方的大片空白，同时给一个"总进度"的目标感
    {
      let tot = 0, got = 0, cleared = 0;
      levels.forEach(lv => {
        const pr = readRecord(lv.levelId);
        tot += 3;
        got += pr ? starsOf(pr.goals) : 0;
        if (pr && pr.best) cleared++;
      });
      const BW = 520, BX = DW / 2 - BW / 2, BY = 478;
      ctx.fillStyle = 'rgba(14,28,34,.9)';
      roundRect(BX - 22, BY - 26, BW + 44, 92, 14); ctx.fill();
      ctx.strokeStyle = 'rgba(232,200,122,.22)'; ctx.lineWidth = 1.5;
      roundRect(BX - 22, BY - 26, BW + 44, 92, 14); ctx.stroke();
      text('总进度', BX, BY, 12, 'rgba(200,220,236,.9)', 'left', true);
      text('通关 ' + cleared + ' / ' + levels.length + ' 关', BX + BW, BY, 12, '#9fb2c2', 'right');
      ctx.fillStyle = 'rgba(255,255,255,.10)';
      roundRect(BX, BY + 12, BW, 12, 6); ctx.fill();
      if (got > 0) {
        const gw = Math.max(12, BW * got / tot);
        const gb = ctx.createLinearGradient(BX, 0, BX + gw, 0);
        gb.addColorStop(0, '#e8c87a'); gb.addColorStop(1, '#ffe9b0');
        ctx.fillStyle = gb; roundRect(BX, BY + 12, gw, 12, 6); ctx.fill();
      }
      // 星标
      for (let k = 0; k < tot; k++) {
        const sx3 = BX + (BW / tot) * (k + 0.5);
        if (k < got) {
          ctx.fillStyle = '#2a1e08';
          ctx.beginPath();
          for (let q = 0; q < 10; q++) {
            const a3 = -Math.PI / 2 + q * Math.PI / 5, r3 = (q % 2 === 0) ? 4.6 : 1.9;
            const px3 = sx3 + Math.cos(a3) * r3, py3 = BY + 18 + Math.sin(a3) * r3;
            q === 0 ? ctx.moveTo(px3, py3) : ctx.lineTo(px3, py3);
          }
          ctx.closePath(); ctx.fill();
        }
      }
      text(got + ' / ' + tot + ' 星', BX + BW / 2, BY + 52, 13, got === tot ? '#ffe9b0' : 'rgba(190,214,232,.6)', 'center', true);
      // 金币总数：每关只记"最好那一次"，重刷不会累加（公式见 coinsOf）
      const tc = totalCoins();
      {
        const cxc = BX + BW - 26, cyc = BY + 47;
        ctx.fillStyle = '#f0c040';
        ctx.beginPath(); ctx.arc(cxc, cyc, 8, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#8a6a10';
        ctx.beginPath(); ctx.arc(cxc, cyc, 4.5, 0, Math.PI * 2); ctx.fill();
        text('×' + tc, cxc + 13, cyc + 5, 12, tc > 0 ? '#ffd93d' : 'rgba(214,232,244,.86)', 'left', true);
      }
    }

    // 「玩法说明」按钮：重新打开欢迎引导
    const hb2 = { x: DW / 2 - 80, y: DH - 84, w: 160, h: 38 };
    ctx.fillStyle = 'rgba(16,30,40,.95)';
    roundRect(hb2.x, hb2.y, hb2.w, hb2.h, 10); ctx.fill();
    ctx.strokeStyle = 'rgba(232,200,122,.55)'; ctx.lineWidth = 1.5;
    roundRect(hb2.x, hb2.y, hb2.w, hb2.h, 10); ctx.stroke();
    text('? 玩法说明', hb2.x + hb2.w / 2, hb2.y + 25, 14, '#ffe9b0', 'center', true);
    text('点卡片进入关卡　·　按 ESC 或点空白关闭', DW / 2, DH - 18, 12, '#7f97a6', 'center');
  }

  /* 选关卡片的排版只允许有一份。
   * 原来是 drawLevelSelect 和 levelCardRect 各写一遍 `216/250/18`，
   * 加到第 6 关时 6×216 + 5×18 = 1386 > 1280，卡片整体溢出屏幕 —— 而点击热区
   * 用的是另一份拷贝，于是"看得见"和"点得着"会分家。
   * 现在按卡片数自适应宽度：能放下 216 就用 216，放不下就等分。 */
  function levelCardsLayout() {
    const n = levels.length, GAP = 14, SIDE = 44;
    const CW = Math.min(216, Math.floor((DW - SIDE * 2 - (n - 1) * GAP) / n));
    const CH = 250;
    const totalW = n * CW + (n - 1) * GAP;
    return { CW, CH, GAP, x0: (DW - totalW) / 2, y: 168 };
  }

  function levelCardRect(i) {
    const L = levelCardsLayout();
    return { x: L.x0 + i * (L.CW + L.GAP), y: L.y, w: L.CW, h: L.CH };
  }

  function drawHelp() {
    if (!state.helpOpen) return;
    /* 高度跟着零件数走：托盘已有 9 款零件，固定 540 会把最后一行（小猪）挤到框外。
     * 行高 62、首行留 84、底部再留 56 给关闭按钮。 */
    const W = 920, ROWH = 58;

    fillScreen('rgba(6,12,14,.78)');
    ctx.fillStyle = '#132430'; roundRect(X, Y, W, H, 16); ctx.fill();
    ctx.strokeStyle = 'rgba(232,200,122,.55)'; ctx.lineWidth = 2; ctx.stroke();
    text('零件说明 —— 搭之前先知道每个东西干什么', X + 26, Y + 40, 19, '#ffe9b0', 'left', true);

    const order = RAP.TRAY_ORDER;
    order.forEach((part, i) => {
      const def = RAP.PARTS[part];
      const yy = Y + 84 + i * ROWH;
      drawPartShape(part, X + 58, yy + 6, 34, 0);
      text(def.label, X + 92, yy, 14, '#e6f0f8', 'left', true);
      const tags = [def.mass + ' kg'];
      if (def.structure) tags.push('结构');
      if (def.wheel) tags.push('轮子');
      if (def.motor) tags.push('动力');
      if (def.energy) tags.push('能量 +' + def.energy);
      if (def.liftMass) tags.push('浮力 +' + def.liftMass + ' kg');
      if (def.dropOne) tags.push('压舱');
      if (def.interactive) tags.push('交互件');
      if (def.inner) tags.push('只能放框里');
      if (def.dir) tags.push('有方向');
      if (def.maxStack > 1) tags.push('同格可叠 ' + def.maxStack);
      text(tags.join(' · '), X + 92, yy + 17, 11, '#8fb6c9', 'left');
      // 说明文字自动换行
      const chars = (def.desc || '').split('');
      let line = '', ly = yy + 2, lx = X + 250;
      for (let k = 0; k < chars.length; k++) {
        const test = line + chars[k];
        if (ctx.measureText(test).width > X + W - 30 - lx) {
          text(line, lx, ly, 12.5, '#cfe0ee', 'left');
          line = chars[k]; ly += 18;
        } else line = test;
      }
      if (line) text(line, lx, ly, 12.5, '#cfe0ee', 'left');
    });
    // 右上角关闭按钮
    const cb = { x: X + W - 56, y: Y + 16, w: 34, h: 34 };
    ctx.fillStyle = 'rgba(224,81,60,.9)';
    ctx.beginPath(); ctx.arc(cb.x + cb.w / 2, cb.y + cb.h / 2, 17, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    const ccx = cb.x + cb.w / 2, ccy = cb.y + cb.h / 2;
    ctx.beginPath();
    ctx.moveTo(ccx - 7, ccy - 7); ctx.lineTo(ccx + 7, ccy + 7);
    ctx.moveTo(ccx + 7, ccy - 7); ctx.lineTo(ccx - 7, ccy + 7);
    ctx.stroke();
    text('点任意处关闭 / 按 H', X + W - 26, Y + H - 18, 12, '#7f97a6', 'right');
  }

  /* 气球炸开：一圈粉色橡皮屑 + 一团雾。
   * 和 spawnDebris（木质碎片）分开，因为气球炸开该是"轻、飘、粉色"，
   * 用木头碎片会看起来像"车散架了"，语义完全不对。 */
  function spawnBurstFx(wx, wy) {
    state.bursts = state.bursts || [];
    for (let i = 0; i < 9; i++) {
      const ang = (i / 9) * Math.PI * 2 + Math.random() * 0.5;
      const sp = 2.2 + Math.random() * 3.4;
      state.bursts.push({
        x: wx, y: wy,
        vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp * 0.8 + 1.2,
        r: 2.5 + Math.random() * 3,
        life: 0.42 + Math.random() * 0.28, maxLife: 0.7,
        color: ['#e0708f', '#f6b6c8', '#a8455f'][i % 3]
      });
    }
    // 中心一团白雾，让"炸开"有一瞬间的体积
    for (let i = 0; i < 4; i++) {
      state.bursts.push({
        x: wx + (Math.random() - 0.5) * 0.2, y: wy + (Math.random() - 0.5) * 0.2,
        vx: (Math.random() - 0.5) * 1.2, vy: (Math.random() - 0.5) * 1.2,
        r: 7 + Math.random() * 5,
        life: 0.28 + Math.random() * 0.16, maxLife: 0.44,
        color: 'rgba(255,236,244,.9)'
      });
    }
  }

  function drawBursts(cam) {
    if (!state.bursts || !state.bursts.length) return;
    state.bursts.forEach(b => {
      const p = worldToScreen(b.x, b.y, cam);
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, b.life / b.maxLife));
      ctx.fillStyle = b.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, b.r * PPM * cam.zoom / 32, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
  }

  function spawnDebris(wx, wy) {
    for (let i = 0; i < 10; i++) {
      state.debris.push({
        x: wx, y: wy,
        vx: (Math.random() - 0.5) * 6,
        vy: 1 + Math.random() * 4,
        a: Math.random() * 6.28,
        w: (Math.random() - 0.5) * 14,
        size: 3 + Math.random() * 5,
        life: 0.5 + Math.random() * 0.4,
        maxLife: 0.9,
        color: Math.random() > 0.5 ? '#c08a4a' : '#8a5f30'
      });
    }
  }

  function drawConfetti(cam) {
    if (!state.confetti.length) return;
    state.confetti.forEach(c2 => {
      const p = worldToScreen(c2.x, c2.y, cam);
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, c2.life / 0.8));
      ctx.translate(p.x, p.y); ctx.rotate(c2.a);
      ctx.fillStyle = c2.color;
      ctx.fillRect(-c2.size / 2, -c2.size / 2, c2.size, c2.size * 0.6);
      ctx.restore();
    });
  }

  function spawnDust(wx, wy, n) {
    for (let i = 0; i < n; i++) {
      state.dust = state.dust || [];
      state.dust.push({
        x: wx + (Math.random() - 0.5) * 0.5,
        y: wy + Math.random() * 0.15,
        vx: (Math.random() - 0.5) * 2.2,
        vy: 0.6 + Math.random() * 1.4,
        r: 2 + Math.random() * 3.5,
        life: 0.35 + Math.random() * 0.3,
        maxLife: 0.65
      });
    }
  }

  function drawDust(cam) {
    if (!state.dust || !state.dust.length) return;
    state.dust.forEach(d => {
      const p = worldToScreen(d.x, d.y, cam);
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(0.5, d.life / d.maxLife * 0.5));
      ctx.fillStyle = '#d8cfb0';
      ctx.beginPath();
      ctx.arc(p.x, p.y, d.r * (1.6 - d.life / d.maxLife), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
  }

  function drawDebris(cam) {
    if (!state.debris.length) return;
    state.debris.forEach(d => {
      const p = worldToScreen(d.x, d.y, cam);
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, d.life / 0.5));
      ctx.translate(p.x, p.y); ctx.rotate(d.a);
      ctx.fillStyle = d.color;
      ctx.fillRect(-d.size / 2, -d.size / 2, d.size, d.size);
      ctx.restore();
    });
  }

  function drawToast() {
    if (state.toastT <= 0) return;
    ctx.fillStyle = 'rgba(16,22,28,.85)';
    const w = Math.max(220, state.toast.length * 16 + 40);
    roundRect(DW / 2 - w / 2, DH - 190, w, 44, 10); ctx.fill();
    text(state.toast, DW / 2, DH - 160, 17, '#ffe08a', 'center');
  }

  // ---------- 主循环 ----------
  let last = performance.now();
  let frameErr = null;
  function frame(now) {
    try { frameBody(now); } catch (e) {
      frameErr = (e && e.message) || String(e);
      console.error('frame error:', e);
      try {
        ctx.fillStyle = 'rgba(200,60,40,.9)';
        ctx.fillRect(8, 8, 560, 26);
        text('渲染异常（游戏继续）：' + frameErr, 16, 26, 13, '#fff');
      } catch (e2) {}
    }
    requestAnimationFrame(frame);
  }
  function frameBody(now) {
    applyCanvasSize();
    state.frameCount = (state.frameCount || 0) + 1;   // 只用于"rAF 还活着吗"这类测试
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (state.toastT > 0) state.toastT -= dt;
    if (state.runBanner > 0) state.runBanner = Math.max(0, state.runBanner - dt);
    state.arrowDrawN = 0;      // 每帧重置：方向箭头只在建造期画，测试靠它确认

    ctx.clearRect(-VIEW_OFF_X - 2, -VIEW_OFF_Y - 2, VIEW_W + 4, VIEW_H + 4);
    if (state.phase === 'build') {
      // 地形缓存：同一关不重复重建（每帧重建要跑 3 遍高斯平滑，很贵）
      if (terrainCacheId !== level().levelId || !terrainCache) {
        terrainCache = RAP.makeTerrain(level());
        terrainCacheId = level().levelId;
      }
      const ter = terrainCache;
      const cam = buildCam();
      // 入场镜头：从关卡全景推到建造区
      if (state.introT < 1) {
        state.introT = Math.min(1, state.introT + dt / 1.2);
        const k = 1 - Math.pow(1 - state.introT, 3);      // ease-out cubic
        const wide = { x: cam.x + 9, y: cam.y + 3.2, zoom: 0.72 };
        cam.x = wide.x + (cam.x - wide.x) * k;
        cam.y = wide.y + (cam.y - wide.y) * k;
        cam.zoom = wide.zoom + (cam.zoom - wide.zoom) * k;
      }
      // 记录"这一帧真正用的镜头"，供测试核对推镜幅度（buildCam() 每帧新建对象，
      // 光看 state.cam 永远是终值，测不出推镜有没有跑）
      state.camLive = { x: cam.x, y: cam.y, zoom: cam.zoom };
      drawWorld(ter, cam);
      // 建造阶段的场景压暗：让拼装区成为视觉主体（原样太亮，网格糊在风景里）
      if (state.introT > 0.2) {
        // 压暗强度按地貌给：洞穴本身就黑，再压就看不见了
        const bm = BIOMES[(level() && level().biome) || 'field'] || BIOMES.field;
        ctx.globalAlpha = Math.min(1, (state.introT - 0.2) / 0.5);
        fillScreen('rgba(6,14,20,' + (bm.dim || 0.26).toFixed(2) + ')');
        ctx.globalAlpha = 1;
      }
      ctx.save();
      ctx.translate(0, VIEW_OFF_Y);      // UI 在设计区居中（4:3 时上下有扩展）
      // 入场时 UI 淡入（前 40% 不显示）
      ctx.globalAlpha = 1;   // 强制复位（缓存切换可能残留 alpha）
      const uiAlpha = state.introT < 0.35 ? 0 : Math.min(1, (state.introT - 0.35) / 0.35);
      if (uiAlpha < 1) ctx.globalAlpha = uiAlpha;
      drawGrid();
      drawBuildCar();
      if (state.bounce) {
        state.bounce.t += dt;
        const k = Math.min(1, state.bounce.t / 0.25);
        if (k >= 1) { state.bounce = null; }
        else {
          const idx = TRAY.indexOf(state.bounce.part);
          const target = idx >= 0 ? trayRect(idx) : { x: DW / 2, y: DH - 60, w: 0, h: 0 };
          const tx = target.x + target.w / 2, ty = target.y + target.h / 2;
          const bx = state.bounce.x + (tx - state.bounce.x) * k;
          const by = state.bounce.y + (ty - state.bounce.y) * k;
          ctx.save();
          ctx.globalAlpha = 1 - k * 0.7;
          drawPartShape(state.bounce.part, bx, by, BUILD_PX * 0.84 * (1 - k * 0.3), 0);
          ctx.restore();
        }
      }
      drawTray();
      drawButtons();
      drawTabs();
      drawHud();
      if (uiAlpha < 1) ctx.globalAlpha = 1;
      ctx.restore();
    } else if (state.phase === 'run' || state.phase === 'resolved') {
      // 慢动作衰减（撞击后 0.25 倍，0.35 秒内恢复）
      if (state.slowmo > 0) state.slowmo = Math.max(0, state.slowmo - dt);
      // 气球炸开的橡皮屑：轻、飘、带上升（气球是"往上炸"的）
      if (state.bursts && state.bursts.length) {
        state.bursts.forEach(b => {
          b.x += b.vx * dt; b.y += b.vy * dt;
          b.vx *= (1 - 2.6 * dt);
          b.vy -= 1.2 * dt;          // 继续往上飘，不是往下掉
          b.life -= dt;
        });
        state.bursts = state.bursts.filter(b => b.life > 0);
      }
      // 尘土：上浮 + 扩散 + 淡出
      if (state.dust && state.dust.length) {
        state.dust.forEach(d => {
          d.vy -= 2.2 * dt;
          d.x += d.vx * dt;
          d.y += d.vy * dt;
          d.vx *= (1 - 2.2 * dt);
          d.life -= dt;
        });
        state.dust = state.dust.filter(d => d.life > 0);
      }
      // 纸花：抛物线 + 摇曳 + 淡出
      if (state.confetti.length) {
        state.confetti.forEach(c2 => {
          c2.vy -= 9 * dt;
          c2.x += c2.vx * dt + Math.sin(performance.now() / 260 + c2.a) * 0.02;
          c2.y += c2.vy * dt;
          c2.a += c2.w * dt;
          c2.life -= dt;
        });
        state.confetti = state.confetti.filter(c2 => c2.life > 0);
      }
      // 碎片：抛物线 + 旋转 + 淡出
      if (state.debris.length) {
        state.debris.forEach(d => {
          d.vy -= 16 * dt;
          d.x += d.vx * dt; d.y += d.vy * dt;
          d.a += d.w * dt; d.life -= dt;
        });
        state.debris = state.debris.filter(d => d.life > 0);
      }
      /* 只有**整场都在跑**时才推进物理。
       *
       * 光判 run.phase 不够：state.phase 才是这一层认的那一个（相机、结算卡、
       * 暂停都看它）。两边一旦不同步 —— 测试会直接把 state.phase 改成
       * 'resolved' 去截结算页 —— 底下的这局还会继续走物理，而看门狗
       * 拿着一个被外部改过的 time 一算 noGainFor 就立刻判负，
       * 把刚设好的 win 覆盖成 fail，结算卡永远出不来。
       * （第 39 轮加看门狗之后，排版审计和对比度审计就是这样同时挂的。） */
      if (state.run && state.phase === 'run' && state.run.phase === 'run' && !state.paused) {
        // 固定 60Hz 累加
        const timeScale = state.slowmo > 0 ? 0.3 : 1;
        state.run.acc = (state.run.acc || 0) + dt * timeScale;
        let guard = 0;
        while (state.run.acc >= 1 / 60 && guard++ < 5) {
          state.run.acc -= 1 / 60;
          // 标准解里的"按下/松开/扔/扎"时刻（只由 launchSpec 注入）：
          // 走的是玩家按键 / 点车身的同一批函数，不是伪造状态。
          // 三类动作用同一条时间轴，和 game.js 的 simulate 同构 ——
          // 否则 1-6 只会在 Node 里通关，浏览器里一次都跑不到（第 40 轮修）。
          if (state.run.actScript && state.run.actScript.length) {
            const ps = state.run.actScript;
            while (ps.length && ps[0].t <= state.run.time) {
              const a = ps.shift();
              if (a.k === 'release') RAP.releaseInteract(state.run, a.n || 1);
              else if (a.k === 'drop') RAP.dropSandbag(state.run, a.n || 1);
              else if (a.k === 'pop') RAP.popBalloon(state.run, a.n || 1);
              else RAP.pressInteract(state.run, a.n || 1);
            }
          }
          RAP.step(state.run, 1 / 60);
          // 撞击检测（用事件流，避免改物理）
          const evs = state.run.events || [];
          if (evs.length !== (state.lastEventLen || 0)) {
            for (let i = state.lastEventLen || 0; i < evs.length; i++) {
              if (evs[i].indexOf('impact') === 0) {
                state.slowmo = 0.35;
                state.shake = Math.min(1.4, state.shake + 0.85);
                state.flash = 1;
                state.vignette = 1;
                spawnDebris(state.run.car.x, state.run.car.y + 0.4);
              } else if (evs[i].indexOf('burst') === 0) {
                /* 气球炸了：在炸点撒一圈橡皮屑 + 一小团粉色雾。
                 * 没有这个，点气球只有"数字变了"、画面上什么都不发生 ——
                 * 玩家会以为没点中。坐标由物理层写进事件串，渲染层只负责画。 */
                const mb = evs[i].match(/x=(-?[\d.]+) y=(-?[\d.]+)/);
                const bx = mb ? parseFloat(mb[1]) : state.run.car.x;
                const by = mb ? parseFloat(mb[2]) : state.run.car.y;
                spawnBurstFx(bx, by);
                SFX.pop();
              } else if (evs[i].indexOf('sandbag_drop') === 0) {
                SFX.bagDrop();
              } else if (evs[i].indexOf('struct_hurt') === 0) {
                /* 木框掉耐久（还没碎）。在它之前，这件事在画面上是**完全静默**的：
                 * 只有木头上多一道相对淡的缝，没有音、没有抖、没有闪。
                 * 于是「不散架」这颗星是靠"你回头自己发现"来惩罚玩家的。
                 * 这里给它一声木头裂的音 + 一点点抖，量级比 touch lvl=4 小一半：
                 * 掉耐久不是灾难片，是提醒。 */
                SFX.crack();
                state.shake = Math.min(1.1, state.shake + 0.30);
              } else if (evs[i].indexOf('touch lvl=') === 0) {
                // 分级接触反馈
                const lv = parseInt(evs[i].split('lvl=')[1], 10) || 1;
                const mx = evs[i].match(/x=([\d.]+)/);
                const px = mx ? parseFloat(mx[1]) : state.run.car.x;
                const strengths = [0, 0.10, 0.22, 0.42, 0.85];
                state.shake = Math.min(1.2, state.shake + strengths[lv]);
                if (lv >= 3) { state.flash = Math.max(state.flash, 0.35); }
                if (lv >= 2) { state.vignette = Math.max(state.vignette, lv >= 3 ? 0.7 : 0.25); }
                // 尘土：级别 1~2 个小，3~4 用碎片
                const n = [0, 3, 5, 8, 10][lv] || 3;
                if (lv >= 3) spawnDebris(px, state.run.car.y + 0.2);
                spawnDust(px, state.run.car.y - 0.3, n);
                SFX.thud(lv);
              }
            }
            state.lastEventLen = evs.length;
          }
        }
      }
      if (state.run && state.run.phase === 'resolved' && state.phase === 'run') {
        state.phase = 'resolved';
        state.resultT = 0;
        state.outroT = 0;                              // 推镜过渡计时
        state.slowmo = Math.max(state.slowmo, 0.75);   // 过关瞬间放慢（比撞击更久）
        if (state.run.result === 'win') {
          // 纸花：从车上方上抛
          for (let k = 0; k < 26; k++) {
            state.confetti.push({
              x: state.run.car.x + (Math.random() - 0.5) * 3,
              y: state.run.car.y + 2.2 + Math.random() * 1.2,
              vx: (Math.random() - 0.5) * 5,
              vy: 3 + Math.random() * 4.5,
              a: Math.random() * 6.28,
              w: (Math.random() - 0.5) * 12,
              size: 3 + Math.random() * 4,
              life: 1.6 + Math.random() * 0.8,
              color: ['#ffd93d', '#63d97e', '#4a9be0', '#e8816a', '#ffffff'][k % 5]
            });
          }
          SFX.cheer();
        }
        if (state.run.result === 'win') {
          // 先读旧记录，判断破没破纪录、点亮了几颗新星，再写
          const rec = readRecord(level().levelId);
          const oldBest = rec ? rec.best : null;
          const oldStars = rec ? starsOf(rec.goals) : 0;
          state.newBest = (oldBest === null || state.run.time < oldBest);
          state.oldBest = oldBest;
          /* 这一局真正进钱包多少金币 —— 必须**量出来**，不能算。
           *
           * 金币总数是由永久标记推导的（coinsOf ← 星数 + 木箱），重刷同一关
           * 只要没有新标记，钱包一点不动。可结算卡原来固定写 `+80`：
           * 实测同一关连打三遍，卡上三次都写 "+80"，而钱包只涨了第一遍的 180。
           * 也就是说屏幕上那个数字是**假的** —— 它承诺了没发生的事。
           * 现在改成前后各读一次总数，卡上写的就是差。 */
          const coinsBefore = totalCoins();
          // 这一局点亮了哪几颗**新**星（用于结算页的"新星"提示）
          const goals = state.run.starGoals ||
            { arrive: state.run.stars >= 1, boxes: state.run.stars >= 2, challenge: state.run.stars >= 3 };
          const res = saveProgress(level().levelId, goals, state.run.time, state.run.boxesGot);
          state.coinGain = Math.max(0, totalCoins() - coinsBefore);
          state.newGoals = GOALS.filter(k => goals[k] && !res.before[k]);
          state.totalGoals = mergeGoals(res.after);
          state.newStarRecord = starsOf(res.after) > oldStars;
          state.didSave = true;
        } else {
          state.newBest = false;
          state.didSave = false;
          state.newGoals = [];
          state.coinGain = 0;
          // 失败也要让玩家看到"这一关已经亮了几颗" —— 否则累计制读不出来
          const rec2 = readRecord(level().levelId);
          state.totalGoals = rec2 ? mergeGoals(rec2.goals) : mergeGoals(null);
        }
        if (state.run.result === 'win') SFX.win(); else SFX.fail();
      }
      // 轮子滚动环境音（按速度调制）
      if (state.run && state.run.phase === 'run' && !state.paused) {
        const sp3 = Math.hypot(state.run.car.vx, state.run.car.vy);
        SFX.rollStart();
        SFX.rollSet(sp3);
      } else {
        SFX.rollStop();
      }
      const prevBox = state.run ? state.run.boxesGot : 0;
      const prevHp = state.run ? state.run.pigHP : 3;
      drawRun(dt);
      if (state.run) {
        if (state.run.boxesGot > prevBox) SFX.box();
        if (state.run.pigHP < prevHp) SFX.hurt();
      }
      drawTabs();
      drawHud();
      // 结算推镜：0.2 秒内把镜头推近 12%（再盖卡片，避免硬切）
      if (state.phase === 'resolved' && state.outroT < 1) {
        state.outroT = Math.min(1, state.outroT + dt / 0.2);
        const kz = 1 + 0.12 * (1 - Math.pow(1 - state.outroT, 2));
        state.camState.zoom *= 1 + (kz - 1) * 0.35;
      }
      if (state.slowmo > 0 && state.phase === 'run') {
        fillScreen('rgba(232,200,122,.08)');
      }
      if (state.phase === 'resolved') drawResult(dt);
      drawButtons();
    }
    drawWelcome();
    drawLevelSelect();
    drawHelp();
    drawToast();
  }
  // 首次进入自动显示欢迎引导
  try {
    if (!localStorage.getItem('rap-welcomed-v1')) state.welcome = 1;
  } catch (e) { state.welcome = 1; }

  window.__rap = { state, RAP, levels, startLevel, launch, launchSpec, buildOrigin, BUILD_PX, cellAt, canvasPos,
                   trayRect, btnRect, TRAY, pauseRowRects, level, welcomeCard, welcomeBtnRect,
                   welcomeSkipRect, levelCardRect, runTimeRects, runProgressRect,
                   runChallengeRect, challengeStatus, coinsOf, totalCoins, SAVE_KEY,
                   readRecord, saveProgress, starsOf, mergeGoals, goalNames,
                   totalStars, GOALS, RAP, tapAt: (wx, wy) => RAP.tapAt(state.run, wx, wy),
                   drawStackBadge, liftLineOf: () => liftLineCache,
                   challengeNameOf, goalNames, challengeStatus, overGoalNotice,
                   progressWarning, failText, chapterDone, resultNextBtn, frameHpOf, frameSegRects };
  startLevel(0);
  requestAnimationFrame(frame);
})();
</script>
